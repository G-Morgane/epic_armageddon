# Death Korps de Krieg, transcrit depuis le PDF EAFR rev 1.5.1 (source de vérité).
codex:
  slug: death-korps-de-krieg
  armee_id: da66e374-161f-4951-b366-44cb34ed4348
  logo: /icons/death_korps_krieg.svg
  nom: Death Korps de Krieg
  version: "1.5.1"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/death-korps-de-krieg.jpg
  couleur: "#4a5240"
  citation:
    texte: "Heureux ceux qui tombent les premiers, car ils recevront la miséricorde de l'Empereur."
    auteur: Colonel Von Stross, Commandant, 143ème Régiment de Siège
  intro_md: |
    La Death Korps of Krieg utilise les feuilles de référence de la Death Korps of Krieg, de l'Aeronautica Imperialis et de l'Adeptus Titanicus.

    La liste qui suit vous permet de mettre sur pied une armée de l'Astra Militarum basée sur un régiment de la Death Korps of Krieg (DKoK).

    Les formations de la DKoK sont de deux types : les compagnies et les formations de support. Chaque compagnie que vous incluez dans l'armée vous permet de mettre sur pied deux formations de support et un ensemble de positions fortifiées pour les seules compagnies QG et d'Infanterie. Vous ne pouvez prendre de formation de support que si vous avez pris au préalable une compagnie. Ces deux formations sont traitées indépendamment durant la bataille et vous n'avez pas à respecter les règles de cohésion.

    En plus de cela, les compagnies peuvent recevoir 3 améliorations. Chaque amélioration ne peut être prise qu'une fois par compagnie. A l'inverse des formations de support, les améliorations font partie intégrante des compagnies. Les formations d'appui ne peuvent en principe pas recevoir d'améliorations, sauf celles indiquées dans la liste d'armée (par exemple : vous pouvez payer 100 pts pour ajouter un transport Gorgone à des Grenadiers qui sont une formation de support). Chaque amélioration est ajoutée au total du coût en point d'une compagnie.

    Les armées de la DKoK peuvent être soutenues par la flotte de l'Aeronautica Imperialis et les légions de l'Adeptus Titanicus. 1/3 des points peuvent être dépensé pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Commissaires"
      texte: |
        Pour chaque Compagnie de la Death Korps of Krieg qu'inclut votre armée, un Commissaire est automatiquement intégré.

        De plus, vous pouvez ajouter gratuitement un Commissaire dans une formation d'appui pour chaque tranche de 1 000 pts dans votre armée, hors appareils de la flotte et soutien titanique.
    - titre: "Règle spéciale : Maître de sièges (DKOK)"
      texte: |
        Le QG Régimentaire et les Compagnies d'Infanterie permettent de prendre un ensemble de positions fortifiées. Ces positions fortifiées devront être déployées en garnison ou dans la zone de déploiement, lors de la phase de déploiement, et ne pourront être conservées en réserve d'aucune sorte.

        Effets des Positions Fortifiées DKOK, dans l'ordre Infanterie / Véhicule / Engin de Guerre :

        - **Tranchées (2)** : Couvert 4+ / Dangereux / Sans effet
        - **Emplacement d'artillerie (1)** : Couvert 4+ / Couvert 5+ / Sans effet
        - **Bunkers (2)** : Couvert 3+ / Infranchissable / Infranchissable
        - **Barbelés** : Dangereux / Sans effet / Sans effet

        Les (X) indiquent le nombre d'unités maximum pouvant occuper ces fortifications par tronçon de 4 cm de longueur.

        Le joueur ayant la valeur stratégique la plus forte décide quel joueur déploie son premier set de Positions Fortifiées en alternance.

        Les Positions Fortifiées doivent être placées après les Objectifs, mais avant que les Vaisseaux Spatiaux et les Garnisons ne se déploient.

        Elles peuvent être placées partout où pourrait l'être un véhicule, dans la moitié de table du joueur actif.

        Bien qu'elles soient des éléments de terrains, les Positions Fortifiées doivent respecter les règles de cohésion de formation entre elles (par exemple, vous pouvez diviser les tranchées en plusieurs éléments, du moment qu'il y a un espace maximum de 5 cm entre chaque élément).

        Les Barbelés n'ont pas à être disposés en cohésion avec vos autres Positions Fortifiées, mais doivent respecter la cohésion entre eux.

        Une fois positionnées, les Positions Fortifiées sont considérées comme un élément de terrain neutre et toute unité ayant la capacité à finir son mouvement à l'intérieur pourra l'occuper.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Brilliane Feldo."
  valeur_strategique: 2
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Soutiens de l'Adeptus Titanicus", valeur: "1+" }

