sections:
  - id: compagnies
    titre: COMPAGNIES DE LA DEATH KORPS DE KRIEG
    formations: [qg_regimentaire, compagnie_infanterie, compagnie_death_riders, compagnie_artillerie, compagnie_leman_russ, compagnie_chars_lourds]
    contraintes:
      - { type: max_options, valeur: 3 }
      - { type: fournit, budget: slot_appui, quantite: 2 }
    options: [peloton_infanterie, peloton_appui_feu, peloton_support, escadron_hellhounds, escadron_leman_russ, char_lourd]
    tableau_options:
      titre: AMÉLIORATIONS DE LA DEATH KORPS DE KRIEG
      sous_titre: "Jusqu'à 3 améliorations différentes par Compagnie"
  - id: appui
    titre: FORMATIONS D'APPUI DE LA DEATH KORPS DE KRIEG
    contraintes: [{ type: consomme, budget: slot_appui }]
    options: [commissaire_appui]
    formations: [peloton_grenadiers, peloton_ingenieurs, peloton_death_riders, silo_deathstrike, batterie_legere_support, batterie_lourde_support, batterie_lourde_siege, peloton_hellhounds, peloton_leman_russ, peloton_super_lourd]
  - id: fortifications
    titre: FORTIFICATIONS DE LA DEATH KORPS DE KRIEG
    contraintes: [{ type: consomme, budget: slot_fortification }]
    formations: [positions_fortifiees]
  - id: aeronautica
    titre: FLOTTES DE L'AERONAUTICA IMPERIALIS
    sous_titre: "SUPPORTS DE LA DEATH KORPS DE KRIEG"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: aeronautica-imperialis }
  - id: titanicus
    titre: SOUTIENS DE L'ADEPTUS TITANICUS
    sous_titre: "SUPPORTS DE LA DEATH KORPS DE KRIEG"
    contraintes: [{ type: consomme, budget: rare, quoi: points }, { type: initiative, valeur: "1+" }]
    formations: []
    allies: { codex: adeptus-titanicus }

listes_test:
  - nom: "3000 pts valide, QG, infanterie, appuis et fortification"
    limite: 3000
    attendu: valide
    formations:
      - formation: qg_regimentaire
        options:
          - { option: peloton_infanterie }
          - { option: transport_siege, variante: gorgones }
      - formation: compagnie_infanterie
        options: [{ option: peloton_appui_feu }]
      - { formation: positions_fortifiees }
      - formation: peloton_grenadiers
        options:
          - { option: transport_grenadiers, variante: centaures }
          - { option: commissaire_appui }
      - formation: batterie_lourde_support
        variante: seisme
        options: [{ option: servants_batterie_lourde, variante: emplacements }]
      - formation: peloton_leman_russ
        options: [{ option: commissaire_appui }]
      - { formation: titan_warhound }
  - nom: "2000 pts valide, artillerie et chars lourds"
    limite: 2000
    attendu: valide
    formations:
      - formation: compagnie_artillerie
        choix: { "0": { canon_seisme: 5, canon_medusa: 4 } }
      - { formation: compagnie_chars_lourds, variante: vulcains }
      - formation: batterie_lourde_siege
        options: [{ option: emplacements_bombardes }]
      - { formation: silo_deathstrike }
  - nom: "formation d'appui sans compagnie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: peloton_leman_russ }
  - nom: "quatre améliorations sur une compagnie"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: compagnie_infanterie
        options:
          - { option: peloton_infanterie }
          - { option: peloton_appui_feu }
          - { option: peloton_support, variante: quad_launchers }
          - { option: escadron_hellhounds }
  - nom: "Transport de Siège sur une Compagnie de Leman Russ"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: compagnie_leman_russ
        options: [{ option: transport_siege, variante: gorgones }]
  - nom: "quota de commissaires gratuits dépassé"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: peloton_death_riders, options: [{ option: commissaire_appui }] }
      - { formation: peloton_ingenieurs, options: [{ option: commissaire_appui }] }
  - nom: "fortification sans QG ni Compagnie d'Infanterie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_death_riders }
      - { formation: positions_fortifiees }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: titan_warlord }
