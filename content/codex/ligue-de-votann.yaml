# Ligue Majeure Thurienne (Ligue de Votann), transcrit depuis le PDF expérimental 1.0 (source de vérité).
codex:
  slug: ligue-de-votann
  armee_id: 0a950336-6082-400d-a99c-7185fb977d7b
  nom: Ligue de Votann
  version: "0.2"
  faction: xenos
  categorie: armees-xenos
  statut: experimental
  citation:
    texte: "Tu sais, p'tit gars, tu peux toujours rêver de conquêtes en bossant pour l'hégémonie de Kronus ou piloter une armure de combat du conglomérat d'Ymyr, mais si tu veux être un vrai guerrier cognat, bats-toi pour la ligue majeure Thurienne !"
    auteur: Âdunn Vothik, Khâl de THU
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée des Ligues de Votann basée sur la Ligue Majeure Thurienne.

    Les armées de la Ligue Majeure Thurienne sont organisées autour de petites formations appelées détachements.

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de support sont des formations autonomes des détachements. Un maximum de 1/3 des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Jugement ancestral"
      texte: |
        Si une formation adverse provoque une perte chez une formation Votann, placez un pion "Jugement ancestral" dessus.

        Lorsqu'une formation des Ligues de Votann annonce une action de tir ou d'assaut qui cible une formation avec un pion "Jugement ancestral", elle peut relancer son test d'activation si celui-ci échoue.

        À la fin de l'action annoncée, retirez le pion "Jugement ancestral" de la formation ciblée.
    - titre: "Règle spéciale : Avances coordonnées"
      texte: |
        Les formations de la Ligue Majeure Thurienne qui possèdent des véhicules de transport peuvent passer un ordre "Avances coordonnées".

        Si la formation réussit son test d'activation, elle pourra effectuer deux mouvements lors de son activation. Les troupes embarquées peuvent sortir et tirer à la fin du premier mouvement avec un malus de -1.
    - titre: "Règle spéciale : Pur Cognat !"
      texte: |
        Un socle d'infanterie cognat collé à un véhicule de transport de sa formation gagne la compétence Sauvegarde invulnérable.
    - titre: "Règle spéciale : Transports"
      texte: |
        Les formations Ligue Majeure Thurienne disposant de l'option "Transports" peuvent prendre assez de transports pour transporter l'intégralité de la formation.

        Si cette option est prise, le nombre de transports doit être suffisant, mais la capacité totale de transport ne doit pas être excédentaire par rapport au nombre d'unités à transporter.
    - titre: "Règle spéciale : Tirs gravitiques"
      texte: |
        Les tirs de vaisseaux spatiaux possédant la note Tirs gravitiques ne nécessitent pas d'indiquer préalablement des coordonnées. Ils sont résolus après les frappes orbitales. Ils utilisent le gabarit de barrage (7,5cm) et peuvent prendre pour cible n'importe quelle formation ennemie suivant les règles du tir de barrage.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Brandon Chen."
  valeur_strategique: 3
  initiative:
    defaut: "2+"

