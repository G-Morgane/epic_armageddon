# Soutiens de l'Adeptus Titanicus : liste partagée, utilisée en alliance par les codex impériaux.
codex:
  slug: adeptus-titanicus
  nom: Adeptus Titanicus
  type: soutien
  version: "1.0"
  faction: imperium
  statut: official
  couleur: "#7a1f1f"
  intro_md: |
    Soutiens des Légions Titaniques proposés aux armées de l'Imperium. Cette liste n'est pas jouable seule : elle est incluse par les codex qui y ont droit, dans la limite fixée par chacun (en général 1/3 des points).
  valeur_strategique: "-"
  initiative:
    defaut: "1+"

unites:
  - id: warhound
    nom: Warhound
    type: EG
    vitesse: 30cm
    blindage: "5+"
    cc: "4+"
    ff: "4+"
    armes:
      - { nom: Méga Bolter Vulcain (F), portee: 45cm, puissance: "4x AP3+/AC5+, Frt" }
      - { nom: Canon Plasma Léger (F), portee: 45cm, puissance: "2xMA2+, Rchg, Frt" }
    notes: [Blindage Renforcé, Marcheur, Sans peur, "Peut passer au-dessus d'unités et des obstacles moins hauts que les genoux du titan et au maximum de 2cm de large"]
    degats: { cd: 3, bi: 2, critique: "Le titan est déséquilibré et vacille. Déplacez-le dans une direction aléatoire de 1D6cm. Si le Warhound percute un terrain infranchissable ou une unité qu'il ne peut pousser, il s'arrête et perd un point de dommage supplémentaire, les unités qu'il percute subissent une touche sur un résultat de 6+" }
  - id: reaver
    nom: Reaver
    type: EG
    vitesse: 20cm
    blindage: "4+"
    cc: "3+"
    ff: "3+"
    armes:
      - { nom: Lance-missiles Apocalypse, portee: 60cm, puissance: "4PB, FrtF" }
      - { nom: 2x Destructeurs Turbo laser, portee: 60cm, puissance: "4xAP5+/AC3+, Frt" }
    notes: [Blindage Renforcé, Marcheur, Sans peur, "Peut passer au-dessus d'unités et des obstacles moins hauts que les genoux du titan et au maximum de 2cm de large"]
    degats: { cd: 6, bi: 4, critique: "Le réacteur à plasma se fissure, lancez 1D6 à la fin de chaque tour pour chaque fissure. Sur un résultat de 1, le Reaver explose et inflige une touche sur un 5+ aux unités à 5cm, sur 2-3, le Reaver perd 1CD, sur 4+ la fissure est réparée" }
  - id: warlord
    nom: Warlord
    type: EG
    vitesse: 15cm
    blindage: "4+"
    cc: "2+"
    ff: "3+"
    armes:
      - { nom: 2x Destructeurs Turbo laser (FF), portee: 60cm, puissance: "4xAP5+/AC3+, FrtF" }
      - { nom: Canon Gatling, portee: 60cm, puissance: "4xAP4+/AC4+, Frt" }
      - { nom: Canon Volcano, portee: 90cm, puissance: "MA2+, TT (D3), Frt" }
    notes: [Blindage Renforcé, Blindage arrière Renforcé, Marcheur, Sans peur, "Peut passer au-dessus d'unités et des obstacles moins hauts que les genoux du titan et au maximum de 2cm de large"]
    degats: { cd: 8, bi: 6, critique: "Le réacteur à plasma se fissure, lancez 1D6 à la fin de chaque tour pour chaque fissure. Sur un résultat de 1 le Warlord explose et inflige une touche sur un 4+ aux unités à 5cm, sur 2-3 le Warlord perd 1 CD, sur 4+ la fissure est réparée" }

formations:
  - id: titan_warhound
    nom: Titan Warhound
    variantes:
      - { id: base, cout: 275, composition: [{ unite: warhound, nombre: 1 }] }
  - id: meute_warhounds
    nom: Meute de Warhounds
    variantes:
      - { id: base, cout: 500, composition: [{ unite: warhound, nombre: 2 }] }
  - id: titan_reaver
    nom: Titan Reaver
    variantes:
      - { id: base, cout: 650, composition: [{ unite: reaver, nombre: 1 }] }
  - id: titan_warlord
    nom: Titan Warlord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: warlord, nombre: 1 }] }

sections:
  - id: titanicus
    titre: SOUTIENS DE L'ADEPTUS TITANICUS
    contraintes: [{ type: initiative, valeur: "1+" }]
    formations: [titan_warhound, meute_warhounds, titan_reaver, titan_warlord]
