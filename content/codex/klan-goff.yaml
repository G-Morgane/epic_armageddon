    colonne_options: true
  - id: truk_en_plus
    titre: TRUK'EN'PLUS
    sous_titre: "0-2 par Bande de Guerre"
    formations: [batterie_grokalibr, kasseurs, durakuir, brigade_blitz]
    colonne_options: true
  - id: truk_eudmek
    titre: TRUK'EUD'MEK
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
