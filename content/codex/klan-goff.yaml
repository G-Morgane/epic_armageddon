    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts, bandes, truk'en'plus et un Gargant"
    limite: 3000
    attendu: valide
    formations:
      - formation: bande_guerre
        variante: mastok
        options:
          - { option: big_boss }
          - { option: k_boyz_gretchin, quantite: 4 }
          - { option: k_nobz, quantite: 2 }
          - { option: k_rok, quantite: 1 }
      - { formation: bande_nobz, variante: normale, options: [{ option: k_bonebreaka, quantite: 3 }] }
      - { formation: bande_koupkoup, variante: normale }
      - { formation: kasseurs }
      - { formation: batterie_grokalibr, options: [{ option: k_brikolo, choix: superkanon }] }
      - { formation: gargant }

  - nom: "sans Big Boss"
    limite: 2000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: bande_guerre, variante: normale }
      - { formation: bande_nobz, variante: normale }

  - nom: "trois truk'en'plus pour une seule Bande de Guerre"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: bande_guerre
        variante: normale
        options: [{ option: big_boss }]
      - { formation: kasseurs }
      - { formation: durakuir }
      - { formation: batterie_grokalibr }

  - nom: "cinq paires de Nobz sur une bande normale"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: bande_guerre
        variante: normale
        options:
          - { option: big_boss }
          - { option: k_nobz, quantite: 5 }

  - nom: "truk'eud'mek au-delà du tiers des points"
    limite: 1500
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: bande_guerre
        variante: normale
        options: [{ option: big_boss }]
      - { formation: grand_gargant }
