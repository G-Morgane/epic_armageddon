# Klan Goff, transcrit depuis le PDF expérimental fan list 0.25 (source de vérité).
codex:
  slug: klan-goff
  armee_id: 7cc9d6a9-e14b-493c-9d6c-0ae72558901f
  nom: Klan Goff
  version: "0.25"
  faction: xenos
  categorie: armees-xenos
  statut: experimental
  citation:
    texte: "Lé z'orks perdent jamais. Si k'on gagne, on gagne, si k'on meurt, on meurt alors ça kompte pas. Si k'on s'en va pour pas mourir, ça kompte pas non plus, pask'on revient après pour s'battre encore !"
    auteur: Sagesse Goff
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied une WAAAGH! d'Orks basée sur le Klan Goff.

    Les armées des Orks sont organisées autour de grandes formations appelées bandes, qui peuvent selon les cas s'acheter selon 3 tailles : la bande normale, la mastok' (doubler l'effectif de départ) ou la tré mastok' (tripler l'effectif de départ). Pour chaque bande de guerre vous pouvez prendre jusqu'à deux formations issues des truk'en'plus.

    Chaque bande et truk'en'plus peut recevoir des kust'oms. La liste d'armée indique pour chaque catégorie de bande et truk'en'plus quels kust'oms sont autorisés. Chaque kust'om autorisé peut être pris un nombre illimité de fois, sauf s'il est fait état d'une limitation de kust'om. Pour les bandes, les limitations de kust'om sont multipliées de la même façon que l'effectif de départ. Les kust'oms font partie intégrante des bandes et doivent en respecter la cohésion.

    Les truk'eud'meks sont des formations autonomes des bandes. Un maximum de 1/3 des points de l'armée peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Da Big Boss"
      texte: |
        Chaque armée Ork doit inclure une unité de commandant suprême appelée Big Boss. Cette unité est gratuite et doit obligatoirement rejoindre un Grand Gargant. S'il n'y en a pas, le Big Boss rejoindra un Gargant ou un socle de Nobz.
    - titre: "Règle spéciale : Pouvoir de la Waaagh!"
      texte: |
        Les Orks ne sont pas de fins stratèges mais la perspective d'une bonne bagarre les galvanise toujours. Afin de représenter ceci, une formation tentant une action d'Avance Rapide ou d'Assaut reçoit +2 à l'initiative pour son test d'action.

        Les formations aériennes ont +2 de bonus pour les tests d'actions lorsqu'elles tentent une Interception ou une Attaque au sol.
    - titre: "Règle spéciale : Waaagh!"
      texte: |
        Le Big Boss pousse un hurlement qui retentit sur le champ de bataille : "Waaagh!". Les orks sont galvanisés et chargent à travers le champ de bataille.

        Le joueur ork peut déclarer, une fois par partie, qu'il utilise la règle Waaagh!. Cette déclaration a lieu en début de tour, avant le placement des téléportations et du jet d'initiative.

        La règle Waaagh! dure tout le tour. Pendant ce tour, toutes les unités d'infanterie Ork dont le mouvement est au maximum de 15cm et qui sont présentes sur la table à ce moment là gagnent la règle Infiltrateurs.
    - titre: "Règle spéciale : R'mise en bande"
      texte: |
        Lorsque les bandes Orks tentent un test de ralliement, ils reçoivent un bonus de +1 lorsqu'ils sont plus de 5 et de +2 lorsqu'ils sont plus de 10. Les engins de guerre faisant partie de ces bandes comptent pour autant d'unités que leur capacité de dommage de départ. Ne sont comptabilisables dans le calcul ni les Gretchins ni les Grokalibr'.
    - titre: "Règle spéciale : Champ énergétique"
      texte: |
        Certains engins de guerre Orks possèdent des champs énergétiques. Le nombre dont dispose chaque engin est indiqué sur sa fiche d'unité. Les champs énergétiques fonctionnent de la même manière que ceux des impériaux, à la différence qu'une fois abattus, ils ne sont pas réparables et restent donc inactifs jusqu'à la fin de la bataille.
    - titre: "Règle spéciale : Rok"
      texte: |
        Une formation se déployant par Assaut Planétaire et pouvant être transportée par Rok le fait selon les règles spéciales suivantes : placez un marqueur de Rok en utilisant les règles d'Assaut Planétaire (4.3 et 4.4 du Livre de Règles). Un Kroiseur en orbite sera nécessaire pour déployer les Rok.

        Le Rok est un marqueur comptant comme la première unité de la formation au moment de déterminer son emplacement d'arrivée en Assaut Planétaire. Une fois le marqueur placé, résolvez son attaque de tir sur toutes les unités ennemies à moins de 15 cm de son centre. Chaque formation ennemie attaquée reçoit un Pion Impact selon les règles normales de tir.

        Ensuite, débarquez les troupes transportées dans le Rok complètement à moins de 15 cm du centre de celui-ci, en cohésion et en dehors de toute zone de contrôle ennemie. Si les unités ne peuvent débarquer en totalité, les unités restantes seront détruites sans attribution de pions d'impacts.

        Le Rok n'étant pas une unité mais un marqueur, il ne possède pas de zone de contrôle et il ne compte pas pour la cohérence de la formation. De plus, il ne peut pas être utilisé pour revendiquer un feu croisé ainsi que pour tenir ou contester des objectifs.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD."
  valeur_strategique: 3
  initiative:
    defaut: "3+"
    exceptions:
      - { portee: "Kroiseurs", valeur: "2+" }

