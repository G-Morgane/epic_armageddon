    contraintes:
      - { type: consomme, budget: slot_support }
      - { type: max_options, valeur: 3 }
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation, et jusqu'à un maximum de 3 par formation"
  - id: support_lourd
    titre: FORMATIONS DE SUPPORT LOURD
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
    formations: [croiseur_eldar, escadrille_hemlock, escadrille_phoenix, vampire_hunter, titan_archonte, titan_fantome, escadron_titans_revenants]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts valide, deux Osts de Guerre et quatre formations de Support"
    limite: 3000
    attendu: valide
    formations:
      - formation: ost_guerre_gardiens
        options:
          - { option: plateformes_armes_lourdes, quantite: 3 }
          - { option: plateformes_support }
          - { option: seigneurs_fantomes, choix: ajouter_seigneurs_fantomes }
      - formation: ost_gardes_fantomes
        options:
          - { option: pierres_esprit }
      - formation: peloton_aspects
        variante: vengeurs
        options:
          - { option: exarque }
          - { option: transport, repartition: { wave_serpent: 2 } }
      - { formation: peloton_rangers }
      - { formation: escadron_marcheurs }
      - { formation: escadron_bouclier_vaul, variante: trois_tisseurs }
      - { formation: escadron_titans_revenants }
  - nom: "2000 pts valide, Chevaliers comptés dans le support lourd et machines de Vaul"
    limite: 2000
    attendu: valide
    formations:
      - formation: ost_guerre_gardiens
        options:
          - { option: fantomes, choix: ajouter_gardes_fantomes, quantite: 2 }
          - { option: commandant_supreme }
      - formation: ost_seigneurs_fantomes
        options:
          - { option: pierres_esprit }
          - { option: seigneurs_fantomes, choix: remplacer_assaut_par_seigneurs }
      - formation: escadron_lame_vaul
        choix: { "0": { falcon: 2, prisme_feu: 3 } }
        options: [{ option: firestorm_remplacement, quantite: 1 }]
      - formation: escadron_machine_vaul
        choix: { "0": { cobra: 1 } }
        options: [{ option: machine_vaul, repartition: { scorpion: 1 } }]
      - formation: escadron_chevaliers
        options: [{ option: pierres_esprit }]
      - { formation: portail }
  - nom: "trois formations de Support pour un seul Ost de Guerre"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: ost_guerre_gardiens }
      - { formation: peloton_rangers }
      - { formation: escadron_marcheurs }
      - { formation: escadron_bouclier_vaul, variante: trois_tisseurs }
  - nom: "support lourd au-delà du tiers des points"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: ost_guerre_gardiens }
      - { formation: titan_archonte }
  - nom: "quatre améliorations sur un même Ost de Guerre"
    limite: 1000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: ost_guerre_gardiens
        options:
          - { option: plateformes_support }
          - { option: fantomes, choix: ajouter_gardes_fantomes, quantite: 1 }
          - { option: seigneurs_fantomes, choix: ajouter_seigneurs_fantomes }
          - { option: firestorm_ost_guerre }
  - nom: "deux Pelotons de Guerriers Aspects dans la même armée"
    limite: 2000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: ost_guerre_gardiens }
      - { formation: peloton_aspects, variante: vengeurs }
      - { formation: peloton_aspects, variante: banshees }
  - nom: "armée sans Ost de Guerre de Gardiens"
    limite: 1500
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: ost_gardes_fantomes }
      - { formation: peloton_rangers }
