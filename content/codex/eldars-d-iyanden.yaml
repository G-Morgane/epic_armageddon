options:
  # ---- Personnage/option ----
  - id: commandant_supreme
    nom: Commandant suprême
    effet: { type: mot_cle, texte: "Commandant Suprême", cout: 50, cible: [grand_prophete] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [grand_prophete] }
      - { type: hors_quota_options }
    phrase_pdf: "Un Grand Prophète devient Commandant Suprême"
    note_md: "Personnage/option : un seul par armée. Ne compte pas dans les 3 améliorations de la formation."

  # ---- Améliorations d'Iyanden ----
  - id: exarque
    nom: Exarque
    effet: { type: ajouter, cout: 25, unites: [{ unite: exarque }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [vengeurs, guerriers_scorpions, banshees, dragons_feu, faucheurs_noirs, araignees_spectrales, aigles_chasseurs, lances_lumiere] }
    phrase_pdf: "Ajouter 1 personnage Exarque à une unité de Guerriers Aspects"
  - id: plateformes_support
    nom: Plate-formes de Support
    effet: { type: ajouter, cout: 50, unites: [{ unite: plateforme_arme_support, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 3 Plate-formes de Support"
  - id: pierres_esprit
    nom: Pierres Esprit
    effet: { type: mot_cle, texte: Meneur, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter des Pierres-Esprits (la formation gagne Meneur)"
  - id: fantomes
    nom: Fantômes
    effet:
      type: choix
      parmi:
        - id: remplacer_guerriers_par_gardes
          nom: "Remplacer 2 unités de Guerriers Fantômes par 2 unités de Gardes Fantômes"
          effet: { type: remplacer, de: guerriers_fantomes, par: gardes_fantomes, lot: 2, max: 1, cout: 25 }
        - id: ajouter_gardes_fantomes
          nom: "Ajouter 1 à 3 Gardes Fantômes"
          effet: { type: ajouter, unites: [{ unite: gardes_fantomes }], cout_par_unite: 50, min: 1, max: 3 }
        - id: ajouter_guerriers_fantomes
          nom: "Ajouter 2 unités de Guerriers Fantômes"
          effet: { type: ajouter, unites: [{ unite: guerriers_fantomes, nombre: 2 }], cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "25 pts le remplacement, 50 pts chacun pour les Gardes Fantômes ajoutés, 75 pts les 2 Guerriers Fantômes."
  - id: seigneurs_fantomes
    nom: Seigneurs Fantômes
    effet:
      type: choix
      parmi:
        - id: remplacer_assaut_par_seigneurs
          nom: "Remplacer 2 unités de Seigneurs Fantômes d'Assaut par 2 unités de Seigneurs Fantômes"
          effet: { type: remplacer, de: seigneur_fantome_assaut, par: seigneur_fantome, lot: 2, max: 1, cout: 25 }
        - id: ajouter_seigneurs_fantomes
          nom: "Ajouter 3 Seigneurs Fantômes"
          effet: { type: ajouter, unites: [{ unite: seigneur_fantome, nombre: 3 }], cout: 175 }
        - id: ajouter_seigneurs_assaut
          nom: "Ajouter 3 Seigneurs Fantômes d'Assaut"
          effet: { type: ajouter, unites: [{ unite: seigneur_fantome_assaut, nombre: 3 }], cout: 175 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: transport
    nom: Transport
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: falcon, cout: 50 }
        - { unite: wave_serpent, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Toute la formation doit être transportée sans qu'il ne reste de place libre."
    note_md: "50 pts le Falcon ou Wave Serpent, 75 pts les 2 Wave Serpents (la remise sur la paire de Wave Serpents n'est pas appliquée automatiquement : chaque véhicule est compté 50 pts)."
  - id: firestorm_remplacement
    nom: Firestorm
    effet: { type: remplacer, de: [tisseur_nuit, falcon, warp_hunter, prisme_feu], par: firestorm, lot: 1, max: 2, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer 1 ou 2 véhicules blindés de la formation par autant de Firestorms (25 pts chacun)"
  - id: firestorm_ost_guerre
    nom: Firestorm
    effet: { type: ajouter, cout: 75, unites: [{ unite: firestorm }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Firestorm à l'Ost de Guerre"
  - id: machine_vaul
    nom: Machine de Vaul
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: cobra, cout: 200 }
        - { unite: scorpion, cout: 200 }
        - { unite: storm_serpent, cout: 200 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 unité(s) supplémentaire(s) parmi : Cobra, Scorpion, Storm Serpent (200 pts chacun)"

  # ---- Composition de l'Ost de Guerre de Gardiens ----
  - id: plateformes_armes_lourdes
    nom: Plate-formes d'Armes Lourdes
    effet: { type: remplacer, de: gardiens, par: plateforme_arme_lourde, lot: 1, max: 3, cout: 0 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "Remplacer gratuitement jusqu'à 3 unités de Gardiens par des Plate-formes d'Armes Lourdes"
    note_md: "Fait partie de la composition de l'Ost de Guerre de Gardiens : gratuit et ne compte pas dans les 3 améliorations."

  # ---- Armement des titans (gratuit) ----
  - id: armement_titan_fantome
    nom: Armement du Titan Fantôme
    effet:
      type: choix
      parmi:
        - { id: deux_lasers_pulsars, nom: 2 Lasers Pulsars, cout: 0 }
        - { id: laser_pulsar_poing, nom: 1 Laser Pulsar et 1 Poing Énergétique, cout: 0 }
    contraintes:
      - { type: hors_quota_options }
      - { type: max_par_formation, valeur: 1 }
    note_md: "Le Titan Fantôme peut être équipé de 2 Lasers Pulsars ou de 1 Laser Pulsar et 1 Poing Énergétique. L'armement est gratuit."
  - id: armement_titan_archonte
    nom: Armement du Titan Archonte
    effet:
      type: choix
      parmi:
        - { id: lance_psychique_laser_pulsar, nom: 1 Lance Psychique et 1 Laser Pulsar, cout: 0 }
        - { id: lance_psychique_poing, nom: 1 Lance Psychique et 1 Poing Énergétique, cout: 0 }
    contraintes:
      - { type: hors_quota_options }
      - { type: max_par_formation, valeur: 1 }
    note_md: "Le Titan Archonte peut être équipé de 1 Lance Psychique et 1 Laser Pulsar ou 1 Lance Psychique et 1 Poing Énergétique. L'armement est gratuit."

