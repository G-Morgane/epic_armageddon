options:
  # ---- Options d'armée ----
  - id: portail
    nom: Portail
    effet: { type: mot_cle, texte: Portail Harlequin, cout: 50 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "0-1 Portail : placez 1 Portail Harlequin sur un objectif de votre bord de table (50 pts)"
  - id: grand_harlequin
    nom: Grand Harlequin
    effet: { type: mot_cle, texte: "Grand Harlequin (Commandant Suprême)", cout: 50, cible: [coryphee] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: requiert_unite, unites: [coryphee] }
    phrase_pdf: "0-1 Grand Harlequin : un Coryphée obtient le mot-clé Commandant Suprême (50 pts)"

  # ---- Améliorations ----
  - id: personnage
    nom: Personnage
    effet:
      type: choix
      parmi:
        - { id: coryphee, nom: Coryphée, cout: 25, effet: { type: ajouter, unites: [{ unite: coryphee }] } }
        - { id: prophete, nom: Prophète de l'Ombre, cout: 25, effet: { type: ajouter, unites: [{ unite: prophete_ombres }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 Coryphée ou 1 Prophète de l'Ombre à une unité de la formation (25 pts)"
  - id: choristes
    nom: Choristes
    effet:
      type: choix
      parmi:
        - { id: lumiere, nom: 4 Choristes (Lumière), cout: 175, effet: { type: ajouter, unites: [{ unite: choristes_lumiere, nombre: 4 }] } }
        - { id: penombre, nom: 4 Choristes (Pénombre), cout: 175, effet: { type: ajouter, unites: [{ unite: choristes_penombre, nombre: 4 }] } }
        - { id: crepuscule, nom: 4 Choristes (Crépuscule), cout: 175, effet: { type: ajouter, unites: [{ unite: choristes_crepuscule, nombre: 4 }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 4 unités de Choristes à la formation (175 pts)"
  - id: solitaire
    nom: Solitaire
    effet: { type: ajouter, cout: 75, unites: [{ unite: solitaire }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "0-1 Solitaire : ajoutez 1 Solitaire à la formation (75 pts)"
  - id: starweavers
    nom: Starweavers
    effet: { type: ajouter, cout: 100, unites: [{ unite: starweaver, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 4 Starweavers à la formation (100 pts)"

formations:
  - id: troupe
    nom: Troupe
    variantes:
      - { id: lumiere, nom: 4 Choristes (Lumière), cout: 200, composition: [{ unite: choristes_lumiere, nombre: 4 }] }
      - { id: penombre, nom: 4 Choristes (Pénombre), cout: 200, composition: [{ unite: choristes_penombre, nombre: 4 }] }
      - { id: crepuscule, nom: 4 Choristes (Crépuscule), cout: 200, composition: [{ unite: choristes_crepuscule, nombre: 4 }] }
    options: [portail, grand_harlequin, personnage, choristes, solitaire, starweavers]
    phrase_pdf: "4 unités de Choristes"
  - id: mimes
    nom: Mimes
    variantes:
      - { id: base, cout: 200, composition: [{ unite: mimes, nombre: 4 }] }
    options: [portail, grand_harlequin]
  - id: bouffons_tragiques
    nom: Bouffons Tragiques
    variantes:
      - { id: base, cout: 225, composition: [{ unite: bouffons_tragiques, nombre: 4 }] }
    options: [portail, grand_harlequin, starweavers]
  - id: escadron_skyweavers
    nom: Escadron de Skyweavers
    variantes:
      - { id: base, cout: 250, composition: [{ unite: skyweavers, nombre: 4 }] }
    options: [portail, grand_harlequin]
  - id: voidweavers
    nom: Voidweavers
    variantes:
      - { id: base, cout: 250, composition: [{ unite: voidweaver, nombre: 4 }] }
    options: [portail, grand_harlequin, starweavers]

sections:
  - id: detachements
    titre: DÉTACHEMENTS HARLEQUINS
    formations: [troupe, mimes, bouffons_tragiques, escadron_skyweavers, voidweavers]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS HARLEQUINS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement"
    options: [portail, grand_harlequin, personnage, choristes, solitaire, starweavers]
    notes:
      mimes_absente: "La colonne Améliorations du PDF propose « Mimes » à la Troupe et aux Bouffons Tragiques, mais le tableau des améliorations ne donne aucune ligne ni coût pour cette amélioration : elle n'est donc pas transcrite."

listes_test:
  - nom: "3000 pts, Troupe, Mimes, Bouffons et Voidweavers"
    limite: 3000
    attendu: valide
    formations:
      - formation: troupe
        variante: penombre
        options:
          - { option: portail }
          - { option: personnage, choix: coryphee }
          - { option: grand_harlequin }
          - { option: choristes, choix: penombre }
          - { option: starweavers }
      - { formation: mimes }
      - { formation: bouffons_tragiques, options: [{ option: starweavers }] }
      - { formation: escadron_skyweavers }
      - { formation: voidweavers }

  - nom: "deux Portails"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: troupe, variante: lumiere, options: [{ option: portail }] }
      - { formation: mimes, options: [{ option: portail }] }

  - nom: "deux Solitaires"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: troupe, variante: lumiere, options: [{ option: solitaire }] }
      - formation: troupe
        variante: crepuscule
        options: [{ option: solitaire }]

  - nom: "Grand Harlequin sans Coryphée"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - { formation: mimes, options: [{ option: grand_harlequin }] }

  - nom: "Starweavers sur des Mimes"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - { formation: mimes, options: [{ option: starweavers }] }
