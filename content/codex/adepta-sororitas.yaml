# Adepta Sororitas, transcrit depuis le PDF EAFR rev 1.2 (source de vérité).
codex:
  slug: adepta-sororitas
  armee_id: 557ea78f-2ded-475e-bf4c-117910a42387
  nom: Adepta Sororitas
  version: "1..2"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  citation:
    texte: "Certains prétendent que nous devrions pardonner aux ignorants, aux timorés et aux dévoyés. Ces faibles qui prônent la clémence et la compréhension sont aussi coupables que ceux qu'ils cherchent à excuser. Qu'ils brûlent tous sur le même bûcher !"
    auteur: Chanoinesse Ismelda Caritados
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de l'Adepta Sororitas.

    Les armées de l'Adepta Sororitas sont organisées autour de formations appelées formations de l'Ordre Militant. Chacune d'entre elles permet de recruter jusqu'à une formation de l'ecclésiarchie.

    Chaque formation peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par formation. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'une formation tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de la Navy Impériale et Support Lourd sont des formations autonomes. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Acte de Foi"
      texte: |
        Une seule formation de l'Ordre Militant de l'Adepta Sororitas peut choisir de faire un acte de foi par tour quand elle fait son test d'action.

        La formation reçoit alors une pénalité de -1 à son test d'action (qui est cumulatif avec les autres modificateurs).

        Si le test d'action est réussi, la formation résout son action normalement. De plus, toutes les unités de la formation gagnent « Sans Peur » et « Sauvegarde invulnérable » jusqu'au début de la séquence de jeu « fin du tour » (§1.14 du livre de règle).

        Si le test d'action est raté, la formation doit effectuer l'action Tenir comme indiqué dans le §1.6.2 du livre de règle.
    - titre: "Règle spéciale : Sainte"
      texte: |
        Si une formation ou une unité de la formation possède la règle spéciale Sainte alors la formation ignore la pénalité « -1 » à son test d'action dû à la règle Acte de foi. Elle subit par contre toutes les autres pénalités à son test d'action comme indiqué dans le §1.6.2 du livre de règle.
    - titre: "Règle spéciale : Transport"
      texte: |
        Si une formation possède des véhicules de transport (amélioration Transport et/ou Repressor), vous devez prendre assez de véhicules pour transporter l'intégralité de la formation (amélioration comprise). Toutes les places des transports doivent être occupées.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de Juan Martinez."
  valeur_strategique: 3
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Formations de l'Ordre Militant", valeur: "1+" }
      - { portee: "Incinérator et Cathédrale", valeur: "1+" }

budgets:
  - id: slot_ecclesiarchie
    libelle: Formations de l'Ecclésiarchie
    capacite: { source: fournitures }
