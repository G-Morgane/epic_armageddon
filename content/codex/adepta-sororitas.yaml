options:
  - id: superieure
    nom: Supérieure
    effet:
      type: choix
      parmi:
        - id: palatine
          nom: Palatine
          cout: 50
          effet: { type: ajouter, unites: [{ unite: palatine, nombre: 1 }] }
        - id: chanoinesse
          nom: Chanoinesse
          cout: 75
          effet: { type: ajouter, unites: [{ unite: chanoinesse, nombre: 1 }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un personnage de Palatine à la formation (50 pts) ou ajouter un personnage de Chanoinesse à la formation (75 pts, 1 maximum par armée)"
  - id: celeste
    nom: Céleste
    effet: { type: remplacer, de: soeur_bataille, par: celeste, lot: 2, max: 1, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer deux unités de la formation par deux unités de Céleste"
  - id: exorciste
    nom: Exorciste
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: exorciste }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter de 1 à 2 Exorciste(s) à la formation (50 pts chacun)"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: transport
    nom: Transport
    effet:
      type: choix
      parmi:
        - id: rhinos_3
          nom: 3 Rhinos
          cout: 25
          effet: { type: ajouter, unites: [{ unite: rhino, nombre: 3 }] }
        - id: rhinos_4
          nom: 4 Rhinos
          cout: 50
          effet: { type: ajouter, unites: [{ unite: rhino, nombre: 4 }] }
        - id: immolators
          nom: Immolators
          cout: 0
          effet:
            type: choix_multiple
            total: { min: 1, max: besoin_transport }
            parmi:
              - { unite: immolator_immolation, cout: 25 }
              - { unite: immolator_justice, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter des Rhinos à la formation (25 pts par 3 / 50 pts par 4) ou ajouter des Immolators à la formation (25 pts chacun)"
    note_ref: transport
  - id: repressor
    nom: Repressor
    effet:
      type: choix
      parmi:
        - id: repressors_3
          nom: 3 Repressors
          cout: 50
          effet: { type: ajouter, unites: [{ unite: repressor, nombre: 3 }] }
        - id: repressors_4
          nom: 4 Repressors
          cout: 75
          effet: { type: ajouter, unites: [{ unite: repressor, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter des Repressors à la formation (50 pts par 3 / 75 pts par 4)"
    note_ref: transport
  - id: machine_penitence
    nom: Machine de Pénitence
    effet: { type: ajouter, cout: 75, unites: [{ unite: machine_penitence, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 machines de pénitences"
  - id: transport_inquisition
