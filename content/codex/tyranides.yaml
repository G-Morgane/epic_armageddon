      - { id: faucheur, nom: 1 Hiérodule Prime Faucheur, cout: 150, composition: [{ unite: hierodule_prime_faucheur, nombre: 1 }] }
    sous_formations:
      label: essaims instinctifs
      total: { min: 1, max: 2 }
