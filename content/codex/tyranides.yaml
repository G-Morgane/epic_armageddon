    ff: "5+"
    armes:
      - { nom: Griffes monstrueuses, portee: (contact), puissance: "Armes d'assaut, +2A, TT (D3)" }
      - { nom: Tentacules, portee: (contact), puissance: "Armes d'assaut, +2A, FeP" }
      - { nom: 2x Lances-dards, portee: (15cm), puissance: "Armes légères, +1A" }
      - { nom: Bio-plasma lourd, portee: 30cm, puissance: "4PB MA, FrtF" }
      - { nom: 2x Bio-canon lourd, portee: 60cm, puissance: "2xAP3+/AC4+, FrtF" }
    notes: [Sans peur, Blindage renforcé, Sauvegarde invulnérable, "Peut enjamber les unités et les terrains infranchissables moins hauts que son abdomen et d'au maximum 2cm de large"]
    degats: { cd: 8, critique: "Lancez 1D6 et consultez le tableau ci-dessous. 1 : Le Hydraphant hurle de rage et se débat sous l'effet de la blessure. Toute unité en contact avec son socle subit une attaque MA6+. 2-5 : Un liquide visqueux s'écoule d'une profonde blessure du Hydraphant, qui perd 1 CD supplémentaire. 6 : Le plexus nerveux central du Hydraphant est détruit. La créature est tuée." }
  # ---- Feuille de références Flotte ----
  - id: harpie
    nom: Harpies
    type: A
    vitesse: B
    blindage: "5+"
    cc: "-"
    ff: "-"
    armes:
      - { nom: Étrangleurs jumelés, portee: 30cm, puissance: "AP4+, Rpt" }
      - { nom: Attaque au passage, portee: 15cm, puissance: "AP5+/AC5+/AA5+" }
      - { nom: Spores mines bombardées, portee: 15cm, puissance: "1PB" }
  - id: virago
    nom: Virago
    type: A
    vitesse: C
    blindage: "5+"
    cc: "-"
    ff: "-"
    armes:
      - { nom: Canon salivaire, portee: 30cm, puissance: "AP4+/AC5+, FrtF" }
      - { nom: Tentaclide, portee: 15cm, puissance: "AA6+" }
  - id: croiseur_razorfiend
    nom: Croiseur Razorfiend
    type: VS
    armes:
      - { nom: Bombardement orbital, portee: "∞", puissance: "3PB" }
    notes: ["Transport (jusqu'à deux spores mycétiques et tout ce qu'elles contiennent)"]
    transport: { capacite: 2, accepte: [spore_mycetique] }
  - id: vaisseau_ruche
    nom: Vaisseau Ruche
    type: VS
    armes:
      - { nom: Bombardement orbital (VR), portee: "∞", puissance: "8PB" }
    notes: [Lent, "Transport (jusqu'à cinq spores mycétiques et tout ce qu'elles contiennent)"]
    transport: { capacite: 5, accepte: [spore_mycetique] }
  - id: spore_mycetique
    nom: Spores Mycétiques
    type: VB
    vitesse: "-"
    blindage: "-"
    cc: "-"
    ff: "-"
    armes:
      - { nom: Tentacules éventreurs, portee: 15cm, puissance: "AP6+, Rpt" }
    notes:
      - Assaut planétaire
      - "Transport (15) : Termagants, Hormagaunts, Biovores, Rôdeur, Carnifex, Prince, Guerriers Tyranides, Zoanthropes."
      - "Une fois que les Spores ont atterries, les tentacules éventreurs s'attaquent à chaque unité ennemie dans un rayon de 15cm. Chaque formation ainsi attaquée reçoit un pion impact pour être sous le feu de l'ennemi puis résolvez les attaques. Enfin, toutes les troupes transportées doivent débarquer à moins de 5cm des Spores ou à moins de 5cm d'une autre unité ayant déjà débarqué, du moment que toutes les unités soient placées dans un rayon de 15cm autour des spores."
    transport: { capacite: 15, accepte: [termagant, hormagaunt, biovore, rodeur, carnifex, prince_tyranide, prince_maitre_essaims, guerrier_tyranide, zoanthrope] }

options:
  # ---- Groupes synaptiques ----
  - id: alpha_prince
    nom: Prince Alpha
    effet: { type: mot_cle, texte: "Prince Alpha : gagne la note Charismatique", cout: 25, cible: [prince_tyranide, prince_tyranide_aile] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Un seul Prince Tyranide par armée peut devenir un Prince Alpha pour +25pts, il gagne la note Charismatique"
  - id: spore_transport
    nom: Spore Mycétique
    effet: { type: ajouter, cout: 50, unites: [{ unite: spore_mycetique, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: taille_max_formation, valeur: 15 }
      - { type: exclut, options: [guerriers_ailes, prince_aile] }
    note_md: "Un Croiseur Razorfiend (2 spores max.) ou un Vaisseau Ruche (5 spores max.) doit être sélectionné dans la liste. La formation ne doit comprendre que des Termagants, Hormagaunts, Biovores, Rôdeurs, Carnifex, Princes Tyranides, Princes Maîtres des Essaims, Guerriers Tyranides et Zoanthropes."
    phrase_pdf: "spore mycétique"
  - id: guerriers_ailes
    nom: Guerriers Tyranides Ailés
    effet: { type: remplacer, de: guerrier_tyranide, par: guerrier_tyranide_aile, tout: true, cout: 0 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [guerrier_tyranide] }
      - { type: exclut, options: [spore_transport] }
    note_md: "Les Guerriers Tyranides gagnent Réacteurs dorsaux, leur vitesse passe à 30cm et leur blindage à 5+."
  - id: prince_aile
    nom: Prince Ailé
    effet: { type: remplacer, de: prince_tyranide, par: prince_tyranide_aile, tout: true, cout: 0 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [prince_tyranide] }
      - { type: exclut, options: [spore_transport] }
    note_md: "Le Prince Tyranide gagne Réacteurs dorsaux, sa vitesse passe à 30cm et son blindage à 5+."
  # ---- Essaims indépendants communs ----
  - id: genestealers_supp
    nom: Genestealers supplémentaires
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: genestealer }], max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "0-3 Genestealers pour +25 pts / unité"
  - id: genestealer_alpha
    nom: Genestealer Alpha
    effet: { type: ajouter, cout: 25, unites: [{ unite: genestealer_alpha, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "0-1 Genestealers Alpha pour +25 pts"
  - id: lictors_supp
    nom: Lictors supplémentaires
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: lictor }], max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "0-2 Lictors pour +50 pts / unité"
  # ---- Essaims indépendants rares ----
  - id: harpies_supp
    nom: Harpies supplémentaires
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: harpie }], max: 2 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [harpie] }
    phrase_pdf: "0-2 Harpies supplémentaires pour 50 pts chacune"

formations:
  # ---- Groupe synaptique ----
  - id: groupe_nexus
    nom: Groupe Nexus
    variantes:
      - id: dominatrix
        nom: 1 Dominatrix
        cout: 400
        composition:
          - { unite: dominatrix, nombre: 1 }
        contraintes:
          - { type: consomme, budget: rare, quoi: points }
          - { type: cout_rare, valeur: 400 }
      - id: prince_maitre
        nom: 1 Prince Maître des Essaims et 2 unités synaptiques
        cout: 175
        composition:
          - { unite: prince_maitre_essaims, nombre: 1 }
          - choix:
              total: 2
              parmi: [{ unite: guerrier_tyranide }, { unite: zoanthrope }]
              phrase_pdf: "2 unités parmi : Guerriers Tyranides ; Zoanthrope"
    sous_formations:
      label: essaims instinctifs
      total: { min: 2, max: 6 }
      parmi: [gaunts, bio_artillerie, gargouilles, carnifex, bio_soutien, bio_tank, hierodule, fouisseurs]
