# Tyranides, transcrit depuis le PDF v1.4 (source de vérité).
codex:
  slug: tyranides
  nom: Tyranides
  version: "1.4"
  faction: xenos
  categorie: armees-xenos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/tyranides.jpg
  couleur: "#96009e"
  citation:
    texte: "Il est ironique de voir qu'alors que nous répandons la paix et l'espoir dans la galaxie, les tyranides font de même avec la peur et la mort. Nous devons nous unir pour espérer leur résister."
    auteur: Aun'shi de l'Empire T'au
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée issue des flottes ruches tyranides telles que Leviathan, Jormungandr ou Behemoth.

    Les armées tyranides sont organisées autour de formations appelées Groupe Synaptique, Essaims Indépendants Communs et Essaims Indépendants rares.

    Chaque Groupe Synaptique a une puissance synaptique qui liste les formations sélectionnées parmi les essaims instinctifs qui doivent être ajoutées au Groupe Synaptique.

    Les Essaims Indépendants Communs sont des formations autonomes des Groupes Synaptiques. Chaque Essaim Indépendant Commun peut recevoir des améliorations. La liste d'armée indique quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par Essaim. Les améliorations font partie intégrante des Essaims et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un Essaim tandis que d'autres ajoutent des unités supplémentaires.

    Les Essaims Indépendants Rares sont des formations autonomes des Groupes Synaptiques. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Synapse"
      texte: |
        Une créature Synapse permet de retirer 1 pion impact supplémentaire au Groupe Synaptique si celui-ci réussit son jet de ralliement (une synapse ayant la capacité Meneur peut donc enlever 2 PI au Groupe Synaptique si le jet est réussi). Une Dominatrix peut toujours retirer 3 pions impacts supplémentaires au groupe Nexus (la capacité Meneur donnée par la capacité Commandant Suprême est déjà incluse dans ces 3 pions impacts).

        Tant qu'une créature Synapse est vivante, le Groupe Synaptique lui correspondant bénéficie d'un bonus de +1 pour un jet de ralliement.

        Dans le cas où toutes les créatures Synapses du Groupe Synaptique sont détruites, les essaims instinctifs associés continuent à agir comme une seule formation, mais celle-ci subit un malus de -2 à l'initiative et perd le bonus de +1 pour le jet de ralliement.
    - titre: "Règle spéciale : Implacable"
      texte: |
        Un essaim Tyranide bénéficie toujours d'un bonus de +1 au test d'action pour un ordre d'assaut.

        Un essaim Tyranide devant effectuer l'action Tenir, peut uniquement effectuer un double mouvement sans possibilité d'effectuer de soutien d'assaut.
    - titre: "Règle spéciale : Mobilité"
      texte: |
        Les véhicules blindés et les engins de guerre Tyranides ignorent tous les tests de terrain dangereux.

        Les véhicules légers tyranides peuvent traverser les terrains et profiter des règles de couvert comme s'il s'agissait d'infanterie.

        Les éléments de fortification (champs de mines, barbelés, etc.) et les éléments de terrains spéciaux (rivière de lave, etc.) affectent cependant les Tyranides normalement.
    - titre: "Règle spéciale : Déploiement"
      texte: |
        Seuls les Essaims Indépendants peuvent se déployer en garnison, s'ils respectent les conditions le permettant.
    - titre: "Règle spéciale : Gaunt"
      texte: |
        Les unités de Gaunts détruites ne comptent pas dans le décompte des pertes pour déterminer le vainqueur d'un assaut tant qu'une créature Synapse est présente dans la formation et si et seulement si le joueur Tyranide a initié l'assaut.
    - titre: "Règle spéciale : Prime"
      texte: |
        Les Trygons Prime et les Hiérodules Prime (Cracheur ou Faucheur) ajoutent les notes Synapse et Sans peur à leurs profils.
    - titre: "Règle spéciale : Tunnelier"
      texte: |
        Les formations où toutes les unités sont tunneliers (ou sont transportées dans des unités qui sont tunneliers) peuvent être gardées hors de la table et peuvent apparaître au début du deuxième tour ou après. Mettre en place les unités au contact du bord de la table de leur propre camp avant le début de la bataille en même temps que les vaisseaux spatiaux sont installés (voir 4.3.1). Toutes les unités transportées dans le tunnelier doivent également être placées de côté à ce moment.

        Notez secrètement l'emplacement où le tunnelier fera surface en même temps et de la même manière que vous enregistrez les coordonnées d'une zone de largage (voir 4.3.1). Vous devez également enregistrer secrètement quand le tunnelier fera surface. S'il doit faire surface dans votre moitié de table, il peut arriver à partir du deuxième tour. S'il doit faire surface dans la moitié opposée de la table, il peut arriver à partir du troisième tour.

        Placer le tunnelier au début du tour indiqué, avant de placer les unités avec téléportation, à l'endroit que vous avez noté. Toutes les unités transportées sont autorisées à débarquer immédiatement après leur remontée à la surface. La remontée ne compte pas comme un mouvement pour ce qui est du déclenchement des tirs d'état d'alerte. Le débarquement déclenche normalement le tir d'état d'alerte.

        Si le tunnelier fait surface sur un terrain qui lui est infranchissable, sous une unité amie ou dans une zone de contrôle ennemie, on suppose que l'équipement de détection embarqué le détournera vers un autre point d'entrée. L'unité doit être déplacée par le joueur adverse vers la zone la plus proche où elle peut faire surface.

        Les formations de plusieurs tunneliers n'ont besoin d'enregistrer qu'un seul emplacement où elles feront surface. Placez une unité à cet emplacement, ou à moins de 5 cm d'une autre unité qui a déjà été placée, à condition que toutes les unités soient placées à moins de 15 cm de l'emplacement et sur la moitié appropriée de la table.

        Le tunnelier, et toutes les unités qui y sont transportées, peuvent effectuer une action le tour où ils apparaissent.
    - titre: "Règle spéciale : Spore Mycétique"
      texte: |
        Un Groupe Synaptique peut embarquer dans un Spore Mycétique pour 50 pts, si :

        - un Croiseur Razorfiend (2 spores mycétiques max.) ou un Vaisseau Ruche (5 spores mycétique max.) est sélectionné dans la liste ;
        - la formation ne compte pas plus de 15 unités ;
        - la formation ne comprend que les unités suivantes : Termagants, Hormagaunts, Biovores, Rôdeur, Carnifex, Prince Tyranide, Prince Maître des Essaims, Guerriers Tyranides, Zoanthropes ;

        De plus, cette option interdit la prise de Prince Ailé ou de Guerriers Tyranide Ailés.
    - titre: "Règle spéciale : Objectifs et conditions de victoire"
      texte: |
        Seuls les essaims Indépendants et les créatures Synapses (pas les essaims instinctifs) peuvent contrôler ou contester les objectifs.

        De même pour la condition de victoire « ils ne passeront pas », seuls les essaims Indépendants et les créatures Synapses (pas les essaims instinctifs) comptent s'ils sont dans la moitié de table adverse.
