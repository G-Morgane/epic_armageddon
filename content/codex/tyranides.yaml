sections:
  - id: groupe_synaptique
    titre: GROUPE SYNAPTIQUE
    formations: [groupe_nexus, centre_synaptique, relais_synaptique, soutien_synaptique, briseur_siege, groupe_appui, groupe_chasse]
    contraintes:
      - { type: fournit, budget: essaim_commun, quantite: 1 }
      - { type: fournit, budget: essaim_rare, quantite: 1 }
    options: [spore_transport, guerriers_ailes, prince_aile]
  - id: essaims_instinctifs
    titre: ESSAIMS INSTINCTIFS
    sous_titre: "Vous devez impérativement prendre le nombre d'options nécessaires au Groupe Synaptique choisi. Par exemple si vous avez pris un relais synaptique, vous avez l'obligation de prendre deux essaims instinctifs parmi le choix proposé"
    formations: [gaunts, bio_artillerie, gargouilles, carnifex, bio_soutien, bio_tank, hierodule, fouisseurs]
    contraintes: [{ type: non_autonome }]
  - id: essaims_communs
    titre: ESSAIMS INDÉPENDANTS COMMUNS
    sous_titre: "Vous pouvez prendre jusqu'à un essaim indépendant commun par Groupe Synaptique. Les essaims indépendants communs ne doivent pas dépasser 1/3 des points de l'armée"
    formations: [genestealers, lictors]
    contraintes:
      - { type: consomme, budget: essaim_commun }
      - { type: consomme, budget: communs, quoi: points }
    options: [genestealers_supp, genestealer_alpha, lictors_supp]
    colonne_options: true
  - id: essaims_rares
    titre: ESSAIMS INDÉPENDANTS RARES
    sous_titre: "Vous pouvez prendre jusqu'à un essaim indépendant rare par groupe synaptique. Les essaims indépendants rares ne doivent pas dépasser 1/3 des points de l'armée. Notez que le coût d'une Dominatrix soit 400pts doit être inclus dans ce tiers."
    formations: [bio_aviation, bio_titans, bio_vaisseaux]
    contraintes:
      - { type: consomme, budget: essaim_rare }
      - { type: consomme, budget: rare, quoi: points }
    options: [harpies_supp]

listes_test:
  - nom: "3000 pts valide : Nexus Dominatrix, Centre, Relais, communs et rares"
    limite: 3000
    attendu: valide
    formations:
      - formation: groupe_nexus
        variante: dominatrix
        sous_formations:
          - { formation: gaunts, choix: { "0": { hormagaunt: 6 } } }
          - { formation: gaunts, choix: { "0": { termagant: 6 } } }
          - { formation: carnifex }
      - formation: centre_synaptique
        choix: { "1": { guerrier_tyranide: 1, zoanthrope: 1 } }
        options: [{ option: alpha_prince }]
        sous_formations:
          - { formation: gaunts, choix: { "0": { termagant: 3, hormagaunt: 3 } } }
          - { formation: bio_artillerie }
          - { formation: gargouilles }
      - formation: relais_synaptique
        choix: { "1": { guerrier_tyranide: 2 } }
        options: [{ option: spore_transport }]
        sous_formations:
          - { formation: gaunts, choix: { "0": { hormagaunt: 6 } } }
          - { formation: gaunts, choix: { "0": { termagant: 6 } } }
      - formation: genestealers
        options: [{ option: genestealers_supp, quantite: 2 }, { option: genestealer_alpha }]
      - { formation: lictors, options: [{ option: lictors_supp, quantite: 1 }] }
      - { formation: bio_titans, variante: hierophant }
      - { formation: bio_vaisseaux, variante: razorfiend }
  - nom: "2 essaims communs pour un seul groupe synaptique"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: centre_synaptique
        choix: { "1": { zoanthrope: 2 } }
        sous_formations:
          - { formation: gaunts, choix: { "0": { hormagaunt: 6 } } }
          - { formation: gargouilles }
      - { formation: genestealers }
      - { formation: lictors }
  - nom: "Relais Synaptique avec 5 essaims (max 4)"
    limite: 3000
    attendu: refusee
    erreur: sous_formations
    formations:
      - formation: relais_synaptique
        choix: { "1": { guerrier_tyranide: 1, zoanthrope: 1 } }
        sous_formations:
          - { formation: gaunts, choix: { "0": { hormagaunt: 6 } } }
          - { formation: gaunts, choix: { "0": { termagant: 6 } } }
          - { formation: bio_artillerie }
          - { formation: gargouilles }
          - { formation: carnifex }
  - nom: "Spore Mycétique et Prince ailé dans la même formation"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: centre_synaptique
        choix: { "1": { guerrier_tyranide: 2 } }
        options: [{ option: spore_transport }, { option: prince_aile }]
        sous_formations:
          - { formation: gaunts, choix: { "0": { hormagaunt: 6 } } }
          - { formation: bio_artillerie }
      - { formation: bio_vaisseaux, variante: razorfiend }
  - nom: "deux Groupes Nexus"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: groupe_nexus
        variante: dominatrix
        sous_formations:
          - { formation: gaunts, choix: { "0": { hormagaunt: 6 } } }
          - { formation: gargouilles }
      - formation: groupe_nexus
        variante: prince_maitre
        choix: { "1": { guerrier_tyranide: 2 } }
        sous_formations:
          - { formation: gaunts, choix: { "0": { termagant: 6 } } }
          - { formation: carnifex }
  - nom: "Dominatrix et Hydraphant au-delà du tiers des rares à 2000 pts"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: groupe_nexus
        variante: dominatrix
        sous_formations:
          - { formation: gaunts, choix: { "0": { hormagaunt: 6 } } }
          - { formation: gaunts, choix: { "0": { termagant: 6 } } }
      - { formation: bio_titans, variante: hydraphant }
