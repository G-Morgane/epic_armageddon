      - "Lent, ne peut être utilisé aux tours 1 et 2."
      - "Transport (60+60+6) : Tactiques, Devastators, Marines d'Assaut, Scouts, Terminators, Dreadnoughts, Motos et Motos d'Assaut, plus 60 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 9 Thunderhawks et Thunderhawks Transporteurs. De plus, la Barge de Bataille peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."

options:
  - id: commandant
    nom: Commandant
    effet:
      type: choix
      parmi:
        - { id: seigneur_loup, nom: Seigneur Loup, cout: 50, effet: { type: ajouter, unites: [{ unite: seigneur_loup }] } }
        - { id: pretre_runes, nom: Prêtre des Runes, cout: 50, effet: { type: ajouter, unites: [{ unite: pretre_runes }] } }
        - { id: pretre_loup, nom: Prêtre Loup, cout: 50, effet: { type: ajouter, unites: [{ unite: pretre_loup }] } }
        - id: loup_supreme
          nom: Loup Suprême
          cout: 50
          effet: { type: ajouter, unites: [{ unite: loup_supreme }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Seigneur Loup ou un Prêtre des Runes ou un Prêtre Loup. Un Seigneur Loup peut être échangé gratuitement par le Loup Suprême"
    note_md: "Un seul Loup Suprême par armée (Commandant Suprême)."
  - id: griffes_sanglantes_renfort
    nom: Griffes Sanglantes
    effet: { type: ajouter, cout: 50, unites: [{ unite: griffes_sanglantes, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 unités de Griffes Sanglantes à la formation"
  - id: gardes_loups_renfort
    nom: Gardes Loups
    effet: { type: ajouter, cout_par_unite: 75, unites: [{ unite: terminators }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 unités de Terminators à la formation"
  - id: motos_assaut
    nom: Motos d'assaut
    effet: { type: remplacer, de: griffes_sanglantes_motos, par: motos_assaut, lot: 1, max: 5, cout: 5 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer n'importe quel nombre de Griffes Sanglantes à Motos par des Motos d'Assaut"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorbacks
    nom: Razorbacks
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à autant de Razorbacks que d'unités à transporter"
  - id: dreadnoughts
    nom: Dreadnoughts
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: dreadnought, cout: 50 }
        - { unite: dreadnought_feu_enfer, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Dreadnoughts à la formation parmi : Dreadnought et Dreadnought Feu d'Enfer"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: predator_annihilator, cout: 65 }
        - { unite: predator_destructor, cout: 65 }
        - { unite: vindicator, cout: 65 }
        - { unite: land_raider, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 véhicules blindés à la formation selon n'importe quelle combinaison : Predators Annihilator, Predators Destructor, Vindicator (65 pts chacun), Land Raider (75 pts chacun)"
  - id: transports_gardes_loups
    nom: Transports Gardes Loups
    effet:
      type: choix
      parmi:
        - id: modules
          nom: Modules d'Atterrissage Mk II
          cout: 50
          effet: { type: ajouter, unites: [{ unite: module_atterrissage_mk2, nombre: 1 }] }
        - id: land_raiders
          nom: 4 Land Raiders
          cout: 300
          effet: { type: ajouter, unites: [{ unite: land_raider, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter des Modules d'Atterrissage Mk II (50 pts) ou ajouter 4 Land Raiders à la formation (300 pts)"
    note_md: "Un Module d'Atterrissage Mk II transporte la formation et ses améliorations : un seul marqueur suffit pour le détachement."
  - id: vindicators
    nom: Vindicators
    effet: { type: ajouter, cout_par_unite: 65, unites: [{ unite: vindicator }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Vindicators"
  - id: tornado_typhoon
    nom: Tornado / Typhoon
    effet: { type: mot_cle, texte: "Land Speeders Tornado et Typhoon au choix dans la composition", cout: 0, cible: [land_speeder, land_speeder_tornado, land_speeder_typhoon] }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation peut contenir des land speeders selon n'importe quelle combinaison : remplacer des unités par autant de Land Speeders Tornado (5 pts chacun) ou de Land Speeders Typhoon (15 pts chacun)"
    note_md: "Porté par la composition de la formation Land Speeders (5 unités parmi Land Speeder 0 pt, Tornado 5 pts, Typhoon 15 pts) ; cette ligne ne sert qu'à l'affichage du tableau."
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Module d'Atterrissage Mk II à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage_mk2, tout: true, par_nombre: 1, cout: 0 }
          contraintes: [{ type: exclut, options: [razorbacks, hunter, support_lourd] }]
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par des Modules d'Atterrissage Mk II"
    note_md: "Règle spéciale Transports : réservée aux détachements avec « + transports », hors détachements de Scouts. Une formation contenant des unités ne pouvant pas être déployées en Module d'Atterrissage (Razorbacks, Hunter, Support Lourd) ne peut pas choisir le Module."

