sections:
  - id: detachements
    titre: DÉTACHEMENTS SPACE WOLVES
    formations: [chasseur_gris, longs_crocs, griffes_sanglantes, serres_sanglantes, gardes_loups, scouts, motos, land_speeders, land_raiders, predators, vindicators, whirlwinds]
    colonne_options: true
    contraintes: [{ type: max_options, valeur: 3 }]
    # Tableau unique des améliorations du PDF : `options` reprend toutes les améliorations dans l'ordre du PDF
    # (chaque formation garde sa propre liste `options`, cette liste ne sert qu'au tableau).
    options: [commandant, griffes_sanglantes_renfort, gardes_loups_renfort, motos_assaut, hunter, razorbacks, dreadnoughts, support_lourd, transports_gardes_loups, vindicators, tornado_typhoon, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS SPACE WOLVES
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 3 améliorations"
  - id: flotte
    titre: FLOTTE SPACE WOLVES
    sous_titre: "SUPPORTS SPACE WOLVES"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [thunderhawks_transporteurs, thunderhawk, barge_debarquement, stormeagles, caestus, stormwolves, stormfang_gunships, vaisseaux_spatiaux]
  - id: titanicus
    titre: SOUTIEN DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS SPACE WOLVES"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: adeptus-titanicus }
    notes:
      sans_peur: "Les formations prises en Soutien des Légions Titaniques ne bénéficient pas de la règle « Et ils ne connaîtront pas la peur »."

listes_test:
  - nom: "3000 pts valide, Grande Compagnie renforcée et un Warhound"
    limite: 3000
    attendu: valide
    formations:
      - formation: chasseur_gris
        options:
          - { option: commandant, choix: seigneur_loup }
          - { option: dreadnoughts, repartition: { dreadnought: 1, dreadnought_feu_enfer: 1 } }
          - { option: support_lourd, repartition: { land_raider: 1, vindicator: 1 } }
      - formation: longs_crocs
        options:
          - { option: razorbacks, repartition: { razorback_canons_laser: 2 } }
          - { option: hunter }
      - formation: gardes_loups
        options:
          - { option: transports_gardes_loups, choix: modules }
      - formation: motos
        options:
          - { option: motos_assaut, quantite: 2 }
      - { formation: stormwolves, variante: deux }
      - { formation: titan_warhound }
  - nom: "2000 pts valide, Dreadnought à la place des Rhinos et Land Speeders panachés"
    limite: 2000
    attendu: valide
    formations:
      - formation: griffes_sanglantes
        options:
          - { option: griffes_sanglantes_renfort }
          - { option: transport_remplacement, choix: dreadnought }
      - formation: land_speeders
        choix: { "0": { land_speeder: 3, land_speeder_tornado: 1, land_speeder_typhoon: 1 } }
        options: [{ option: tornado_typhoon }]
      - formation: scouts
        options: [{ option: commandant, choix: pretre_loup }]
      - { formation: serres_sanglantes }
      - { formation: stormfang_gunships, variante: deux }
      - { formation: vaisseaux_spatiaux, variante: croiseur }
  - nom: "quatre améliorations sur un détachement de Chasseurs Gris"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: chasseur_gris
        options:
          - { option: commandant, choix: pretre_runes }
          - { option: dreadnoughts, repartition: { dreadnought: 1 } }
          - { option: hunter }
          - { option: gardes_loups_renfort, quantite: 1 }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: chasseur_gris }
      - { formation: titan_warlord }
  - nom: "deux Loups Suprêmes"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: chasseur_gris, options: [{ option: commandant, choix: loup_supreme }] }
      - { formation: longs_crocs, options: [{ option: commandant, choix: loup_supreme }] }
  - nom: "Module d'Atterrissage pour un détachement de Scouts"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - { formation: chasseur_gris }
      - { formation: scouts, options: [{ option: transport_remplacement, choix: module_atterrissage }] }
  - nom: "six Motos d'Assaut pour cinq Griffes Sanglantes à Motos"
    limite: 2000
    attendu: refusee
    erreur: option_quantite
    formations:
      - { formation: chasseur_gris }
      - { formation: motos, options: [{ option: motos_assaut, quantite: 6 }] }
