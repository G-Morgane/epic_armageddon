    cc: "5+"
    ff: "3+"
    armes:
      - { nom: 2x Canons Laser Jumelés, portee: 45cm, puissance: "AC4+" }
      - { nom: 3x Bolters Lourds Jumelés (Barge), portee: 30cm, puissance: "AP4+/AA5+" }
    notes: [Blindage Renforcé, Blindage Arrière Renforcé, Assaut planétaire, "Transport (12+6/4) : Tactiques, Devastators, Scouts, Marines d'Assaut, Motos, Motos d'Assaut, Terminator, Dreadnought (Terminators et Dreadnought prennent 2 places), plus 6 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators ou 4 Land Raiders"]
    transport: { capacite: 12, accepte: [chasseurs_gris, griffes_sanglantes, longs_crocs, scouts_space_wolves, serres_sanglantes, griffes_sanglantes_motos, motos_assaut, terminators, dreadnought, dreadnought_feu_enfer] }
    degats: { cd: 4, critique: "La Barge de débarquement s'écrase au sol et est détruite, ainsi que toutes les unités à son bord. Toute unité dans un rayon de 5cm de l'appareil subit une touche si la Barge de débarquement se trouvait au sol." }
  - id: croiseur_attaque
