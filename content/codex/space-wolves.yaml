    notes: ["Transport (20+20+6) : Tactiques, Devastators, Marines d'Assaut, Scouts, Terminators, Dreadnoughts, Motos et Motos d'assaut, plus 20 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 6 Thunderhawks et Thunderhawks Transporteurs. De plus, le Croiseur d'Attaque peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."]
  - id: barge_bataille
