options:
  - id: primus
    nom: Primus
    effet: { type: ajouter, cout: 50, unites: [{ unite: primus, nombre: 1 }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "(0-1) Un personnage Primus pour toute l'armée"
    note_md: "Une formation qui contient le Primus s'active sur 1+ (règle « Au nom du Père ! »)."
  - id: genestealers
    nom: Genestealers
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: genestealer }], min: 1, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 3 unités de Genestealers à la formation (25 pts chacun)"
  - id: hybrides_metamorphes
    nom: Hybrides métamorphes
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: hybride_metamorphe }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 unités d'Hybrides Métamorphes à la formation (25 pts chacun)"
  - id: aberrants
    nom: Aberrants
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: aberrant }], min: 1, max: 5 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 5 unités d'Aberrants à la formation (25 pts chacun)"
  - id: hydre
    nom: Hydre
    effet: { type: ajouter, cout: 50, unites: [{ unite: hydre, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hydre à la formation (50 pts)"
  - id: soldats_neophytes
    nom: Soldats néophytes
    effet: { type: ajouter, cout: 100, unites: [{ unite: infanterie_neophyte, nombre: 6 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 6 unités d'Infanterie Néophyte à la formation (100 pts)"
  - id: appui_feu_neophytes
    nom: Appui feu néophytes
    effet: { type: ajouter, cout: 100, unites: [{ unite: appui_feu_neophyte, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 4 unités d'Appui-feu Néophytes à la formation (100 pts)"
  - id: transports
    nom: Transports
    effet:
      type: choix
      parmi:
        - id: chimeres
          nom: Chimères
          cout: 0
          effet: { type: ajouter, unites: [{ unite: chimere }], cout_par_unite: 25, min: 1, max: besoin_transport }
        - id: goliaths
          nom: Goliath
          cout: 0
          effet: { type: ajouter, unites: [{ unite: goliath }], cout_par_unite: 25, min: 1, max: besoin_transport }
        - id: goliaths_brise_roche
          nom: Goliath Brise-Roche
          cout: 0
          effet: { type: ajouter, unites: [{ unite: goliath_brise_roche, nombre: 2 }], cout_par_unite: 75, min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter assez de transports pour embarquer toute la formation : Chimères (25 pts chacune) ou Goliath (25 pts chacun) ou Goliath Brise-Roche (75 pts les deux)"
    note_md: "Vous ne pouvez pas prendre plus de véhicules que vous en avez besoin pour embarquer ces troupes. Le Goliath Brise-Roche se prend par paire (75 pts les deux). Le format ne sait pas mélanger plusieurs modèles de transport dans une même amélioration : choisissez un modèle."
  - id: transports_chimeres
    nom: Transports
    effet: { type: ajouter, unites: [{ unite: chimere }], cout_par_unite: 25, min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter assez de Chimères pour embarquer toute la formation (25 pts chacune)"
    note_md: "Chimères uniquement. Vous ne pouvez pas prendre plus de véhicules que vous en avez besoin pour embarquer ces troupes."
  - id: ridgerunners_supplementaires
    nom: Achille Ridgerunner supplémentaires
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: achille_ridgerunner }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "1 ou 2 Achille Ridgerunner supplémentaires pour 25 pts chaque"

formations:
  # ---- Détachements principaux ----
  - id: couvain_patriarche
    nom: Couvain du Patriarche
    variantes:
      - id: base
        cout: 325
        composition:
          - { unite: patriarche, nombre: 1 }
          - choix:
              total: 12
              parmi: [{ unite: hybride_acolyte }, { unite: hybride_neophyte }]
              phrase_pdf: "12 unités parmi : Hybrides Acolytes ; Hybrides Néophytes"
    options: [transports, appui_feu_neophytes, soldats_neophytes, genestealers, hybrides_metamorphes, aberrants, hydre]
    contraintes:
      - { type: min_par_armee, valeur: 1 }
      - { type: max_par_armee, valeur: 1 }
      - { type: fournit, budget: soutien, quantite: 2 }
      - { type: initiative, valeur: "1+" }
  - id: couvain_magus
    nom: Couvain du Magus
    variantes:
      - id: base
        cout: 250
        composition:
