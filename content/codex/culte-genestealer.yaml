# Culte Genestealer, transcrit depuis le PDF EAFR rev 1.1 (source de vérité).
codex:
  slug: culte-genestealer
  armee_id: a6d2a923-53eb-4e41-9d7d-99fa36f38330
  logo: https://nomrnaobradtiddfewxm.supabase.co/storage/v1/object/public/army-pdfs/icons/culte-genestealer.svg
  nom: Culte Genestealer
  version: "1.1"
  faction: xenos
  categorie: armees-xenos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/culte-genestealer.jpg
  citation:
    texte: "Camarades !! L'Empereur à quatre bras est notre véritable sauveur, brisons les chaînes de l'oppression du faux Empereur qui ne nous protège plus !! Seul les Anges Stellaires nous sauveront de l'oubli ! Respectez les anciens, suivons le père de tous et gagnons le droit de vivre éternellement au firmament !"
    auteur: Fiodor Ramazanov, Primus de la secte des Sauveurs Stellaire
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de culte Genestealer.

    Les armées du culte sont organisées autour de formations appelées détachements principaux ainsi que des détachements de soutien qui leurs sont autonomes.

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.
  regles_md:
    - titre: "Règle spéciale : « Au nom du Père ! »"
      texte: |
        Tant que le Patriarche est en vie, la formation qui le contient devient Sans Peur. Si le socle de ce dernier est détruit, la formation est automatiquement démoralisée et toutes les formations de l'armée reçoivent un pion impact.

        Si la formation qui contient le Patriarche ou le Magus est motorisée, elle reçoit gratuitement une limousine blindée afin de transporter ceux-ci.

        Une formation qui contient le Patriarche, le Magus ou le Primus s'active sur 1+.
    - titre: "Règle spéciale : « Il en arrive de partout ! »"
      texte: |
        Une formation d'infanterie non montée par tranche complète de 750 points peut gagner la règle Embuscade. Lors de la phase de déploiement des vaisseaux, pour chaque formation en Embuscade, vous devez indiquer à votre adversaire son tour d'arrivée et noter secrètement ses coordonnées d'atterrissage.

        Au tour indiqué, lors de la phase d'action, vous activez la formation en suivant cette procédure :

        1. Déployez un marqueur Embuscade dans les 15 cm du lieu noté secrètement.
        2. Effectuez un jet de déviation de 2D6 cm pour ce marqueur, la première unité pourra se déployer dans les 5 cm du marqueur puis toutes les autres unités pourront se déployer en cohésion dans les 15 cm du marqueur Embuscade (en dehors des zones de contrôle ennemies).
        3. Puis lancez le jet d'activation de la formation normalement (LdR 1.6) : déclarez l'action qu'elle compte accomplir, puis effectuez un test d'action pour déterminer si elle accomplit l'action avec succès.

        Remarque : les unités entrant en jeu par une Embuscade sont détruites si elles arrivent en dehors de la table. Si les unités arrivent dans un terrain qui leur est normalement infranchissable ou dangereux, sur une autre unité (amie ou ennemie) ou dans une zone de contrôle ennemie, l'unité est placée par l'adversaire dans la zone dégagée la plus proche pouvant la recevoir.
    - titre: "Règle spéciale : « Ils sortent de terre ! »"
      texte: |
        Une formation entièrement transportée qui contient au moins un Goliath Brise-Roche gagne la règle spéciale Tunnelier.
    - titre: "Règle spéciale : Tunnelier"
      texte: |
        Une formation Tunnelier peut se déployer en utilisant la règle suivante :

        « Un tunnelier est déployé au même moment et de la même manière qu'un vaisseau spatial (voir section 4.3.1 du livre de règle). Les unités transportées dans un tunnelier sont gardées en réserve. Définissez ensuite une « zone de largage », selon la procédure décrite en section 4.3.1. Un tunnelier peut apparaître dans votre moitié de table dès le deuxième tour et dans la moitié de table adverse dès le troisième tour. Il est déployé avant le jet de stratégie au début du tour indiqué, aux coordonnées prédéfinies. Un tunnelier et toutes les unités qu'il transporte peuvent agir normalement dès leur tour d'arrivée. »
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Andrey Nyarl, illustration page 1 Vladimir Krisetskiy."
  valeur_strategique: 2
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Formations comptant un Patriarche, un Magus ou un Primus", valeur: "1+" }

