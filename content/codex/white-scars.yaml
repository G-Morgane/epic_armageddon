      - { nom: Bombardement Orbital (5), portee: "∞", puissance: "5PB, MA" }
    notes: ["Transport (20+20+6) : Tactiques, Devastators, Marines d'Assaut, Scouts, Terminators, Dreadnoughts, Motos et Motos d'assaut, plus 20 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 6 Thunderhawks et Thunderhawks Transporteurs. De plus, le Croiseur d'Attaque peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."]
  - id: barge_bataille
    nom: Barge de Bataille
    type: VS
    armes:
      - { nom: Bombardement Orbital (14), portee: "∞", puissance: "14PB, MA" }
    notes:
      - "Lent, ne peut être utilisé aux tours 1 et 2."
      - "Transport (60+60+6) : Tactiques, Devastators, Marines d'Assaut, Scouts, Terminators, Dreadnoughts, Motos et Motos d'Assaut, plus 60 véhicules parmis Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 9 Thunderhawks et Thunderhawks Transporteurs. De plus, la Barge de Bataille peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."

  # ---- Légions Titaniques : importées par l'alliance avec adeptus-titanicus ----

options:
  - id: commandant
    nom: Commandant
    effet:
      type: choix
      parmi:
        - { id: capitaine, nom: Capitaine, cout: 50, effet: { type: ajouter, unites: [{ unite: capitaine }] } }
        - { id: archiviste, nom: Archiviste, cout: 50, effet: { type: ajouter, unites: [{ unite: archiviste }] } }
        - { id: chapelain, nom: Chapelain, cout: 50, effet: { type: ajouter, unites: [{ unite: chapelain }] } }
        - id: maitre_chapitre
          nom: Maître de Chapitre
          cout: 50
          effet: { type: ajouter, unites: [{ unite: maitre_chapitre }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Capitaine ou un Archiviste ou un Chapelain (50 pts). Un Capitaine peut être échangé gratuitement par un Maître de chapitre"
    note_md: "Un seul Maître de Chapitre par armée (Commandant Suprême). L'échange Capitaine contre Maître de Chapitre étant gratuit, la branche Maître de Chapitre coûte le même prix que le Capitaine."
  - id: transport_terminator
    nom: Transport Terminator
    effet:
      type: choix
      parmi:
        - id: land_raiders
          nom: 4 Land Raiders
          cout: 300
          effet: { type: ajouter, unites: [{ unite: land_raider, nombre: 4 }] }
        - id: teleportation
          nom: Téléportation
          cout: 50
          effet: { type: mot_cle, texte: Téléportation, cout: 0, cible: [terminators] }
        - id: modules
          nom: Modules d'Atterrissage Mk II
          cout: 50
          effet: { type: ajouter, unites: [{ unite: module_atterrissage_mk2, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 4 Land Raiders à la formation (300 pts) ou ajouter la Note Téléportation aux unités d'infanteries de la formation (50 pts) ou ajouter des Modules d'Atterrissage Mk II (50 pts)"
    note_md: "Un Module d'Atterrissage Mk II transporte la formation et ses améliorations : un seul marqueur suffit pour le détachement."
  - id: sniper
    nom: Sniper
    effet: { type: mot_cle, texte: Sniper, cout: 50, cible: [scouts] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Les Bolters lourds des unités de Scouts reçoivent la Note Sniper"
  - id: motos
    nom: Motos
    effet:
      type: choix_multiple
      total: 3
      parmi:
        - { unite: motos_white_scars, cout: 50 }
        - { unite: motos_assaut_white_scars, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 3 unités à la formation parmi : Motos White Scars, Motos d'assaut White Scars"
    note_md: "Le PDF donne un prix forfaitaire de 150 pts pour les 3 unités ; il est réparti à 50 pts par unité, la quantité étant fixée à 3."
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorbacks
    nom: Razorbacks
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à autant de Razorbacks que d'unités à transporter, 25 pts chacun"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: predator_annihilator, cout: 65 }
        - { unite: predator_destructor, cout: 65 }
        - { unite: vindicator, cout: 65 }
        - { unite: land_raider, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 véhicules blindés à la formation selon n'importe quelle combinaison : Predators Annihilator, Predators Destructor, Vindicator (65 pts chacun), Land Raider (75 pts chacun)"
  - id: vindicators
    nom: Vindicators
    effet: { type: ajouter, cout_par_unite: 65, unites: [{ unite: vindicator }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Vindicators à la formation, 65 pts chacun"
  - id: tornado_typhoon
    nom: Tornado / Typhoon
    effet: { type: mot_cle, texte: "Land Speeders Tornado et Typhoon au choix dans la composition", cout: 0, cible: [land_speeder, land_speeder_tornado, land_speeder_typhoon] }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation peut contenir des land speeders selon n'importe quelle combinaison : remplacez des unités par autant de Land Speeders Tornado (5 pts chacun) ou de Land Speeders Typhoon (15 pts chacun)"
    note_md: "Porté par la composition de la formation Land Speeders (5 unités parmi Land Speeder 0 pt, Tornado 5 pts, Typhoon 15 pts) ; cette ligne ne sert qu'à l'affichage du tableau."
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Modules d'Atterrissage Mk II à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage_mk2, tout: true, par_nombre: 1, cout: 0 }
          contraintes: [{ type: exclut, options: [razorbacks, hunter, support_lourd] }]
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par des Modules d'Atterrissage Mk II"
    note_md: "Vient de la règle spéciale Transports et non du tableau des améliorations : elle ne consomme donc pas le quota de 3 améliorations. Réservée aux détachements avec « + transports » et interdite aux détachements de Scouts. Une formation contenant des unités ne pouvant pas être déployées en Module d'Atterrissage (Razorbacks, Hunter, Support Lourd) ne peut pas choisir le Module."

formations:
  # ---- Détachements principaux ----
  - id: motos_white_scars
    nom: Motos White Scars
    variantes:
      - id: base
        cout: 225
        composition:
          - choix:
              total: 5
              parmi: [{ unite: motos_white_scars, cout: 0 }, { unite: motos_assaut_white_scars, cout: 0 }]
              phrase_pdf: "5 unités parmi : Motos White Scars, Motos d'assaut White Scars"
    options: [commandant, motos]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]
  - id: land_speeders
    nom: Land Speeders
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 5
              parmi: [{ unite: land_speeder, cout: 0 }, { unite: land_speeder_tornado, cout: 5 }, { unite: land_speeder_typhoon, cout: 15 }]
              phrase_pdf: "5 Land Speeders"
    options: [commandant, tornado_typhoon]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]

  # ---- Détachements de soutien ----
  - id: tactique
    nom: Tactique
    variantes:
      - id: base
        cout: 275
        composition:
          - { unite: tactiques, nombre: 6 }
          - { transports: { unite: rhino } }
    options: [commandant, razorbacks, hunter, support_lourd, transport_remplacement]
    phrase_pdf: "6 unités de Tactiques + transports"
  - id: assaut
    nom: Assaut
    variantes:
      - { id: base, cout: 175, composition: [{ unite: marines_assaut, nombre: 4 }] }
    options: [commandant]
    phrase_pdf: "4 unités de Marines d'Assaut"
  - id: terminator
    nom: Terminator
    variantes:
      - { id: base, cout: 300, composition: [{ unite: terminators, nombre: 4 }] }
    options: [commandant, transport_terminator]
    phrase_pdf: "4 unités de Terminators"
  - id: scouts
    nom: Scouts
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: scouts, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [commandant, razorbacks, sniper]
    phrase_pdf: "4 unités de Scouts + transports"
  - id: scouts_motos
    nom: Scouts à motos
    variantes:
      - { id: base, cout: 200, composition: [{ unite: scouts_motos, nombre: 5 }] }
    options: [commandant]
    phrase_pdf: "5 unités de Scouts à motos"
  - id: predators
    nom: Predators
    variantes:
      - { id: destructor, nom: 4 Predators Destructor, cout: 225, composition: [{ unite: predator_destructor, nombre: 4 }] }
      - { id: annihilator, nom: 4 Predators Annihilator, cout: 275, composition: [{ unite: predator_annihilator, nombre: 4 }] }
    options: [commandant, vindicators]
  - id: whirlwinds
    nom: Whirlwinds
    variantes:
      - { id: base, cout: 300, composition: [{ unite: whirlwind, nombre: 4 }] }
    options: [commandant, hunter]
  - id: vindicators
    nom: Vindicators
    variantes:
      - { id: base, cout: 250, composition: [{ unite: vindicator, nombre: 4 }] }
    options: [commandant]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: "0-1 Vindicators, 4 Vindicators"
  - id: land_raiders
    nom: Land Raiders
    variantes:
      - { id: base, cout: 350, composition: [{ unite: land_raider, nombre: 4 }] }
    options: [commandant, vindicators]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: "0-1 Land Raiders, 4 Land Raiders"

  # ---- Supports : Flotte White Scars ----
  - id: thunderhawk
    nom: Thunderhawk
    variantes:
      - { id: base, cout: 225, composition: [{ unite: thunderhawk, nombre: 1 }] }
  - id: thunderhawks_transporteurs
    nom: Thunderhawks Transporteurs
    variantes:
      - { id: deux, nom: 2 Thunderhawks Transporteurs, cout: 300, composition: [{ unite: thunderhawk_transporteur, nombre: 2 }] }
      - { id: trois, nom: 3 Thunderhawks Transporteurs, cout: 450, composition: [{ unite: thunderhawk_transporteur, nombre: 3 }] }
    phrase_pdf: "2 Thunderhawks Transporteurs (Ajouter 1 Thunderhawk Transporteur : +150 pts)"
  - id: barge_debarquement
    nom: Barge de débarquement
    variantes:
      - { id: base, cout: 400, composition: [{ unite: barge_debarquement, nombre: 1 }] }
  - id: intercepteurs_stormtalons
    nom: Intercepteurs Stormtalons
    variantes:
      - { id: destructor, nom: 2 Stormtalons Destructor, cout: 200, composition: [{ unite: stormtalon_destructor, nombre: 2 }] }
      - { id: annihilator, nom: 2 Stormtalons Annihilator, cout: 250, composition: [{ unite: stormtalon_annihilator, nombre: 2 }] }
  - id: stormeagles
    nom: Stormeagles
    variantes:
      - { id: base, cout: 275, composition: [{ unite: stormeagle, nombre: 2 }] }
  - id: caestus
    nom: Bélier d'assaut Caestus
    variantes:
      - { id: deux, nom: 2 Caestus, cout: 250, composition: [{ unite: belier_assaut_caestus, nombre: 2 }] }
      - { id: trois, nom: 3 Caestus, cout: 350, composition: [{ unite: belier_assaut_caestus, nombre: 3 }] }
    phrase_pdf: "2 Caestus (Ajouter 1 Caestus : +100 pts)"
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur d'attaque, cout: 200, composition: [{ unite: croiseur_attaque, nombre: 1 }] }
      - { id: barge_bataille, nom: 1 Barge de bataille, cout: 350, composition: [{ unite: barge_bataille, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    phrase_pdf: "0-1 Soutien Orbital"

sections:
  - id: detachements_principaux
    titre: DÉTACHEMENTS PRINCIPAUX WHITE SCARS
    formations: [motos_white_scars, land_speeders]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
  - id: detachements_soutien
    titre: DÉTACHEMENTS DE SOUTIEN WHITE SCARS
    sous_titre: "Jusqu'à 3 détachements de soutien par détachement principal"
    formations: [tactique, assaut, terminator, scouts, scouts_motos, predators, whirlwinds, vindicators, land_raiders]
    contraintes: [{ type: consomme, budget: soutien }, { type: max_options, valeur: 3 }]
    colonne_options: true
    # Tableau unique des améliorations du PDF : `options` reprend toutes les améliorations dans l'ordre du PDF
    # (chaque formation garde sa propre liste `options`, cette liste ne sert qu'au tableau).
    options: [commandant, transport_terminator, sniper, motos, hunter, razorbacks, support_lourd, vindicators, tornado_typhoon, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS WHITE SCARS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 3 améliorations"
  - id: flotte
    titre: FLOTTE WHITE SCARS
    sous_titre: "SUPPORTS WHITE SCARS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [thunderhawk, thunderhawks_transporteurs, barge_debarquement, intercepteurs_stormtalons, stormeagles, caestus, soutien_orbital]
  - id: titanicus
    titre: SOUTIEN DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS WHITE SCARS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: adeptus-titanicus }
    notes:
      sans_peur: "Les formations prises en Soutien des Légions Titaniques ne bénéficient pas de la règle « Et ils ne connaîtront pas la peur »."

listes_test:
  - nom: "3000 pts valide, deux détachements principaux montés et un Warhound"
    limite: 3000
    attendu: valide
    formations:
      - formation: motos_white_scars
        choix: { "0": { motos_white_scars: 3, motos_assaut_white_scars: 2 } }
        options:
          - { option: commandant, choix: capitaine }
          - { option: motos, repartition: { motos_white_scars: 2, motos_assaut_white_scars: 1 } }
      - formation: land_speeders
        choix: { "0": { land_speeder: 3, land_speeder_tornado: 1, land_speeder_typhoon: 1 } }
      - formation: tactique
        options:
          - { option: commandant, choix: chapelain }
          - { option: razorbacks, repartition: { razorback_bolters_lourds: 1, razorback_canons_laser: 1 } }
          - { option: hunter }
      - formation: terminator
        options: [{ option: transport_terminator, choix: teleportation }]
      - { formation: scouts_motos }
      - { formation: predators, variante: destructor }
      - { formation: stormeagles }
      - { formation: titan_warhound }
  - nom: "2000 pts valide, Land Raiders des Terminators, Sniper et Module d'atterrissage"
    limite: 2000
    attendu: valide
    formations:
      - formation: motos_white_scars
        choix: { "0": { motos_white_scars: 5 } }
      - formation: terminator
        options: [{ option: transport_terminator, choix: land_raiders }]
      - formation: scouts
        options:
          - { option: sniper }
          - { option: razorbacks, repartition: { razorback_bolters_lourds: 2 } }
      - formation: tactique
        options: [{ option: transport_remplacement, choix: module_atterrissage }]
  - nom: "1500 pts valide, Modules d'Atterrissage Mk II et Thunderhawk"
    limite: 1500
    attendu: valide
    formations:
      - formation: motos_white_scars
        choix: { "0": { motos_white_scars: 2, motos_assaut_white_scars: 3 } }
      - formation: terminator
        options: [{ option: transport_terminator, choix: modules }]
      - formation: assaut
        options: [{ option: commandant, choix: archiviste }]
      - { formation: thunderhawk }
  - nom: "1250 pts valide, Support Lourd et Vindicators"
