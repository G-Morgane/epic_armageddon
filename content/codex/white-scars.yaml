      - { formation: land_raiders }
      - { formation: land_raiders }
  - nom: "quatre détachements de soutien pour un seul détachement principal"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: motos_white_scars
        choix: { "0": { motos_white_scars: 5 } }
      - { formation: tactique }
      - { formation: assaut }
      - { formation: scouts_motos }
      - { formation: whirlwinds }
  - nom: "quatre améliorations sur un même détachement"
    limite: 3000
    attendu: refusee
