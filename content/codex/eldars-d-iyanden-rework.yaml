      - { id: scorpions, nom: 6 Guerriers Scorpions, cout: 225, composition: [{ unite: guerriers_scorpions, nombre: 6 }] }
      - { id: banshees, nom: 6 Banshees, cout: 225, composition: [{ unite: banshees, nombre: 6 }] }
      - { id: dragons_feu, nom: 6 Dragons de Feu, cout: 225, composition: [{ unite: dragons_feu, nombre: 6 }] }
      - { id: faucheurs, nom: 6 Faucheurs Noirs, cout: 225, composition: [{ unite: faucheurs_noirs, nombre: 6 }] }
