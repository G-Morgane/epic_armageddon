    options: [exarque_opt, transport]
  - id: peloton_rangers
    nom: Peloton de Rangers
    variantes:
      - { id: base, cout: 150, composition: [{ unite: rangers, nombre: 6 }] }
    contraintes: [{ type: consomme, budget: support }]
    options: []
  - id: peloton_windrider
    nom: Peloton Windrider
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 6
              parmi: [{ unite: motojet }, { unite: vyper }]
