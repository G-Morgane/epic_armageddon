# Eldars d'Iyanden (rework), transcrit depuis le PDF EAFR (pied de page : CODEX IYANDEN -
# GT mai 2026 - document de travail, publié sur le site en REV 0.3 — source de vérité).
#
# Refonte de la liste d'Iyanden, distincte du codex officiel `eldars-d-iyanden` : les deux
# cohabitent, chacun rattaché à sa propre fiche d'armée.
codex:
  slug: eldars-d-iyanden-rework
  armee_id: 9de76677-c8a4-4834-95f5-d37dbc3342ed
  nom: Eldars d'Iyanden (rework)
  version: "0.3"
  faction: xenos
  categorie: armees-xenos
  statut: beta
  couleur: "#c8a032"
  citation:
    texte: "Les morts doivent rejoindre nos rangs, de crainte que nous rejoignions les leurs."
    auteur: Prince Yriel, Autarque d'Iyanden
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée du vaisseau monde Iyanden.

    Une armée du Vaisseau Monde d'Iyanden est organisée autour de formations principales appelées osts de guerre. Chaque formation principale permet ainsi de recruter jusqu'à 2 formations de support.

    Chaque formation (principale ou de support) est autonome et peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par formation et jusqu'à un maximum de 3. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'une formation tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de support lourd sont des formations autonomes. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.

    Une armée eldar peut également recevoir des Personnage/options. Chaque Personnage/option ne peut être sélectionnée qu'une seule fois.

    Concernant le transport, les unités suivantes seront jugées comme équivalentes : Spirite ↔ Garde Fantôme.
  regles_md:
    - titre: "Règle spéciale : L'Avatar"
      texte: |
        L'Avatar peut apparaître sur le champ de bataille de trois manières différentes : de manière classique lors du déploiement en début de partie ; par le biais d'un portail comme n'importe quelle formation se trouvant en réserve ; par invocation dans les 15 cm d'un Grand Prophète ou d'un Spirite lors de la phase de téléportation.

        Dans tous les cas, dès son apparition, c'est une formation indépendante et permanente jusqu'à la fin de la partie ou sa destruction. Cependant il ne peut que contester les objectifs.
    - titre: "Règle spéciale : Vision extra lucide"
      texte: |
        Toute formation Eldar qui n'est pas démoralisée et qui comprend une unité ayant la capacité Vision extra lucide ignore la pénalité de -1 au test d'action lorsqu'elle tente de conserver l'initiative.

        De plus, une fois par tour, le joueur Eldar peut essayer de retenir l'initiative deux fois d'affilée (le joueur Eldar ne peut retenir l'initiative et faire une autre action qu'après avoir déjà réussi à retenir l'initiative une première fois).

        N'importe quelle formation Eldar peut être choisie, y compris celles ne comportant pas de Grand Prophète, néanmoins un Grand Prophète doit impérativement être encore en jeu sur le champ de bataille. La formation doit tout de même passer un test d'initiative pour ne pas perdre l'action, et elle subit le modificateur de -1 pour avoir retenu l'initiative, sauf si elle comprend une unité ayant la capacité Vision extra lucide. Une fois l'action réalisée, l'initiative retourne au joueur adverse.
    - titre: "Règle spéciale : Armée en mouvement"
      texte: |
        Seuls les Rangers et les Marcheurs de Combat peuvent se déployer en garnison.
    - titre: "Règle spéciale : Tactique du tirer et courir"
      texte: |
        Cette règle spéciale s'applique à toutes les formations de l'armée Eldar hormis les Osts de Gardes Fantômes et de Seigneurs Fantômes.

        Les formations Eldars qui reçoivent l'ordre Avance ou Avance rapide peuvent choisir de tirer soit avant soit après chaque mouvement. Elles ne peuvent néanmoins tirer qu'une seule fois durant l'action.

        De plus, les formations Eldars qui remportent un assaut sont autorisées à utiliser la totalité de leur mouvement lorsqu'elles consolident leur position, au lieu d'être limitées à un mouvement de 5cm. Cependant, hormis pour les formations de Guerriers Aspects, les formations Eldars qui choisissent de consolider de leur mouvement complet ne peuvent en aucun cas prétendre au soutien d'un autre assaut. Les formations qui souhaitent soutenir un nouvel assaut ne doivent alors consolider que de 5 cm. Les formations de Guerriers Aspects peuvent toujours consolider de leur mouvement complet et soutenir d'autres assauts.
    - titre: "Règle spéciale : Holo-Champs"
      texte: |
        Les Holo-champs procurent aux titans Eldars une sauvegarde spéciale de 3+ qui peut être utilisée à la place de la sauvegarde normale du titan. Cette sauvegarde peut toujours être utilisée, même en corps-à-corps, en fusillade et contre les armes tueuses de titan ou les macro armes.

        Faites une seule sauvegarde contre les armes avec la capacité Tueuse de titan, au lieu de séparer les sauvegardes pour chaque point de dommage. Si un véhicule avec un Holo-champ a aussi un blindage renforcé, alors il est autorisé à relancer ses sauvegardes, sauf pour les attaques réalisées avec des armes ayant la capacité Lance, Macro-armes ou Tueuses de titans. La relance doit être faite en utilisant la sauvegarde de blindage de l'unité et non celle de l'Holo-champ.

        Aucun point d'impact n'est placé pour une touche avec une arme ayant le trait Rupture sauvée par l'Holo-champ. La sauvegarde de l'Holo-champ peut tout à fait être modifiée par un tir croisé ou par les armes Sniper.
    - titre: "Règle spéciale : Portails Eldars"
      texte: |
        Chaque Portail inclus dans une armée permet au joueur Eldar de conserver en réserve jusqu'à trois formations. Les formations en réserve peuvent entrer en jeu par n'importe quel Portail en réalisant une action qui comporte un mouvement. Ce mouvement est alors mesuré à partir du Portail. Une seule formation peut voyager à travers chaque portail à chaque tour.

        Une formation ne peut qu'entrer en jeu grâce au portail mais jamais retourner en réserve. Une formation qui rate son activation en tentant de franchir un Portail prendra automatiquement l'ordre Tenir : elle peut soit entrer en jeu en réalisant un simple mouvement en prenant 1 PI pour l'activation ratée, soit rester hors-table et se regrouper. Si le Portail utilisé est celui d'une formation démoralisée, alors 1 PI sera attribué à la formation l'utilisant après le jet d'initiative.

        Les formations pouvant utiliser un Portail Fantôme sont : les unités d'infanterie, les véhicules légers, les véhicules blindés dotés de la capacité Marcheur et l'Avatar.

        Il est possible de sortir d'un Portail sur lequel une unité adverse se trouve en déclarant un assaut contre cette formation. Une unité sortante doit utiliser son mouvement de charge pour arriver en contact avec l'ennemi le plus proche dont elle doit traverser la zone de contrôle. Une fois ainsi engagée au contact d'un ennemi, ce dernier perd sa zone de contrôle pour le reste de l'action. Une unité sortant d'un Portail Fantôme peut « traverser » un ennemi par dérogation à la règle 1.7.3 pour pouvoir se placer en assaut.

        Le joueur Eldar peut, pour 50 pts, placer un Portail Fantôme sur un objectif de sa moitié de table : il compte à la fois comme un objectif et un Portail. Il ne peut ni être attaqué ni détruit.
