options:
  - id: commandant_supreme
    nom: 0-1 Commandant suprême
    effet: { type: mot_cle, texte: Commandant Suprême, cout: 50, cible: [grand_prophete, spirite] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [grand_prophete, spirite] }
      - { type: hors_quota_options }
    phrase_pdf: "Un Grand Prophète ou un Spirite gagne la compétence Commandant Suprême"
  - id: exarque_opt
    nom: Exarque
    effet: { type: ajouter, cout: 25, unites: [{ unite: exarque, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 personnage Exarque à une unité de Guerriers Aspects"
  - id: plateformes_support_opt
    nom: Plate-formes de Support
    effet: { type: ajouter, cout: 50, unites: [{ unite: plateforme_support, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 3 Plate-formes de Support"
  - id: plateformes_lourdes_gratuites
    nom: Plate-formes d'armes lourdes
    effet: { type: remplacer, de: gardiens, par: plateforme_arme_lourde, lot: 1, max: 3, cout: 0 }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer gratuitement jusqu'à trois unités de Gardiens par des Plate-formes d'armes lourdes"
  - id: pierres_esprit
    nom: Pierres Esprit
    effet: { type: mot_cle, texte: Pierres-Esprits (Meneur), cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter des Pierres-Esprits (la formation gagne Meneur)"
  - id: fantomes
    nom: Fantômes
    effet:
      type: choix
      parmi:
        - id: gardes
          nom: 1 à 4 Gardes Fantômes
          cout: 50
          effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: garde_fantome, nombre: 1 }], max: 4 }
        - id: guerriers
          nom: 2 ou 4 unités de Guerriers Fantômes
          cout: 75
          effet: { type: ajouter, cout_par_unite: 75, lot: 2, unites: [{ unite: guerrier_fantome, nombre: 2 }], max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: seigneurs_fantomes_opt
    nom: Seigneurs Fantômes
    effet: { type: ajouter, cout: 175, unites: [{ unite: seigneur_fantome, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 3 Seigneurs Fantômes"
  - id: transport
    nom: Transport
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi: [{ unite: wave_serpent, cout: 50 }, { unite: falcon, cout: 50 }]
    note_md: "Toute la formation doit être transportée sans qu'il ne reste de place libre. 50 pts le Falcon ou le Wave Serpent, 75 pts les 2 Wave Serpents (la remise par paire n'est pas calculée par le constructeur)."
  - id: firestorm_opt
    nom: Firestorm
    effet:
      type: choix
      parmi:
        - id: remplacement
          nom: Remplacez 1 ou 2 véhicules blindés de la formation par autant de Firestorms
          cout: 25
          effet: { type: remplacer, de: [falcon, wave_serpent, prisme_feu, warp_hunter, tisseur_nuit], par: firestorm, lot: 1, max: 2, cout: 25 }
        - id: ajout
          nom: Ajouter 1 Firestorm à l'Ost de Guerre ou au Bouclier de Vaul
          cout: 75
          effet: { type: ajouter, cout: 75, unites: [{ unite: firestorm, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: tisseur_nuit_opt
    nom: Tisseur de Nuit
    effet: { type: ajouter, cout: 125, unites: [{ unite: tisseur_nuit, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 Tisseurs de nuit à la formation"
  - id: machine_vaul_opt
    nom: Machine de Vaul
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi: [{ unite: cobra, cout: 200 }, { unite: scorpion_superlourd, cout: 200 }, { unite: storm_serpent, cout: 200 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 unité(s) supplémentaire(s) parmi : Cobra, Scorpion, Storm Serpent, 200 pts chacune"

formations:
  # ---- Personnage / options ----
  - id: formation_portail
    nom: Portail
    variantes:
      - { id: base, nom: 1 Portail Fantôme, cout: 50, composition: [{ unite: portail_fantome, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    options: []
  - id: formation_avatar
    nom: Avatar
    variantes:
      - { id: base, nom: 1 Avatar, cout: 100, composition: [{ unite: avatar, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    options: []

  # ---- Formations principales ----
  - id: ost_fantomes
    nom: Ost de Fantômes
    variantes:
      - id: base
        cout: 50
        composition:
          - choix:
              total: 2
              parmi:
                - { unite: garde_fantome, cout: 100, par_pioche: 2 }
                - { unite: guerrier_fantome, cout: 75, par_pioche: 2 }
              phrase_pdf: "4 unités de fantômes parmi : 2 Gardes Fantômes (100 pts) ou 2 Guerriers Fantômes (75 pts)"
          - { unite: spirite, nombre: 1 }
    contraintes: [{ type: fournit, budget: support, quantite: 2 }, { type: max_options, valeur: 3 }]
    options: [pierres_esprit, fantomes, transport, firestorm_opt, commandant_supreme]
  - id: ost_seigneurs_fantomes
    nom: Ost de Seigneurs Fantômes
    variantes:
      - id: base
        cout: 325
        composition:
