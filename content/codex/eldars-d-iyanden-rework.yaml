          - { unite: tisseur_nuit, nombre: 2 }
          - { unite: firestorm, nombre: 1 }
    contraintes: [{ type: consomme, budget: support }, { type: max_options, valeur: 3 }]
    options: [firestorm_opt, tisseur_nuit_opt]
  - id: escadron_lame_vaul
