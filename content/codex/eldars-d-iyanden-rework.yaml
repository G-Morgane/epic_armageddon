sections:
  - id: personnages_options
    titre: PERSONNAGE/OPTIONS
    sous_titre: "Chaque Personnage/option ne peut être sélectionné qu'une seule fois"
    formations: [formation_portail, formation_avatar]
  - id: principales
    titre: FORMATIONS PRINCIPALES
    formations: [ost_fantomes, ost_seigneurs_fantomes]
    colonne_options: true
  - id: supports
    titre: FORMATIONS DE SUPPORT
    sous_titre: "Jusqu'à 2 formations de Support par Ost de Guerre"
    formations: [ost_guerre_gardiens, peloton_guerriers_aspects, peloton_rangers, peloton_windrider, escadron_marcheurs, escadron_bouclier_vaul, escadron_lame_vaul, escadron_machine_vaul, escadron_chevaliers]
    colonne_options: true
    options: [commandant_supreme, exarque_opt, plateformes_support_opt, pierres_esprit, fantomes, seigneurs_fantomes_opt, transport, firestorm_opt, tisseur_nuit_opt, machine_vaul_opt]
    tableau_options:
      titre: AMÉLIORATIONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation, jusqu'à un maximum de 3"
  - id: support_lourd_aeronaval
    titre: SUPPORT LOURD
    sous_titre: FORMATIONS DE SUPPORT LOURD
    formations: [croiseur_eldar, escadrille_hemlock, escadrille_phoenix, formation_vampire_raider]
  - id: support_lourd_titans
    titre: TITANS
    sous_titre: FORMATIONS DE SUPPORT LOURD
    formations: [formation_titan_archonte, formation_titan_fantome, escadron_titans_revenants]

listes_test:
  - nom: "Ost d'Iyanden 3000 pts"
    limite: 3000
    attendu: valide
    formations:
      - formation: ost_fantomes
        choix: { "0": { garde_fantome: 1, guerrier_fantome: 1 } }
        options: [{ option: pierres_esprit }, { option: commandant_supreme }]
      - { formation: ost_seigneurs_fantomes, options: [{ option: seigneurs_fantomes_opt }] }
      - formation: ost_guerre_gardiens
        options: [{ option: plateformes_lourdes_gratuites, quantite: 3 }, { option: plateformes_support_opt }]
      - { formation: peloton_guerriers_aspects, variante: banshees, options: [{ option: exarque_opt }] }
      - { formation: peloton_rangers }
      - { formation: escadron_marcheurs }
      - { formation: formation_avatar }
      - { formation: formation_portail }
      - { formation: escadrille_hemlock, variante: deux }
  - nom: "trois supports pour un seul Ost de Guerre"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: ost_fantomes
        choix: { "0": { garde_fantome: 2 } }
      - { formation: peloton_rangers }
      - { formation: peloton_guerriers_aspects, variante: vengeurs }
      - { formation: escadron_marcheurs }
  - nom: "trois Escadrons de Marcheurs"
    limite: 4000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: ost_fantomes
        choix: { "0": { garde_fantome: 2 } }
      - formation: ost_seigneurs_fantomes
      - { formation: escadron_marcheurs }
      - { formation: escadron_marcheurs }
      - { formation: escadron_marcheurs }
  - nom: "deux Avatars"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: ost_fantomes
        choix: { "0": { garde_fantome: 2 } }
      - { formation: formation_avatar }
      - { formation: formation_avatar }
  - nom: "support lourd au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: ost_fantomes
        choix: { "0": { garde_fantome: 2 } }
      - { formation: formation_titan_fantome }
