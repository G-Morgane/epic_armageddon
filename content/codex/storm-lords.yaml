        - { id: land_raiders, nom: Ajouter 4 Land Raiders à la formation, cout: 300, effet: { type: ajouter, unites: [{ unite: land_raider, nombre: 4 }] } }
        - { id: teleportation, nom: Téléportation, cout: 50, effet: { type: mot_cle, texte: Téléportation } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 4 Land Raiders à la formation (300 pts) ou la Note Téléportation aux unités d'infanterie de la formation (50 pts)"
  - id: sniper
    nom: Sniper
    effet: { type: mot_cle, texte: Sniper, cout: 50, cible: [scouts] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Les Bolters lourds des unités de Scouts reçoivent la Note Sniper"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorbacks
    nom: Razorbacks
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à autant de Razorbacks que d'unités à transporter (25 pts chacun)"
  - id: tornado_typhoon
    nom: Tornado / Typhoon
    effet: { type: mot_cle, texte: "Land Speeders Tornado et Typhoon au choix dans la composition", cout: 0, cible: [land_speeder, land_speeder_tornado, land_speeder_typhoon] }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation peut contenir des Land Speeders selon n'importe quelle combinaison : remplacer des unités par autant de Land Speeders Tornado (5 pts chacun) ou de Land Speeders Typhoon (15 pts chacun)"
    note_md: "Porté par la composition des formations qui contiennent des Land Speeders ; cette ligne ne sert qu'à l'affichage du tableau."
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Modules d'atterrissage à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage, tout: true, par_nombre: 1, cout: 0 }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par des Modules d'atterrissage (hors détachements de Scouts)"
  - id: thunderhawk_supplementaire
    nom: Ajouter 1 Thunderhawk Transporteur
    effet: { type: ajouter, cout: 150, unites: [{ unite: thunderhawk_transporteur }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: caestus_supplementaire
    nom: Ajouter 1 Caestus
    effet: { type: ajouter, cout: 100, unites: [{ unite: belier_assaut_caestus }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: warhound_supplementaire
    nom: Ajouter 1 Titan Warhound
    effet: { type: ajouter, cout: 225, unites: [{ unite: warhound }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]

formations:
  # ---- Détachements principaux ----
  - id: fils_de_jaghatai
    nom: Fils de Jaghatai
    variantes:
      - id: base
        cout: 300
        composition:
          - { unite: motos, nombre: 5 }
          - choix:
              total: 3
              parmi: [{ unite: motos }, { unite: motos_assaut }, { unite: land_speeder }, { unite: land_speeder_tornado, cout: 5 }, { unite: land_speeder_typhoon, cout: 15 }]
              phrase_pdf: "3 unités parmi : Motos, Motos d'assaut, Landspeeders"
    options: [commandant, tornado_typhoon, attaque_de_flanc]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]
    phrase_pdf: "5 Motos plus 3 unités parmi : Motos, Motos d'assaut, Landspeeders"

  # ---- Détachements de soutien ----
  - id: tactique
    nom: Tactique
    variantes:
      - id: base
        cout: 275
        composition:
          - { unite: tactiques, nombre: 6 }
          - { transports: { unite: rhino } }
    options: [commandant, razorbacks, hunter, transport_remplacement]
    phrase_pdf: "6 unités de Tactiques + transports"
  - id: assaut
    nom: Assaut
    variantes:
      - { id: base, cout: 175, composition: [{ unite: marines_assaut, nombre: 4 }] }
    options: [commandant]
  - id: terminator
    nom: Terminator
    variantes:
      - { id: base, cout: 300, composition: [{ unite: terminators, nombre: 4 }] }
    options: [commandant, transport_terminator]
  - id: scouts
    nom: Scouts
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: scouts, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [commandant, razorbacks, sniper]
    phrase_pdf: "4 unités de Scouts + transports"
  - id: land_speeders
    nom: Land Speeders
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 5
              parmi: [{ unite: land_speeder }, { unite: land_speeder_tornado, cout: 5 }, { unite: land_speeder_typhoon, cout: 15 }]
              phrase_pdf: "5 Land Speeders"
    options: [commandant, tornado_typhoon, attaque_de_flanc]
  - id: predators
    nom: Predators
    variantes:
      - { id: destructor, nom: 4 Predators Destructor, cout: 225, composition: [{ unite: predator_destructor, nombre: 4 }] }
      - { id: annihilator, nom: 4 Predators Annihilator, cout: 275, composition: [{ unite: predator_annihilator, nombre: 4 }] }
    options: [commandant, hunter]
  - id: land_raiders
    nom: Land Raiders
    variantes:
      - { id: base, cout: 350, composition: [{ unite: land_raider, nombre: 4 }] }
    options: [commandant, hunter]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: "0-1 Land Raiders : 4 Land Raiders"

  # ---- Supports ----
  - id: thunderhawk
    nom: Thunderhawk
    variantes:
      - { id: base, cout: 225, composition: [{ unite: thunderhawk, nombre: 1 }] }
  - id: thunderhawks_transporteurs
    nom: Thunderhawks Transporteurs
    variantes:
      - { id: base, cout: 300, composition: [{ unite: thunderhawk_transporteur, nombre: 2 }] }
    options: [thunderhawk_supplementaire]
    phrase_pdf: "2 Thunderhawks Transporteurs (Ajouter 1 Thunderhawk Transporteur : +150 pts)"
  - id: barge_debarquement
    nom: Barge de débarquement
    variantes:
      - { id: base, cout: 400, composition: [{ unite: barge_debarquement, nombre: 1 }] }
  - id: intercepteurs_stormtalons
    nom: Intercepteurs Stormtalons
    variantes:
      - { id: destructor, nom: 2 Stormtalons Destructor, cout: 200, composition: [{ unite: stormtalon_destructor, nombre: 2 }] }
      - { id: annihilator, nom: 2 Stormtalons Annihilator, cout: 250, composition: [{ unite: stormtalon_annihilator, nombre: 2 }] }
  - id: stormeagles
    nom: Stormeagles
    variantes:
      - { id: base, cout: 275, composition: [{ unite: stormeagle, nombre: 2 }] }
  - id: caestus
    nom: Bélier d'assaut Caestus
    variantes:
      - { id: base, cout: 250, composition: [{ unite: belier_assaut_caestus, nombre: 2 }] }
    options: [caestus_supplementaire]
    phrase_pdf: "2 Caestus (Ajouter 1 Caestus : +100 pts)"
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur d'attaque, cout: 200, composition: [{ unite: croiseur_attaque, nombre: 1 }] }
      - { id: barge_bataille, nom: 1 Barge de bataille, cout: 350, composition: [{ unite: barge_bataille, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    phrase_pdf: "0-1 Soutien Orbital"
  - id: titan_warhound
    nom: Titan Warhound
    variantes:
      - { id: base, cout: 275, composition: [{ unite: warhound, nombre: 1 }] }
    options: [warhound_supplementaire]
    phrase_pdf: "1 Titan Warhound (Ajouter 1 Titan Warhound : +225 pts)"

sections:
  - id: detachements_principaux
    titre: DÉTACHEMENTS PRINCIPAUX STORM LORDS
    formations: [fils_de_jaghatai]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
  - id: detachements_soutien
    titre: DÉTACHEMENTS DE SOUTIEN STORM LORDS
    sous_titre: "Jusqu'à 3 détachements de soutien par détachement principal"
    formations: [tactique, assaut, terminator, scouts, land_speeders, predators, land_raiders]
    contraintes: [{ type: consomme, budget: soutien }, { type: max_options, valeur: 3 }]
    colonne_options: true
    options: [commandant, attaque_de_flanc, transport_terminator, sniper, hunter, razorbacks, tornado_typhoon, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS STORM LORDS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 3 améliorations"
  - id: flotte
    titre: FLOTTE STORM LORDS
    sous_titre: "SUPPORTS STORM LORDS"
    formations: [thunderhawk, thunderhawks_transporteurs, barge_debarquement, intercepteurs_stormtalons, stormeagles, caestus, soutien_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: titanicus
    titre: SOUTIEN DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS STORM LORDS"
    formations: [titan_warhound]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    colonne_options: true

listes_test:
  - nom: "3000 pts, deux détachements de Fils de Jaghatai et leurs soutiens"
    limite: 3000
    attendu: valide
    formations:
      - formation: fils_de_jaghatai
        choix: { "1": { motos: 2, motos_assaut: 1 } }
        options:
          - { option: commandant, choix: maitre_chapitre }
          - { option: attaque_de_flanc }
      - formation: fils_de_jaghatai
        choix: { "1": { land_speeder_tornado: 3 } }
      - { formation: tactique, options: [{ option: hunter }] }
      - { formation: terminator, options: [{ option: transport_terminator, choix: teleportation }] }
      - { formation: scouts, options: [{ option: sniper }] }
      - { formation: predators, variante: destructor }
      - { formation: intercepteurs_stormtalons, variante: destructor }

  - nom: "deux Maîtres de chapitre"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: fils_de_jaghatai
        choix: { "1": { motos: 3 } }
        options: [{ option: commandant, choix: maitre_chapitre }]
      - { formation: tactique, options: [{ option: commandant, choix: maitre_chapitre }] }

  - nom: "deux détachements de Land Raiders"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: fils_de_jaghatai
        choix: { "1": { motos: 3 } }
      - { formation: land_raiders }
      - { formation: land_raiders }

  - nom: "quatre détachements de soutien pour un détachement principal"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: fils_de_jaghatai
        choix: { "1": { motos: 3 } }
      - { formation: assaut }
      - { formation: scouts }
      - { formation: tactique }
      - { formation: predators, variante: destructor }
