# Storm Lords, transcrit depuis le PDF expérimental fan list 1.4 (source de vérité).
codex:
  slug: storm-lords
  armee_id: 244fc0f8-de74-42a2-b379-3232e1f3234c
  nom: Storm Lords
  version: "0.2"
  faction: imperium
  categorie: armees-imperiales
  statut: experimental
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/storm-lords.png
  citation:
    texte: "Guerriers de Chogoris ! Frères de la Grande Tribu ! La chasse stellaire vous appelle, l'entendez-vous ? La crête rouge de la bataille est votre foyer, le respect de vos pairs est votre feu. Plongez dans le cœur de l'ennemi comme une lame et vous serez apaisés. L'Empereur nous a donné la force. Remboursons-le en lui donnant la victoire !"
    auteur: Jaghatai Khan, la Dernière Charge de Galathamar
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de Storm Lords ou tout autre chapitre successeur des White Scars.
  regles_md:
    - titre: "Règle spéciale : Garnison"
      texte: |
        Les Storm Lords sont une armée mobile qui déploie rarement des garnisons. Par contre, leurs formations de motos progressent en avant-garde de l'armée.

        Le joueur Storm Lords peut choisir de placer jusqu'à deux formations de Fils de Jaghatai en garnison même si ces formations ne respectent pas les règles normales permettant de placer une formation en garnison. S'il choisit cette option, aucune autre formation ne peut être placée en garnison.
    - titre: "Règle spéciale : Charge féroce"
      texte: |
        Les unités d'une formation de Fils de Jaghatai peuvent relancer leurs jets de terrain difficile lors :

        - d'un mouvement de charge ;
        - d'un mouvement de contre-charge ;
        - d'un mouvement de consolidation.
    - titre: "Règle spéciale : Maître tacticien"
      texte: |
        Si le Commandant Suprême est présent sur la table, qu'il n'a pas encore utilisé sa relance lors de ce tour et qu'une formation Storm Lords peut réaliser une contre charge, alors le joueur Storm Lords peut choisir de consommer sa relance de commandant suprême pour ce tour afin de bénéficier du bonus suivant :

        Toutes les unités de la formation Storm Lords peuvent effectuer ce mouvement de contre charge dans n'importe quelle direction.

        De plus, si une fois ce mouvement terminé, la formation attaquante n'a plus aucune de ses unités dans un rayon de 15 cm autour d'une unité ennemie de la formation visée, l'assaut prend fin.
    - titre: "Règle spéciale : Débordement"
      texte: |
        En début de partie, notez secrètement un bord de table latéral (autre que les bords de table des joueurs : gauche ou droit).

        À partir du tour 2, lors de la phase de téléportation, vous pouvez placer la formation entièrement à moins de 15 cm du bord choisi. Puis, lancez 1 dé : sur un résultat de 1, la formation reçoit 1 PI.
    - titre: "Règle spéciale : Et ils ne connaîtront pas la peur"
      texte: |
        - Il faut deux pions d'impact pour neutraliser une unité Space Marines ou détruire une unité démoralisée (ignorez les pions d'impacts en plus).
        - Les formations Space Marines ne sont démoralisées qu'à partir du moment où elles ont deux pions d'impact ou plus par unité.
        - Les formations Space Marines comptent comme ayant la moitié de leur nombre de pions impact lors de la résolution de l'assaut (arrondi à l'inférieur, à un minimum de 1 pion impact).
        - Réduisez de moitié le nombre de touches supplémentaires subies par une formation de Space Marines perdant un assaut, en arrondissant à l'entier inférieur en faveur des Space Marines.
        - Lorsqu'une formation Space Marines démoralisée se rallie, elle reçoit un nombre de pions impact égal au nombre d'unités plutôt qu'à la moitié du nombre d'unités.
        - Les Meneurs Space Marines retirent deux pions d'impact au lieu d'habituellement un seul.
    - titre: "Règle spéciale : Transports"
      texte: |
        Les formations Space Marines disposant d'unités avec le suffixe "+ Transports" peuvent prendre assez de Rhinos pour transporter l'intégralité de la formation. Si cette option est prise, le nombre de Rhinos doit être suffisant, mais la capacité totale de transport ne doit pas être excédentaire par rapport au nombre d'unités à transporter.

        Si des véhicules avec une capacité de transport ont été achetés pour la formation (comme des Razorbacks ou des Land Raiders), on considère qu'ils transportent au maximum de leurs capacités et qu'il est possible de prendre assez de Rhinos pour transporter ce qu'il reste de la formation.

        En outre, il est possible de remplacer tous les Rhinos de la formation par un Dreadnought ou par des Modules d'atterrissage, excepté pour les détachements de Scouts.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD."
  valeur_strategique: 5
  initiative:
    defaut: "1+"

