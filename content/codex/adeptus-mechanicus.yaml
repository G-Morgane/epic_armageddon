sections:
  - id: principaux
    titre: DÉTACHEMENTS PRINCIPAUX DE L'ADEPTUS MECHANICUS
    formations: [det_skitarii_vanguards, det_kataphrons, det_ballistarii]
    contraintes: [{ type: fournit, budget: slot_soutien, quantite: 2 }]
    colonne_options: true
  - id: soutien
    titre: DÉTACHEMENTS DE SOUTIEN DE L'ADEPTUS MECHANICUS
    sous_titre: "Jusqu'à 2 détachements de soutien par détachement principal"
    formations:
      - groupe_assaut_souterrain
      - det_skitarii_rangers
      - det_electro_pretres
      - det_sicarian_infiltrators
      - det_sicarian_ruststalkers
      - det_serberys_raiders
      - det_pteraxii
      - det_sydonian_dragoons
      - det_kastellan_automata
      - det_onagres
      - det_skorpius_desintegrators
      - det_archaeopter_transvector
      - det_ordinatus_minoris
    contraintes: [{ type: consomme, budget: slot_soutien }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DE L'ADEPTUS MECHANICUS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation"
  - id: omnimessie
    titre: FLOTTE DE L'OMNIMESSIE
    sous_titre: "SUPPORTS DE L'ADEPTUS MECHANICUS"
    formations: [escadrille_stratoraptor, escadrille_fusilave, soutien_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: centurio_ordinatus
    titre: SOUTIENS DU CENTURIO ORDINATUS
    sous_titre: "SUPPORTS DE L'ADEPTUS MECHANICUS"
    formations: [support_ordinatus_mars, support_ordinatus_armageddon, support_ordinatus_golgotha]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: titanicus
    titre: SOUTIENS DE L'ADEPTUS TITANICUS
    sous_titre: "ALLIANCE MECHANICUM DE L'ADEPTUS MECHANICUS"
    formations: []
    contraintes: [{ type: consomme, budget: alliance_mechanicum, quoi: points }, { type: initiative, valeur: "1+" }]
    allies: { codex: adeptus-titanicus }

listes_test:
  - nom: "3000 pts : deux détachements principaux et quatre soutiens"
    limite: 3000
    attendu: valide
    formations:
      - formation: det_skitarii_vanguards
        variante: huit
        options: [{ option: magos, choix: tech_priest }]
      - { formation: det_kataphrons }
      - formation: det_skitarii_rangers
        options: [{ option: skorpius_dunerider, quantite: 3 }]
      - formation: det_electro_pretres
        options: [{ option: tunnelier, choix: termites, quantite: 4 }]
      - formation: det_sicarian_infiltrators
        options: [{ option: teleportation }]
      - formation: det_onagres
        options: [{ option: onagre_icarus, choix: remplacement }]
      - { formation: support_ordinatus_mars }
      - { formation: escadrille_stratoraptor, choix: { "0": { archaeopter_stratoraptor: 3 } } }
      - { formation: titan_warhound }
  - nom: "2500 pts : assaut souterrain, automates et Ordinatus Minoris"
    limite: 2500
    attendu: valide
    formations:
      - { formation: det_skitarii_vanguards, variante: douze }
      - { formation: det_ballistarii }
      - { formation: groupe_assaut_souterrain, variante: taupe }
      - { formation: det_kastellan_automata }
      - formation: det_ordinatus_minoris
        variante: sagittar
        options: [{ option: ordinatus_minoris, repartition: { ordinatus_minoris_ulator: 1 } }]
      - formation: det_archaeopter_transvector
        variante: electro_pretres
        options: [{ option: magos, choix: tech_priest }]
  - nom: "trois détachements de soutien pour un seul détachement principal"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: det_skitarii_vanguards, variante: huit }
      - { formation: det_serberys_raiders }
      - { formation: det_sydonian_dragoons }
      - { formation: det_pteraxii }
  - nom: "supports au-delà du tiers des points"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: det_skitarii_vanguards, variante: huit }
      - { formation: support_ordinatus_golgotha }
      - { formation: support_ordinatus_mars }
  - nom: "deux Tech-Priests pour moins de 2 000 pts"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: det_skitarii_vanguards
        variante: huit
        options: [{ option: magos, choix: tech_priest }]
      - formation: det_kataphrons
        options: [{ option: magos, choix: tech_priest }]
  - nom: "deux Tech-Priests Dominus dans l'armée"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: det_skitarii_vanguards
        variante: huit
        options: [{ option: magos, choix: dominus }]
      - formation: det_kataphrons
        options: [{ option: magos, choix: dominus }]
  - nom: "plus de Duneriders que nécessaire"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - { formation: det_skitarii_vanguards, variante: huit }
      - formation: det_skitarii_rangers
        options: [{ option: skorpius_dunerider, quantite: 4 }]
  - nom: "Avant-Garde et Skorpius Dunerider sur la même formation"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - { formation: det_skitarii_vanguards, variante: huit }
      - formation: det_skitarii_rangers
        options: [{ option: avant_garde }, { option: skorpius_dunerider, quantite: 3 }]
