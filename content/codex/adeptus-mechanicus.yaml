options:
  - id: magos
    nom: Magos
    effet:
      type: choix
      parmi:
        - id: tech_priest
          nom: Tech-Priest
          cout: 50
          effet: { type: ajouter, unites: [{ unite: tech_priest, nombre: 1 }] }
          contraintes: [{ type: consomme, budget: tech_priests }]
        - id: dominus
          nom: Tech-Priest Dominus
          cout: 75
          effet: { type: ajouter, unites: [{ unite: tech_priest_dominus, nombre: 1 }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajoutez un Tech-Priest à la formation (1 par tranche de 1 000 pts même incomplète) ou 1 Tech-Priest Dominus à la formation (1 par armée au maximum). Une formation qui comprend un Tech-Priest ou un Tech-Priest Dominus a une valeur d'initiative de 1+."
  - id: avant_garde
    nom: Avant-Garde
    effet: { type: mot_cle, texte: Éclaireur, cout: 25 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: max_par_armee, valeur: 2 }
      - { type: exclut, options: [skorpius_dunerider] }
    phrase_pdf: "Les unités de formation gagnent la note Éclaireur, la formation ne peut pas recevoir simultanément l'amélioration Skorpius Dunerider"
  - id: onagre_icarus
    nom: Onagre Icarus
    effet:
      type: choix
      parmi:
        - id: remplacement
          nom: Remplacer un Onagre de la formation par un Onagre Icarus
          cout: 0
          effet: { type: remplacer, de: onagre, par: onagre_icarus, lot: 1, max: 1, cout: 25 }
        - id: ajout
          nom: Ajouter un Onagre Icarus à la formation
          cout: 75
          effet: { type: ajouter, unites: [{ unite: onagre_icarus, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: skorpius_dunerider
    nom: Skorpius Dunerider
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: skorpius_dunerider }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez suffisamment de Duneriders pour transporter toute la formation"
  - id: skorpius_desintegrator
    nom: Skorpius Desintegrator
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: skorpius_desintegrator }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 ou 2 Skorpius Desintegrator"
  - id: ordinatus_minoris
    nom: Ordinatus Minoris
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: ordinatus_minoris_sagittar, cout: 125 }
        - { unite: ordinatus_minoris_ulator, cout: 125 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 ou 2 Ordinatus Minoris, Sagittar et/ou Ulator"
  - id: tunnelier
    nom: Tunnelier
    effet:
      type: choix
      parmi:
        - id: termites
          nom: Ajouter suffisamment de Termites pour transporter toute la formation
          cout: 0
          effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: termite }], min: 1, max: besoin_transport }
        - id: taupe
          nom: Ajouter 1 Taupe à la formation
          cout: 50
          effet: { type: ajouter, unites: [{ unite: taupe, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Vous pouvez choisir l'une des options suivantes : ajouter suffisamment de Termites pour transporter toute la formation (25 pts chacun), ou ajouter 1 Taupe à la formation (50 pts)."
  - id: teleportation
