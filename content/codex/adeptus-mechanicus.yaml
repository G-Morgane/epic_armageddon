# Adeptus Mechanicus, transcrit depuis le PDF EAFR rev 1.5 (source de vérité).
codex:
  slug: adeptus-mechanicus
  nom: Adeptus Mechanicus
  version: "1.5"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/adeptus-mechanicus.jpg
  couleur: "#8b2f13"
  citation:
    texte: "Le besoin intrinsèque d'un ordre parfait est profondément ancré dans la psyché. La galaxie s'oppose à cet ordre. Une telle dissidence doit être systématiquement éliminée. Sans pitié, sans exception, elle doit être éliminée, comme l'énonce la voie suprême de la logique. Voilà ce qui me pousse à envoyer mes légions paver le chemin de l'illumination de l'Omnimessie."
    auteur: Vitruvius Eng, Technoprêtre Dominus
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de l'Adeptus Mechanicus.

    Les armées de l'Adeptus Mechanicus sont organisées en formations appelées détachements principaux, détachements de soutien.

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement sans autre contrainte. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion.

    Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de support sont des formations autonomes des détachements. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Boucliers du vide"
      texte: |
        Certains engins de guerre sont protégés par des boucliers énergétiques. Le nombre de boucliers de chaque engin de guerre est noté sur sa fiche d'unité.

        Chaque bouclier stoppe automatiquement un point de dommages avant de se désactiver. Ne faites pas de sauvegarde contre les attaques stoppées par des boucliers, n'ajoutez pas non plus de pion d'impact pour chaque bouclier désactivé. Une fois que tous les boucliers sont désactivés, l'engin de guerre peut être endommagé normalement. Faites les jets de sauvegarde habituels contre les touches subies.

        Les touches de corps à corps lors d'un assaut ignorent les boucliers, mais pas celles de fusillade.

        Les boucliers désactivés peuvent être réparés. Un engin de guerre répare un bouclier désactivé à la fin de chaque tour. De plus, si un engin de guerre se regroupe, il peut utiliser le résultat de son dé pour retirer des pions d'impact ou pour réparer des boucliers (par exemple, si le résultat est 2, vous pouvez soit retirer 2 pions d'impact, soit réparer 2 boucliers, soit retirer 1 pion d'impact et réparer 1 bouclier).
    - titre: "Règle spéciale : Tunneliers"
      texte: |
        Le Mechanicum utilise des Tunneliers pour mener sans danger par voie souterraine les troupes à des lieux clés du champ de bataille :

        - Les tunneliers sont déployés sur leur bord de table avant la bataille, au même moment que les vaisseaux spatiaux, ils n'interviennent pas directement dans le jeu tant qu'ils n'émergent pas.
        - Noter secrètement au début de quel tour ils feront surface ainsi que les coordonnées (à partir de la pointe de la ou d'une des foreuses) où vous voulez qu'ils émergent, de la même façon que vous notez celles de vos zones de largage.
        - Si les tunneliers apparaissent dans votre moitié de table, ils ne peuvent le faire qu'à partir du second tour et s'ils comptent émerger dans la moitié de table ennemie, ils ne peuvent le faire qu'à partir du troisième tour.
        - Les tunneliers émergeants sont placés en début de tour, avant le jet de stratégie. Une fois les tunneliers placés vous pouvez faire débarquer vos troupes de suite.
        - Il n'y a pas de déviation mais si toutefois, ils émergent sous les pieds de n'importe quel type d'unité (amie ou ennemie) ou dans une zone de contrôle ennemie, l'unité est placée par l'adversaire dans la zone dégagée la plus proche pouvant la recevoir.
        - S'il y a plus d'une unité de Tunnelier qui émerge, après le placement de la première, les autres sont toutes placées à 15cm maximum de celle-ci tout en restant en formation.
    - titre: "Alliance : Mechanicum"
      texte: |
        Un tiers des points d'une liste de l'Adeptus Mechanicus peut être sélectionné dans l'un des deux codex Légions Titaniques ou Chevalier Impériaux. Cette sélection doit respecter la structure de ces listes (ex : un choix de base pour avoir deux choix de soutien, etc.) et elle ne peut pas inclure d'unités possédant la note Commandant Suprême.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Igor Sid https://40k.gallery/artist/igor-sid/"
  valeur_strategique: 3
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Formations comprenant un Tech-Priest ou un Tech-Priest Dominus", valeur: "1+" }
      - { portee: "Soutiens de l'Adeptus Titanicus", valeur: "1+" }

