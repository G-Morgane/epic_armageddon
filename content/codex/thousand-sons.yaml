        - { id: sorcier, nom: Sorcier du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: sorcier_chaos }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "(0-1) Ajouter un Seigneur du Chaos (50 pts) ou ajouter un Champion Exalté du Chaos ou un Sorcier du Chaos (25 pts)"
    note_md: "Un seul Seigneur du Chaos par armée (Commandant Suprême)."
  - id: porte_icone
    nom: Porte-icône
    effet: { type: ajouter, cout: 25, unites: [{ unite: porte_icone }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Porte-icône à l'une des unités de la formation"
    note_md: "Le Porte-icône porte la note Icône Démoniaque : il permet d'invoquer une formation de Démons placée en réserve (règle Invocation de démons)."
  - id: prince_demon
    nom: Prince Démon
    effet:
      type: choix
      parmi:
        - id: prince_demon
          nom: Prince Démon
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon, lot: 1, max: 1, cout: 0 }
        - id: prince_demon_aile
          nom: Prince Démon Ailé
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon_aile, lot: 1, max: 1, cout: 0 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Remplacer le Seigneur du Chaos ou le Champion Exalté du Chaos et l'unité qu'il accompagne par un Prince Démon (ou un Prince Démon Ailé). S'il remplace le Seigneur du Chaos, il acquiert la capacité Commandant Suprême"
    note_md: "Nécessite un Seigneur du Chaos ou un Champion Exalté du Chaos dans la formation. L'unité que le personnage accompagnait est retirée avec lui. S'il remplace le Seigneur du Chaos, le Prince Démon devient Commandant Suprême."
  - id: duc_changement
    nom: Duc du Changement
    effet: { type: ajouter, cout: 150, unites: [{ unite: duc_changement }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: consomme, budget: duc_unique }
    phrase_pdf: "Ajouter 1 Duc du Changement. Uniquement si le Démon Majeur n'a pas été pris comme choix de Détachement"
    note_md: "Une formation de Démons Mineurs comprenant un Duc du Changement a une initiative de 1+ au lieu de 2+."
  - id: transports_elus
    nom: Transports Élus
    effet:
      type: choix
      parmi:
        - id: dreadclaw
          nom: Dreadclaw
          cout: 50
          effet: { type: ajouter, unites: [{ unite: dreadclaw }] }
          contraintes: [{ type: exclut, options: [defilers, stalker, support_lourd, land_raiders] }]
        - id: teleportation
          nom: Téléportation
          cout: 50
          effet: { type: mot_cle, texte: Téléportation, cible: [elus_terminators_chaos] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Dreadclaw pour transporter toute la formation ou Donnez le mot-clé Téléportation aux Élus Terminators du Chaos"
    note_md: "Le Dreadclaw ne transporte que l'infanterie (sauf motos) et les Dreadnoughts : une formation comprenant des Defilers, un Stalker, du Support Lourd ou des Land Raiders ne peut pas le choisir."
  - id: transports
    nom: Transports
    effet:
      type: choix
      parmi:
        - id: dreadclaw
          nom: Dreadclaw
          cout: 50
          effet: { type: ajouter, unites: [{ unite: dreadclaw }] }
          contraintes: [{ type: exclut, options: [defilers, stalker, support_lourd, land_raiders] }]
        - id: rhinos
          nom: Rhinos du Chaos
          cout: 50
          effet: { type: ajouter, unites: [{ unite: rhino_chaos }], cout_par_unite: 0, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Dreadclaw ou suffisamment de Rhinos du Chaos pour transporter toute la formation"
    note_md: "Prix forfaitaire de 50 pts quel que soit le nombre de Rhinos. Le Dreadclaw ne transporte que l'infanterie (sauf motos) et les Dreadnoughts : une formation comprenant des Defilers, un Stalker, du Support Lourd ou des Land Raiders ne peut pas le choisir."
  - id: dreadnoughts
    nom: Dreadnoughts
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: dreadnought_chaos }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 Dreadnoughts du Chaos à la formation (50 pts chacun)"
  - id: defilers
    nom: Defilers
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: un, nom: 1 Defiler, cout: 75, unites: [{ unite: defiler, nombre: 1 }] }
        - { id: deux, nom: 2 Defilers, cout: 125, unites: [{ unite: defiler, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Defiler à la formation (75 pts) ou 2 Defilers (125 pts)"
  - id: stalker
    nom: Stalker
    effet: { type: ajouter, cout: 50, unites: [{ unite: stalker }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Stalker à la formation"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: vindicators, nom: 2 Vindicators du Chaos, cout: 75, unites: [{ unite: vindicator_chaos, nombre: 2 }] }
        - { id: predators, nom: 2 Predators du Chaos, cout: 75, unites: [{ unite: predator_chaos, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 Vindicators du Chaos ou 2 Predators du Chaos à la formation"
  - id: land_raiders
    nom: Land Raiders
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: un, nom: 1 Land Raider du Chaos, cout: 75, unites: [{ unite: land_raider_chaos, nombre: 1 }] }
        - { id: deux, nom: 2 Land Raiders du Chaos, cout: 125, unites: [{ unite: land_raider_chaos, nombre: 2 }] }
        - { id: trois, nom: 3 Land Raiders du Chaos, cout: 200, unites: [{ unite: land_raider_chaos, nombre: 3 }] }
        - { id: quatre, nom: 4 Land Raiders du Chaos, cout: 250, unites: [{ unite: land_raider_chaos, nombre: 4 }] }
        - { id: cinq, nom: 5 Land Raiders du Chaos, cout: 325, unites: [{ unite: land_raider_chaos, nombre: 5 }] }
        - { id: six, nom: 6 Land Raiders du Chaos, cout: 400, unites: [{ unite: land_raider_chaos, nombre: 6 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 6 Land Raiders du Chaos à la formation (75 pts chacun, 125 pts les 2)"
  - id: destinee_architecte
    nom: Destinée de l'Architecte
    effet: { type: mot_cle, texte: Téléportation, cout: 50 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "La formation reçoit la compétence Téléportation"
    note_md: "Une seule Suite de Rubric Marines de l'armée peut recevoir la Destinée de l'Architecte."
  - id: vehicules_blindee
    nom: Véhicules supplémentaires
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: vindicators, nom: 2 Vindicators du Chaos, cout: 75, unites: [{ unite: vindicator_chaos, nombre: 2 }] }
        - { id: predators, nom: 2 Predators du Chaos, cout: 75, unites: [{ unite: predator_chaos, nombre: 2 }] }
        - { id: lr1, nom: 1 Land Raider du Chaos, cout: 75, unites: [{ unite: land_raider_chaos, nombre: 1 }] }
        - { id: lr2, nom: 2 Land Raiders du Chaos, cout: 125, unites: [{ unite: land_raider_chaos, nombre: 2 }] }
        - { id: lr3, nom: 3 Land Raiders du Chaos, cout: 200, unites: [{ unite: land_raider_chaos, nombre: 3 }] }
        - { id: lr4, nom: 4 Land Raiders du Chaos, cout: 250, unites: [{ unite: land_raider_chaos, nombre: 4 }] }
        - { id: vindicators_lr1, nom: 2 Vindicators et 1 Land Raider du Chaos, cout: 150, unites: [{ unite: vindicator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 1 }] }
        - { id: vindicators_lr2, nom: 2 Vindicators et 2 Land Raiders du Chaos, cout: 200, unites: [{ unite: vindicator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 2 }] }
        - { id: predators_lr1, nom: 2 Predators et 1 Land Raider du Chaos, cout: 150, unites: [{ unite: predator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 1 }] }
        - { id: predators_lr2, nom: 2 Predators et 2 Land Raiders du Chaos, cout: 200, unites: [{ unite: predator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "0-4 véhicules supplémentaires parmi : Support Lourd, Land Raiders"
    note_md: "Compagnie Blindée uniquement : au plus 4 véhicules supplémentaires en combinant une fois Support Lourd (2 Vindicators ou 2 Predators, 75 pts) et une fois Land Raiders (75 pts chacun, 125 pts les 2)."

formations:
  # ---- Détachements ----
  - id: suite_rubric
    nom: Suite de Rubric Marines
    description: "1+ par armée"
    variantes:
      - { id: base, cout: 275, composition: [{ unite: rubric_marines, nombre: 8 }] }
    options: [personnage_chaos, porte_icone, prince_demon, transports, dreadnoughts, defilers, stalker, support_lourd, land_raiders, destinee_architecte]
    contraintes:
      - { type: min_par_armee, valeur: 1 }
      - { type: fournit, budget: place_soutien, quantite: 1 }
  - id: scarab_occult
    nom: Scarab Occult Terminators
    description: "0-2 par armée"
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 4, max: 6 }
              parmi: [{ unite: elus_terminators_chaos, cout: 50 }]
              phrase_pdf: "4 à 6 unités d'Élus Terminators du Chaos"
    options: [personnage_chaos, porte_icone, prince_demon, transports_elus, dreadnoughts, defilers, stalker, support_lourd, land_raiders]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: compagnie_blindee
    nom: Compagnie Blindée
    variantes:
      - { id: land_raiders, nom: 4 Land Raiders du Chaos, cout: 300, composition: [{ unite: land_raider_chaos, nombre: 4 }] }
      - { id: predators, nom: 4 Predators du Chaos, cout: 200, composition: [{ unite: predator_chaos, nombre: 4 }] }
    options: [stalker, vehicules_blindee]
  - id: demons_mineurs
    nom: Démons Mineurs
    description: "0-2 par armée"
    variantes:
      - { id: huit, nom: 8 unités d'Incendiaires, cout: 175, composition: [{ unite: incendiaires, nombre: 8 }] }
      - { id: douze, nom: 12 unités d'Incendiaires, cout: 275, composition: [{ unite: incendiaires, nombre: 12 }] }
    options: [duc_changement]
    contraintes:
      - { type: max_par_armee, valeur: 2 }
      - { type: initiative, valeur: "2+" }
  - id: demon_majeur
    nom: Démon Majeur
    description: "0-1 par armée"
    variantes:
      - { id: base, nom: 1 Duc du Changement, cout: 200, composition: [{ unite: duc_changement, nombre: 1 }] }
    options: []
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: consomme, budget: duc_unique }

  # ---- Détachements de soutien ----
  - id: fleches_arcanes
    nom: Flèches des Arcanes
    variantes:
      - { id: quatre, nom: 4 Tours d'Argent, cout: 250, composition: [{ unite: tour_argent, nombre: 4 }] }
      - { id: six, nom: 6 Tours d'Argent, cout: 375, composition: [{ unite: tour_argent, nombre: 6 }] }
    options: []
    contraintes: [{ type: initiative, valeur: "2+" }]
  - id: chevaucheurs_disque
    nom: Chevaucheurs de Disque
    variantes:
      - { id: base, cout: 225, composition: [{ unite: chevaucheurs_disque, nombre: 6 }] }
    options: [personnage_chaos, porte_icone]

  # ---- Supports : Flotte de Guerre du Chaos ----
  - id: vol_firelords
    nom: Vol de Firelords
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 2, max: 3 }
              parmi: [{ unite: firelord, cout: 150 }]
              phrase_pdf: "2 à 3 Firelords"
  - id: vol_doomwings
    nom: Vol de Doomwings
    variantes:
      - { id: base, cout: 200, composition: [{ unite: doomwing, nombre: 3 }] }
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur Devastation, cout: 200, composition: [{ unite: croiseur_devastation, nombre: 1 }] }
      - { id: cuirasse, nom: 1 Cuirassé Despoiler, cout: 250, composition: [{ unite: cuirasse_despoiler, nombre: 1 }] }
    contraintes: [{ type: pas_une_activation }]

  # ---- Supports : Soutien Titanique des Légions Renégates ----
  - id: palais_warp
    nom: Palais du Warp
    description: "0-2 par armée"
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 1, max: 2 }
              parmi: [{ unite: palais_warp, cout: 375 }]
              phrase_pdf: "1 ou 2 Palais du Warp"
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: titan_feral
    nom: Titan Feral
    variantes:
      - { id: base, cout: 300, composition: [{ unite: titan_feral, nombre: 1 }] }
  - id: titan_ravager
    nom: Titan Ravager
    variantes:
      - { id: base, cout: 650, composition: [{ unite: titan_ravager, nombre: 1 }] }
  - id: titan_banelord
    nom: Titan Banelord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: titan_banelord, nombre: 1 }] }

sections:
  - id: detachements
    titre: DÉTACHEMENTS DES THOUSAND SONS
    formations: [suite_rubric, scarab_occult, compagnie_blindee, demons_mineurs, demon_majeur]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DES THOUSAND SONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 4 améliorations"
  - id: soutien
    titre: DÉTACHEMENTS DE SOUTIEN DES THOUSAND SONS
    sous_titre: "Une formation par Suite de Rubric Marines"
    formations: [fleches_arcanes, chevaucheurs_disque]
    contraintes:
      - { type: consomme, budget: place_soutien }
      - { type: max_options, valeur: 4 }
    colonne_options: true
  - id: flotte
    titre: FLOTTE DE GUERRE DU CHAOS
    sous_titre: "SUPPORTS DES THOUSAND SONS"
    formations: [vol_firelords, vol_doomwings, soutien_orbital]
    contraintes:
      - { type: consomme, budget: rare, quoi: points }
      - { type: initiative, valeur: "2+" }
  - id: titans_renegats
    titre: SOUTIEN TITANIQUE DES LÉGIONS RENÉGATES
    sous_titre: "SUPPORTS DES THOUSAND SONS"
    formations: [palais_warp, titan_feral, titan_ravager, titan_banelord]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts valide : Suite en Rhinos, Scarab Occult, Compagnie Blindée, Démons Mineurs, Flèches des Arcanes et Titan Feral"
    limite: 3000
    attendu: valide
    formations:
      - formation: suite_rubric
        options:
          - { option: personnage_chaos, choix: seigneur }
          - { option: porte_icone }
          - { option: destinee_architecte }
          - { option: transports, choix: rhinos, quantite: 4 }
      - formation: scarab_occult
        choix: { "0": { elus_terminators_chaos: 5 } }
        options:
          - { option: personnage_chaos, choix: champion }
          - { option: prince_demon, choix: prince_demon_aile }
          - { option: transports_elus, choix: teleportation }
      - formation: compagnie_blindee
        variante: predators
        options:
          - { option: stalker }
          - { option: vehicules_blindee, variante: predators_lr1 }
      - formation: demons_mineurs
        variante: douze
        options: [{ option: duc_changement }]
      - { formation: fleches_arcanes, variante: six }
      - { formation: titan_feral }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_rubric }
      - { formation: titan_banelord }
  - nom: "trois Scarab Occult Terminators"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: suite_rubric }
      - { formation: scarab_occult, choix: { "0": { elus_terminators_chaos: 4 } } }
      - { formation: scarab_occult, choix: { "0": { elus_terminators_chaos: 4 } } }
      - { formation: scarab_occult, choix: { "0": { elus_terminators_chaos: 4 } } }
  - nom: "deux détachements de soutien pour une seule Suite de Rubric Marines"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_rubric }
      - { formation: fleches_arcanes, variante: quatre }
      - { formation: chevaucheurs_disque }
  - nom: "Duc du Changement pris en détachement et en amélioration"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_rubric }
      - { formation: demon_majeur }
      - formation: demons_mineurs
        variante: huit
        options: [{ option: duc_changement }]
  - nom: "armée sans Suite de Rubric Marines"
    limite: 3000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: compagnie_blindee, variante: land_raiders }
  - nom: "Dreadclaw dans une formation comprenant des Defilers"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: suite_rubric
        options:
          - { option: transports, choix: dreadclaw }
          - { option: defilers, variante: un }
  - nom: "cinq améliorations sur une Suite de Rubric Marines"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: suite_rubric
        options:
          - { option: personnage_chaos, choix: sorcier }
          - { option: porte_icone }
          - { option: stalker }
          - { option: defilers, variante: un }
          - { option: dreadnoughts, quantite: 2 }
