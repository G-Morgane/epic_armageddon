      - { nom: et, portee: (15cm), puissance: "Arme Légère, +1A, MA" }
      - { nom: Feu du Warp de Tzeentch, portee: 30cm, puissance: "3PB, TT (D3), IC" }
    notes: [Antigrav, Blindage Renforcé, Blindage Arrière Renforcé, Sans Peur, Sauvegarde Invulnérable]
    degats: { cd: 6, critique: "Une des runes canalisant l'énergie du Warp est endommagée. Lancez 1D6 durant la phase finale de chaque tour pour chaque rune endommagée : 1 : le Palais du Warp est aspiré dans le Warp, et considéré comme détruit ; 2-3 : il subit 1 point de dommages supplémentaire, et chaque unité dans un rayon de 5cm subit une touche Macro arme sur 6+ ; 4-6 : la rune est réparée" }

