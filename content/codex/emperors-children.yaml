              parmi:
                - { unite: titan_subjugator, cout: 250 }
                - { unite: titan_questor, cout: 275 }
              phrase_pdf: "1 ou 2 Titans parmi : Titan Subjugator (250 pts), Titan Questor (275 pts)"
    contraintes: [{ type: max_par_armee, valeur: 2 }]
