formations:
  # ---- Détachements ----
  - id: suite_noise_marines
    nom: Suite de Noise Marines
    description: "1+ par armée"
    variantes:
      - { id: base, cout: 275, composition: [{ unite: noise_marines, nombre: 8 }] }
    options: [personnage_chaos, porte_icone, prince_demon, transports_noise, dreadnoughts, defilers, stalker, support_lourd, land_raiders, doom_siren]
    contraintes:
      - { type: min_par_armee, valeur: 1 }
      - { type: fournit, budget: place_soutien, quantite: 1 }
  - id: suite_elus
    nom: Suite d'Élus Terminators Emperor's Children
    description: "0-2 par armée"
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 4, max: 6 }
              parmi: [{ unite: elus_terminators_chaos, cout: 50 }]
              phrase_pdf: "4 à 6 unités d'Élus Terminators du Chaos"
    options: [personnage_chaos, porte_icone, prince_demon, transports_elus, dreadnoughts, defilers, stalker, support_lourd, land_raiders]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
