      - { id: six, nom: 6 Chevaliers Démons Hell Scourge, cout: 400, composition: [{ unite: chevalier_hell_scourge, nombre: 6 }] }
    options: []
    contraintes: [{ type: initiative, valeur: "2+" }]
  - id: cohorte_infernale
    nom: Cohorte Infernale
    variantes:
      - { id: quatre, nom: 4 Chevaliers Démons Hell Striders, cout: 225, composition: [{ unite: chevalier_hell_strider, nombre: 4 }] }
      - { id: six, nom: 6 Chevaliers Démons Hell Striders, cout: 325, composition: [{ unite: chevalier_hell_strider, nombre: 6 }] }
    options: []
    contraintes: [{ type: initiative, valeur: "2+" }]

  # ---- Supports : Flotte de Guerre du Chaos ----
