    sous_titre: "SUPPORTS DES EMPEROR'S CHILDREN"
    formations: [titans_legers, titan_ravager, titan_banelord]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts valide : deux Suites de Noise Marines, Élus, Compagnie Blindée, Démons Mineurs et deux détachements de soutien"
    limite: 3000
    attendu: valide
    formations:
      - formation: suite_noise_marines
        options:
          - { option: personnage_chaos, choix: seigneur }
          - { option: porte_icone }
          - { option: doom_siren }
          - { option: transports_noise, choix: rhinos, quantite: 4 }
      - { formation: suite_noise_marines }
      - formation: suite_elus
        choix: { "0": { elus_terminators_chaos: 5 } }
        options:
          - { option: personnage_chaos, choix: champion }
          - { option: prince_demon, choix: prince_demon_aile }
          - { option: transports_elus, choix: teleportation }
      - formation: compagnie_blindee
        variante: predators
        options:
          - { option: stalker }
          - { option: vehicules_supplementaires, variante: predators_lr1 }
      - formation: demons_mineurs
        variante: douze
        options: [{ option: gardien_secrets }]
      - formation: legionnaires
        options: [{ option: transports_legionnaires, choix: rhinos, quantite: 3 }]
      - { formation: phalange_infernale, variante: quatre }
      - formation: titans_legers
        choix: { "0": { titan_subjugator: 1 } }
