  - id: titan_banelord
    nom: Titan Banelord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: titan_banelord, nombre: 1 }] }

sections:
  - id: detachements
    titre: DÉTACHEMENTS DES EMPEROR'S CHILDREN
    formations: [suite_noise_marines, suite_elus, compagnie_motos, compagnie_blindee, demons_mineurs, demon_majeur]
    contraintes: [{ type: max_options, valeur: 4 }]
