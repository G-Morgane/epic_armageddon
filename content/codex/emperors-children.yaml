    options: []
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: consomme, budget: gardien_unique }

  # ---- Détachements de soutien ----
  - id: legionnaires
    nom: Légionnaires
    variantes:
      - { id: base, cout: 225, composition: [{ unite: legionnaires_ec, nombre: 6 }] }
    options: [transports_legionnaires]
  - id: havocs
    nom: Havocs
    variantes:
      - { id: base, cout: 225, composition: [{ unite: havocs, nombre: 6 }] }
    options: [personnage_chaos, prince_demon, transports_havocs, dreadnoughts, defilers, stalker, support_lourd, land_raiders]
