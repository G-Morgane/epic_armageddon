# Eldars de Mymeara, transcrit depuis le PDF expérimental EAFR rev 1.0 (source de vérité).
# Le PDF porte le pied de page « CODEX ALAITOC » et son introduction cite Alaitoc, mais la liste et sa couverture sont celles du vaisseau-monde Mymeara.
codex:
  slug: eldars-de-mymeara
  armee_id: d3368697-c729-40bc-88d9-c138ceacb462
  nom: Eldars de Mymeara
  version: "0.1"
  faction: xenos
  categorie: armees-xenos
  statut: experimental
  citation:
    texte: "Nous les considérions comme des vagabonds. Eh bien ces vagabonds ont retenu mon peloton pendant cinq jours."
    auteur: Lieutenant Pharaik à propos des Rangers Eldars
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée du vaisseau monde Mymeara. Cette liste peut également être utilisée comme liste générique pour représenter n'importe quelle autre armée d'eldars.

    Une armée d'eldars est organisée autour de formations principales aussi appelées osts de guerre. Chaque formation principale permet de recruter jusqu'à 3 formations de support.

    Chaque formation (principale ou de support) est autonome et peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par formation et jusqu'à un maximum de 3. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion.

    Les formations de support lourd sont des formations autonomes. Un maximum de 1/3 des points peuvent être dépensés pour ces formations.

    Une armée eldar peut également recevoir des options. Chaque option ne peut être sélectionnée qu'une seule fois.
  regles_md:
    - titre: "Règle spéciale : L'Avatar"
      texte: |
        L'Avatar peut apparaître sur le champ de bataille de trois manières différentes :

        1. De manière classique lors du déploiement en début de partie.
        2. Par le biais d'un portail comme n'importe quelle formation se trouvant en réserve.
        3. Par invocation dans les 15 cm d'un grand prophète lors de la phase de téléportation.

        Dans tous les cas, dès son apparition, c'est une formation indépendante et permanente jusqu'à la fin de la partie ou sa destruction. Cependant il ne peut que contester les objectifs.
    - titre: "Règle spéciale : Vision extra lucide"
      texte: |
        Toute formation Eldar qui n'est pas démoralisée et qui comprend une unité ayant la capacité vision extra lucide ignore la pénalité de -1 au test d'action lorsqu'elle tente de conserver l'initiative.

        De plus, une fois par tour le joueur Eldar peut essayer de retenir l'initiative deux fois d'affilée. N'importe quelle formation Eldar peut être choisie, y compris celles ne comportant pas de Grand Prophète, néanmoins un Grand Prophète doit impérativement être encore en jeu sur le champ de bataille. La formation doit tout de même passer un test d'initiative pour ne pas perdre l'action, et elle subit le modificateur de -1 pour avoir retenu l'initiative, sauf si elle comprend une unité ayant la capacité vision extra lucide.
    - titre: "Règle spéciale : Armée en mouvement"
      texte: |
        Seuls les Osts de Rangers, Guerriers Mirages et les Coureurs Mirages peuvent se déployer en garnison.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Darren Tan."
  valeur_strategique: 4
  initiative:
    defaut: "1+"

