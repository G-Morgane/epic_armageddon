sections:
  - id: osts
    titre: OST DE GUERRE MYMEARA
    formations: [ost_gardiens, ost_spectres_ombre]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS MYMEARA
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation et jusqu'à un maximum de 3"
    options: [portail, avatar, autarque, exarque, plateformes_support, gardes_fantomes, seigneurs_fantomes, visionnaire_fantome, firestorm, machine_vaul, lynx, transport, marcheurs, plateformes_lourdes]
  - id: support
    titre: SUPPORT MYMEARA
    sous_titre: "Jusqu'à 2 formations de Support par Ost de Guerre"
    formations: [peloton_rangers, peloton_guerriers_aspects, peloton_windrider, escadron_marcheurs, escadron_bouclier_vaul, escadron_lame_vaul, escadron_machine_vaul, escadron_frelon, escadron_lynx]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
  - id: support_lourd
    titre: SUPPORT LOURD MYMEARA
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
    formations: [croiseur_eldar, escadrille_nightwings, escadrille_phoenix, vampire_hunter, titan_archonte, titan_fantome, escadron_titans_revenants]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts, osts de guerre, supports et support lourd"
    limite: 3000
    attendu: valide
    formations:
      - formation: ost_spectres_ombre
        options:
          - { option: autarque }
          - { option: portail }
          - { option: exarque }
      - formation: ost_gardiens
        options:
          - { option: plateformes_lourdes, quantite: 3 }
          - { option: seigneurs_fantomes }
          - { option: visionnaire_fantome }
          - { option: plateformes_support }
      - { formation: peloton_rangers, variante: huit }
      - { formation: escadron_lynx, options: [{ option: lynx, quantite: 1 }] }
      - { formation: escadron_frelon }
      - { formation: escadrille_phoenix }

  - nom: "sans Ost de Guerre Spectres de l'Ombre"
    limite: 2000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: ost_gardiens }
      - { formation: peloton_rangers, variante: quatre }

  - nom: "deux Autarques"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: ost_spectres_ombre, options: [{ option: autarque }] }
      - { formation: ost_spectres_ombre, options: [{ option: autarque }] }

  - nom: "trois formations de support pour un seul ost"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: ost_spectres_ombre }
      - { formation: peloton_rangers, variante: quatre }
      - { formation: escadron_frelon }
      - { formation: escadron_lynx }

  - nom: "quatre améliorations sur un ost de guerre"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: ost_gardiens
        options:
          - { option: plateformes_support }
          - { option: gardes_fantomes, quantite: 2 }
          - { option: seigneurs_fantomes }
          - { option: marcheurs }
