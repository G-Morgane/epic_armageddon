      - { nom: Bombardement orbital II, portee: "∞", puissance: "8PB MA" }
      - { nom: ou 2x Frappes chirurgicales, portee: "-", puissance: "MA2+, TT (D3)" }
    notes: ["Vous devez décider et noter le système d'armement ainsi que le tour où il entrera en jeu avant la bataille."]

options:
  # ---- Options d'armée ----
  - id: portail
    nom: Portail
    effet: { type: mot_cle, texte: Portail Fantôme, cout: 50 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "0-1 Portail : 1 Portail Fantôme (50 pts)"
  - id: avatar
    nom: Avatar
    effet: { type: ajouter, cout: 100, unites: [{ unite: avatar }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "0-1 Avatar (100 pts)"
  - id: autarque
    nom: Autarque
    effet: { type: ajouter, cout: 75, unites: [{ unite: autarque }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: requiert_unite, unites: [spectres_ombre] }
    phrase_pdf: "0-1 Autarque : ajouter 1 Autarque à une unité de spectres de l'Ombre (75 pts)"

  # ---- Améliorations ----
  - id: exarque
    nom: Exarque
    effet: { type: ajouter, cout: 25, unites: [{ unite: exarque }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 personnage Exarque à une unité de Guerriers Aspects (25 pts)"
  - id: plateformes_support
    nom: Plate-formes de Support
    effet: { type: ajouter, cout: 50, unites: [{ unite: plateforme_support, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 3 Plate-formes de Support (50 pts)"
  - id: gardes_fantomes
    nom: Gardes Fantômes
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: gardes_fantomes }], min: 2, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 2 ou 3 Gardes Fantômes (50 pts chacun)"
  - id: seigneurs_fantomes
    nom: Seigneurs Fantômes
    effet: { type: ajouter, cout: 175, unites: [{ unite: seigneur_fantome, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 3 Seigneurs Fantômes (175 pts)"
  - id: visionnaire_fantome
    nom: Visionnaire Fantôme
    effet: { type: remplacer, de: seigneur_fantome, par: visionnaire_fantome, lot: 1, max: 1, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacez un seigneur fantôme par un visionnaire fantôme (50 pts)"
  - id: firestorm
    nom: Firestorm
    effet:
      type: choix
      parmi:
        - id: remplacement
          nom: Remplacer 1 ou 2 véhicules blindés par autant de Firestorms
          cout: 0
          effet: { type: remplacer, de: [tisseur_nuit, falcon, prisme_feu, warp_hunter], par: firestorm, lot: 1, max: 2, cout: 25 }
        - { id: ajout, nom: Ajouter 1 Firestorm dans une formation de Gardiens, cout: 75, effet: { type: ajouter, unites: [{ unite: firestorm }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacez 1 ou 2 véhicules blindés de la formation par autant de Firestorms (25 pts chacun) ou ajoutez 1 Firestorm dans une formation de Gardiens (75 pts)"
  - id: machine_vaul
    nom: Machine de Vaul
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: cobra, cout: 275 }
        - { unite: scorpion_vaul, cout: 275 }
        - { unite: storm_serpent, cout: 275 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 ou 2 unités supplémentaires parmi : Cobra, Scorpion, Storm Serpent (275 pts chacun)"
  - id: lynx
    nom: Lynx
    effet: { type: ajouter, cout_par_unite: 175, unites: [{ unite: lynx }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Lynx (175 pts chacun)"
  - id: transport
    nom: Transport
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: wave_serpent, cout: 50 }
        - { unite: falcon, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "50 pts le Falcon ou le Wave Serpent, 75 pts les 2 Wave Serpents. Toute la formation doit être transportée sans qu'il ne reste de place libre. Les unités pouvant être transportées sont : Gardiens, Gardes Fantômes, Grands Prophètes, Plate-formes d'Armes Lourdes, Plate-formes de Support, Vengeurs, Guerriers Scorpions, Banshees, Dragons de Feu et Faucheurs Noirs."
    phrase_pdf: "Toute la formation doit être transportée sans qu'il ne reste de place libre (50 pts le Falcon ou Wave Serpent, 75 pts les 2 Wave Serpents)"
  - id: marcheurs
    nom: Marcheurs
    effet: { type: remplacer, de: gardiens, par: marcheur_combat, lot: 3, max: 1, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacez 3 unités de Gardiens par 3 Marcheurs de Combat (50 pts)"
  - id: plateformes_lourdes
    nom: Plate-formes d'armes lourdes
    effet: { type: remplacer, de: gardiens, par: plateforme_arme_lourde, lot: 1, max: 3, cout: 0 }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Vous pouvez remplacer gratuitement jusqu'à trois unités de Gardiens par des Plate-formes d'armes lourdes"

formations:
  # ---- Osts de guerre ----
