sections:
  - id: compagnies
    titre: COMPAGNIES DE LA LÉGION D'ACIER
    formations: [qg_regimentaire, compagnie_mecanisee, compagnie_infanterie, compagnie_blindee, compagnie_super_lourds, compagnie_artillerie]
    contraintes:
      - { type: max_options, valeur: 3 }
      - { type: fournit, budget: slot_appui, quantite: 2 }
    options: [peloton_appui_feu, peloton_infanterie, escadron_chars, escadron_hellhounds, batterie_griffons, dca, snipers, ogryns, transport_chimere]
    tableau_options:
      titre: AMÉLIORATIONS DE COMPAGNIES DE LA LÉGION D'ACIER
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation et jusqu'à un maximum de 3"
    notes:
      embarquement: "Les unités de cette amélioration peuvent être embarquées pour 25 points par Chimère. Vous ne pouvez pas prendre plus de Chimères que nécessaire pour embarquer ces troupes."
  - id: appui
    titre: FORMATIONS D'APPUI DE LA LÉGION D'ACIER
    contraintes: [{ type: consomme, budget: slot_appui }]
    options: [commissaire_appui]
    formations: [peloton_super_lourd, peloton_leman_russ, batterie_artillerie, batterie_deathstrike, batterie_aa, escadron_sentinelles, peloton_rough_riders, militarum_tempestus, escadron_vultures]
