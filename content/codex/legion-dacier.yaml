listes_test:
  - nom: "3000 pts valide"
    limite: 3000
    attendu: valide
    formations:
      - formation: qg_regimentaire
        options:
          - { option: escadron_chars, variante: leman_russ }
          - { option: peloton_infanterie }
          - { option: transport_chimere, quantite: 3 }
      - formation: compagnie_blindee
        options: [{ option: vanquisher_gratuit }]
      - formation: peloton_leman_russ
        options: [{ option: commissaire_appui }]
      - { formation: batterie_artillerie, variante: manticores }
      - { formation: titan_warhound }
  - nom: "trop d'appui pour une compagnie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: peloton_leman_russ }
      - { formation: batterie_aa }
      - { formation: escadron_sentinelles }
  - nom: "quota commissaires dépassé"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: peloton_leman_russ, options: [{ option: commissaire_appui }] }
      - { formation: batterie_aa, options: [{ option: commissaire_appui }] }
  - nom: "trop de Chimères"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: compagnie_infanterie
        options: [{ option: snipers, quantite: 2 }, { option: transport_chimere, quantite: 2 }]
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: titan_warlord }
