# Black Legion, transcrit depuis le PDF EAFR rev 1.6.1 (source de vérité).
codex:
  slug: black-legion
  nom: Black Legion
  version: "1.6.1"
  faction: chaos
  categorie: armees-chaos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/black-legion.jpg
  couleur: "#3B2F2F"
  citation:
    texte: "Je suis l'archi-ennemi, le Destructeur de Mondes. C'est par ma main que le faux empereur sera déchu."
    auteur: Abaddon le Fléau
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de la Black Legion basée sur les forces d'Abaddon le Fléau lors de sa XIIIème Croisade Noire. Cette liste peut également être utilisée pour représenter n'importe quel autre chapitre Space Marine du Chaos Universel comme les Red Corsairs ou les Sons of Malice.

    Les armées de la Black Legion sont organisées en formations appelées détachements.

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement pour un maximum de quatre par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Notez que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de Supports Titaniques Renégates et de la Flotte de Guerre du Chaos sont des formations autonomes des détachements. Elles ne peuvent jamais recevoir d'améliorations, sauf s'il en existe d'indiquées explicitement dans leur profil. Un maximum d'⅓ des points de l'armée peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Invocation de démons"
      texte: |
        Au début de la partie, toutes les formations de Démons sélectionnées lors de la composition de l'armée sont placées en réserve. La note Icône Démoniaque permet, lors de la phase de Téléportation, d'invoquer une de ces formations.

        L'unité possédant Icône Démoniaque est nommée unité Invocatrice. La formation de l'unité Invocatrice et la formation invoquée doivent appartenir à la même faction. La formation invoquée apparaît à moins de 15 cm de l'unité Invocatrice. Si l'unité Invocatrice est éliminée, les démons ne peuvent plus être invoqués par cette formation.

        On ne peut invoquer qu'une seule formation de démons par Icône Démoniaque et par partie. Une formation s'étant téléportée ce tour-ci ne peut pas invoquer de démons. La formation invoquée ne subit pas de PI suite à sa « téléportation ».

        Elle devient immédiatement une formation à part entière et en suit les règles habituelles d'activation, de cohésion, etc. Elle reste ensuite en jeu jusqu'à la fin de la partie ou jusqu'à sa destruction.
    - titre: "Règle spéciale : Sacrifiables"
      texte: |
        Les unités Sacrifiables ne génèrent pas de pion impact lorsqu'elles sont détruites. Cependant, les unités Sacrifiables comptent dans le calcul des pertes lors de la résolution d'un assaut.
    - titre: "Règle spéciale : Instables"
      texte: |
        Les unités Instables démoralisées sont immédiatement détruites. De plus, les unités Instables ne peuvent que contester les objectifs, pas les contrôler.
    - titre: "Règle spéciale : Factions"
      texte: |
        Chaque formation dans une armée de la Black Legion appartient à une faction qui prête allégeance à l'un des Dieux du Chaos (Khorne, Nurgle, Slaanesh ou Tzeentch) ou au Chaos Universel. Vous devez décider à quelle faction appartient chaque formation de votre armée au début de la bataille et le noter sur votre liste d'armée.

        A l'exception de celles vénérant le Chaos Universel, les différentes factions ne s'entendent pas toutes bien, et certaines entretiennent entre elles des haines millénaires. Ceci est représenté par les règles suivantes :

        - Khorne hait Slaanesh et vice versa ;
        - Tzeentch hait Nurgle et vice versa.

        Il est impossible d'aligner dans une même armée des formations qui se haïssent (si vous jouez par exemple une formation de Khorne, vous ne pourrez pas aligner une formation de Slaanesh).

        | Factions | Démons mineurs | Démons majeurs | Marines du Culte |
        |---|---|---|---|
        | Chaos Universel | Bêtes démoniaques | - | - |
        | Khorne | Sanguinaires | Buveur de Sang | Berzerkers de Khorne |
        | Tzeentch | Incendiaires | Duc du Changement | Rubric Marines |
        | Nurgle | Portes-peste | Grand Immonde | Marines de la Peste |
        | Slaanesh | Démonettes | Gardien des Secrets | Noise Marines |
    - titre: "Règle spéciale : Modules d'atterrissage Dreadclaw"
      texte: |
        Une formation se déployant par Assaut Planétaire et pouvant être transportée par Modules d'atterrissage Dreadclaw le fait selon les règles spéciales suivantes :

        Placez un marqueur de Module d'atterrissage en utilisant les règles d'Assaut Planétaire (4.3 et 4.4 du Livre de Règles). Un Vaisseau en orbite sera nécessaire pour déployer les Modules d'atterrissage.

        Le Module d'atterrissage est un marqueur comptant comme la première unité de la formation au moment de déterminer son emplacement d'arrivée en Assaut Planétaire. Une fois le marqueur de Module d'atterrissage placé, résolvez son attaque de tir sur toutes les unités ennemies à moins de 15 cm du centre du Module d'atterrissage. Chaque formation ennemie attaquée reçoit un Pion Impact selon les règles normales de tir.

        Ensuite, débarquez les troupes transportées dans le Module d'atterrissage (cela peut déclencher un tir d'État d'Alerte normalement) complètement à moins de 15 cm du centre de celui-ci, en cohésion et en dehors de toute zone de contrôle ennemie. Si les unités ne peuvent débarquer en totalité en respectant les règles ci-dessus, les unités restantes seront détruites sans attribution de pions d'impacts.

        Le Module d'atterrissage n'étant pas une unité mais un marqueur, il ne possède pas de zone de contrôle et il ne compte pas pour la cohérence de la formation. De plus, il ne peut pas être utilisé pour revendiquer un feu croisé ainsi que pour tenir ou contester des objectifs.

        Si plusieurs formations utilisent des Modules d'atterrissage, placez tous les marqueurs Module d'atterrissage aux coordonnées prédéterminées en utilisant les règles d'Assaut Planétaire (y compris la résolution de dispersion). Une fois que tous les marqueurs sont placés, résolvez toutes les attaques des Modules d'atterrissage simultanément contre les formations ennemies à portée des marqueurs Module d'atterrissage. Les formations visées recevront un pion impact pour le tir pour chaque attaque du vaisseau ou des modules d'atterrissage. Les pertes et les tirs ruptures infligent des PI normalement. Puis débarquez toutes les formations transportées, en suivant les règles ci-dessus.
