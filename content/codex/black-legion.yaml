formations:
  # ---- Détachements ----
  - id: suite_bl
    nom: Suite de la BL
    variantes:
      - { id: base, cout: 250, composition: [{ unite: space_marines_chaos, nombre: 8 }] }
    options: [personnage_chaos, porte_icone, prince_demon, transports, marines_chaos, havocs, obliterators, dreadnoughts, defilers, stalker, support_lourd, land_raiders]
    contraintes: [{ type: fournit, budget: place_forlorn, quantite: 1 }]
  - id: suite_elus
    nom: Suite d'Élus
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 4, max: 6 }
              parmi: [{ unite: elus_terminators_chaos, cout: 50 }]
              phrase_pdf: "4 à 6 unités d'Élus Terminators du Chaos"
    options: [personnage_chaos, porte_icone, prince_demon, transports_elus, obliterators, dreadnoughts, defilers, stalker, support_lourd, land_raiders]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: culte_raptor
    nom: Culte Raptor
    variantes:
      - { id: six, nom: 6 unités de Raptors, cout: 200, composition: [{ unite: raptors, nombre: 6 }] }
      - { id: huit, nom: 8 unités de Raptors, cout: 275, composition: [{ unite: raptors, nombre: 8 }] }
    options: [personnage_chaos, porte_icone, prince_demon]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
  - id: forlorn_hope
    nom: Forlorn Hope
    description: "0-1 par Suite de la BL"
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: forlorn_hope, nombre: 4 }
          - { unite: rhino_chaos, nombre: 2 }
    options: []
    contraintes: [{ type: consomme, budget: place_forlorn }]
  - id: compagnie_motos
    nom: Compagnie de Motos
    variantes:
      - { id: base, cout: 250, composition: [{ unite: motos_chaos, nombre: 8 }] }
    options: [personnage_chaos, porte_icone]
  - id: compagnie_blindee
    nom: Compagnie Blindée
    variantes:
      - { id: land_raiders, nom: 4 Land Raiders du Chaos, cout: 300, composition: [{ unite: land_raider_chaos, nombre: 4 }] }
      - { id: predators, nom: 4 Predators du Chaos, cout: 200, composition: [{ unite: predator_chaos, nombre: 4 }] }
    options: [stalker, vehicules_blindee]
  - id: compagnie_assaut
    nom: Compagnie d'Assaut
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 1, max: 3 }
              parmi: [{ unite: decimator, cout: 225 }]
              phrase_pdf: "1 à 3 Decimators"
    options: [defilers, stalker]

  # ---- Pool démoniaque ----
  - id: demons_mineurs
    nom: Démons Mineurs
    variantes:
      - id: base
        cout: 175
        composition:
          - choix:
