listes_test:
  - nom: "3000 pts valide, Suite en Rhinos, Élus en Dreadclaw, Forlorn Hope, démons et Titan Feral"
    limite: 3000
    attendu: valide
    formations:
      - formation: suite_bl
        options:
          - { option: personnage_chaos, choix: seigneur }
          - { option: porte_icone }
          - { option: marines_chaos, variante: berzerkers }
          - { option: transports, choix: rhinos, quantite: 6 }
      - formation: suite_elus
        choix: { "0": { elus_terminators_chaos: 6 } }
        options:
          - { option: personnage_chaos, choix: champion }
          - { option: prince_demon, choix: prince_demon_aile }
          - { option: obliterators, variante: deux }
          - { option: transports_elus, choix: dreadclaw }
      - { formation: forlorn_hope }
      - formation: culte_raptor
        variante: huit
        options: [{ option: porte_icone }]
      - formation: compagnie_blindee
        variante: land_raiders
        options:
          - { option: vehicules_blindee, variante: predators_lr2 }
          - { option: stalker }
      - formation: compagnie_assaut
        choix: { "0": { decimator: 1 } }
      - formation: demons_mineurs
        choix: { "0": { sanguinaires: 8 } }
        options: [{ option: demon_majeur, choix: buveur_sang }]
      - { formation: titan_feral }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_bl }
      - { formation: titan_banelord }
  - nom: "deux Cultes Raptor"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: suite_bl }
      - { formation: culte_raptor, variante: six }
      - { formation: culte_raptor, variante: huit }
  - nom: "Démon Majeur pris en formation et en amélioration"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_bl, options: [{ option: porte_icone }] }
      - formation: demons_mineurs
        choix: { "0": { sanguinaires: 8 } }
        options: [{ option: demon_majeur, choix: buveur_sang }]
      - formation: demon_majeur
        choix: { "0": { gardien_secrets: 1 } }
  - nom: "deux Forlorn Hope pour une seule Suite"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_bl }
      - { formation: forlorn_hope }
      - { formation: forlorn_hope }
  - nom: "formation démoniaque sans Porte-icône"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_bl }
      - formation: demons_mineurs
        choix: { "0": { incendiaires: 8 } }
  - nom: "Buveur de Sang ajouté à des Démonettes"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - { formation: suite_bl, options: [{ option: porte_icone }] }
      - formation: demons_mineurs
        choix: { "0": { demonettes: 8 } }
        options: [{ option: demon_majeur, choix: buveur_sang }]
