options:
  - id: personnage_chaos
    nom: Personnage du Chaos
    effet:
      type: choix
      parmi:
        - id: seigneur
          nom: Seigneur du Chaos
          cout: 50
          effet: { type: ajouter, unites: [{ unite: seigneur_chaos }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
        - { id: champion, nom: Champion Exalté du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: champion_exalte }] } }
        - { id: sorcier, nom: Sorcier du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: sorcier_chaos }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "1 des choix suivants : (0-1) Ajoutez un Seigneur du Chaos (50 pts) ou ajoutez un Champion Exalté du Chaos ou un Sorcier du Chaos (25 pts)"
    note_md: "Un seul Seigneur du Chaos par armée (Commandant Suprême)."
  - id: porte_icone
    nom: Porte-icône
    effet: { type: ajouter, cout: 25, unites: [{ unite: porte_icone }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: fournit, budget: place_demons, quantite: 1 }
    phrase_pdf: "Ajoutez un Porte-icône à l'une des unités de la formation"
    note_md: "Une formation du Pool Démoniaque peut être prise pour chaque amélioration Porte-icône de l'armée (règle Invocation de démons)."
  - id: prince_demon
    nom: Prince Démon
    effet:
      type: choix
      parmi:
        - id: prince_demon
          nom: Prince Démon
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon, lot: 1, max: 1, cout: 0 }
        - id: prince_demon_aile
          nom: Prince Démon Ailé
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon_aile, lot: 1, max: 1, cout: 0 }
    contraintes:
      - { type: max_par_armee, valeur: 2 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Remplacer le Seigneur du Chaos ou le Champion Exalté du Chaos et l'unité qu'il accompagne par un Prince Démon (ou un Prince Démon Ailé). S'il remplace le Seigneur du Chaos, il acquiert la capacité Commandant Suprême"
    note_md: "Nécessite un Seigneur du Chaos ou un Champion Exalté du Chaos dans la formation. L'unité que le personnage accompagnait est retirée avec lui. S'il remplace le Seigneur du Chaos, le Prince Démon devient Commandant Suprême."
  - id: demon_majeur
    nom: Démon Majeur
    effet:
      type: choix
      parmi:
        - id: buveur_sang
          nom: Buveur de Sang
          cout: 150
          effet: { type: ajouter, unites: [{ unite: buveur_sang }] }
          contraintes: [{ type: requiert_unite, unites: [sanguinaires] }]
        - id: duc_changement
          nom: Duc du Changement
          cout: 150
          effet: { type: ajouter, unites: [{ unite: duc_changement }] }
          contraintes: [{ type: requiert_unite, unites: [incendiaires] }]
        - id: grand_immonde
          nom: Grand Immonde
          cout: 150
          effet: { type: ajouter, unites: [{ unite: grand_immonde }] }
          contraintes: [{ type: requiert_unite, unites: [portepestes] }]
        - id: gardien_secrets
          nom: Gardien des Secrets
          cout: 150
          effet: { type: ajouter, unites: [{ unite: gardien_secrets }] }
          contraintes: [{ type: requiert_unite, unites: [demonettes] }]
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: consomme, budget: demon_majeur_unique }
