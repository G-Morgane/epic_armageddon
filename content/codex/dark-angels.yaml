      - "Transport (60+60+6) : Tactiques, Devastators, Marines d'Assaut, Scouts, Terminators, Dreadnoughts, Motos et Motos d'Assaut, plus 60 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 9 Thunderhawks et Thunderhawks Transporteurs. De plus, la Barge de Bataille peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."

  # ---- Légions Titaniques : importées par l'alliance avec adeptus-titanicus ----

options:
  - id: commandant
    nom: Commandant
    effet:
      type: choix
      parmi:
        - { id: capitaine, nom: Capitaine, cout: 50, effet: { type: ajouter, unites: [{ unite: capitaine }] } }
        - { id: archiviste, nom: Archiviste, cout: 50, effet: { type: ajouter, unites: [{ unite: archiviste }] } }
        - { id: chapelain, nom: Chapelain, cout: 50, effet: { type: ajouter, unites: [{ unite: chapelain }] } }
        - id: maitre_chapitre
          nom: Maître de Chapitre
          cout: 50
          effet: { type: ajouter, unites: [{ unite: maitre_chapitre }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Capitaine ou un Archiviste ou un Chapelain (Remplacer un Capitaine par 0-1 Maître de Chapitre, gratuit)"
    note_md: "Un seul Maître de Chapitre par armée (Commandant Suprême). Règle Chapelain Investigateur : un Chapelain pris dans une formation de la Deathwing gagne gratuitement la note Sans Peur."
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 0, cible: [terminators, terminators_assaut] }
    contraintes: [{ type: obligatoire }, { type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Téléportation aux unités d'infanterie de la formation"
    note_md: "Comprise dans le coût des formations Terminator et Chevaliers de la Deathwing (« + téléportation »)."
  - id: sniper
    nom: Sniper
    effet: { type: mot_cle, texte: Sniper, cout: 50, cible: [scouts] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Les Bolters lourds des unités de Scouts reçoivent la Note Sniper"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorback
    nom: Razorback
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à autant de Razorbacks Bolters Lourds ou de Razorbacks Canons Laser que d'unités à transporter"
  - id: dreadnought
    nom: Dreadnought
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: dreadnought, cout: 50 }
        - { unite: dreadnought_feu_enfer, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Dreadnoughts à la formation selon n'importe quelle combinaison : Dreadnought, Dreadnought Feu d'enfer"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: predator_annihilator, cout: 65 }
        - { unite: predator_destructor, cout: 65 }
        - { unite: vindicator, cout: 65 }
        - { unite: land_raider, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 véhicules blindés à la formation selon n'importe quelle combinaison : Predators Annihilator, Predators Destructor, Vindicators (65 pts chacun), Land Raiders (75 pts chacun)"
  - id: vindicator
    nom: Vindicator
    effet: { type: ajouter, cout_par_unite: 65, unites: [{ unite: vindicator }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Vindicators à la formation"
  - id: tornado_typhoon
    nom: Tornado / Typhoon
    effet: { type: mot_cle, texte: "Land Speeders Tornado et Typhoon au choix dans la composition", cout: 0, cible: [land_speeder, land_speeder_tornado, land_speeder_typhoon] }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation peut contenir des Land Speeders selon n'importe quelle combinaison : remplacer des unités par autant de Land Speeders Tornado (5 pts chacun) ou de Land Speeders Typhoon (15 pts chacun)"
    note_md: "Porté par la composition de la formation Land Speeders (5 unités parmi Land Speeder 0 pt, Tornado 5 pts, Typhoon 15 pts) ; cette ligne ne sert qu'à l'affichage du tableau."
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Module d'atterrissage à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage, tout: true, par_nombre: 1, cout: 0 }
          contraintes: [{ type: exclut, options: [razorback, hunter, support_lourd] }]
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par un Module d'atterrissage"
    note_md: "Règle spéciale Transports : une formation contenant des unités ne pouvant pas être déployées en Module d'atterrissage (Razorbacks, Hunter, Support Lourd) ne peut pas choisir le Module. Interdit aux détachements de Scouts."

formations:
  # ---- 1ère Compagnie : Deathwing ----
  - id: terminator
    nom: Terminator
    variantes:
      - { id: base, cout: 350, composition: [{ unite: terminators, nombre: 4 }] }
    options: [commandant, teleportation]
    contraintes: [{ type: fournit, budget: soutien_1ere, quantite: 1 }]
    phrase_pdf: "4 unités de Terminator + téléportation"
  - id: chevaliers_deathwing
    nom: Chevaliers de la Deathwing
    variantes:
      - { id: base, cout: 325, composition: [{ unite: terminators_assaut, nombre: 4 }] }
    options: [commandant, teleportation]
    phrase_pdf: "4 unités de Terminator d'assaut + téléportation"
  - id: land_raiders
    nom: Land Raiders
    variantes:
      - { id: base, cout: 350, composition: [{ unite: land_raider, nombre: 4 }] }
    options: [commandant, vindicator]

  # ---- 2ème Compagnie : Ravenwing ----
  - id: motos
    nom: Motos
    variantes:
      - id: base
        cout: 225
        composition:
          - choix:
              total: 5
              parmi: [{ unite: motos, cout: 0 }, { unite: motos_assaut, cout: 0 }]
              phrase_pdf: "5 Motos et/ou Motos d'assaut"
    options: [commandant]
    contraintes: [{ type: fournit, budget: soutien_2eme, quantite: 2 }]
  - id: land_speeders
    nom: Land Speeders
    variantes:
      - id: base
        cout: 225
        composition:
          - choix:
              total: 5
              parmi: [{ unite: land_speeder, cout: 0 }, { unite: land_speeder_tornado, cout: 5 }, { unite: land_speeder_typhoon, cout: 15 }]
              phrase_pdf: "5 Land Speeders"
    options: [commandant, tornado_typhoon]
  - id: nephilim
    nom: Nephilim
    variantes:
      - { id: base, cout: 225, composition: [{ unite: chasseur_nephilim, nombre: 2 }] }
    options: []
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    phrase_pdf: "2 Chasseurs Nephilim (compte dans le ⅓ de support)"

  # ---- Autres Compagnies ----
  - id: tactique
    nom: Tactique
    variantes:
      - id: base
        cout: 275
        composition:
          - { unite: tactiques, nombre: 6 }
          - { transports: { unite: rhino } }
    options: [commandant, dreadnought, razorback, hunter, support_lourd, transport_remplacement]
    contraintes: [{ type: fournit, budget: soutien_autres, quantite: 3 }]
  - id: devastator
    nom: Devastator
    variantes:
      - id: base
        cout: 250
        composition:
          - { unite: devastators, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [commandant, dreadnought, razorback, hunter, support_lourd, transport_remplacement]
  - id: assaut
    nom: Assaut
    variantes:
      - { id: base, cout: 175, composition: [{ unite: marines_assaut, nombre: 4 }] }
    options: [commandant]
  - id: scouts
    nom: Scouts
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: scouts, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [commandant, razorback, sniper]
  - id: predators
    nom: Predators
    variantes:
      - { id: destructor, nom: 4 Predators Destructor, cout: 225, composition: [{ unite: predator_destructor, nombre: 4 }] }
      - { id: annihilator, nom: 4 Predators Annihilator, cout: 275, composition: [{ unite: predator_annihilator, nombre: 4 }] }
    options: [commandant, vindicator]
  - id: vindicators
    nom: Vindicators
    variantes:
      - { id: base, cout: 250, composition: [{ unite: vindicator, nombre: 4 }] }
    options: [commandant]
  - id: whirlwinds
    nom: Whirlwinds
    variantes:
      - { id: base, cout: 300, composition: [{ unite: whirlwind, nombre: 4 }] }
    options: [commandant, hunter]

  # ---- Supports : Flotte Dark Angels ----
  - id: thunderhawks_transporteurs
    nom: Thunderhawks transporteurs
    variantes:
      - { id: deux, nom: 2 Thunderhawks transporteurs, cout: 300, composition: [{ unite: thunderhawk_transporteur, nombre: 2 }] }
      - { id: trois, nom: 3 Thunderhawks transporteurs, cout: 450, composition: [{ unite: thunderhawk_transporteur, nombre: 3 }] }
    phrase_pdf: "2 Thunderhawks transporteurs (Ajouter 1 Thunderhawk transporteur : +150 pts)"
  - id: thunderhawk
    nom: Thunderhawk
    variantes:
      - { id: base, cout: 225, composition: [{ unite: thunderhawk, nombre: 1 }] }
  - id: barge_debarquement
    nom: Barge de débarquement
    variantes:
      - { id: base, cout: 400, composition: [{ unite: barge_debarquement, nombre: 1 }] }
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur d'attaque, cout: 200, composition: [{ unite: croiseur_attaque, nombre: 1 }] }
      - { id: barge_bataille, nom: 1 Barge de bataille, cout: 350, composition: [{ unite: barge_bataille, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    phrase_pdf: "0-1 Soutien Orbital"

sections:
  - id: deathwing
    titre: "1ère COMPAGNIE DARK ANGEL : DEATHWING"
    formations: [terminator]
    colonne_options: true
    notes:
      chapelain_investigateur: "Règle spéciale Chapelain Investigateur : les personnages de Chapelain de la Deathwing gagnent gratuitement la note Sans Peur."
  - id: soutien_1ere
    titre: DÉTACHEMENTS DE SOUTIEN DE LA 1ère COMPAGNIE
    formations: [chevaliers_deathwing, land_raiders]
    contraintes: [{ type: consomme, budget: soutien_1ere }]
    colonne_options: true
  - id: ravenwing
    titre: "2ème COMPAGNIE DARK ANGEL : RAVENWING"
    formations: [motos]
    colonne_options: true
    notes:
      ravenwing: "Règle spéciale Ravenwing : les unités au sol appartenant aux formations de la Ravenwing gagnent les notes Sauvegarde Invulnérable, Marcheur et Balise de Téléportation."
  - id: soutien_2eme
    titre: DÉTACHEMENTS DE SOUTIEN DE LA 2ème COMPAGNIE
    formations: [land_speeders, nephilim]
    contraintes: [{ type: consomme, budget: soutien_2eme }]
    colonne_options: true
    notes:
      ravenwing: "Règle spéciale Ravenwing : les unités au sol appartenant aux formations de la Ravenwing gagnent les notes Sauvegarde Invulnérable, Marcheur et Balise de Téléportation. Le Nephilim compte aussi dans le ⅓ des points réservé aux Supports."
  - id: autres_compagnies
    titre: AUTRES COMPAGNIES DARK ANGELS
    formations: [tactique]
    colonne_options: true
  - id: soutien_autres
    titre: DÉTACHEMENTS DE SOUTIEN DES AUTRES COMPAGNIES
    formations: [devastator, assaut, scouts, predators, vindicators, whirlwinds]
    contraintes: [{ type: consomme, budget: soutien_autres }]
    colonne_options: true
    # Tableau unique des améliorations du PDF : `options` reprend toutes les améliorations dans l'ordre du PDF
    # (chaque formation garde sa propre liste `options`, cette liste ne sert qu'au tableau).
    options: [commandant, teleportation, sniper, hunter, razorback, dreadnought, support_lourd, vindicator, tornado_typhoon, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS DARK ANGELS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement"
  - id: flotte
    titre: FLOTTE DARK ANGELS
    sous_titre: "SUPPORTS DARK ANGELS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [thunderhawks_transporteurs, thunderhawk, barge_debarquement, soutien_orbital]
  - id: titanicus
    titre: SOUTIENS DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS DARK ANGELS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: adeptus-titanicus }
    notes:
      sans_peur: "Les formations prises en Soutien des Légions Titaniques ne bénéficient pas de la règle « Et ils ne connaîtront pas la peur »."

listes_test:
  - nom: "3000 pts valide, Deathwing, Ravenwing et un Warhound"
    limite: 3000
    attendu: valide
    formations:
      - formation: terminator
        options: [{ option: teleportation }, { option: commandant, choix: capitaine }]
      - formation: chevaliers_deathwing
        options: [{ option: teleportation }]
      - formation: motos
        choix: { "0": { motos: 3, motos_assaut: 2 } }
        options: [{ option: commandant, choix: chapelain }]
      - formation: land_speeders
        choix: { "0": { land_speeder: 3, land_speeder_tornado: 1, land_speeder_typhoon: 1 } }
      - { formation: nephilim }
      - formation: tactique
        options:
          - { option: commandant, choix: maitre_chapitre }
          - { option: dreadnought, repartition: { dreadnought: 1, dreadnought_feu_enfer: 1 } }
          - { option: razorback, repartition: { razorback_canons_laser: 1 } }
          - { option: hunter }
      - formation: devastator
        options: [{ option: support_lourd, repartition: { land_raider: 1 } }]
      - formation: scouts
        options:
          - { option: sniper }
          - { option: razorback, repartition: { razorback_bolters_lourds: 2 } }
      - { formation: titan_warhound }
  - nom: "2000 pts valide, Module d'atterrissage et Flotte"
    limite: 2000
    attendu: valide
    formations:
      - formation: tactique
        options: [{ option: transport_remplacement, choix: module_atterrissage }]
      - formation: devastator
        options:
          - { option: transport_remplacement, choix: dreadnought }
          - { option: commandant, choix: archiviste }
      - { formation: assaut }
      - { formation: predators, variante: annihilator }
      - { formation: thunderhawks_transporteurs, variante: trois }
      - { formation: soutien_orbital, variante: croiseur }
  - nom: "deux soutiens de la Deathwing pour une seule formation Terminator"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: terminator, options: [{ option: teleportation }] }
      - { formation: chevaliers_deathwing, options: [{ option: teleportation }] }
      - { formation: land_raiders }
  - nom: "quatre soutiens pour une seule formation Tactique"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: tactique }
      - { formation: devastator }
      - { formation: assaut }
      - { formation: scouts }
      - { formation: predators, variante: destructor }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: tactique }
      - { formation: titan_warlord }
  - nom: "deux Maîtres de Chapitre"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: tactique, options: [{ option: commandant, choix: maitre_chapitre }] }
      - { formation: devastator, options: [{ option: commandant, choix: maitre_chapitre }] }
