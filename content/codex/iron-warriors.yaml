# Iron Warriors, transcrit depuis le PDF EAFR rev 1.5 (source de vérité).
codex:
  slug: iron-warriors
  armee_id: bcf87fcf-c529-4a37-9751-18bf8d8d487c
  nom: Iron Warriors
  version: "1.5"
  faction: chaos
  categorie: armees-chaos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/iron-warriors.jpg
  couleur: "#4A4B4D"
  citation:
    texte: "Les remords sur l'âme, comme la rouille sur le fer ; tous deux les dégradent et les consument, les rongent et s'y infiltrent, jusqu'à dévorer enfin le cœur et la substance même du métal. Si le monde entier vous déteste, et vous croit mauvais, tant que votre conscience vous absout du remords, vous ne serez pas sans amis."
    auteur: Le Primarque Perturabo
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée d'Iron Warriors, les maîtres des sièges.

    Ils honorent les Dieux du Chaos en tant que panthéon sans être des dévots. Leur loyauté va avant tout à Perturabo, leur Primarque, qui est censé leur avoir épargné d'être sacrifiés par le Faux Empereur.

    Les armées des Iron Warriors sont organisées en formations appelées détachements. Une armée des Iron Warriors doit obligatoirement comporter une suite d'Iron Warriors. Chaque suite d'Iron Warriors permet de prendre jusqu'à trois suites de spécialistes Iron Warriors différentes.

    Chaque détachement et suite de spécialistes peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement pour un maximum de quatre par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations du Soutien Titanique sont des formations autonomes des détachements. Elles ne peuvent jamais recevoir d'améliorations, sauf s'il en existe d'indiquées explicitement dans leur profil. Un maximum d'⅓ des points de l'armée peuvent être dépensés pour ces formations.

    La mention Space Marines du Chaos indiquée dans les notes des unités ayant la capacité « Transport » englobe les unités Space Marines du Chaos, Havocs, Sapeurs Iron Warriors et Forlorn Hopes.
  regles_md:
    - titre: "Règle spéciale : Maîtres de Siège"
      texte: |
        Les suites d'Iron Warriors et de Havocs peuvent échanger chaque Rhino par 4 cm de Position Fortifiée de type Ligne de défense(2) et 4 cm de Barbelés. Ces formations devront se déployer en garnison ou dans la zone de déploiement lors de la phase de déploiement et ne pourront être conservées en réserve d'aucune sorte.

        De plus, pour 50 pts, vous pouvez remplacer les Lignes de défense d'une formation par autant de Bunkers(2).

        **Positions Fortifiées Iron Warriors**, dans l'ordre Infanterie / Véhicule / Engin de Guerre :

        - Ligne de défense(2)* : Couvert 4+ / Dangereux / Sans effet.
        - Bunkers(2)* : Couvert 3+ / Infranchissable / Infranchissable.
        - Barbelés : Dangereux / Sans effet / Sans effet.

        *les (X) indiquent le nombre d'unités maximum pouvant occuper ces fortifications par tronçon de 4 cm de longueur.
    - titre: "Règle spéciale : Positions Fortifiées"
      texte: |
        Une Position Fortifiée est un élément de terrain du type suivant : Lignes de défense ou Fortification/Bunker. Leur forme peut varier selon la conception des maîtres architectes, mais leur surface ne doit jamais permettre d'accueillir plus d'unités tel que décrit par le nombre entre parenthèses dans leur codex (par exemple « Bunker(3) » décrit un bunker pouvant accueillir 3 unités d'infanterie au maximum). Si la combinaison de la topologie de la Position Fortifiée et des socles des unités ne permet de contenir toutes les unités autorisées, alors ces dernières seront tout de même considérées comme à l'intérieur et les mesures se feront toutes depuis les bords de la Position Fortifiée. La longueur totale des Positions Fortifiées déployées par une formation ne devra jamais excéder son nombre de fois 4 cm.

        Les Positions Fortifiées suivent les règles de couvert tel que décrit page 12 du livre de règle et bloquent les lignes de vue normalement. Les Barbelés pouvant accompagner les Positions Fortifiées suivent les mêmes règles mais ne bloquent pas les lignes de vue et leur longueur totale ne doit pas excéder celle des Positions Fortifiées et seront déployées au même moment.

        Le joueur ayant la valeur stratégique la plus forte décide quel joueur déploie son premier set de Positions Fortifiées en alternance. Les Positions Fortifiées doivent être placées après les Objectifs, mais avant que les Vaisseaux Spatiaux et les Garnisons ne se déploient. Elles peuvent être placées partout où pourrait l'être un véhicule, dans la moitié de table du joueur actif. Bien qu'elles soient des éléments de terrains, les Positions Fortifiées doivent respecter les règles de cohésion de formation entre elles (par exemple, vous pouvez diviser les tranchées en plusieurs éléments, du moment qu'il y a un espace maximum de 5 cm entre chaque élément). Les Barbelés n'ont pas à être disposés en cohésion avec vos Positions Fortifiées, mais doivent respecter la cohésion entre eux.

        Une fois positionnées, les Positions Fortifiées sont considérées comme un élément de terrain neutre et toute unité ayant la capacité à finir son mouvement à l'intérieur pourra l'occuper.
    - titre: "Règle spéciale : Modules d'atterrissage Dreadclaw"
      texte: |
        Une formation se déployant par Assaut Planétaire et pouvant être transportée par Modules d'atterrissage Dreadclaw le fait selon les règles spéciales suivantes :

        Placez un marqueur de Module d'atterrissage en utilisant les règles d'Assaut Planétaire (4.3 et 4.4 du Livre de Règles). Un Vaisseau en orbite sera nécessaire pour déployer les Modules d'atterrissage.

        Le Module d'atterrissage est un marqueur comptant comme la première unité de la formation au moment de déterminer son emplacement d'arrivée en Assaut Planétaire. Une fois le marqueur de Module d'atterrissage placé, résolvez son attaque de tir sur toutes les unités ennemies à moins de 15 cm du centre du Module d'atterrissage. Chaque formation ennemie attaquée reçoit un Pion Impact selon les règles normales de tir.

        Ensuite, débarquez les troupes transportées dans le Module d'atterrissage (cela peut déclencher un tir d'État d'Alerte normalement) complètement à moins de 15 cm du centre de celui-ci, en cohésion et en dehors de toute zone de contrôle ennemie. Si les unités ne peuvent débarquer en totalité en respectant les règles ci-dessus, les unités restantes seront détruites sans attribution de pions d'impacts.

        Le Module d'atterrissage n'étant pas une unité mais un marqueur, il ne possède pas de zone de contrôle et il ne compte pas pour la cohérence de la formation. De plus, il ne peut pas être utilisé pour revendiquer un feu croisé ainsi que pour tenir ou contester des objectifs.

        Si plusieurs formations utilisent des Modules d'atterrissage, placez tous les marqueurs Module d'atterrissage aux coordonnées prédéterminées en utilisant les règles d'Assaut Planétaire (y compris la résolution de dispersion). Une fois que tous les marqueurs sont placés, résolvez toutes les attaques des Modules d'atterrissage simultanément contre les formations ennemies à portée des marqueurs Module d'atterrissage. Les formations visées recevront un pion impact pour le tir pour chaque attaque du vaisseau ou des modules d'atterrissage. Les pertes et les tirs ruptures infligent des PI normalement. Puis débarquez toutes les formations transportées, en suivant les règles ci-dessus.
