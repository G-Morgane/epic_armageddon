      - Sans Peur
      - "Peut passer au-dessus d'unités et de terrains infranchissables ou dangereux moins hauts que les genoux du titan et de 2cm de large maximum"
    degats: { cd: 8, bi: 6, critique: "Le réacteur à plasma se fissure. Lancez 1D6 durant la phase finale de chaque tour pour chaque fissure : 1 : le réacteur explose, toute unité dans un rayon de 5cm subit une touche sur 5+ ; 2-3 : le Banelord entre dans une rage démoniaque et bouge immédiatement de 3D6cm dans une direction aléatoire, s'il percute un terrain infranchissable ou une unité qu'il ne peut pousser, il s'arrête et subit un point de dommages supplémentaire, les unités qu'il percute subissent une touche sur un résultat de 4+ ; 4-6 : la fissure est réparée" }

options:
  - id: personnage_chaos
    nom: Personnage du Chaos
    effet:
      type: choix
      parmi:
        - id: seigneur
          nom: Seigneur du Chaos
          cout: 50
          effet: { type: ajouter, unites: [{ unite: seigneur_chaos }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
        - { id: champion, nom: Champion Exalté du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: champion_exalte }] } }
        - { id: sorcier, nom: Sorcier du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: sorcier_chaos }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez (0-1) Seigneur du Chaos (50 pts) ou ajoutez un Champion Exalté du Chaos ou un Sorcier du Chaos (25 pts)"
    note_md: "Un seul Seigneur du Chaos par armée (Commandant Suprême)."
  - id: prince_demon
    nom: Prince Démon
    effet:
      type: choix
      parmi:
        - id: prince_demon
          nom: Prince Démon
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon, lot: 1, max: 1, cout: 0 }
        - id: prince_demon_aile
          nom: Prince Démon Ailé
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon_aile, lot: 1, max: 1, cout: 0 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Remplacez le Seigneur du Chaos ou un Champion Exalté du Chaos par un Prince Démon ou Prince Démon Ailé. S'il remplace le Seigneur du Chaos, il acquiert la capacité Commandant Suprême"
    note_md: "0-1 par armée. Nécessite un Seigneur du Chaos ou un Champion Exalté du Chaos dans la formation."
  - id: obliterators
    nom: Obliterators
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: un, nom: 1 Obliterator, cout: 75, unites: [{ unite: obliterators, nombre: 1 }] }
        - { id: deux, nom: 2 Obliterators, cout: 125, unites: [{ unite: obliterators, nombre: 2 }] }
        - { id: trois, nom: 3 Obliterators, cout: 200, unites: [{ unite: obliterators, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez jusqu'à 3 unités d'Obliterators à la formation (75 pts chacun, 125 pts les 2)"
  - id: havocs
    nom: Havocs
    effet: { type: ajouter, cout: 150, unites: [{ unite: havocs, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 4 unités de Havocs à la formation"
  - id: transports_elus
    nom: Transports Élus
    effet:
      type: choix
      parmi:
        - id: dreadclaw
          nom: Dreadclaw
          cout: 50
          effet: { type: ajouter, unites: [{ unite: dreadclaw }] }
          contraintes: [{ type: exclut, options: [defilers, stalker, support_lourd, land_raiders] }]
        - id: teleportation
          nom: Téléportation
          cout: 50
          effet: { type: mot_cle, texte: Téléportation, cible: [elus_terminators_chaos] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez un Dreadclaw pour transporter toute la formation ou donnez le mot-clé Téléportation aux Élus Terminators du Chaos"
    note_md: "Le Dreadclaw ne transporte que l'infanterie (sauf motos) et les Dreadnoughts : une formation comprenant des Defilers, un Stalker, du Support Lourd ou des Land Raiders ne peut pas le choisir."
  - id: transports
    nom: Transports
    effet:
      type: choix
      parmi:
        - id: dreadclaw
          nom: Dreadclaw
          cout: 50
          effet: { type: ajouter, unites: [{ unite: dreadclaw }] }
          contraintes: [{ type: exclut, options: [defilers, stalker, support_lourd, land_raiders] }]
        - id: rhinos
          nom: Rhinos du Chaos
          cout: 50
          effet: { type: ajouter, unites: [{ unite: rhino_chaos }], cout_par_unite: 0, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez suffisamment de Rhinos du Chaos ou de Dreadclaws pour transporter une Suite d'Iron Warriors ou de Sapeurs Iron Warriors"
    note_md: "Prix forfaitaire de 50 pts quel que soit le nombre de Rhinos. Le Dreadclaw ne transporte que l'infanterie (sauf motos) et les Dreadnoughts : une formation comprenant des Defilers, un Stalker, du Support Lourd ou des Land Raiders ne peut pas le choisir."
  - id: dreadnoughts
    nom: Dreadnoughts
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: dreadnought_chaos }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez jusqu'à 4 Dreadnoughts du Chaos à la formation (50 pts chacun)"
  - id: defilers
    nom: Defilers
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: un, nom: 1 Defiler, cout: 75, unites: [{ unite: defiler, nombre: 1 }] }
        - { id: deux, nom: 2 Defilers, cout: 125, unites: [{ unite: defiler, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 Defiler à la formation (75 pts) ou ajoutez-en 2 (125 pts)"
  - id: stalker
    nom: Stalker
    effet: { type: ajouter, cout: 50, unites: [{ unite: stalker }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 Stalker à la formation"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: vindicators, nom: 2 Vindicators du Chaos, cout: 75, unites: [{ unite: vindicator_chaos, nombre: 2 }] }
        - { id: predators, nom: 2 Predators du Chaos, cout: 75, unites: [{ unite: predator_chaos, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 2 Vindicators du Chaos ou 2 Predators du Chaos à la formation"
  - id: land_raiders
    nom: Land Raiders
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: un, nom: 1 Land Raider du Chaos, cout: 75, unites: [{ unite: land_raider_chaos, nombre: 1 }] }
        - { id: deux, nom: 2 Land Raiders du Chaos, cout: 125, unites: [{ unite: land_raider_chaos, nombre: 2 }] }
        - { id: trois, nom: 3 Land Raiders du Chaos, cout: 200, unites: [{ unite: land_raider_chaos, nombre: 3 }] }
        - { id: quatre, nom: 4 Land Raiders du Chaos, cout: 250, unites: [{ unite: land_raider_chaos, nombre: 4 }] }
        - { id: cinq, nom: 5 Land Raiders du Chaos, cout: 325, unites: [{ unite: land_raider_chaos, nombre: 5 }] }
        - { id: six, nom: 6 Land Raiders du Chaos, cout: 400, unites: [{ unite: land_raider_chaos, nombre: 6 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez jusqu'à 6 Land Raiders du Chaos à la formation (75 pts chacun, 125 pts les 2)"

formations:
  # ---- Détachements ----
  - id: suite_iron_warriors
    nom: Suite d'Iron Warriors
    description: "1+ par armée"
    variantes:
      - { id: base, cout: 250, composition: [{ unite: space_marines_chaos, nombre: 8 }] }
    options: [personnage_chaos, prince_demon, havocs, obliterators, dreadnoughts, defilers, transports, stalker, support_lourd, land_raiders]
    contraintes:
      - { type: min_par_armee, valeur: 1 }
      - { type: fournit, budget: place_havocs, quantite: 1 }
      - { type: fournit, budget: place_sapeurs, quantite: 1 }
      - { type: fournit, budget: place_forlorn, quantite: 1 }
  - id: suite_elus_terminators
    nom: Suite d'Élus Terminators Iron Warriors
    description: "0-2 par armée"
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 4, max: 6 }
              parmi: [{ unite: elus_terminators_chaos, cout: 50 }]
              phrase_pdf: "4 à 6 unités d'Élus Terminators du Chaos"
    options: [personnage_chaos, prince_demon, obliterators, dreadnoughts, defilers, transports_elus, stalker, support_lourd, land_raiders]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: suite_obliterator
    nom: Suite d'Obliterator
    description: "0-1 par armée"
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 4, max: 6 }
              parmi: [{ unite: obliterators, cout: 75 }]
              phrase_pdf: "4 à 6 unités d'Obliterators"
    options: []
    contraintes: [{ type: max_par_armee, valeur: 1 }]
  - id: compagnie_marcheurs_siege
    nom: Compagnie de Marcheurs de Siège
    variantes:
      - { id: base, cout: 275, composition: [{ unite: dreadnought_chaos, nombre: 6 }] }
    options: []
  - id: detachement_defilers
    nom: Defilers
    variantes:
      - { id: base, cout: 300, composition: [{ unite: defiler, nombre: 4 }] }
    options: [defilers]
  - id: artillerie_iron_warriors
    nom: Artillerie Iron Warriors
    variantes:
      - { id: base, cout: 225, composition: [{ unite: basilisk, nombre: 3 }] }
    options: []
  - id: compagnie_blindee
    nom: Compagnie Blindée
    variantes:
      - { id: land_raiders, nom: 4 Land Raiders du Chaos, cout: 300, composition: [{ unite: land_raider_chaos, nombre: 4 }] }
      - { id: predators, nom: 4 Predators du Chaos, cout: 200, composition: [{ unite: predator_chaos, nombre: 4 }] }
    options: [stalker, support_lourd, land_raiders]
  - id: compagnie_assaut
    nom: Compagnie d'Assaut
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 1, max: 3 }
              parmi: [{ unite: decimator, cout: 225 }]
              phrase_pdf: "De 1 à 3 Decimators"
    options: [defilers, stalker]

  # ---- Suites de spécialistes ----
  - id: suite_havocs
    nom: Suite d'Havocs
    variantes:
      - { id: base, cout: 350, composition: [{ unite: havocs, nombre: 8 }] }
    options: [personnage_chaos, prince_demon, havocs, obliterators, dreadnoughts, defilers, transports, stalker, support_lourd, land_raiders]
    contraintes: [{ type: consomme, budget: place_havocs }]
  - id: suite_sapeurs
    nom: Suite de Sapeurs
    variantes:
      - { id: base, cout: 250, composition: [{ unite: sapeurs_iron_warriors, nombre: 8 }] }
    options: [personnage_chaos, prince_demon, havocs, obliterators, dreadnoughts, defilers, transports, stalker, support_lourd, land_raiders]
    contraintes: [{ type: consomme, budget: place_sapeurs }]
  - id: suite_forlorn_hope
    nom: Suite de Forlorn Hope
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: forlorn_hope, nombre: 4 }
          - { unite: rhino_chaos, nombre: 2 }
    options: []
    contraintes: [{ type: consomme, budget: place_forlorn }]

  # ---- Supports : Flotte de guerre du Chaos ----
  - id: escadrille_intercepteurs
    nom: Escadrille d'Intercepteurs Hellblade
    variantes:
      - { id: base, cout: 200, composition: [{ unite: hellblade, nombre: 3 }] }
  - id: escadrille_chasseurs_bombardiers
    nom: Escadrille de Chasseurs-Bombardiers Helltalon
    variantes:
      - { id: base, cout: 225, composition: [{ unite: helltalon, nombre: 2 }] }
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur Devastation, cout: 200, composition: [{ unite: croiseur_devastation, nombre: 1 }] }
      - { id: cuirasse, nom: 1 Cuirassé Despoiler, cout: 250, composition: [{ unite: cuirasse_despoiler, nombre: 1 }] }
    contraintes: [{ type: pas_une_activation }]

  # ---- Supports : Soutien titanique des Légions Renégates ----
  - id: titan_feral
    nom: Titan Feral
    variantes:
      - { id: base, cout: 300, composition: [{ unite: titan_feral, nombre: 1 }] }
  - id: titan_ravager
    nom: Titan Ravager
    variantes:
      - { id: base, cout: 650, composition: [{ unite: titan_ravager, nombre: 1 }] }
  - id: titan_banelord
    nom: Titan Banelord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: titan_banelord, nombre: 1 }] }

sections:
  - id: detachements
    titre: DÉTACHEMENTS DES IRON WARRIORS
    sous_titre: "Une armée des Iron Warriors doit comporter au moins une suite d'Iron Warriors"
    formations: [suite_iron_warriors, suite_elus_terminators, suite_obliterator, compagnie_marcheurs_siege, detachement_defilers, artillerie_iron_warriors, compagnie_blindee, compagnie_assaut]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DES IRON WARRIORS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 4 améliorations"
  - id: specialistes
    titre: SUITES DE SPÉCIALISTES DES IRON WARRIORS
    sous_titre: "Jusqu'à 3 suites de spécialistes différentes par suite d'Iron Warriors"
    formations: [suite_havocs, suite_sapeurs, suite_forlorn_hope]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
  - id: flotte
    titre: FLOTTE DE GUERRE DU CHAOS
    sous_titre: "SUPPORTS IRON WARRIORS"
    formations: [escadrille_intercepteurs, escadrille_chasseurs_bombardiers, soutien_orbital]
    contraintes:
      - { type: consomme, budget: rare, quoi: points }
      - { type: initiative, valeur: "2+" }
  - id: titans_renegats
    titre: SOUTIEN TITANIQUE DES LÉGIONS RENÉGATES
    sous_titre: "SUPPORTS IRON WARRIORS"
    formations: [titan_feral, titan_ravager, titan_banelord]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts valide : suite en Rhinos, spécialistes, Élus en Téléportation et Titan Feral"
    limite: 3000
    attendu: valide
    formations:
      - formation: suite_iron_warriors
        options:
          - { option: personnage_chaos, choix: seigneur }
          - { option: transports, choix: rhinos, quantite: 4 }
          - { option: support_lourd, variante: predators }
          - { option: stalker }
      - formation: suite_havocs
        options:
          - { option: obliterators, variante: deux }
          - { option: dreadnoughts, quantite: 2 }
      - formation: suite_sapeurs
        options:
          - { option: transports, choix: rhinos, quantite: 4 }
      - { formation: suite_forlorn_hope }
      - formation: suite_elus_terminators
        choix: { "0": { elus_terminators_chaos: 6 } }
        options:
          - { option: personnage_chaos, choix: champion }
          - { option: prince_demon, choix: prince_demon_aile }
          - { option: transports_elus, choix: teleportation }
      - { formation: artillerie_iron_warriors }
      - formation: compagnie_blindee
        variante: predators
        options: [{ option: stalker }]
      - { formation: titan_feral }
  - nom: "armée sans Suite d'Iron Warriors"
    limite: 3000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: compagnie_blindee, variante: predators }
      - { formation: artillerie_iron_warriors }
  - nom: "supports titaniques au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_iron_warriors }
      - { formation: titan_banelord }
  - nom: "deux Suites d'Havocs pour une seule Suite d'Iron Warriors"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_iron_warriors }
      - { formation: suite_havocs }
      - { formation: suite_havocs }
  - nom: "trois Suites d'Élus Terminators"
    limite: 5000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: suite_iron_warriors }
      - { formation: suite_elus_terminators, choix: { "0": { elus_terminators_chaos: 4 } } }
      - { formation: suite_elus_terminators, choix: { "0": { elus_terminators_chaos: 4 } } }
      - { formation: suite_elus_terminators, choix: { "0": { elus_terminators_chaos: 4 } } }
  - nom: "cinq améliorations sur une Suite d'Iron Warriors"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: suite_iron_warriors
        options:
          - { option: personnage_chaos, choix: sorcier }
          - { option: stalker }
          - { option: support_lourd, variante: vindicators }
          - { option: land_raiders, variante: deux }
          - { option: dreadnoughts, quantite: 1 }
  - nom: "Dreadclaw dans une formation dotée de Land Raiders"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: suite_iron_warriors
        options:
          - { option: land_raiders, variante: un }
          - { option: transports, choix: dreadclaw }
