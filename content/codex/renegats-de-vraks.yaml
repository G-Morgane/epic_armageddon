sections:
  - id: principales
    titre: FORMATIONS PRINCIPALES VRAKSIENNES
    formations: [milice_renegate, milice_ouvriere, populace_mutante, compagnie_blindee]
    contraintes:
      - { type: max_options, valeur: 4 }
      - { type: fournit, budget: appui, quantite: 2 }
      - { type: fournit, budget: appui_chaos, quantite: 1 }
    options: [archi_heretique_opt, loge_psychique, soutien_infanterie, appuis_feux, brutes_ogryns, chiens_chaos, flak_renegate, soutien_blinde, transport_chimere]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DES RENÉGATS DE VRAKS
      sous_titre: "Chaque amélioration ne peut être prise qu'une fois par formation, pour un maximum de quatre"
    notes:
      embarquement: "Si l'unité est transportée par Chimère, ajouter autant de Chimères que nécessaire pour le transport de l'unité (+25 pts par Chimère)."
  - id: appui_vraksiennes
    titre: FORMATIONS D'APPUI VRAKSIENNES
    sous_titre: FORMATIONS DE SOUTIEN RENÉGATES
    formations: [disciples_xaphan, escadron_reconnaissance, escadron_chasseurs_chars, peloton_hellhounds, batterie_artillerie, batterie_artillerie_lourde, batterie_antiaerienne]
    contraintes: [{ type: consomme, budget: appui }, { type: max_options, valeur: 4 }]
    options: [archi_heretique_opt, loge_psychique, soutien_infanterie, appuis_feux, brutes_ogryns, chiens_chaos, flak_renegate, soutien_blinde, transport_chimere, executeur_appui]
    colonne_options: true
  - id: formations_chaos
    titre: FORMATIONS DU CHAOS
    sous_titre: FORMATIONS DE SOUTIEN RENÉGATES
    formations: [suite_alpha_legion, meute_sauvage, horde_mutante, infestation_nurgle, avant_garde_ruine, meute_massacreurs, scorpions_airain]
    contraintes:
      - { type: consomme, budget: appui }
      - { type: consomme, budget: appui_chaos }
      - { type: max_options, valeur: 4 }
    colonne_options: true
  - id: fortifications_renegates
    titre: FORTIFICATIONS RENÉGATES
    sous_titre: "Jusqu'à 1 Fortification pour chaque Formation de Milice Renégate et Milice Ouvrière"
    formations: [position_fortifiee]
  - id: support_aeronaval
    titre: SUPPORT AÉRONAVAL RENÉGAT
    sous_titre: FORMATIONS DE SUPPORT RENÉGATES
    formations: [escadrille_hellblades, escadrille_helltalons]
    contraintes: [{ type: consomme, budget: support, quoi: points }]
  - id: support_titanique
    titre: SUPPORT DES LÉGIONS TITANIQUES RENÉGATES
    sous_titre: FORMATIONS DE SUPPORT RENÉGATES
    formations: [formation_warhound_chaos, formation_reaver_chaos, formation_warlord_chaos]
    contraintes: [{ type: consomme, budget: support, quoi: points }, { type: initiative, valeur: "1+" }]
    colonne_options: true

