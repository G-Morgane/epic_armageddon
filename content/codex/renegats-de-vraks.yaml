# Renégats de Vraks, transcrit depuis le PDF EAFR (pied de page : CODEX ÉGARÉS & DAMNÉS - EAFR -
# REV BETA VIII, publié sur le site en REV 0.7 — source de vérité).
#
# Liste cousine d'Égarés et Damnés : plusieurs unités portent le même nom dans les deux codex, mais
# les profils repris ici sont ceux des feuilles de références du PDF de Vraks.
codex:
  slug: renegats-de-vraks
  armee_id: cdd5d146-584a-44ed-be12-afb27478d66c
  nom: Renégats de Vraks
  version: "0.7"
  faction: chaos
  categorie: armees-chaos
  statut: beta
  couleur: "#6b2f2f"
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/renegats-de-vraks.png
  citation:
    texte: "Sur ma parole, le maelström viendra et Vraks se noiera dans le sang. Même les morts ne trouveront pas la paix. Je serai le héraut de l'apocalypse à venir et les vrais dieux connaîtront mon nom."
    auteur: Seigneur Xaphan, Cardinal Apostat, Archi-hérétique et Despote de Vraks
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de Renégats de Vraks composée de Miliciens, de Space Marines du Chaos, ainsi que des Démons issus des Dieux du Chaos et leurs machines de guerres infernales.

    Pour chaque Formation Renégate Principale sélectionnée dans votre liste d'armée, vous pouvez également sélectionner soit deux Formations d'Appui Renégate, soit une de ces formations et une Formation du Chaos.

    Chaque Formation Renégate Principale, Formation d'Appui Renégate, Formation du Chaos Universel et Formation de Démons peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement pour un maximum de quatre par formation. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'une formation tandis que d'autres ajoutent des unités supplémentaires.
  regles_md:
    - titre: "Règle spéciale : Exécuteurs"
      texte: |
        Pour chaque Formation Principale des Renégats de Vraks qu'inclut votre armée, un Exécuteur est automatiquement intégré.

        De plus, vous pouvez ajouter gratuitement un Exécuteur dans une Formation d'Appui Vraksienne pour chaque tranche de 1 000 pts dans votre armée.
    - titre: "Règle spéciale : Allégeances"
      texte: |
        Une armée Renégats de Vraks peut prêter allégeance à l'un des Dieux du Chaos (Khorne ou Nurgle) ou au Chaos Universel. Si vous décidez d'affilier une armée de Renégats de Vraks, vous devez décider à quelle allégeance appartient votre armée au début de la bataille et le noter sur votre liste d'armée. Il est impossible de lier des alliances entre les différents Dieux. Vous n'aurez accès qu'aux formations de Machines Démons du Dieu choisi et à celles du Chaos Universel pour constituer votre armée.

        **Chaos Universel** : Éclaireurs de l'Alpha Légion, Enfants du Chaos, Chiens du Chaos. **Khorne** : Grands Scorpions d'Airain, Massacreurs Sanglants. **Nurgle** : Drones de la Ruine, Zombies de la Peste.

        Le constructeur ne sait pas vérifier l'allégeance : à vous de ne pas mélanger deux Dieux dans une même liste.
    - titre: "Règle spéciale : Maître de sièges (Vraks)"
      texte: |
        Chaque Milice Renégate, Milice Ouvrière et Populace Mutante permet de prendre un ensemble de Positions Fortifiées. Ces Positions Fortifiées devront être déployées en garnison ou dans la zone de déploiement, lors de la phase de déploiement, et ne pourront être conservées en réserve d'aucune sorte.

        **Tranchées (2)** : Couvert 4+ pour l'infanterie, Dangereux pour les véhicules, sans effet sur les engins de guerre. **Emplacement d'artillerie (1)** : Couvert 4+ / 5+ / sans effet. **Emplacement de Char (1)** : Couvert 4+ / 5+ / 5+. **Bunkers (2)** : Couvert 3+ pour l'infanterie, Infranchissable pour les véhicules et les engins de guerre. **Barbelés** : Dangereux pour l'infanterie, sans effet sur le reste.

        Les (X) indiquent le nombre d'unités maximum pouvant occuper ces fortifications par tronçon de 4 cm de longueur.
    - titre: "Règle spéciale : Infestations"
      texte: |
        Le déploiement des Infestations fonctionne exactement comme la règle spéciale Téléportation, mais après avoir placé une unité, lancez 2D6+6 pour savoir combien de socles de Zombies de la Peste apparaissent. Testez ensuite normalement pour les pions impact pour la Téléportation (cela représente une infestation de zombies de la peste qui a été lâchée sur l'ennemi).
    - titre: "Règle spéciale : Tunnelier"
      texte: |
        Une formation Tunnelier peut se déployer en utilisant la règle suivante : un tunnelier est déployé au même moment et de la même manière qu'un vaisseau spatial (voir section 4.3.1 du livre de règles). Les unités transportées dans un tunnelier sont gardées en réserve. Définissez ensuite une « zone de largage », selon la procédure décrite en section 4.3.1.

        Un tunnelier peut apparaître dans votre moitié de table dès le deuxième tour et dans la moitié de table adverse dès le troisième tour. Il est déployé avant le jet de stratégie au début du tour indiqué, aux coordonnées prédéfinies. Un tunnelier et toutes les unités qu'il transporte peuvent agir normalement dès leur tour d'arrivée.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture (GW) et contenu Vukašin Ivković."
  valeur_strategique: 2
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Alpha Légion et Engins de Guerre démoniaques", valeur: "1+" }

