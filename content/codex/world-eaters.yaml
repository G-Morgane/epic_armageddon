formations:
  # ---- Détachements ----
  - id: suite_berzerkers
    nom: Suite de Berzerkers
    description: "1+ par armée"
    variantes:
      - { id: base, cout: 275, composition: [{ unite: berzerkers_khorne, nombre: 8 }] }
    options: [personnage_chaos, porte_icone, prince_demon, transports, dreadnoughts, defilers, stalker, support_lourd, land_raiders, rage_khorne]
    contraintes:
      - { type: min_par_armee, valeur: 1 }
      - { type: fournit, budget: place_soutien, quantite: 1 }
  - id: suite_elus
    nom: Suite d'Élus World Eaters
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 4, max: 6 }
              parmi: [{ unite: elus_terminators_chaos, cout: 50 }]
              phrase_pdf: "4 à 6 unités d'Élus Terminators du Chaos"
    options: [personnage_chaos, porte_icone, prince_demon, transports_elus, dreadnoughts, defilers, stalker, support_lourd, land_raiders]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: marines_assaut_khorne
    nom: Marines d'assaut de Khorne
    variantes:
      - { id: six, nom: 6 unités de Marines d'Assaut de Khorne, cout: 200, composition: [{ unite: marines_assaut_khorne, nombre: 6 }] }
      - { id: huit, nom: 8 unités de Marines d'Assaut de Khorne, cout: 275, composition: [{ unite: marines_assaut_khorne, nombre: 8 }] }
    options: [personnage_chaos, porte_icone]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: compagnie_motos
    nom: Compagnie de Motos
    variantes:
      - { id: base, cout: 250, composition: [{ unite: motos_chaos, nombre: 8 }] }
    options: [personnage_chaos, porte_icone]
  - id: compagnie_blindee
    nom: Compagnie Blindée
    variantes:
      - { id: land_raiders, nom: 4 Land Raiders du Chaos, cout: 300, composition: [{ unite: land_raider_chaos, nombre: 4 }] }
      - { id: predators, nom: 4 Predators du Chaos, cout: 200, composition: [{ unite: predator_chaos, nombre: 4 }] }
    options: [stalker, vehicules_supplementaires]
  - id: demons_mineurs
    nom: Démons Mineurs
    variantes:
      - { id: huit, nom: 8 unités de Sanguinaires, cout: 175, composition: [{ unite: sanguinaires, nombre: 8 }] }
      - { id: douze, nom: 12 unités de Sanguinaires, cout: 275, composition: [{ unite: sanguinaires, nombre: 12 }] }
    options: [buveur_sang]
    contraintes:
      - { type: max_par_armee, valeur: 2 }
      - { type: initiative, valeur: "2+" }
  - id: demon_majeur
    nom: Démon Majeur
    variantes:
      - { id: base, cout: 200, composition: [{ unite: buveur_sang, nombre: 1 }] }
    options: []
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: consomme, budget: demon_majeur_unique }

  # ---- Détachements de soutien ----
  - id: meute_carnage
    nom: Meute du Carnage
    variantes:
      - { id: quatre, nom: 4 Machines Démons de Khorne, cout: 275, composition: [{ unite: machine_demon_khorne, nombre: 4 }] }
      - { id: six, nom: 6 Machines Démons de Khorne, cout: 400, composition: [{ unite: machine_demon_khorne, nombre: 6 }] }
    options: []
    contraintes: [{ type: initiative, valeur: "2+" }]
  - id: batterie_feu_enfer
    nom: Batterie Feu d'Enfer
    variantes:
      - { id: quatre, nom: 4 Canons de Khorne, cout: 225, composition: [{ unite: canon_khorne, nombre: 4 }] }
      - { id: six, nom: 6 Canons de Khorne, cout: 325, composition: [{ unite: canon_khorne, nombre: 6 }] }
    options: []
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: initiative, valeur: "2+" }
  - id: scorpions_airain
    nom: Scorpions d'Airain
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 1, max: 3 }
              parmi: [{ unite: grand_scorpion_airain, cout: 225 }]
              phrase_pdf: "1 à 3 Grands Scorpions d'Airain"
    options: []
    contraintes: [{ type: max_par_armee, valeur: 2 }]

  # ---- Supports : Flotte de Guerre du Chaos ----
  - id: escadrille_intercepteurs
    nom: Escadrille d'Intercepteurs
    variantes:
      - { id: base, cout: 200, composition: [{ unite: hellblade, nombre: 3 }] }
  - id: escadrille_chasseurs_bombardiers
    nom: Escadrille de Chasseurs-Bombardiers
    variantes:
