  - id: rage_khorne
    nom: Rage de Khorne
    effet: { type: mot_cle, texte: Sans peur, cout: 50 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
