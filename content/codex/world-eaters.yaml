      - { id: cuirasse, nom: 1 Cuirassé Despoiler, cout: 250, composition: [{ unite: cuirasse_despoiler, nombre: 1 }] }
    contraintes: [{ type: pas_une_activation }]

  # ---- Supports : Soutien Titanique des Légions Renégates ----
  - id: seigneur_bataille
    nom: Seigneur de Bataille
    description: "Le codex imprime « 400 pts » sans préciser « chacun » : le coût est compté par Seigneur de Bataille, comme pour les Scorpions d'Airain."
    variantes:
      - { id: un, nom: 1 Seigneur de Bataille, cout: 400, composition: [{ unite: seigneur_bataille, nombre: 1 }] }
      - { id: deux, nom: 2 Seigneurs de Bataille, cout: 800, composition: [{ unite: seigneur_bataille, nombre: 2 }] }
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: titan_feral
    nom: Titan Feral
    variantes:
      - { id: base, cout: 300, composition: [{ unite: titan_feral, nombre: 1 }] }
  - id: titan_ravager
    nom: Titan Ravager
    variantes:
      - { id: base, cout: 650, composition: [{ unite: titan_ravager, nombre: 1 }] }
  - id: titan_banelord
    nom: Titan Banelord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: titan_banelord, nombre: 1 }] }

sections:
  - id: detachements
    titre: DÉTACHEMENTS DES WORLD EATERS
    formations: [suite_berzerkers, suite_elus, marines_assaut_khorne, compagnie_motos, compagnie_blindee, demons_mineurs, demon_majeur]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DES WORLD EATERS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 4 améliorations"
  - id: soutien
    titre: DÉTACHEMENTS DE SOUTIEN DES WORLD EATERS
    sous_titre: "Un Détachement par suite de Berzerkers"
    formations: [meute_carnage, batterie_feu_enfer, scorpions_airain]
    contraintes: [{ type: consomme, budget: place_soutien }]
  - id: flotte
    titre: FLOTTE DE GUERRE DU CHAOS
    sous_titre: "SUPPORTS DES WORLD EATERS"
    formations: [escadrille_intercepteurs, escadrille_chasseurs_bombardiers, soutien_orbital]
    contraintes:
      - { type: consomme, budget: rare, quoi: points }
      - { type: initiative, valeur: "2+" }
  - id: titans_renegats
    titre: SOUTIEN TITANIQUE DES LÉGIONS RENÉGATES
    sous_titre: "SUPPORTS DES WORLD EATERS"
    formations: [seigneur_bataille, titan_feral, titan_ravager, titan_banelord]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts valide : Berzerkers en Rhinos, Élus téléportés, Démons Mineurs, Meute du Carnage et Titan Feral"
    limite: 3000
    attendu: valide
    formations:
      - formation: suite_berzerkers
        options:
          - { option: personnage_chaos, choix: seigneur }
          - { option: porte_icone }
          - { option: rage_khorne }
          - { option: transports, choix: rhinos, quantite: 4 }
      - formation: suite_elus
        choix: { "0": { elus_terminators_chaos: 6 } }
        options:
          - { option: personnage_chaos, choix: champion }
          - { option: prince_demon, choix: prince_demon_aile }
          - { option: transports_elus, choix: teleportation }
      - formation: marines_assaut_khorne
        variante: huit
        options: [{ option: porte_icone }]
      - formation: compagnie_blindee
