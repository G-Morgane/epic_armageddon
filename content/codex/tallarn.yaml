sections:
  - id: compagnies
    titre: COMPAGNIES DE TALLARN
    formations: [compagnie_infanterie, compagnie_mecanisee, compagnie_cavalerie, compagnie_reconnaissance, compagnie_blindee_legere]
    contraintes:
      - { type: max_options, valeur: 3 }
      - { type: fournit, budget: slot_appui, quantite: 2 }
    options: [commandant_supreme, confesseur, equipes_snipers, appui_feu, appui_mortier, support_dca, sentinelles]
    tableau_options:
      titre: AMÉLIORATIONS DE COMPAGNIES DE TALLARN
      sous_titre: "Jusqu'à 3 améliorations différentes par Compagnie de la Garde"
    notes:
      embarquement: "Si la formation est motorisée, ajoutez aussi suffisamment de Chimères pour transporter ces unités, pour 25 pts chacune."
  - id: appui
    titre: FORMATIONS D'APPUI DE TALLARN
    sous_titre: "Jusqu'à 2 formations d'appui par Compagnie"
    formations: [escadron_cavalerie_reconnaissance, escadron_cavalerie_autochtone, section_mortiers, section_snipers, section_artillerie_mobile, section_dca_mobile, escadron_hellhounds, escadron_sentinelles_soutien, escadron_conqueror, escadron_leman_russ_speciaux]
    contraintes: [{ type: consomme, budget: slot_appui }]
    options: [commissaire_appui]
  - id: aeronautica
    titre: APPUI DE L'AERONAUTICA IMPERIALIS
