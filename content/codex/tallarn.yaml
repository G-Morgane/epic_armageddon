listes_test:
  - nom: "3000 pts, trois compagnies, appuis et supports"
    limite: 3000
    attendu: valide
    formations:
      - formation: compagnie_mecanisee
        options:
          - { option: commandant_supreme }
          - { option: appui_feu, quantite: 4 }
          - { option: transport_chimere, quantite: 2 }
      - formation: compagnie_infanterie
        options:
          - { option: equipes_snipers, quantite: 2 }
          - { option: support_dca, choix: plateformes, quantite: 2 }
      - { formation: compagnie_blindee_legere }
      - { formation: escadron_conqueror }
      - { formation: section_artillerie_mobile, options: [{ option: commissaire_appui }] }
      - { formation: escadron_leman_russ_speciaux, variante: thunderers }
      - { formation: peloton_super_lourd, variante: baneblade }

  - nom: "deux Commandants Suprêmes"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: compagnie_infanterie, options: [{ option: commandant_supreme }] }
      - { formation: compagnie_mecanisee, options: [{ option: commandant_supreme }] }

  - nom: "quatre améliorations sur une compagnie"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: compagnie_infanterie
        options:
          - { option: confesseur }
          - { option: equipes_snipers, quantite: 1 }
          - { option: appui_feu, quantite: 1 }
          - { option: appui_mortier, quantite: 1 }

  - nom: "trois formations d'appui pour une compagnie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: section_mortiers }
      - { formation: section_snipers }
      - { formation: escadron_hellhounds }

  - nom: "supports non régimentaires au-delà du tiers des points"
    limite: 1500
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: peloton_super_lourd, variante: baneblade }
      - { formation: peloton_super_lourd, variante: shadowsword }
      - { formation: peloton_super_lourd, variante: stormblade }
