options:
  - id: commandant_supreme
    nom: Commandant Suprême
    effet: { type: mot_cle, texte: Commandant Suprême, cout: 50 }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "L'unité ayant la règle Commandant gagne à la place la règle Commandant Suprême"
  - id: confesseur
    nom: Confesseur
    effet: { type: ajouter, cout: 50, unites: [{ unite: confesseur }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoute un Confesseur à 1 unité d'Infanterie (hors Cavaliers de Tallarn et Commandant Cavalier de Tallarn)"
  - id: equipes_snipers
    nom: Equipes de Snipers
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: snipers }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_ref: embarquement
    phrase_pdf: "Ajouter jusqu'à 4 unités de Sniper"
  - id: appui_feu
    nom: Appui-feu
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: appui_feu }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_ref: embarquement
    phrase_pdf: "Ajouter jusqu'à 4 escouades d'appui-feu"
  - id: appui_mortier
    nom: Appui Mortier
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: mortiers }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_ref: embarquement
    phrase_pdf: "Ajouter jusqu'à 4 unités de Mortiers"
  - id: support_dca
    nom: Support DCA
    effet:
      type: choix
      parmi:
        - id: plateformes
          nom: Plateformes Sabre
          cout: 0
          effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: plateforme_sabre }], min: 1, max: 2 }
        - id: hydre
          nom: Hydre
          cout: 50
          effet: { type: ajouter, unites: [{ unite: hydre }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter jusqu'à 2 Plateformes Sabre pour 25 pts chacune. Si la formation est motorisée, ajoutez à la place 1 Hydre pour 50 pts."
    phrase_pdf: "Ajouter jusqu'à 2 Plateformes Sabre (+25 pts chaque), ou 1 Hydre si la formation est motorisée (+50 pts)"
  - id: sentinelles
    nom: Sentinelles
    effet: { type: ajouter, cout: 75, unites: [{ unite: sentinelle_soutien, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 2 Sentinelles de soutien"
  - id: transport_chimere
    nom: Transport Chimères
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: chimere }], max: besoin_transport, perimetre_transport: options }
    contraintes: [{ type: hors_quota_options }]
    note_md: "Réservé aux formations motorisées : ajoutez suffisamment de Chimères pour transporter les unités ajoutées par les améliorations."
    phrase_pdf: "Si la formation est motorisée, ajoutez aussi suffisamment de Chimères pour les transporter (25 pts chacune)"
  - id: commissaire_appui
    nom: Commissaire
    effet: { type: ajouter, cout: 0, unites: [{ unite: commissaire, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: consomme, budget: commissaires_gratuits }

