# Raid Tallarn, transcrit depuis le PDF expérimental EAFR rev 0.1 (source de vérité).
codex:
  slug: tallarn
  armee_id: b83b346e-cd5d-41b1-b055-15217d76d116
  nom: Tallarn
  version: "0.1"
  faction: imperium
  categorie: armees-imperiales
  statut: experimental
  citation:
    texte: "Soyez prestes et silencieux, tels le simoun qui traverse le désert sans faire frémir le moindre grain de sable."
    auteur: Capitaine Al'Rahem
  intro_md: |
    La liste qui suit vous permet de mettre sur pied un régiment de Tallarn basé sur ceux déployés lors de la Campagne de Taros.

    Les armées de Tallarn sont organisées autour de grandes formations appelées compagnies, elles-mêmes complétées par des formations d'appui qui leurs sont autonomes.

    Chaque compagnie peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par compagnie. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Chaque compagnie peut prendre jusqu'à trois améliorations.

    Les formations de support sont des formations autonomes des compagnies. Elles ne peuvent pas recevoir d'améliorations. Un maximum de 1/3 des points peuvent être dépensés pour ces formations.

    Le Raid Tallarn utilise les feuilles de référence de Raid Tallarn, de l'Aeronautica Imperialis et de Soutien Super-Lourd de Raid Tallarn.
  regles_md:
    - titre: "Règle spéciale : Commissaires"
      texte: |
        Chaque compagnie inclut un Commissaire. De plus, vous pouvez ajouter gratuitement un Commissaire dans une formation d'appui pour chaque tranche (même incomplète) de 1 000 points dans votre armée hors Supports non régimentaires.
    - titre: "Règle spéciale : Vifs comme le vent"
      texte: |
        Une formation ayant effectué un Redéploiement peut effectuer un soutien en assaut *, un feu croisé, et des tirs anti-aériens *.

        * Ces actions se feront avec un malus à la touche de -1 supplémentaire à tout autre malus qui pourrait être subi.
    - titre: "Règle spéciale : Formations motorisées"
      texte: |
        Au regard des améliorations auxquelles elles peuvent prétendre, les compagnies suivantes sont qualifiées de formations motorisées :

        - Compagnie d'infanterie mécanisée
        - Compagnie blindée légère

        Les compagnies suivantes peuvent être qualifiées de formations motorisées si vous le choisissez au moment de rédiger votre liste d'armée :

        - Compagnie de cavalerie
        - Compagnie de reconnaissance

        La compagnie suivante n'est pas une formation motorisée :

        - Compagnie d'infanterie
  valeur_strategique: 2
  initiative:
    defaut: "2+"

budgets:
  - id: slot_appui
    libelle: Formations d'appui
    capacite: { source: fournitures }
    phrase_pdf: "Jusqu'à 2 formations d'appui par Compagnie"
  - id: rare
    libelle: Supports non régimentaires
    capacite: { source: ratio_points, ratio: 0.3334 }
    phrase_pdf: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
  - id: commissaires_gratuits
    libelle: Commissaires gratuits
    capacite: { source: par_tranche, points: 1000, perimetre: "section:compagnies" }
    phrase_pdf: "1 Commissaire gratuit par tranche (même incomplète) de 1 000 pts, hors Supports non régimentaires"

