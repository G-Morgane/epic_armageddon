  # ---- Da Big Boss ----
  - id: big_boss
    nom: Big Boss
    effet: { type: ajouter, cout: 0, unites: [{ unite: big_boss }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: min_par_armee, valeur: 1 }
      - { type: hors_quota_options }
      - { type: max_par_formation, valeur: 1 }
    note_md: "Chaque armée Ork doit inclure une unité de commandant suprême appelée Big Boss. Cette unité est gratuite et doit obligatoirement rejoindre un Grand Gargant. S'il n'y en a pas, le Big Boss rejoindra un Gargant ou un socle de Nobz."
