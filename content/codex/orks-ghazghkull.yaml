# Orks de Ghazghkull, transcrit depuis le PDF EAFR rev 1.7.1 (source de vérité).
codex:
  slug: orks-ghazghkull
  armee_id: 709b48d0-4578-4e83-900c-af9e00a00f98
  nom: Orks de Ghazghkull
  version: "1.7.1"
  faction: xenos
  categorie: armees-xenos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/orks-ghazghkull.jpg
  couleur: "#236d44"
  logo: /icons/orc_gazhgull.svg
  citation:
    texte: "CHUI L'TOUT PUISSAN SAIGNEUR GHAZGHKULL MAG URUK THRAKA, ET CH'KOZ AVEK LA VOIX DÉ DIEUS ON VA KRABOUILLÉ L'UNIVERS ET TUÉ TOU CEU KI S'RBIFRON ET ON L'FRA A KAUZ KON É DÉ ZORKS ET KON É FÉ POUR S'BATT ET GAGNER"
    auteur: Graffiti trouvé par des Dark Angels sur les débris d'un Titan Warlord à Westerisle, sur Piscina IV
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied une WAAAGH! d'Orks basée sur celle de GHAZGHKULL MAD URUK THRAKA lors de la IIIème Guerre pour Armageddon. Cette liste peut également être utilisée pour représenter d'autres armées orks comme celles de DREGRUK ou GATHROG.

    Les armées des Orks sont organisées autour de grandes formations appelées bandes, qui peuvent s'acheter selon 3 tailles, la bande normale, la mastok (doubler l'effectif de départ) ou la tré mastok (tripler l'effectif de départ).

    Chaque bande peut recevoir des kust'oms. La liste d'armée indique pour chaque catégorie de bande quels kust'oms sont autorisés. Chaque kust'om autorisé peut être pris un nombre illimité de fois par bande, sauf s'il est fait état d'une limitation de kust'om. Les limitations de kust'om sont multipliées de la même façon que l'effectif de départ, ainsi si un Kulte d'la Vitesse normal ne peut accueillir qu'un Brikolo supplémentaire, un Kulte d'la Vitesse tré mastok peut en inclure jusqu'à 3. Les kust'oms font partie intégrante des bandes et doivent en respecter la cohésion.

    Les truk'eud'meks sont des formations autonomes des bandes. Un maximum de ⅓ des points de l'armée peuvent être dépensés pour ces formations.

    Les armées Orks de Ghazghkull ont une valeur stratégique de 3. Toutes les formations Orks de Ghazghkull ont une initiative de 3+ mais reçoivent des modificateurs en fonction des actions choisies lorsqu'elles effectuent un test d'action (Pouvoir de la Waaagh!) ou de leur taille lorsqu'elles tentent de se rallier (R'mise en bande).
  regles_md:
    - titre: "Règle spéciale : Da Big Boss"
      texte: |
        Chaque armée Ork doit inclure une unité de commandant suprême appelée Big Boss. Cette unité est gratuite et doit obligatoirement rejoindre un Grand Gargant. S'il n'y en a pas, le Big Boss rejoindra un Gargant ou un socle de Nobz.
    - titre: "Règle spéciale : Pouvoir de la Waaagh!"
      texte: |
        Les Orks ne sont pas de fins stratèges mais la perspective d'une bonne bagarre les galvanise toujours. Afin de représenter ceci, une formation tentant une action d'Avance Rapide ou d'Assaut reçoit +2 à l'initiative pour son test d'action.

        Les formations aériennes ont +2 de bonus pour les tests d'actions lorsqu'elles tentent une Interception ou une Attaque au sol.
    - titre: "Règle spéciale : R'mise en bande"
      texte: |
        Lorsque les bandes Orks tentent un test de ralliement, ils reçoivent un bonus de +1 lorsqu'ils sont plus de 5 et de +2 lorsqu'ils sont plus de 10. Les engins de guerre faisant partie de ces bandes comptent pour autant d'unités que leur capacité de dommage de départ. Ne sont pas comptabilisables dans le calcul ni les Gretchins ni les Groskalibr'.
    - titre: "Règle spéciale : Champ énergétique"
      texte: |
        Certains engins de guerre Orks possèdent des champs énergétiques. Le nombre dont en dispose chaque engin est indiqué sur sa fiche d'unité. Les champs énergétiques fonctionnent de la même manière que les Boucliers du Vide des impériaux, à la différence qu'une fois abattus, ils ne sont pas réparables et restent donc inactifs jusqu'à la fin de la bataille.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture rasmusillustration."
  valeur_strategique: 3
  initiative:
    defaut: "3+"
    exceptions: []

