    nom: Forteresse de bataille ou à Kanon
    effet:
      type: choix
      parmi:
        - { id: forteresse_bataille, nom: Forteresse de Bataille, cout: 125, effet: { type: ajouter, unites: [{ unite: forteresse_bataille }] } }
        - { id: forteresse_kanons, nom: Forteresse à Kanons, cout: 125, effet: { type: ajouter, unites: [{ unite: forteresse_kanons }] } }
    contraintes: [{ type: max_par_formation, valeur: 1, par_taille: true }]
