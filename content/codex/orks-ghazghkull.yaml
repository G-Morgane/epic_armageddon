listes_test:
  - nom: "3000 pts valide, Big Boss dans un Gargant"
    limite: 3000
    attendu: valide
    formations:
      - formation: bande_guerre
        variante: mastok
        options:
          - { option: boyz_gretchin, quantite: 4 }
          - { option: kommandos, quantite: 2 }
          - { option: nobz, quantite: 1 }
          - { option: forteresse, choix: forteresse_bataille }
      - formation: kulte_vitesse
        variante: normale
        choix: { "0": { buggy: 5, motos: 3 } }
        options: [{ option: kopter, quantite: 2 }]
      - formation: batterie_grokalibr
        variante: normale
        options: [{ option: brikolo, choix: super_zap }]
      - { formation: bande_chokboyz }
      - formation: gargant
        options: [{ option: big_boss }]
      - formation: chassa_bombas
        choix: { "0": { chassa_bomba: 4 } }
  - nom: "sans Big Boss"
    limite: 3000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: bande_guerre, variante: normale }
      - formation: kulte_vitesse
        variante: normale
        choix: { "0": { buggy: 8 } }
  - nom: "bande normale avec 3 lots de Boyz"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: bande_guerre
        variante: normale
        options: [{ option: boyz_gretchin, quantite: 3 }]
      - formation: gargant
        options: [{ option: big_boss }]
  - nom: "Truk'eud'mek au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: bande_guerre, variante: normale }
      - formation: grand_gargant
        options: [{ option: big_boss }]
  - nom: "Forteresse de Bataille sur une Brigade Blitz"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: brigade_blitz
        variante: normale
        choix: { "0": { chariot_kanon: 2, chariot_flak: 1, kopter: 1 } }
        options: [{ option: forteresse, choix: forteresse_bataille }]
      - formation: gargant
        options: [{ option: big_boss }]
  - nom: "deux Big Boss"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: bande_guerre
        variante: normale
        options: [{ option: big_boss }]
      - formation: gargant
        options: [{ option: big_boss }]
