# Adeptus Arbites, transcrit depuis le PDF EAFR rev 1.3 (source de vérité).
codex:
  slug: adeptus-arbites
  armee_id: f40025a7-e0db-4305-ae71-37e48a91b55f
  nom: Adeptus Arbites
  version: "1.3"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  citation:
    texte: "Aucun serviteur de l'Empereur ne meurt sans vengeance, nul ennemi de l'Empereur n'échappe au châtiment !"
    auteur: Promesse de la Pax Imperialis
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de l'Adeptus Arbites.

    Les armées de l'Adeptus Arbites sont organisées autour de petites formations appelées détachements principaux ainsi que des détachements de soutien qui leur sont autonomes.

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de support sont des formations autonomes des détachements. Un maximum du tiers des points peut être dépensé pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Auxiliaires de l'Imperium"
      texte: |
        Les troupes de l'Adeptus Arbites sont des troupes d'élites chargées du maintien de l'ordre dans les mondes ruches de l'Imperium. Aussi, elles combattent rarement seules lorsqu'un conflit d'ampleur éclate sur un monde sous leur juridiction.

        Un tiers des points d'une liste de l'Adeptus Arbites peut être sélectionné dans les codex Adeptus Astartes, Astra Militarum et Adepta Sororitas. Cette sélection doit respecter la structure de ces listes (ex : un choix de base pour avoir deux choix de soutien, etc.) et elle ne peut pas inclure d'unités possédant la note Commandant Suprême.
    - titre: "Règle spéciale : Initiative des détachements"
      texte: |
        Les Détachements incluant un personnage ont une initiative de 1+. Les autres détachements ont une initiative de 2+.
    - titre: "Règle spéciale : Capacité de transport du Mastodon"
      texte: |
        Le Mastodon a une capacité de Transport (10). Il ne peut pas transporter d'Ogryns et ne peut transporter que jusqu'à 2 Plateformes Sabres.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture deviantart.com/thefirstangel."
  valeur_strategique: 3
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Détachements incluant un personnage", valeur: "1+" }

budgets:
  - id: slot_soutien
    libelle: Détachements de soutien
    capacite: { source: fournitures }
    phrase_pdf: "Jusqu'à 2 détachements de soutien par détachement principal"
  - id: rare
    libelle: Supports de l'Adeptus Arbites
    capacite: { source: ratio_points, ratio: 0.3334 }
    phrase_pdf: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"

