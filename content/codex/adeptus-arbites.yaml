options:
  - id: juge_supreme
    nom: Juge Suprême
    effet: { type: ajouter, cout: 50, unites: [{ unite: juge_supreme, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: max_par_armee, valeur: 1 }
    phrase_pdf: "Ajouter un Juge Suprême à la formation"
  - id: officier
    nom: Officier
    effet:
      type: choix
      parmi:
        - { id: marshall, nom: Marshall, cout: 25, effet: { type: ajouter, unites: [{ unite: marshall, nombre: 1 }] } }
        - { id: sheriff, nom: Sheriff, cout: 25, effet: { type: ajouter, unites: [{ unite: sheriff, nombre: 1 }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Marshall ou un Sheriff à la formation"
  - id: transports
    nom: Transports
    effet:
      type: choix
      parmi:
        - id: rhino
          nom: Rhino
          cout: 0
          effet: { type: ajouter, unites: [{ unite: rhino }], cout_par_unite: 10, min: 1, max: besoin_transport }
        - id: repressor
          nom: Repressor
          cout: 0
          effet: { type: ajouter, unites: [{ unite: repressor }], cout_par_unite: 15, min: 1, max: besoin_transport }
        - id: chimere
          nom: Chimère
          cout: 0
          effet: { type: ajouter, unites: [{ unite: chimere }], cout_par_unite: 25, min: 1, max: besoin_transport }
        - id: mastodon
          nom: Mastodon
          cout: 0
          effet: { type: ajouter, unites: [{ unite: mastodon }], cout_par_unite: 225, min: 1, max: besoin_transport }
          contraintes: [{ type: requiert_unite, unites: [juge_supreme] }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter suffisamment de véhicules pour transporter toutes les unités de la formation parmi : Rhino (10 pts) ou Repressor (15 pts) ou Chimère (25 pts) ou Mastodon (225 pts, uniquement si la formation contient un Juge Suprême)"
    note_md: "Le coût indiqué est celui d'un véhicule. Vous ne pouvez pas prendre plus de véhicules que nécessaire pour embarquer la formation."
  - id: k9_team
    nom: K9 team
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: k9_team }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 unités à la formation"
  - id: sniper_team
    nom: Sniper Team
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: sniper_team }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 unités à la formation"
  - id: plateformes_sabre
    nom: Plateformes Sabre
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: plateforme_sabre }], min: 1, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 3 unités à la formation"

  # ---- Améliorations propres à certains détachements de soutien ----
  - id: punisher
    nom: Leman Russ Punisher
    effet: { type: remplacer, de: leman_russ, par: leman_russ_punisher, lot: 1, max: 3, cout: 0 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer jusqu'à 3 Leman Russ par des Leman Russ Punisher (gratuit)"
  - id: ogryns_supplementaires
    nom: Ogryns supplémentaires
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: ogryns }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 0-2 unités d'Ogryns pour 25 pts chacune"
  - id: transport_chimere
    nom: Transport
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: chimere }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter suffisamment de Chimères pour transporter toutes les unités de la formation (25 pts chacune)"
    note_md: "Chimères uniquement. Vous ne pouvez pas prendre plus de Chimères que nécessaire pour embarquer la formation."

formations:
  # ---- Détachements principaux ----
  - id: patrouille_repressor
    nom: Patrouille Repressor
    variantes:
      - id: base
        cout: 225
        composition:
          - choix:
              total: 8
              parmi: [{ unite: arbitrator_choc }, { unite: arbitrator_assaut }]
              phrase_pdf: "8 unités parmi Arbitrators de Choc / Assaut"
    contraintes: [{ type: min_par_armee, valeur: 1 }]
    options: [juge_supreme, officier, k9_team, sniper_team, plateformes_sabre, transports]
  - id: patrouille_interceptor
    nom: Patrouille Interceptor
    variantes:
      - { id: base, cout: 225, composition: [{ unite: moto_arbites, nombre: 8 }] }
    options: [juge_supreme, officier]
  - id: patrouille_purgator
    nom: Patrouille Purgator
    variantes:
      - { id: base, cout: 250, composition: [{ unite: arbitrator_soutien, nombre: 8 }] }
    options: [juge_supreme, officier, k9_team, sniper_team, plateformes_sabre, transports]

  # ---- Détachements de soutien ----
  - id: patrouille_tormentor
    nom: Patrouille Tormentor
    variantes:
      - id: base
        cout: 350
        composition:
          - choix:
              total: 8
              parmi: [{ unite: arbitrator_choc }, { unite: arbitrator_assaut }]
              phrase_pdf: "8 unités d'Arbitrators de Choc / Assaut"
          - { unite: valkyrie, nombre: 4 }
    options: [officier]
  - id: patrouille_lupus
    nom: Patrouille Lupus
    variantes:
      - { id: base, cout: 150, composition: [{ unite: k9_team, nombre: 6 }] }
    options: [officier, sniper_team]
  - id: patrouille_fortitude
    nom: Patrouille Fortitude
    variantes:
      - { id: base, cout: 350, composition: [{ unite: leman_russ, nombre: 6 }] }
    options: [officier, punisher]
  - id: patrouille_punition
    nom: Patrouille Punition
    variantes:
      - { id: base, cout: 250, composition: [{ unite: black_maria, nombre: 3 }] }
    options: []
  - id: patrouille_interception
    nom: Patrouille Interception
    variantes:
      - { id: base, cout: 125, composition: [{ unite: sentinelle_arbites, nombre: 6 }] }
    options: [officier]
  - id: patrouille_soumission
    nom: Patrouille Soumission
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: marshall, nombre: 1 }
          - { unite: ogryns, nombre: 4 }
    contraintes: [{ type: initiative, valeur: "1+" }]
    options: [ogryns_supplementaires, transport_chimere]

  # ---- Supports : Flotte de l'Aeronautica Imperialis ----
  - id: escadron_interception
    nom: Escadron d'interception
    variantes:
      - { id: base, cout: 150, composition: [{ unite: avenger, nombre: 2 }] }
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: base, cout: 150, composition: [{ unite: croiseur_attaque, nombre: 1 }] }
    contraintes: [{ type: pas_une_activation }]

  # ---- Supports : Auxiliaires du Departmento Munitorum ----
  - id: redemptionistes
    nom: Rédemptionistes
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: magister, nombre: 1 }
          - { unite: devots, nombre: 9 }
  - id: legions_penales
    nom: Légions Pénales
    variantes:
      - id: base
        cout: 225
        composition:
          - { unite: arbitrator_choc, nombre: 1 }
          - { unite: legionnaires, nombre: 12 }
    options: [officier]

sections:
  - id: detachements_principaux
    titre: DÉTACHEMENTS PRINCIPAUX DE L'ADEPTUS ARBITES
    sous_titre: "Au moins une Patrouille Repressor obligatoire"
    formations: [patrouille_repressor, patrouille_interceptor, patrouille_purgator]
    contraintes: [{ type: fournit, budget: slot_soutien, quantite: 2 }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DE L'ADEPTUS ARBITES
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement"
  - id: detachements_soutien
    titre: DÉTACHEMENTS DE SOUTIEN DE L'ADEPTUS ARBITES
    sous_titre: "Jusqu'à 2 détachements de soutien par détachement principal"
    formations: [patrouille_tormentor, patrouille_lupus, patrouille_fortitude, patrouille_punition, patrouille_interception, patrouille_soumission]
    contraintes: [{ type: consomme, budget: slot_soutien }]
    colonne_options: true
  - id: aeronautica
    titre: FLOTTE DE L'AERONAUTICA IMPERIALIS
    sous_titre: "SUPPORTS DE L'ADEPTUS ARBITES"
    formations: [escadron_interception, soutien_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: munitorum
    titre: AUXILIAIRES DU DEPARTMENTO MUNITORUM
    sous_titre: "SUPPORTS DE L'ADEPTUS ARBITES"
    formations: [redemptionistes, legions_penales]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    colonne_options: true

