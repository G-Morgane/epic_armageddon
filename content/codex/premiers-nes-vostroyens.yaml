  - id: marauder
    nom: Bombardier Marauder
    type: A/EG
    vitesse: B
    blindage: "5+"
    cc: "-"
    ff: "-"
    armes:
      - { nom: Bolters Lourds Jumelés (AA), portee: 30cm, puissance: "AA5+" }
      - { nom: Bolters Lourds Jumelés (AA Arr), portee: 30cm, puissance: "AA5+, Arr" }
      - { nom: Canons Laser Jumelés (AA Avant), portee: 45cm, puissance: "AC4+/AA5+, FrtF" }
      - { nom: Bombes (Bomber), portee: 15cm, puissance: "3PB, FrtF" }
    degats: { cd: 2, critique: "le Bombardier Marauder s'écrase au sol et est détruit." }
  - id: croiseur_lunar
    nom: Croiseur Classe Lunar
    type: VS
    armes:
      - { nom: Bombardement Orbital (3), portee: "∞", puissance: "3PB, MA" }
      - { nom: Frappe chirurgicale, portee: "∞", puissance: "MA2+, TT (D3)" }
  - id: cuirasse_emperor
    nom: Cuirassé Emperor
    type: VS
    armes:
      - { nom: Bombardement Orbital (8), portee: "∞", puissance: "8PB, MA" }
    notes: ["Lent, ne peut être utilisé aux tours un et deux d'une bataille à moins que le scénario ne précise le contraire."]

  # ---- Adeptus Titanicus ----
  - id: reaver
    nom: Reaver
    type: EG
    vitesse: 20cm
    blindage: "4+"
    cc: "3+"
    ff: "3+"
    armes:
      - { nom: Lance-missiles Apocalypse, portee: 60cm, puissance: "4PB, FrtF" }
      - { nom: 2x Destructeurs Turbo laser, portee: 60cm, puissance: "4xAP5+/AC3+, Frt" }
    notes: [Blindage Renforcé, Marcheur, Sans peur, "Peut passer au-dessus d'unités et des obstacles moins hauts que les genoux du titan et au maximum de 2cm de large"]
    degats:
      cd: 6
      bi: 4
      critique: "Le réacteur à plasma se fissure, lancez 1D6 à la fin de chaque tour pour chaque fissure. Sur un résultat de 1, le Reaver explose et inflige une touche sur un 5+ aux unités à 5cm, sur 2-3, le Reaver perd 1CD, sur 4+ la fissure est réparée"
  - id: warlord
    nom: Warlord
    type: EG
    vitesse: 15cm
    blindage: "4+"
    cc: "2+"
    ff: "3+"
    armes:
      - { nom: 2x Destructeurs Turbo laser (FF), portee: 60cm, puissance: "4xAP5+/AC3+, FrtF" }
      - { nom: Canon Gatling, portee: 60cm, puissance: "4xAP4+/AC4+, Frt" }
      - { nom: Canon Volcano, portee: 90cm, puissance: "MA2+, TT (D3), Frt" }
    notes: [Blindage Renforcé, Blindage arrière Renforcé, Marcheur, Sans peur, "Peut passer au-dessus d'unités et des obstacles moins hauts que les genoux du titan et au maximum de 2cm de large"]
    degats:
      cd: 8
      bi: 6
      critique: "Le réacteur à plasma se fissure, lancez 1D6 à la fin de chaque tour pour chaque fissure. Sur un résultat de 1 le Warlord explose et inflige une touche sur un 4+ aux unités à 5cm, sur 2-3 le Warlord perd 1 CD, sur 4+ la fissure est réparée"

options:
  - id: commandant_supreme
    nom: Commandant Suprême
    effet: { type: mot_cle, texte: Commandant Suprême, cout: 50 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Ajoutez la Note Commandant Suprême à une unité"
    note_md: "Non disponible si vous disposez d'une Compagnie de Commandement."
  - id: transports_speciaux
    nom: Transports spéciaux
    effet:
      type: choix
      parmi:
        - id: taurox
          nom: "Remplacez les chimères de la formation par des Taurox (pour 1 Chimère chaque)"
          cout: 0
          effet: { type: remplacer, de: chimere, par: taurox, lot: 1, max: tout, cout: 0 }
        - id: taurox_prime
          nom: "Remplacez les chimères de la formation par des Taurox Prime (pour 1 Chimère chaque)"
          cout: 0
          effet: { type: remplacer, de: chimere, par: taurox_prime, lot: 1, max: tout, cout: 5 }
        - id: crassus
          nom: "Remplacez les chimères de la formation par des Crassus (pour 3 Chimères chaque)"
          cout: 0
          effet: { type: remplacer, de: chimere, par: crassus, lot: 3, max: tout, cout: 25, par_nombre: 2 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
    note_md: "Amélioration réservée aux formations qui comptent des Chimères. Un Crassus remplace 3 Chimères : la seule compagnie qui embarque des Chimères en compte 7, soit 2 Crassus."
  - id: escadron_hellhounds
    nom: Escadron de Hellhounds
    effet: { type: ajouter, cout: 150, unites: [{ unite: hellhound, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: dca
    nom: DCA
    effet: { type: ajouter, cout: 50, unites: [{ unite: hydre, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: escadron_chars
    nom: Escadron de chars
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: conqueror, nom: 3 Leman Russ Conqueror, cout: 150, unites: [{ unite: leman_russ_conqueror, nombre: 3 }] }
        - { id: leman_russ, nom: 3 Leman Russ, cout: 175, unites: [{ unite: leman_russ, nombre: 3 }] }
        - { id: executioner, nom: 3 Leman Russ Executioner, cout: 175, unites: [{ unite: leman_russ_executioner, nombre: 3 }] }
        - { id: demolisseur, nom: 3 Leman Russ Démolisseur, cout: 225, unites: [{ unite: leman_russ_demolisseur, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: commissaire_appui
    nom: Commissaire
    effet: { type: ajouter, cout: 0, unites: [{ unite: commissaire, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: consomme, budget: commissaires_gratuits }

