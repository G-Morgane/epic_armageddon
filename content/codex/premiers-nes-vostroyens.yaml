# Premiers-Nés Vostroyens, transcrit depuis le PDF EAFR rev 1.5.1 (source de vérité).
codex:
  slug: premiers-nes-vostroyens
  armee_id: ee903380-b2c5-4cc9-be8b-29932f9fee10
  logo: /icons/vostoyens.svg
  nom: Premiers-Nés Vostroyens
  version: "1.5.1"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/premiers-nes-vostroyens.jpg
  citation:
    texte: "Nous nous battrons avec une foi et un courage imperturbables. Nous ne reculerons jamais. Ce monde appartient à l'Empereur et nous ne l'abandonnerons pas."
    auteur: Seigneur Maréchal Toshenko s'adressant au 16ème Vostroyen lors de la défense de Nimbosa
  intro_md: |
    La liste qui suit vous permet de mettre sur pied un régiment blindé de l'Astra Militarum basée sur ceux des Premiers-Nés Vostroyens. Cette liste peut également être utilisée pour représenter des régiments blindés de la Garde Impériale d'autres origines comme ceux de Cadia ou de Mordia.

    Les armées des Premiers-Nés Vostroyens sont organisées autour de grandes formations appelées compagnies, elles-mêmes complétées par des formations d'appui qui leurs sont autonomes.

    Chaque compagnie peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par compagnie. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Chaque compagnie peut prendre jusqu'à trois améliorations.

    Les formations de support sont des formations autonomes des compagnies. Elles ne peuvent pas recevoir d'améliorations. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Commissaires"
      texte: |
        Pour chaque Compagnie qu'inclut votre armée, un commissaire y est automatiquement intégré.

        De plus, vous pouvez ajouter gratuitement un commissaire dans une Formation d'Appui pour chaque tranche (même incomplète) de 1 000 points dans votre armée hors formations de support.

        Une compagnie ou une formation ne peut avoir qu'un seul commissaire.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Games Workshop LTD."
  valeur_strategique: 2
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Soutiens de l'Adeptus Titanicus", valeur: "1+" }

budgets:
  - id: slot_appui
    libelle: Formations d'appui
    capacite: { source: fournitures }
    phrase_pdf: "Jusqu'à 2 formations d'appui par compagnie"
  - id: rare
    libelle: Supports
    capacite: { source: ratio_points, ratio: 0.3334 }
    phrase_pdf: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
  - id: commissaires_gratuits
    libelle: Commissaires gratuits
    capacite: { source: par_tranche, points: 1000, perimetre: "section:compagnies" }
    phrase_pdf: "1 commissaire gratuit par tranche (même incomplète) de 1 000 pts, hors formations de support"

