sections:
  - id: compagnies
    titre: COMPAGNIE DES PREMIERS-NÉS VOSTROYENS
    formations: [compagnie_commandement, compagnie_infanterie_mecanisee, compagnie_blindee_legere, compagnie_blindee, compagnie_chasseurs_titans, compagnie_mur_de_feu]
    contraintes:
      - { type: max_options, valeur: 3 }
      - { type: fournit, budget: slot_appui, quantite: 2 }
    options: [commandant_supreme, transports_speciaux, escadron_hellhounds, dca, escadron_chars]
    tableau_options:
      titre: AMÉLIORATIONS DE COMPAGNIES DES PREMIERS-NÉS VOSTROYENS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation et jusqu'à un maximum de 3"
  - id: appui
    titre: FORMATIONS D'APPUI DES PREMIERS-NÉS VOSTROYENS
    sous_titre: "Jusqu'à 2 formations d'appui par compagnie"
    contraintes: [{ type: consomme, budget: slot_appui }]
    options: [commissaire_appui]
    formations: [batterie_deathstrike, peloton_infanterie_mecanisee, militarum_tempestus, batterie_aa, batterie_artillerie, batterie_artillerie_lourde, batterie_griffons, peloton_reconnaissance, peloton_nettoyage, escadron_leman_russ_conqueror, escadron_leman_russ, escadron_leman_russ_speciaux, peloton_appui_lourd, peloton_char_super_lourd]
  - id: aeronautica
    titre: FLOTTES DE L'AERONAUTICA IMPERIALIS
    sous_titre: "SUPPORTS DES PREMIERS-NÉS VOSTROYENS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [escadrille_intercepteurs, escadrille_bombardiers, soutien_orbital]
  - id: titanicus
    titre: SOUTIENS DE L'ADEPTUS TITANICUS
    sous_titre: "SUPPORTS DES PREMIERS-NÉS VOSTROYENS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }, { type: initiative, valeur: "1+" }]
    formations: [titan_reaver, titan_warlord]

listes_test:
  - nom: "3000 pts valide, compagnie mécanisée, compagnie blindée, appuis et un Reaver"
    limite: 3000
    attendu: valide
    formations:
      - formation: compagnie_infanterie_mecanisee
        options:
          - { option: escadron_chars, variante: leman_russ }
          - { option: dca }
          - { option: transports_speciaux, choix: taurox }
      - { formation: compagnie_blindee }
      - { formation: peloton_reconnaissance }
      - formation: batterie_aa
        options: [{ option: commissaire_appui }]
      - { formation: titan_reaver }
  - nom: "2000 pts valide, compagnie de commandement, mur de feu et bombardiers"
    limite: 2000
    attendu: valide
    formations:
      - { formation: compagnie_commandement }
      - formation: compagnie_mur_de_feu
        choix: { "0": { baneblade: 2, stormsword: 1 } }
        options: [{ option: escadron_hellhounds }]
      - { formation: peloton_char_super_lourd, variante: shadowsword }
      - { formation: escadron_leman_russ_speciaux, variante: destroyers }
      - { formation: escadrille_bombardiers }
  - nom: "trois formations d'appui pour une seule compagnie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_blindee }
      - { formation: batterie_aa }
      - { formation: batterie_griffons }
      - { formation: peloton_nettoyage }
  - nom: "quatre améliorations sur une compagnie"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: compagnie_infanterie_mecanisee
        options:
          - { option: escadron_chars, variante: conqueror }
          - { option: escadron_hellhounds }
          - { option: dca }
          - { option: transports_speciaux, choix: crassus }
  - nom: "deux Escadrons de Leman Russ Spéciaux"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: compagnie_blindee }
      - { formation: escadron_leman_russ_speciaux, variante: destroyers }
      - { formation: escadron_leman_russ_speciaux, variante: executioners }
  - nom: "Transports spéciaux sur une compagnie sans Chimère"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: compagnie_blindee
        options: [{ option: transports_speciaux, choix: taurox }]
  - nom: "quota de commissaires gratuits dépassé"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_blindee }
      - { formation: batterie_aa, options: [{ option: commissaire_appui }] }
      - { formation: batterie_griffons, options: [{ option: commissaire_appui }] }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_blindee }
      - { formation: titan_warlord }
