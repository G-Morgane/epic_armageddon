sections:
  - id: base_loyaliste
    titre: FORMATIONS DE BASE DE LA LEGIO CYBERNETICA
    sous_titre: TAGHMATA OMNISSIAH - LOYALISTE
    formations: [cenacle_technoserfs, manipule_castellax, escadron_krios]
    contraintes: [{ type: fournit, budget: slot_support_loyaliste, quantite: 2 }]
    colonne_options: true
  - id: support_loyaliste
    titre: FORMATIONS DE SUPPORT DE LA LEGIO CYBERNETICA
    formations: [ost_myrmidon, manipule_vorax, escadron_vultarax, manipule_arlatax, manipule_thanatar, escadron_karacnos]
    contraintes: [{ type: consomme, budget: slot_support_loyaliste }]
    colonne_options: true
    options: [adaptation_thallax, domitar_castellax, domitar_thanatar, gardes_scyllax, levee_supplementaire, lord_scion_opt, magos_auxiliaire_opt, magos_primat, mission_elargie, ordinatus_minoris_opt, parangons_de_metal, transport]
    tableau_options:
      titre: AMÉLIORATIONS DE TAGHMATA
      sous_titre: "Chaque amélioration autorisée ne peut être prise qu'une seule fois par formation"
  - id: base_renegat
    titre: FORMATIONS DE BASE DU MECHANICUM OBSCUR
    sous_titre: TAGHMATA OMNISSIAH - RENÉGAT
    formations: [cenacle_technoserfs_obscur, cohorte_tenebrax, ost_harpax]
    contraintes: [{ type: fournit, budget: slot_support_renegat, quantite: 2 }]
    colonne_options: true
  - id: support_renegat
    titre: FORMATIONS DE SUPPORT DU MECHANICUM OBSCUR
    formations: [escadron_krios_obscur, cohort_errax, manipule_serperos, scorpios_colossi, escadron_karacnos_obscur]
    contraintes: [{ type: consomme, budget: slot_support_renegat }]
    colonne_options: true
    options: [controleur_noospherique, adaptation_thallax, gardes_scyllax, levee_supplementaire, lord_scion_opt, magos_auxiliaire_opt, magos_primat, mission_elargie, ordinatus_minoris_opt, transport]
    tableau_options:
      titre: AMÉLIORATIONS DE TAGHMATA (RENÉGAT)
      sous_titre: "Chaque amélioration autorisée ne peut être prise qu'une seule fois par formation"
  - id: questor_mechanicus
    titre: FORMATIONS DU QUESTOR MECHANICUS
    formations: [armigeres_moirax, mechanicus_magaera, mechanicus_styrix, mechanicus_atropos, mechanicus_asterius]
    contraintes: [{ type: consomme, budget: questor, quoi: points }]
    colonne_options: true
  - id: ordo_reductor
    titre: FORMATIONS DE L'ORDO REDUCTOR
    formations: [cohorte_thallax, cohorte_ursarax, couvent_reductor, batterie_artillerie, batterie_minotaures, ordinatus_minoris, formation_ordinatus_mars]
    contraintes: [{ type: consomme, budget: reductor, quoi: points }]
    colonne_options: true
  - id: basilikon_astra
    titre: BASILIKON ASTRA
    sous_titre: FORMATIONS DE SUPPORT DU BASILICA POTENTIS
    formations: [escadron_avengers, escadron_primaris_lightning, soutien_orbital]
    contraintes: [{ type: consomme, budget: basilica, quoi: points }]
  - id: legio_titanicus
    titre: LEGIO TITANICUS
    sous_titre: FORMATIONS DE SUPPORT DU BASILICA POTENTIS
    formations: [formation_titan_warhound, formation_titan_direwolf, formation_titan_reaver]
    contraintes: [{ type: consomme, budget: basilica, quoi: points }, { type: initiative, valeur: "1+" }]

listes_test:
  - nom: "Ost loyaliste 3000 pts"
    limite: 3000
    attendu: valide
    formations:
      - formation: cenacle_technoserfs
        options: [{ option: magos_primat }, { option: levee_supplementaire, quantite: 2 }]
      - formation: manipule_castellax
        options: [{ option: domitar_castellax }]
      - { formation: escadron_krios, variante: krios }
      - { formation: manipule_thanatar, variante: cavas, options: [{ option: parangons_de_metal }] }
      - { formation: escadron_karacnos }
      - { formation: cohorte_thallax, variante: six }
      - { formation: mechanicus_magaera, variante: trois }
  - nom: "Ost renégat 3000 pts"
    limite: 3000
    attendu: valide
    formations:
      - { formation: cohorte_tenebrax, options: [{ option: controleur_noospherique }] }
      - { formation: ost_harpax }
      - { formation: escadron_krios_obscur, variante: venator }
      - { formation: manipule_serperos, variante: deux, choix: { "0": { serperos_bombarde: 1, serperos_laser: 1 } }, options: [{ option: controleur_noospherique }] }
      - { formation: scorpios_colossi, variante: un }
      - { formation: formation_titan_warhound, variante: un }
  - nom: "trop de supports pour une seule formation de base"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: manipule_castellax }
      - { formation: manipule_vorax }
      - { formation: escadron_vultarax, variante: quatre }
      - { formation: manipule_arlatax }
  - nom: "Escadron Krios sans Manipule Castellax"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: cenacle_technoserfs }
      - { formation: escadron_krios, variante: krios }
  - nom: "trois Cénacles au-delà du quota par tranche"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: cenacle_technoserfs }
      - { formation: cenacle_technoserfs }
      - { formation: cenacle_technoserfs }
  - nom: "Basilica Potentis au-delà du tiers"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: manipule_castellax }
      - { formation: formation_titan_reaver }
      - { formation: formation_titan_warhound, variante: deux }
