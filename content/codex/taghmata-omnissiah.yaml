options:
  - id: adaptation_thallax
    nom: Adaptation Thallax
    effet:
      type: choix
      parmi:
        - id: empyrite
          nom: "0-1 Empyrite : la formation gagne Téléportation, limité à une formation de 6 unités"
          cout: 50
          effet: { type: mot_cle, texte: Téléportation, cout: 50 }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
        - id: icarus
          nom: "Icarus : remplacer 2 unités Thallax par 2 Thallax Icarus"
          cout: 50
          effet: { type: remplacer, de: thallax, par: thallax_icarus, lot: 2, max: 1, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: domitar_castellax
    nom: Domitar
    effet: { type: remplacer, de: castellax, par: domitar, lot: 2, max: 1, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: Remplacer 2 Castellax par 2 Domitar
  - id: domitar_thanatar
    nom: Domitar
    effet: { type: ajouter, cout: 50, unites: [{ unite: domitar, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: Ajouter 1 Domitar à la formation Thanatar
  - id: gardes_scyllax
    nom: Gardes Scyllax
    effet: { type: ajouter, cout: 75, unites: [{ unite: scyllax, nombre: 4 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [magos_auxiliaire, primat_archimagos] }
    note_md: "Réservée aux formations contenant au moins un Magos Auxiliaire et/ou un Primat Archimagos sur Abéant."
  - id: levee_supplementaire
    nom: Levée supplémentaire
    effet: { type: ajouter, cout_par_unite: 25, lot: 2, unites: [{ unite: technoserfs, nombre: 2 }], max: 4 }
    phrase_pdf: "Ajouter jusqu'à 8 unités de Technoserfs"
  - id: lord_scion_opt
    nom: Lord Scion
    effet: { type: ajouter, cout: 25, unites: [{ unite: lord_scion, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: magos_auxiliaire_opt
    nom: Magos auxiliaire
    effet: { type: ajouter, cout: 50, unites: [{ unite: magos_auxiliaire, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: magos_primat
    nom: 0-1 Magos primat
    effet: { type: remplacer, de: magos_auxiliaire, par: primat_archimagos, lot: 1, max: 1, cout: 25 }
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: Remplacer un Magos Auxiliaire par un Primat Archimagos sur Abéant
  - id: mission_elargie
    nom: Mission élargie
    effet:
      type: ajouter
      cout: 175
      unites: [{ unite: technopretre_reductor, nombre: 2 }, { unite: escorte_serviteurs, nombre: 4 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
  - id: ordinatus_minoris_opt
    nom: Ordinatus Minoris
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi: [{ unite: ordinatus_sagittar, cout: 150 }, { unite: ordinatus_ulator, cout: 150 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 ou 2 Ordinatus Minoris (tous types), 150 pts chacun"
  - id: parangons_de_metal
    nom: 0-1 Parangons de métal
    effet: { type: mot_cle, texte: Parangons de métal, cout: 75 }
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: Accorde la règle Parangons de métal à la formation
  - id: transport
    nom: Transport
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi: [{ unite: convoyeur_triaros, cout: 75 }, { unite: macrocarid_explorator, cout: 75 }]
    note_md: "Ajouter suffisamment de Convoyeur Triaros et/ou de Macrocarid Explorator pour transporter toute la formation sans qu'il ne reste de place libre. 75 pts chacun, 125 pts la paire (la remise par paire n'est pas calculée par le constructeur)."
  - id: controleur_noospherique
    nom: Contrôleur Noosphérique
    effet: { type: ajouter, cout: 75, unites: [{ unite: scintillax, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: Ajouter 1 Scyntillax « Cyclope »

