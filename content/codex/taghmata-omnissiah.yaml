# Taghmata Omnissiah, transcrit depuis le PDF EAFR (pied de page : FANLIST LEGIO - EAFR - REV 0.5.5.1,
# publié sur le site en REV 0.1 — source de vérité).
#
# Le PDF porte deux listes : Loyaliste (Legio Cybernetica) et Renégat (Mechanicum Obscur). Elles partagent
# l'Ordo Reductor, le Questor Mechanicus et le Basilica Potentis. Une armée suit l'une ou l'autre : le moteur
# ne sait pas l'interdire, il vérifie en revanche que les supports d'une branche sont bien débloqués par les
# formations de base de cette branche.
codex:
  slug: taghmata-omnissiah
  armee_id: cbb8e6c6-bb38-4254-b96a-965bde21b188
  nom: Taghmata Omnissiah
  version: "0.1"
  faction: imperium
  categorie: armees-imperiales
  statut: beta
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/taghmata-omnissiah.png
  couleur: "#7a2b2b"
  citation:
    texte: "Un soldat obéissant est certes un atout pour son commandant. Or, l'obéissance implique la possibilité de désobéir. C'est une transgression indigne du service de l'Omnimessie, aussi abolissons-nous ce choix. Mes serfs ne sont pas obéissants, ce sont des pantins assujettis à ma volonté, pour parfaitement servir les desseins du Dieu-Machine."
    auteur: Haephex Ul, Auxiliaire Lachrimallus
  intro_md: |
    Les listes qui suivent vous permettent de mettre sur pied un ost du Taghmata Omnissiah Loyaliste ou du Taghmata Omnissiah Renégat basé sur ceux déployés lors de la Grande Croisade puis durant l'Hérésie d'Horus.

    Les osts du Taghmata Omnissiah Loyaliste sont organisés autour de formations appelées formations de base et de support de la Legio Cybernetica, elles-mêmes complétées par des formations de l'Ordo Reductor et du Questor Mechanicus qui leur sont autonomes.

    Les osts du Taghmata Omnissiah Renégat sont organisés autour de formations appelées formations de base et de support du Mechanicum Obscur, elles-mêmes complétées par des formations de l'Ordo Reductor et du Questor Mechanicus qui leur sont autonomes.

    Chaque formation de base débloque deux formations de support.

    Chaque formation peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une seule fois par formation et sera parfois limitée dans ses possibilités. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion.

    Les formations de l'Ordo Reductor sont des formations autonomes. Un maximum de la moitié des points peuvent être dépensés pour ces formations.

    Les formations du Questor Mechanicus sont des formations autonomes. Un maximum de la moitié des points peuvent être dépensés pour ces formations.

    Les formations de support du Basilica Potentis sont des formations autonomes des détachements. Elles ne peuvent pas recevoir d'améliorations. Un maximum d'un tiers des points peuvent être dépensés pour ces formations.

    Le Taghmata Omnissiah utilise les feuilles de référence du Taghmata Omnissiah & Legio Cybernetica, d'Ordo Reductor & Questor Mechanicus et du Basilica Potentis & Mechanicum Obscur.
  regles_md:
    - titre: "Règle spéciale : Parangons de métal"
      texte: |
        Les unités de cette formation possèdent un profil amélioré. Elles gagnent les Notes suivantes : **Sauvegarde Invulnérable** et **Sans Peur**.

        De plus, les unités « Automates » de la formation peuvent contrôler les objectifs au lieu de juste les contester.
    - titre: "Règle spéciale : Prêtre ordonné"
      texte: |
        Tant qu'une unité Prêtre ordonné est vivante, sa formation peut retirer 1 pion impact supplémentaire si celle-ci réussit son jet de ralliement (un Prêtre ordonné ayant la capacité Meneur peut donc enlever 2 PI à sa formation si le jet est réussi).

        Un Primat Archimagos sur Abéant peut toujours retirer 3 pions impacts supplémentaires à sa formation (la capacité Meneur donnée par la capacité Commandant Suprême est déjà incluse dans ces 3 pions impacts).

        Toute formation contenant au moins un Magos Auxiliaire et/ou Primat Archimagos sur Abéant peut sélectionner l'amélioration Gardes Scyllax une seule fois.

        Les unités de Technoserfs détruites peuvent être réparées par une unité Prêtre Ordonné. Si leur formation effectue un test de Regroupement dans le cadre d'un ordre de Regroupement ou Tenir, on peut utiliser le résultat de son dé pour retirer des pions d'impact ou pour faire revenir en jeu des unités de Technoserfs dans les 5cm du Prêtre ordonné, sans dépasser pour autant leur effectif initial (par exemple, si le résultat est 2, vous pouvez soit retirer 2 pions d'impact, soit réparer 2 unités, soit retirer 1 pion d'impact et réparer 1 unité).
    - titre: "Règle spéciale : Automates"
      texte: |
        Les unités Automates ne génèrent pas de pion impact lorsqu'elles sont détruites. Par contre, elles reçoivent des pions d'impact dans tous les autres cas (ex : arme à Rupture, Barrage, Feu Croisé…).

        Les unités Automates comptent dans le calcul des pertes lors de la résolution d'un assaut. À la fin de l'assaut, les unités Automates détruites génèrent normalement des pions d'impact.

        En outre, les unités Automates ne peuvent que contester les objectifs, pas les contrôler, à moins que leur formation ne contienne une unité ayant la règle spéciale : Prêtre ordonné.
    - titre: "Règle spéciale : Questor Mechanicus"
      texte: |
        **Armement des Chevaliers** : les Chevaliers Styrix, Megaera et Atropos sont des engins de guerre mobiles et leurs armes ont toutes un angle de tir frontal. Les Chevaliers Asterius sont des engins de guerre d'appui feu et leurs armes ont toutes un angle de tir frontal fixe.

        **Bouclier à Ions** : les Chevaliers sont protégés par un Bouclier à Ions. Un Chevalier peut décider d'utiliser la sauvegarde de son Bouclier à Ions à la place de sa sauvegarde de blindage, y compris contre les armes n'autorisant habituellement pas les sauvegardes (MA et TT). Dans ce cas, chaque touche en TT doit être sauvegardée séparément. Si la sauvegarde du Bouclier à Ions échoue, le Chevalier peut utiliser son Blindage Renforcé si l'arme l'y autorise (les attaques TT, MA et Lance annulent donc cette possibilité). Il utilisera alors sa valeur de blindage et non la valeur de son Bouclier à Ions. Par contre, cette règle ne s'applique pas contre les attaques de corps à corps et les tirs en cas de feu croisé.

        **Courage Chevaleresque** : les formations du Questor Mechanicus bénéficient d'un bonus de +1 lors des tests d'actions d'Assaut et des tests de ralliement.
    - titre: "Règle spéciale : Boucliers du vide"
      texte: |
        Chaque bouclier stoppe automatiquement un point de dommages avant de se désactiver. Ne faites pas de sauvegarde contre les attaques stoppées par des boucliers, n'ajoutez pas non plus de pion d'impact pour chaque bouclier désactivé. Une fois que tous les boucliers sont désactivés, l'engin de guerre peut être endommagé normalement. Faites les jets de sauvegarde habituels contre les touches subies.

        Les touches de corps à corps lors d'un assaut ignorent les boucliers, mais pas celles de fusillade.

        Les boucliers désactivés peuvent être réparés. Un engin de guerre répare un bouclier désactivé à la fin de chaque tour. De plus, si un engin de guerre se regroupe, il peut utiliser le résultat de son dé pour retirer des pions d'impact ou pour réparer des boucliers.
    - titre: "Règle spéciale : Boucliers Constructs"
      texte: |
        Les Constructs du Mechanicum Obscur possèdent des Boucliers Constructs. Le nombre dont dispose chaque unité est indiqué sur sa fiche d'unité, BC.

        Les Boucliers Constructs fonctionnent de la même manière que les Boucliers du Vide des Impériaux, à la différence qu'une fois abattus, ils ne sont pas réparables et restent donc inactifs jusqu'à la fin de la bataille.
