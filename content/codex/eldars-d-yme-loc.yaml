    note_md: "Ce remplacement fait partie de la composition du Peloton de Gardiens : il ne compte pas dans les 3 améliorations autorisées."

  # ---- Armement des titans (gratuit) ----
  - id: armement_titan_fantome
    nom: Armement du Titan Fantôme
    effet:
      type: choix
      parmi:
        - { id: deux_lasers_pulsars, nom: 2 Lasers Pulsars, cout: 0 }
        - { id: laser_pulsar_poing, nom: 1 Laser Pulsar et 1 Poing Énergétique, cout: 0 }
    contraintes:
      - { type: hors_quota_options }
      - { type: max_par_formation, valeur: 1 }
    note_md: "Le Titan Fantôme peut être équipé de 2 Lasers Pulsars ou de 1 Laser Pulsar et 1 Poing Énergétique. L'armement est gratuit."
  - id: armement_titan_archonte
    nom: Armement du Titan Archonte
    effet:
      type: choix
      parmi:
        - { id: lance_psychique_laser_pulsar, nom: 1 Lance Psychique et 1 Laser Pulsar, cout: 0 }
        - { id: lance_psychique_poing, nom: 1 Lance Psychique et 1 Poing Énergétique, cout: 0 }
    contraintes:
      - { type: hors_quota_options }
      - { type: max_par_formation, valeur: 1 }
