sections:
  - id: options
    titre: OPTIONS
    sous_titre: "Chaque option ne peut être sélectionnée qu'une seule fois. Le Commandant Suprême (0-1, 50 pts) est une option prise sur une formation comportant un Grand Prophète."
    formations: [portail, avatar]
  - id: formations_principales
    titre: FORMATIONS PRINCIPALES
    sous_titre: "Un Ost de Guerre Maîtres Artisans ne peut être sélectionné que si au moins une formation titanique est sélectionnée en Support Lourd."
    formations: [ost_guerre_maitres_artisans, ost_guerre_lame_vaul, ost_guerre_machines_vaul]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
  - id: formations_support
    titre: FORMATIONS DE SUPPORT
    sous_titre: "Jusqu'à 3 formations de Support par Ost de Guerre"
    formations: [peloton_aspects, peloton_rangers, peloton_gardiens, peloton_windrider, escadron_marcheurs, escadron_bouclier_vaul, escadron_lynx, escadron_chevaliers]
    contraintes:
      - { type: consomme, budget: slot_support }
      - { type: max_options, valeur: 3 }
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation, et jusqu'à un maximum de 3 par formation."
  - id: support_lourd
    titre: FORMATIONS DE SUPPORT LOURD
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations. Les formations de Titan Archonte, Titan Fantôme et Titans Revenants peuvent recevoir l'amélioration Pierres Esprit."
    formations: [croiseur_eldar, escadrille_nightshades, escadrille_nightwings, escadrille_phoenix, vampire_hunter, titan_archonte, titan_fantome, escadron_titans_revenants]
    contraintes:
      - { type: consomme, budget: rare, quoi: points }
      - { type: max_options, valeur: 3 }

listes_test:
  - nom: "3000 pts valide, deux Osts de Guerre, quatre supports et un escadron de Revenants"
    limite: 3000
    attendu: valide
    formations:
      - formation: ost_guerre_lame_vaul
        choix: { "1": { falcon: 3, warp_hunter: 2, prisme_feu: 2 } }
        options:
          - { option: pierres_esprit }
          - { option: commandant_supreme }
          - { option: firestorm_remplacement, quantite: 1 }
      - formation: ost_guerre_machines_vaul
        choix: { "0": { cobra: 1 } }
        options:
          - { option: pierres_esprit }
          - { option: machine_vaul, repartition: { scorpion: 1 } }
      - formation: peloton_gardiens
        options:
          - { option: gardes_fantomes }
          - { option: plateformes_armes_lourdes, quantite: 3 }
      - formation: peloton_rangers
        options: [{ option: rangers }]
      - formation: peloton_windrider
        choix: { "0": { motojet_wind_rider: 4, vyper_wind_rider: 2 } }
      - { formation: escadron_marcheurs }
      - { formation: escadron_titans_revenants }
      - { formation: avatar }
      - { formation: portail }
  - nom: "2000 pts valide, Chevaliers et Croiseur dans le tiers de support lourd"
    limite: 2000
    attendu: valide
    formations:
      - formation: ost_guerre_machines_vaul
        choix: { "0": { storm_serpent: 1 } }
        options:
          - { option: pierres_esprit }
          - { option: gardiens }
          - { option: wind_riders, choix: deux_motojets_un_vyper }
      - formation: escadron_chevaliers
        options: [{ option: pierres_esprit }]
      - formation: escadron_lynx
        options: [{ option: lynx, quantite: 1 }]
      - formation: peloton_aspects
        variante: banshees
        options:
          - { option: exarque }
          - { option: transport, repartition: { wave_serpent: 3 } }
      - { formation: croiseur_eldar, variante: vaisseau_fantome }
  - nom: "quatre formations de support pour un seul Ost de Guerre"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: ost_guerre_machines_vaul
        choix: { "0": { cobra: 1 } }
      - { formation: peloton_rangers }
      - { formation: escadron_marcheurs }
      - formation: peloton_windrider
        choix: { "0": { motojet_wind_rider: 6 } }
      - { formation: escadron_lynx }
  - nom: "support lourd au-delà du tiers des points"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: ost_guerre_lame_vaul
        choix: { "1": { falcon: 7 } }
      - { formation: titan_archonte }
  - nom: "trois Escadrons de Marcheurs alors que la liste en autorise deux"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: ost_guerre_machines_vaul
        choix: { "0": { cobra: 1 } }
      - { formation: escadron_marcheurs }
      - { formation: escadron_marcheurs }
      - { formation: escadron_marcheurs }
  - nom: "quatre améliorations sur un Ost de Guerre Machines de Vaul"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: ost_guerre_machines_vaul
        choix: { "0": { cobra: 1 } }
        options:
          - { option: pierres_esprit }
          - { option: gardiens }
          - { option: wind_riders, choix: trois_vypers }
          - { option: lynx, quantite: 1 }
