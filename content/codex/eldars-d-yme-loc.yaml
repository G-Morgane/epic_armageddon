options:
  # ---- Option d'armée ----
  - id: commandant_supreme
    nom: Commandant Suprême
    effet: { type: mot_cle, texte: "Commandant Suprême", cout: 50, cible: [grand_prophete] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [grand_prophete] }
      - { type: hors_quota_options }
    phrase_pdf: "Un Grand Prophète gagne la compétence Commandant Suprême"
    note_md: "Option d'armée : elle ne compte pas dans les 3 améliorations autorisées par formation."

  # ---- Améliorations d'Yme-Loc ----
  - id: pierres_esprit
    nom: Pierres Esprit
    effet: { type: mot_cle, texte: "Pierres Esprit", cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter des Pierres Esprit (la formation gagne la compétence meneur)"
  - id: exarque
    nom: Exarque
    effet: { type: ajouter, cout: 25, unites: [{ unite: exarque }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [vengeurs, guerriers_scorpions, banshees, dragons_feu, faucheurs_noirs, araignees_spectrales, aigles_chasseurs, lances_lumiere] }
    phrase_pdf: "Ajouter 1 Exarque à une unité de Guerriers Aspect"
  - id: gardes_fantomes
    nom: Gardes Fantômes
    effet:
      type: ajouter
      cout: 175
      unites:
        - { unite: gardes_fantomes, nombre: 2 }
        - { unite: wave_serpent, nombre: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 unités de Gardes Fantômes et 2 Wave Serpents"
  - id: gardiens
    nom: Gardiens
    effet:
      type: ajouter
      cout: 150
      unites:
        - { unite: gardiens, nombre: 4 }
        - { unite: wave_serpent, nombre: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 4 unités de Gardiens et deux Wave Serpents"
  - id: rangers
    nom: Rangers
    effet:
      type: ajouter
      cout: 100
      unites:
        - { unite: rangers, nombre: 2 }
        - { unite: wave_serpent, nombre: 1 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 unités de Rangers et 1 Wave Serpent"
  - id: wind_riders
    nom: Wind Riders
    effet:
      type: choix
      parmi:
        - id: trois_motojets
          nom: 3 Motojets
          cout: 100
          effet: { type: ajouter, cout: 0, unites: [{ unite: motojet_wind_rider, nombre: 3 }] }
        - id: deux_motojets_un_vyper
          nom: 2 Motojets et 1 Vyper
          cout: 100
          effet:
            type: ajouter
            cout: 0
            unites:
              - { unite: motojet_wind_rider, nombre: 2 }
              - { unite: vyper_wind_rider, nombre: 1 }
        - id: un_motojet_deux_vypers
          nom: 1 Motojet et 2 Vypers
          cout: 100
          effet:
            type: ajouter
            cout: 0
            unites:
              - { unite: motojet_wind_rider, nombre: 1 }
              - { unite: vyper_wind_rider, nombre: 2 }
        - id: trois_vypers
          nom: 3 Vypers
          cout: 100
          effet: { type: ajouter, cout: 0, unites: [{ unite: vyper_wind_rider, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 3 unités de Motojets ou de Vypers selon n'importe quelle combinaison"
  - id: transport
    nom: Transport
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: falcon, cout: 50 }
        - { unite: wave_serpent, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter assez de Wave Serpent et/ou de Falcon pour transporter toute la formation sans qu'il ne reste de place libre."
    note_md: "50 pts le Falcon ou Wave Serpent, 75 pts les 2 Wave Serpents (la remise sur la paire de Wave Serpents n'est pas appliquée automatiquement : chaque véhicule est compté 50 pts)."
  - id: firestorm_remplacement
    nom: Firestorm
    effet: { type: remplacer, de: [tisseur_nuit, falcon, warp_hunter, prisme_feu], par: firestorm, lot: 1, max: 2, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacez 1 ou 2 véhicules blindés de la formation par autant de Firestorms"
  - id: firestorm_gardiens
    nom: Firestorm
    effet: { type: ajouter, cout: 75, unites: [{ unite: firestorm }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Firestorm dans une formation de Gardiens"
  - id: tisseurs_nuit
    nom: Tisseurs de Nuit
    effet: { type: ajouter, cout: 125, unites: [{ unite: tisseur_nuit, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 Tisseurs de Nuit"
  - id: lynx
    nom: Lynx
    effet: { type: ajouter, cout_par_unite: 150, unites: [{ unite: lynx }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Lynx"
  - id: machine_vaul
    nom: Machine de Vaul
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: cobra, cout: 200 }
        - { unite: scorpion, cout: 200 }
        - { unite: storm_serpent, cout: 200 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 unité(s) supplémentaire(s) parmi : Cobra, Scorpion, Storm Serpent"

  # ---- Remplacement gratuit inscrit dans la composition du Peloton de Gardiens ----
  - id: plateformes_armes_lourdes
    nom: Plate-formes d'Armes Lourdes
    effet: { type: remplacer, de: gardiens, par: plateforme_arme_lourde, lot: 1, max: 3, cout: 0 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
