# Eldars d'Yme-Loc, transcrit depuis le PDF EAFR rev 1.5 (source de vérité).
codex:
  slug: eldars-d-yme-loc
  armee_id: 1854ca15-7c09-49c5-9a81-8363dade11bf
  nom: Eldars d'Yme-Loc
  version: "1.5"
  faction: xenos
  categorie: armees-xenos
  statut: official
  citation:
    texte: "Vous ne pouvez comprendre l'Aigle qu'après avoir plané dans le ciel matinal sur des ailes de feu. Vous ne pouvez comprendre la Banshee qu'après vous être jeté sur vos ennemis terrifiés en hurlant. Vous ne pouvez comprendre la puissance du Dragon qu'après avoir consumé vos ennemis. Et vous ne pouvez comprendre l'Autarque qu'après avoir suivi toutes ces voies et vous être détourné d'elles."
    auteur: Anthrillien Morningchild, Autarque d'Yme-Loc
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée du vaisseau monde Yme-Loc. Cette liste peut également être utilisée comme liste générique pour représenter n'importe quelle autre armée d'eldars.

    Une armée d'eldars est organisée autour de formations principales aussi appelées Osts de guerre. Chaque formation principale permet de recruter jusqu'à 3 formations de support.

    Chaque formation (principale ou de support) est autonome et peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par formation et jusqu'à un maximum de 3. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'une formation tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de support lourd sont des formations autonomes. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.

    Une armée eldar peut également recevoir des options. Chaque option ne peut être sélectionnée qu'une seule fois.
  regles_md:
    - titre: "Règle spéciale : L'Avatar"
      texte: |
        L'Avatar peut apparaître sur le champ de bataille de trois manières différentes :

        1. De manière classique lors du déploiement en début de partie.
        2. Par le biais d'un portail comme n'importe quelle formation se trouvant en réserve.
        3. Par invocation dans les 15 cm d'un grand prophète lors de la phase de téléportation.

        Dans tous les cas, dès son apparition, c'est une formation indépendante et permanente jusqu'à la fin de la partie ou sa destruction. Cependant il ne peut que contester les objectifs.
    - titre: "Règle spéciale : Vision Extra lucide"
      texte: |
        Toute formation Eldar qui n'est pas démoralisée et qui comprend une unité ayant la capacité vision extra lucide ignore la pénalité de -1 au test d'action lorsqu'elle tente de conserver l'initiative.

        De plus, une fois par tour le joueur Eldar peut essayer de retenir l'initiative deux fois d'affilée (le joueur Eldar peut retenir l'initiative et faire une autre action qu'après avoir déjà réussi à retenir l'initiative une première fois).

        N'importe quelle formation Eldar peut être choisie, y compris celles ne comportant pas de Grand Prophète, néanmoins un Grand Prophète doit impérativement être encore en jeu sur le champ de bataille. La formation doit tout de même passer un test d'initiative pour ne pas perdre l'action, et elle subit le modificateur de -1 pour avoir retenu l'initiative, sauf si elle comprend une unité ayant la capacité vision extra lucide. Une fois l'action réalisée, l'initiative retourne au joueur adverse.
    - titre: "Règle spéciale : Armée en mouvement"
      texte: |
        Seuls les Rangers et les Marcheurs de combat peuvent se déployer en garnison.
    - titre: "Règle spéciale : Tactique du tirer et courir"
      texte: |
        Cette règle spéciale s'applique à toutes les formations de l'armée Eldar. Les formations Eldars qui reçoivent l'ordre avance ou avance rapide peuvent choisir de tirer soit avant soit après chaque mouvement. Elles ne peuvent néanmoins tirer qu'une seule fois durant l'action. Par exemple, une formation Eldar avec un ordre avance peut tirer puis se déplacer ou se déplacer puis tirer, de même une formation avec un ordre d'avance rapide peut tirer et se déplacer deux fois, se déplacer deux fois et tirer, ou se déplacer puis tirer puis encore bouger.

        De plus, les formations Eldars qui remportent un assaut sont autorisées à utiliser la totalité de leur mouvement lorsqu'elles consolident leur position, au lieu d'être limitées à un mouvement de 5 cm comme cela devrait être normalement le cas.

        Cependant (hormis pour les formations de Guerriers Aspects), les formations Eldars qui choisissent de consolider de leur mouvement complet ne peuvent en aucun cas prétendre au soutien d'un autre assaut. Les formations qui souhaitent soutenir un nouvel assaut ne doivent alors consolider que de 5 cm.

        Les formations de Guerriers Aspects peuvent toujours consolider de leur mouvement complet et soutenir d'autres assauts.
    - titre: "Règle spéciale : Holo-Champs"
      texte: |
        Les Holo-champs procurent aux titans Eldars une sauvegarde spéciale de 3+ qui peut être utilisée à la place de la sauvegarde normale du titan.

        Cette sauvegarde peut toujours être utilisée, même en corps-à-corps, en fusillade et contre les armes tueuses de titan ou les macro armes. Faites une seule sauvegarde contre les armes avec la capacité tueuse de titan, au lieu de séparer les sauvegardes pour chaque point de dommage. Si un véhicule avec un Holo-champ a aussi un blindage renforcé, alors il est autorisé à relancer ses sauvegardes, sauf pour les attaques réalisées avec des armes ayant la capacité lance, macro-armes ou tueuses de titans. La relance doit être faite en utilisant la sauvegarde de blindage de l'unité et non celle de l'Holo-champ.

        Aucun point d'impact n'est placé pour une touche avec une arme ayant le trait Rupture sauvée par l'Holo-champ.

        La sauvegarde de l'Holo-champ peut tout à fait être modifiée par un tir croisé ou par les armes Sniper.
    - titre: "Règle spéciale : Portails de Yme-Loc"
      texte: |
        Chaque Portail inclus dans une armée permet au joueur Eldar de conserver en réserve jusqu'à trois formations.

        Les formations en réserve peuvent entrer en jeu par n'importe quel Portail en réalisant une action qui comporte un mouvement. Ce mouvement est alors mesuré à partir du Portail.

        Une seule formation peut voyager à travers chaque portail à chaque tour.

        Une formation ne peut qu'entrer en jeu grâce au portail mais jamais retourner en réserve. Notez qu'une formation qui rate son activation en tentant de franchir un Portail prendra automatiquement l'ordre Tenir (elle peut soit entrer en jeu en réalisant un simple mouvement en prenant 1 PI pour l'activation ratée soit rester hors-table et se regrouper). Si elle choisit de se regrouper en restant hors de table, cela permettra à une autre formation de pouvoir utiliser ce Portail ce tour-ci. Si le Portail utilisé est celui d'une formation démoralisée, alors 1 PI sera attribué à la formation l'utilisant après le jet d'initiative.

        Les formations pouvant utiliser un Portail Fantôme sont : les unités d'infanterie, les véhicules légers, les véhicules blindés dotés de la capacité Marcheur et l'Avatar.

        Les formations pouvant utiliser un Portail de Yme-Loc sont : les unités d'infanterie, les véhicules légers, tous les véhicules blindés et les engins de guerre (sauf les Titans).

        Il est possible de sortir d'un Portail sur lequel une unité adverse se trouve en déclarant un assaut contre cette formation. Une unité sortante doit utiliser son mouvement de charge pour arriver en contact avec l'ennemi le plus proche dont elle doit traverser la zone de contrôle. Une fois ainsi engagée au contact d'un ennemi, ce dernier perd sa zone de contrôle pour le reste de l'action (y compris l'assaut qui s'ensuit). Cela permet à d'autres unités sortantes de contourner l'ennemi pour engager le reste de la formation. Une unité sortant d'un Portail Fantôme peut « traverser » un ennemi par dérogation à la règle 1.7.3. pour pouvoir se placer en assaut.

        Les formations avec plusieurs options de déploiement doivent désigner leur méthode de déploiement avant le choix du bord de table (Portail, aéronef, téléportation...).

        Le joueur Eldar peut pour 100 pts placer un Portail de Yme-Loc sur un objectif de sa moitié de table, il compte à la fois comme un objectif et un Portail. Il ne peut ni être attaqué ni détruit.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Chillstrand, intérieure GW."
  valeur_strategique: 4
  initiative:
    defaut: "2+"
    exceptions:
