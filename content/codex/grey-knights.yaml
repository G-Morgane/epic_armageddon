  - id: barge_bataille
    nom: Barge de bataille
    type: VS
    armes:
      - { nom: Bombardement Orbital (14), portee: "∞", puissance: "14PB, MA" }
    notes:
      - "Lent, ne peut être utilisé aux tours 1 et 2."
      - "Transport (60+60+6) : Strikes Squads, Purifiers, Purgators, Terminators, Dreadnought, plus 60 véhicules parmi Rhinos, Razorbacks, Hunters et Land Raiders ainsi que 6 Thunderhawks et Thunderhawks Transporteurs. De plus, la Barge de Bataille peut transporter le nombre nécessaire de Stormravens et Barges de Débarquement pour transporter le reste des unités à son bord."

  # ---- Légions Titaniques : importées par l'alliance avec adeptus-titanicus ----

options:
  - id: commandant
    nom: Commandant
    effet:
      type: choix
      parmi:
        - { id: capitaine, nom: Capitaine, cout: 50, effet: { type: ajouter, unites: [{ unite: capitaine }] } }
        - { id: archiviste, nom: Archiviste, cout: 50, effet: { type: ajouter, unites: [{ unite: archiviste }] } }
        - { id: chapelain, nom: Chapelain, cout: 50, effet: { type: ajouter, unites: [{ unite: chapelain }] } }
        - id: maitre_chapitre
          nom: Maître de Chapitre
          cout: 50
          effet: { type: ajouter, unites: [{ unite: maitre_chapitre }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Capitaine ou un Archiviste ou un Chapelain (50 pts) ; remplacer un Capitaine par 0-1 Maître de Chapitre (gratuit)"
    note_md: "Le Maître de Chapitre remplace le Capitaine sans surcoût : l'amélioration coûte 50 pts dans tous les cas, et l'armée ne peut en aligner qu'un seul. Le détachement Némésis DreadKnights ne peut prendre cette amélioration que sous la forme du Maître de Chapitre."
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 50, cible: [terminators, terminators_assaut, paladins] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Téléportation aux unités d'infanterie de la formation"
    note_md: "La note n'est ajoutée qu'aux unités d'infanterie de la formation. Le détachement Némésis DreadKnights peut acheter l'amélioration bien que les DreadKnights soient des véhicules légers."
  - id: techmarines
    nom: Techmarines
    effet: { type: ajouter, cout: 25, unites: [{ unite: techmarines }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 personnage de Techmarines à la formation"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorback
    nom: Razorback
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à autant de Razorbacks Bolters Lourds ou de Razorbacks Canons Laser que d'unités à transporter, 25 pts chacun"
  - id: dreadnought
    nom: Dreadnought
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: dreadnought, cout: 50 }
        - { unite: dreadnought_feu_enfer, cout: 50 }
        - { unite: dreadnought_venerable, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Dreadnoughts à la formation selon n'importe quelle combinaison : Dreadnought, Dreadnought Feu d'enfer (50 pts chacun), Dreadnought Vénérable (75 pts chacun)"
  - id: support_specialistes
    nom: Support Spécialistes
    effet:
      type: choix_multiple
      total: { min: 1, max: 4 }
      parmi:
        - { unite: purgators, cout: 50 }
        - { unite: purifiers, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 unités de soutien à la formation selon n'importe quelle combinaison parmi Purgators et Purifiers, 50 pts chacune"
  - id: land_raider
    nom: Land Raider
    effet:
      type: choix_multiple
      total: { min: 1, max: 4 }
      parmi:
        - { unite: land_raider, cout: 75 }
        - { unite: land_raider_redeemer, cout: 75 }
        - { unite: land_raider_crusader, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 Land Raiders ou Land Raiders Redeemer ou Land Raiders Crusader à la formation, 75 pts chacun"
  - id: terminators
    nom: Terminators
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: un_terminator, nom: 1 Terminator, cout: 75, unites: [{ unite: terminators }] }
        - { id: deux_terminators, nom: 2 Terminators, cout: 150, unites: [{ unite: terminators, nombre: 2 }] }
        - { id: un_paladin, nom: 1 Paladin, cout: 90, unites: [{ unite: paladins }] }
        - { id: deux_paladins, nom: 2 Paladins, cout: 175, unites: [{ unite: paladins, nombre: 2 }] }
        - { id: terminator_paladin, nom: 1 Terminator et 1 Paladin, cout: 165, unites: [{ unite: terminators }, { unite: paladins }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 unités à la formation selon n'importe quelle combinaison parmi Terminator (75 pts chacun) et Paladin (90 pts chacun, 175 pts les deux)"
    note_md: "La paire de Paladins est facturée 175 pts et non 180 : les cinq combinaisons possibles sont donc listées avec leur prix exact."
  - id: chimere
    nom: Chimère
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: chimere }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez assez de Chimères Inquisitoriales pour transporter toute la formation, 25 pts chacune"
    note_md: "La Chimère ne transporte que des Troupes de Choc Inquisitoriales : l'Inquisiteur, personnage rattaché à la formation, n'occupe pas de place."
  - id: valkyrie
    nom: Valkyrie
    effet: { type: ajouter, cout: 150, unites: [{ unite: valkyrie_inquisitoriale, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 4 Valkyries Inquisitoriales à la formation"
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: dreadnought_feu_enfer
          nom: Dreadnought Feu d'Enfer à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought_feu_enfer, tout: true, par_nombre: 1, cout: 0 }
        - id: dreadnought_venerable
          nom: Dreadnought Vénérable à la place des Rhinos
          cout: 25
          effet: { type: remplacer, de: rhino, par: dreadnought_venerable, tout: true, par_nombre: 1, cout: 0 }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer gratuitement tous les Rhinos de la formation par un Dreadnought ou un Dreadnought Feu d'enfer, ou par un Dreadnought Vénérable (+25 pts)"
    note_md: "Vient de la règle spéciale Transports et non du tableau des améliorations. Les Grey Knights n'ont pas accès aux Modules d'assaut planétaire."

