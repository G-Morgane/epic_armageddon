# Grey Knights, transcrit depuis le PDF EAFR rev 1.2 (source de vérité).
codex:
  slug: grey-knights
  armee_id: 297c4bc5-675a-458c-9da2-520a60c8b537
  logo: /icons/grey_knights.svg
  nom: Grey Knights
  version: "1.2"
  faction: imperium
  categorie: armees-astartes
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/grey-knights.jpg
  couleur: "#6e7b88"
  citation:
    texte: "Nous sommes des guerriers Chevaliers Gris, dont l'armure est la Foi, le bouclier la Dévotion et l'arme notre Devoir Sacré. Mais plus que tout, nous portons la flamme divine de l'Empereur de l'Humanité dans les ténèbres afin d'y purger le Démon."
    auteur: Frère-Capitaine Stern des Chevaliers Gris
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de Grey Knights.

    Les armées des Grey Knights sont organisées autour de petites formations appelées détachements principaux ainsi que des détachements de soutien qui leurs sont autonomes.

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de support sont des formations autonomes des détachements. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.

    Concernant le transport, les unités suivantes seront jugées comme équivalentes : Terminators d'assaut, Paladins ↔ Terminators.
  regles_md:
    - titre: "Règle spéciale : Némésis du Chaos"
      texte: |
        Quand une formation de Space Marines Grey Knights est engagée dans un assaut comprenant au moins une unité de démons invoqués (démon mineur ou majeur), elle comptera comme Charismatique pour ce combat.
    - titre: "Règle spéciale : Psyker"
      texte: |
        Une formation contenant au moins 1 Psyker peut effectuer un tir à 30 cm après qu'elle ait été désignée pour s'activer et avant de lancer le jet d'initiative. La qualité de la touche dépendra du nombre d'unités non neutralisées disposant de la note Psyker dans la formation. Cette action spéciale est considérée comme un tir concernant les règles mais une seule unité a besoin d'une ligne de vue sur la formation ciblée.

        Si la formation fait ce tir, elle aura un malus de -1 pour s'activer à ce tour.

        Table des Psykers :

        - 1 à 3 Psykers : MA5+
        - 4 à 5 Psykers : MA4+
        - 6 à 7 Psykers : MA3+
        - 8 Psykers et plus : MA2+

        Les unités contenant 1 Archiviste ou le Maître de Chapitre comptent comme 3 Psykers. Les unités de Paladins comptent comme 2 Psykers.

        Si l'action entreprise ensuite par la formation comporte un tir ou si l'action est un assaut, la formation ciblée doit impérativement être la même que celle du tir psy.
    - titre: "Règle spéciale : Et ils ne connaîtront pas la peur"
      texte: |
        La bravoure et la ténacité des Space Marines sont légendaires. Ces traits de caractère sont représentés par les règles suivantes :

        - Il faut deux pions d'impact pour neutraliser une unité Space Marines ou détruire une unité démoralisée (ignorez les pions d'impacts en plus).
        - Les formations Space Marines ne sont démoralisées qu'à partir du moment où elles ont deux pions d'impact ou plus par unité.
        - Les formations Space Marines comptent comme ayant la moitié de leur nombre de pions impact lors de la résolution de l'assaut (arrondi à l'inférieur, à un minimum de 1 pion impact).
        - Réduisez de moitié le nombre de touches supplémentaires subies par une formation de Space Marines perdant un assaut, en arrondissant à l'entier inférieur en faveur des Space Marines.
        - Lorsqu'une formation Space Marines démoralisée se rallie, elle reçoit un nombre de pions impact égal au nombre d'unités plutôt qu'à la moitié du nombre d'unités.
        - Les Meneurs Space Marines retirent deux pions d'impact au lieu d'habituellement un seul.

        Attention : les formations de Servitors, la Suite Inquisitoriale et les formations des Légions Titaniques ne bénéficient pas de cette règle.
    - titre: "Règle spéciale : Transports"
      texte: |
        Les formations Space Marines disposant d'unités avec le suffixe « + Transports » peuvent prendre assez de Rhinos pour transporter l'intégralité de la formation. Si cette option est prise, le nombre de Rhinos doit être suffisant, mais la capacité totale de transport ne doit pas être excédentaire par rapport au nombre d'unités à transporter.

        Si des véhicules avec une capacité de transport ont été achetés pour la formation (comme des Razorbacks ou des Land Raiders), on considère qu'ils transportent au maximum de leurs capacités et qu'il est possible de prendre assez de Rhinos pour transporter ce qu'il reste de la formation (même si un Rhino se retrouve à moitié vide).

        En outre, il est possible de remplacer gratuitement tous les Rhinos de la formation par un Dreadnought ou un Dreadnought Feu d'enfer, ou par un Dreadnought Vénérable (+25 pts).

        Les Grey Knights n'ont pas accès aux Modules d'assaut planétaire.
