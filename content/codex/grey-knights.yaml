      - { nom: Bolters Lourds Jumelés (AA Droite), portee: 30cm, puissance: "AP4+/AA5+, Drt" }
      - { nom: Bolters Lourds Jumelés (AA Gauche), portee: 30cm, puissance: "AP4+/AA5+, Gch" }
    notes: [Assaut planétaire, Blindage renforcé, "Transport (8) : Strikes Squads, Purifiers, Purgators, Terminators, Dreadnought (Terminators et Dreadnought prennent 2 places)"]
    transport: { capacite: 8, accepte: [strikes_squad, purifiers, purgators, terminators, terminators_assaut, paladins, dreadnought, dreadnought_feu_enfer, dreadnought_venerable] }
    degats: { cd: 2, critique: "L'appareil s'écrase au sol, tuant tous ceux à son bord" }
  - id: barge_debarquement
    nom: Barge de débarquement
    type: A/EG
    vitesse: B
    blindage: "4+"
    cc: "5+"
    ff: "3+"
    armes:
      - { nom: 2x Canons Laser Jumelés, portee: 45cm, puissance: "AC4+" }
      - { nom: 3x Bolters Lourds Jumelés (Barge), portee: 30cm, puissance: "AP4+/AA5+" }
    notes:
      - Blindage Renforcé
      - Blindage Arrière Renforcé
      - Assaut planétaire
      - "Transport (12+6/4) : Strikes Squads, Purifiers, Purgators, Terminators, Dreadnought (Terminators et Dreadnought prennent 2 places), plus 6 véhicules parmi Rhinos, Razorbacks, Hunters, ou 4 Land Raiders"
    transport: { capacite: 12, accepte: [strikes_squad, purifiers, purgators, terminators, terminators_assaut, paladins, dreadnought, dreadnought_feu_enfer, dreadnought_venerable] }
    degats: { cd: 4, critique: "La Barge de débarquement s'écrase au sol et est détruite, ainsi que toutes les unités à son bord. Toute unité dans un rayon de 5cm de l'appareil subit une touche si la Barge de débarquement se trouvait au sol." }
