sections:
  - id: detachements_principaux
    titre: DÉTACHEMENTS PRINCIPAUX GREY KNIGHTS
    formations: [terminators, strikes_squad]
    colonne_options: true
    notes:
      strikes_squad: "L'armée doit comprendre au moins un détachement de Strikes Squad."
  - id: detachements_soutien
    titre: DÉTACHEMENTS DE SOUTIEN
    sous_titre: "3 Détachements de Soutien maximum par Détachement Principal"
    formations: [dreadknights, paladins, terminators_assaut, interceptors, purgators, purifiers, land_raiders, servitors, suite_inquisitoriale]
    contraintes: [{ type: consomme, budget: soutien }]
    colonne_options: true
    # Tableau unique des améliorations du PDF : `options` reprend toutes les améliorations dans l'ordre du PDF
    # (chaque formation garde sa propre liste `options`, cette liste ne sert qu'au tableau).
    options: [commandant, teleportation, techmarines, hunter, razorback, dreadnought, support_specialistes, land_raider, terminators, chimere, valkyrie, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS GREY KNIGHTS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement"
    notes:
      dreadknights: "Le détachement Némésis DreadKnights ne peut prendre l'amélioration Commandant que sous la forme du Maître de Chapitre."
      sans_peur: "Les formations de Servitors et la Suite Inquisitoriale ne bénéficient pas de la règle « Et ils ne connaîtront pas la peur » et ont une initiative de 2+."
  - id: flotte
    titre: FLOTTE GREY KNIGHTS
    sous_titre: "SUPPORTS GREY KNIGHTS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [thunderhawks_transporteurs, thunderhawk, barge_debarquement, intercepteurs_stormtalons, intercepteurs_stormhawk, storm_raven, soutien_orbital]
  - id: titanicus
    titre: SOUTIENS DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS GREY KNIGHTS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: adeptus-titanicus }
    notes:
      sans_peur: "Les formations des Légions Titaniques ne bénéficient pas de la règle « Et ils ne connaîtront pas la peur »."

listes_test:
  - nom: "3000 pts valide, deux détachements principaux, Paladins, DreadKnights et Suite Inquisitoriale"
    limite: 3000
    attendu: valide
    formations:
      - formation: strikes_squad
        options:
          - { option: commandant, choix: capitaine }
          - { option: dreadnought, repartition: { dreadnought: 1 } }
      - formation: terminators
        options:
          - { option: teleportation }
          - { option: land_raider, repartition: { land_raider: 1, land_raider_crusader: 1 } }
      - formation: paladins
        options:
          - { option: commandant, choix: maitre_chapitre }
      - formation: dreadknights
        choix: { "0": { dreadknight_incinerator: 2, dreadknight_daemon_hunter: 1 } }
      - formation: suite_inquisitoriale
        options:
          - { option: chimere, quantite: 4 }
      - { formation: interceptors }
      - { formation: thunderhawk }
      - { formation: titan_warhound }
  - nom: "2000 pts valide, Razorbacks, Dreadnought à la place des Rhinos et paire de Paladins"
    limite: 2000
    attendu: valide
    formations:
      - formation: strikes_squad
        options:
          - { option: razorback, repartition: { razorback_bolters_lourds: 2, razorback_canons_laser: 1 } }
          - { option: transport_remplacement, choix: dreadnought_venerable }
      - formation: terminators_assaut
        options:
          - { option: terminators, variante: deux_paladins }
      - formation: land_raiders
        choix: { "0": { land_raider: 2, land_raider_redeemer: 1, land_raider_crusader: 1 } }
      - { formation: soutien_orbital, variante: croiseur }
  - nom: "1500 pts valide, Servitors, Purifiers et Stormtalons"
    limite: 1500
    attendu: valide
    formations:
      - formation: strikes_squad
        options:
          - { option: support_specialistes, repartition: { purgators: 2 } }
      - formation: servitors
        options: [{ option: techmarines }]
      - formation: purifiers
        options: [{ option: commandant, choix: archiviste }]
      - { formation: intercepteurs_stormtalons, variante: annihilator }
  - nom: "armée sans détachement de Strikes Squad"
    limite: 1500
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: terminators }
      - { formation: terminators_assaut }
  - nom: "deux Maîtres de Chapitre"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: strikes_squad
        options: [{ option: commandant, choix: maitre_chapitre }]
      - formation: terminators
        options: [{ option: commandant, choix: maitre_chapitre }]
  - nom: "quatre détachements de soutien pour un seul détachement principal"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: strikes_squad }
      - { formation: interceptors }
      - { formation: terminators_assaut }
      - { formation: purifiers }
      - { formation: servitors }
  - nom: "Razorbacks sur un détachement de Terminators"
    limite: 2000
    attendu: refusee
    erreur: option_interdite
    formations:
      - { formation: strikes_squad }
      - formation: terminators
        options: [{ option: razorback, repartition: { razorback_bolters_lourds: 2 } }]
  - nom: "trois Dreadnoughts en une seule amélioration"
    limite: 2000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: strikes_squad
        options:
          - { option: dreadnought, repartition: { dreadnought: 2, dreadnought_venerable: 1 } }
