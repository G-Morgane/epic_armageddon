sections:
  - id: principaux
    titre: DÉTACHEMENTS PRINCIPAUX BLOOD ANGELS
    formations: [compagnie_mort, assaut, tactique_assaut]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]
    colonne_options: true
    notes:
      compagnie_mort: "Une armée Blood Angels doit obligatoirement inclure un, et un seul, détachement Compagnie de la Mort."
  - id: soutien
    titre: DÉTACHEMENTS DE SOUTIEN
    sous_titre: "Jusqu'à 3 Détachements de Soutien par Détachement principal"
    formations: [garde_sanguinienne, tactique, devastator, terminator, scouts, motos, land_speeders, land_raiders, predators, vindicators, whirlwinds]
    contraintes: [{ type: consomme, budget: soutien }]
    colonne_options: true
    # Tableau unique des améliorations du PDF : `options` reprend toutes les améliorations dans l'ordre du PDF
    # (chaque formation garde sa propre liste `options`, cette liste ne sert qu'au tableau).
    options: [commandant, commandant_garde, teleportation, sniper, hunter, razorback, dreadnought, support_lourd, land_raider, vindicator, tornado_typhoon, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS BLOOD ANGELS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement"
  - id: flotte
    titre: FLOTTE BLOOD ANGELS
    sous_titre: "SUPPORTS BLOOD ANGELS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [thunderhawks_transporteurs, thunderhawk, barge_debarquement, intercepteurs_stormtalons, stormeagles, stormravens, caestus, soutien_orbital]
  - id: titanicus
    titre: SOUTIENS DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS BLOOD ANGELS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: adeptus-titanicus }
    notes:
      sans_peur: "Les formations prises en Soutien des Légions Titaniques ne bénéficient pas de la règle « Et ils ne connaîtront pas la peur »."

listes_test:
