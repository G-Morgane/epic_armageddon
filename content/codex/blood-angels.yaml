  # ---- Légions Titaniques : importées par l'alliance avec adeptus-titanicus ----

options:
  - id: commandant
    nom: Commandant
    effet:
      type: choix
      parmi:
        - { id: capitaine, nom: Capitaine, cout: 50, effet: { type: ajouter, unites: [{ unite: capitaine }] } }
        - { id: archiviste, nom: Archiviste, cout: 50, effet: { type: ajouter, unites: [{ unite: archiviste }] } }
        - { id: chapelain, nom: Chapelain, cout: 50, effet: { type: ajouter, unites: [{ unite: chapelain }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Capitaine ou un Archiviste ou un Chapelain (Remplacer un Capitaine par 0-1 Maître de Chapitre, gratuit)"
    note_md: "Le Maître de Chapitre n'est proposé que sur la Garde Sanguinienne : la fiche des Gardes Sanguiniens impose qu'il rejoigne cette formation s'il fait partie de l'armée, et la Garde Sanguinienne n'accepte que lui comme Commandant."
  - id: commandant_garde
    nom: Commandant (Maître de Chapitre uniquement)
    effet:
      type: choix
      parmi:
        - { id: maitre_chapitre, nom: Maître de Chapitre, cout: 50, effet: { type: ajouter, unites: [{ unite: maitre_chapitre }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }, { type: max_par_armee, valeur: 1 }]
    phrase_pdf: "Ajouter 0-1 Maître de Chapitre"
    note_md: "Un seul Maître de Chapitre par armée (Commandant Suprême). S'il fait partie de l'armée, il rejoint obligatoirement la formation de la Garde Sanguinienne."
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 50, cible: [terminators] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Téléportation aux unités d'infanterie de la formation"
  - id: sniper
    nom: Sniper
    effet: { type: mot_cle, texte: Sniper, cout: 50, cible: [scouts] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Les Bolters Lourds des unités de Scouts reçoivent la Note Sniper"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorback
    nom: Razorback
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter autant de Razorback Bolters Lourds ou de Razorback Canons Laser que d'unités à transporter (25 pts chacun)"
  - id: dreadnought
    nom: Dreadnought
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: dreadnought, cout: 50 }
        - { unite: dreadnought_feu_enfer, cout: 50 }
        - { unite: dreadnought_furioso, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Dreadnoughts à la formation parmi Dreadnought, Dreadnought Feu d'Enfer et Dreadnought Furioso (50 pts chacun)"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: predator_annihilator, cout: 65 }
        - { unite: predator_destructor, cout: 65 }
        - { unite: predator_baal, cout: 65 }
        - { unite: vindicator, cout: 65 }
        - { unite: land_raider, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 véhicules blindés à la formation selon n'importe quelle combinaison : Predators Annihilator, Predators Destructor, Predators Baal, Vindicator (65 pts chacun), Land Raiders (75 pts chacun)"
  - id: land_raider
    nom: Land Raider
    effet: { type: ajouter, cout_par_unite: 75, unites: [{ unite: land_raider }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 Land Raiders à la formation (75 pts chacun)"
  - id: vindicator
    nom: Vindicator
    effet: { type: ajouter, cout_par_unite: 65, unites: [{ unite: vindicator }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Vindicators à la formation (65 pts chacun)"
  - id: tornado_typhoon
    nom: Tornado / Typhoon
    effet: { type: mot_cle, texte: "Land Speeders Tornado et Typhoon au choix dans la composition", cout: 0, cible: [land_speeder, land_speeder_tornado, land_speeder_typhoon] }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation peut contenir des Land Speeders selon n'importe quelle combinaison : remplacer des unités par autant de Land Speeders Tornado (5 pts chacun) ou de Land Speeders Typhoon (15 pts chacun)"
    note_md: "Porté par la composition de la formation Land Speeders (5 unités parmi Land Speeder 0 pt, Tornado 5 pts, Typhoon 15 pts) ; cette ligne ne sert qu'à l'affichage du tableau."
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Modules d'Atterrissage à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage, tout: true, par_nombre: 1, cout: 0 }
          contraintes: [{ type: exclut, options: [razorback, hunter, support_lourd] }]
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par des Modules d'Atterrissage"
    note_md: "Règle spéciale Transports : une formation contenant des unités ne pouvant pas être déployées en Module d'Atterrissage (Razorbacks, Hunter, Support Lourd) ne peut pas choisir le Module. Interdit aux détachements de Scouts. Le PDF ne précise pas quel Dreadnought remplace les Rhinos : le Dreadnought de base est retenu ici."

formations:
