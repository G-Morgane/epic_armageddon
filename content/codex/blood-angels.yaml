      - { formation: assaut }
      - formation: garde_sanguinienne
        variante: six
        options:
          - { option: commandant_garde, choix: maitre_chapitre }
          - { option: support_lourd, repartition: { land_raider: 1 } }
      - formation: tactique
        options:
          - { option: razorback, repartition: { razorback_bolters_lourds: 1, razorback_canons_laser: 1 } }
          - { option: hunter }
      - formation: terminator
        options:
          - { option: teleportation }
          - { option: land_raider, quantite: 2 }
      - { formation: titan_warhound }
  - nom: "2000 pts valide, Modules d'Atterrissage et Stormravens"
    limite: 2000
    attendu: valide
    formations:
      - { formation: compagnie_mort, variante: assaut }
      - formation: tactique_assaut
        variante: quatre
