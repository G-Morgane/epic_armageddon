# Squats, transcrit depuis le PDF EAFR rev 1.3 (source de vérité).
codex:
  slug: squats
  armee_id: 6eba8947-c08a-4265-b3bd-c94e47077c27
  nom: Squats
  version: "1.3"
  faction: xenos
  categorie: armees-xenos
  statut: official
  citation:
    texte: "Ne sous-estimez pas les Squats. Ils ont survécu des millénaires coupés de l'Impérium et assaillis de tous les côtés. Leur détermination et leur résistance est un exemple pour tout le monde."
    auteur: "Leman Russ, Méditations sur le commandement Impérial, Livre XVI"
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de Squats.

    Les armées Squats sont organisées en formations séparées en trois catégories : Confréries, Formations de soutien, et Engins de Guerre.

    Chaque formation de Confréries et formation de soutien peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par formation pour un maximum de quatre par formation. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion. Notez que certaines améliorations remplacent des unités d'une formation tandis que d'autres ajoutent des unités supplémentaires.

    Les armées Squats ont une valeur stratégique de 3. Les Gardes du Foyer, le Colossus, le Cyclope et le Train Blindé ont une valeur d'initiative de 1+. Les autres formations Squat ont une valeur d'initiative de 2+.
  regles_md:
    - titre: "Règle spéciale : Disrupteur (Drpt)"
      texte: |
        Les Squats utilisent des canons de vaisseau spatial appelés « Canon Furie », montés sur forteresse mobile.

        Ce canon projette un rayon continu très puissant faisant rapidement surchauffer les systèmes de protection. Chaque Touche avec ces armes détruit deux Boucliers du vide (ou autre appareil de protection ayant les mêmes effets) au lieu d'un.
    - titre: "Règle spéciale : Obstiné"
      texte: |
        Les Squats sont un peuple obstiné et difficile à vaincre en assaut. Leur nature bornée les pousse également à se rallier plus vite que les autres races pour retourner au combat !

        - Une formation Squat est démoralisée dès qu'elle a accumulé un nombre de pions Impact égal au nombre d'unités + 1.
        - Lorsqu'une formation Squat perd un assaut, elle subit une perte de moins lors de la résolution des touches supplémentaires. Ceci peut réduire à zéro les pertes encourues en résolution.
    - titre: "Règle spéciale : Esprit des Ancêtres"
      texte: |
        Les Ancêtres vivants sont vénérés en tant qu'incarnations de l'Esprit des Ancêtres qui veille sur la forteresse. Ceux-ci développent de puissants pouvoirs psychiques, souvent de nature prémonitoire et protectrice.

        Tant qu'il se trouve dans la formation, un Ancêtre Vivant confère à l'ensemble des unités qui la compose la règle Sauvegarde Invulnérable.
    - titre: "Règle spéciale : Boucliers du Vide"
      texte: |
        Certains engins de guerre comme les Léviathans sont protégés par des boucliers énergétiques. Le nombre de boucliers de chaque engin de guerre est noté sur sa fiche d'unité.

        Chaque bouclier annule automatiquement un point de dommage avant de se désactiver. Ne faites pas de sauvegarde contre les attaques stoppées par des boucliers, n'ajoutez pas non plus de pion d'impact pour chaque bouclier désactivé.

        Une fois que tous les boucliers sont désactivés, l'engin de guerre peut être endommagé normalement. Faites les jets de sauvegarde habituels contre les touches subies.

        Les touches de corps-à-corps lors d'un assaut ignorent les boucliers mais pas les touches des unités utilisant leur valeur de fusillade.

        Les boucliers désactivés peuvent être réparés. Un engin de guerre peut réparer un bouclier désactivé à la fin de chaque tour.

        De plus, si un engin de guerre se regroupe, il peut utiliser le résultat de son dé pour retirer des pions d'impact et/ou pour réparer des boucliers (par exemple, si le résultat est 2, vous pouvez retirer 2 pions d'impact ou réparer 2 boucliers, ou retirer 1 pion d'impact et réparer 1 bouclier).
    - titre: "Règle spéciale : Tunneliers"
      texte: |
        Les formations où toutes les unités sont tunneliers (ou sont transportées dans des unités qui sont tunneliers) peuvent être gardées hors de la table et peuvent apparaître au début du deuxième tour ou après. Mettez en place les unités au contact du bord de la table de leur propre camp avant le début de la bataille en même temps que les vaisseaux spatiaux sont installés (voir 4.3.1). Toutes les unités transportées dans le tunnelier doivent également être placées de côté à ce moment.

        Notez secrètement l'emplacement où le tunnelier fera surface en même temps et de la même manière que vous enregistrez les coordonnées d'une zone de largage (voir 4.3.1). Vous devez également enregistrer secrètement quand le tunnelier fera surface. S'il doit faire surface dans votre moitié de table, il peut arriver à partir du deuxième tour. S'il doit faire surface dans la moitié opposée de la table, il peut arriver à partir du troisième tour.

        Placez le tunnelier au début du tour indiqué, avant de placer les unités avec téléportation, à l'endroit que vous avez noté. Toutes les unités transportées sont autorisées à débarquer immédiatement après leur remontée à la surface. La remontée ne compte pas comme un mouvement pour ce qui est du déclenchement des tirs d'état d'alerte. Le débarquement déclenche normalement les tirs d'état d'alerte.

        Si le tunnelier fait surface sur un terrain qui lui est infranchissable, sous une unité amie ou dans une zone de contrôle ennemie, on suppose que l'équipement de détection embarqué le détournera vers un autre point d'entrée. L'unité doit être déplacée par le joueur adverse vers la zone la plus proche où elle peut faire surface. Les formations de plusieurs tunneliers n'ont besoin d'enregistrer qu'un seul emplacement où elles feront surface.

        Placez une unité à cet emplacement, ou à moins de 5 cm d'une autre unité qui a déjà été placée, à condition que toutes les unités soient placées à moins de 15 cm de l'emplacement et sur la moitié appropriée de la table.

        Le tunnelier, et toutes les unités qui y sont transportées, peuvent effectuer une action le tour où ils apparaissent.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Alexey Kruglov."
