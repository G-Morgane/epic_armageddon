  - id: seigneur_de_guerre
    nom: Seigneur de Guerre
    effet: { type: ajouter, cout: 50, unites: [{ unite: seigneur_de_guerre, nombre: 1 }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    note_md: "Ajouter un personnage de Seigneur de Guerre à une unité de la formation"
    phrase_pdf: "Ajouter un personnage de Seigneur de Guerre à une unité de la formation"
  - id: ancetre_vivant
    nom: Ancêtre Vivant
    effet: { type: ajouter, cout: 50, unites: [{ unite: ancetre_vivant, nombre: 1 }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    note_md: "Ajouter un personnage d'Ancêtre Vivant à une unité de la formation"
    phrase_pdf: "Ajouter un personnage d'Ancêtre Vivant à une unité de la formation"
  - id: maitre_guilde
    nom: Maître de la Guilde
    effet: { type: ajouter, cout: 50, unites: [{ unite: maitre_guilde, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [motards_guilde] }
    phrase_pdf: "Ajouter un personnage de Maître de la Guilde à une unité de Motard de la Guilde"
  - id: exo_armure
    nom: Exo-armure
    effet: { type: mot_cle, texte: "Exo-armure : le Seigneur gagne la compétence Blindage Renforcé", cout: 25, cible: [seigneur] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [seigneur] }
    phrase_pdf: "Le seigneur gagne la compétence Blindage Renforcé"
  - id: exotrikes
    nom: Exotrikes
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: exotrikes }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 unités d'Exotrikes à la formation"
  - id: canon_foudre
    nom: Canon Foudre
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: canon_foudre }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 unités de Canons Foudre à la formation"
  - id: leviathan
    nom: Léviathan
    effet: { type: ajouter, cout: 350, unites: [{ unite: leviathan, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Léviathan à la formation"
  - id: trikes
    nom: Trikes
    effet: { type: remplacer, de: motards_guilde, par: trikes_guilde, lot: 1, max: 10, cout: 5 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer des unités de Motards de la Guilde par autant de Trikes"
  - id: tunneliers
    nom: Tunneliers
    effet:
      type: choix
      parmi:
        - id: fouisseuse
          nom: Une Fouisseuse
          cout: 0
          effet: { type: ajouter, cout: 75, unites: [{ unite: fouisseuse, nombre: 1 }] }
        - id: taupes_termites
          nom: Taupes et/ou Termites
          cout: 0
          effet:
            type: choix_multiple
            total: { min: 1, max: besoin_transport }
            parmi:
              - { unite: termite, cout: 25 }
              - { unite: taupe, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter une Fouisseuse à la formation (75 pts) ou ajouter suffisamment de Taupe (50 pts) et/ou Termite (25 pts) pour transporter toute la formation sans qu'il ne reste de place disponible."
    phrase_pdf: "Ajouter une Fouisseuse à la formation ou ajouter suffisamment de Taupe et/ou Termite pour transporter toute la formation sans qu'il ne reste de place disponible"
  - id: rhinos
    nom: Rhinos
    effet: { type: ajouter, cout_par_unite: 15, unites: [{ unite: rhino }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter suffisamment de Rhinos pour transporter la formation"
  - id: land_raiders
    nom: Land Raiders
    effet:
      type: choix
      parmi:
        - id: chacun
          nom: 75 pts chacun
          cout: 0
          effet: { type: ajouter, cout_par_unite: 75, unites: [{ unite: land_raider }], min: 1, max: besoin_transport }
        - id: par_deux
          nom: 125 pts les 2
          cout: 0
          effet: { type: ajouter, cout_par_unite: 125, unites: [{ unite: land_raider, nombre: 2 }], lot: 2, min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter suffisamment de Land Raiders pour transporter la formation"
  # ---- Wagons du Train Blindé (partie intégrante de la formation) ----
  - id: wagons
    nom: Wagons
    effet:
      type: choix_multiple
      total: { min: 4, max: 7 }
      parmi:
        - { unite: wagon_canon, cout: 100, max: 7 }
        - { unite: wagon_berserker, cout: 75, max: 7 }
        - { unite: wagon_mortier, cout: 125, max: 7 }
        - { unite: wagon_marteau_celeste, cout: 125, max: 7 }
        - { unite: wagon_dragon, cout: 100, max: 7 }
        - { unite: wagon_bombe_h, cout: 150, max: 1 }
    contraintes:
      - { type: obligatoire }
      - { type: hors_quota_options }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "0-7 Wagon Canon, 0-7 Wagon Berserker, 0-7 Wagon Mortier, 0-7 Wagon Marteau Céleste, 0-7 Wagon Dragon, 0-1 Wagon Bombe H"

formations:
