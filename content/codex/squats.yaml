sections:
  - id: confreries
    titre: CONFRÉRIES
    formations: [confrerie_guerriers, confrerie_berserkers, confrerie_motards]
    contraintes:
      - { type: max_options, valeur: 4 }
      - { type: fournit, budget: soutien, quantite: 2 }
    options: []
    colonne_options: true
  - id: formations_soutien
    titre: FORMATIONS DE SOUTIEN
    sous_titre: "Deux formations de soutien par Confrérie"
    formations: [confrerie_gardes_foyer, confrerie_guerriers_tonnerre, formation_robots, formation_overlord, formation_gyrocopteres, batterie_foudre, batterie_artillerie, batterie_artillerie_lourde]
    contraintes:
      - { type: max_options, valeur: 4 }
      - { type: consomme, budget: soutien }
    options: [seigneur_de_guerre, ancetre_vivant, maitre_guilde, exo_armure, exotrikes, canon_foudre, leviathan, trikes, tunneliers, rhinos, land_raiders]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une fois par formation"
  - id: engins_guerre
    titre: ENGINS DE GUERRE
    sous_titre: "Jusqu'à 1/3 de la valeur totale de l'armée"
    formations: [leviathan, train_blinde, colossus, cyclope]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    options: []

listes_test:
  - nom: "3000 pts valide : deux Confréries, deux soutiens et un Léviathan"
    limite: 3000
    attendu: valide
    formations:
      - formation: confrerie_guerriers
        variante: onze
        options: [{ option: seigneur_de_guerre }, { option: exo_armure }]
      - formation: confrerie_berserkers
        variante: sept
        options: [{ option: rhinos, quantite: 4 }]
      - formation: confrerie_gardes_foyer
        variante: six
        options: [{ option: ancetre_vivant }]
      - formation: batterie_artillerie
        variante: thudd_guns
        options: [{ option: canon_foudre, quantite: 2 }]
      - { formation: leviathan }
  - nom: "2000 pts valide : Confrérie de Motards et Train Blindé"
    limite: 2000
    attendu: valide
    formations:
      - formation: confrerie_motards
        variante: huit
        options:
          - { option: maitre_guilde }
          - { option: exotrikes, quantite: 2 }
          - { option: trikes, quantite: 3 }
      - formation: train_blinde
        options:
          - option: wagons
            repartition: { wagon_canon: 2, wagon_berserker: 1, wagon_bombe_h: 1 }
  - nom: "trois formations de soutien pour une seule Confrérie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: confrerie_guerriers, variante: sept }
      - { formation: formation_robots }
      - { formation: formation_gyrocopteres }
      - formation: batterie_foudre
        choix: { "0": { canon_foudre: 3 } }
  - nom: "deux Seigneurs de Guerre dans l'armée"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: confrerie_guerriers
        variante: sept
        options: [{ option: seigneur_de_guerre }]
      - formation: confrerie_berserkers
        variante: sept
        options: [{ option: seigneur_de_guerre }]
  - nom: "cinq améliorations sur une Confrérie de Guerriers Tonnerre"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - { formation: confrerie_guerriers, variante: sept }
      - formation: confrerie_guerriers_tonnerre
        variante: huit
        options:
          - { option: rhinos, quantite: 4 }
          - { option: leviathan }
          - { option: tunneliers, choix: fouisseuse }
          - { option: seigneur_de_guerre }
          - { option: ancetre_vivant }
  - nom: "Colossus et Cyclope au-delà du tiers à 2000 pts"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: confrerie_guerriers, variante: sept }
      - { formation: colossus }
      - { formation: cyclope }
