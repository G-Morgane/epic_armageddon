# Empire T'au, transcrit depuis le PDF EAFR rev 1.4 (source de vérité).
codex:
  slug: empire-tau
  armee_id: f2c10f18-9270-4501-a84c-49c2c1d2868d
  logo: /icons/tau.svg
  nom: Empire T'au
  version: "1.4"
  faction: xenos
  categorie: armees-xenos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/empire-tau.jpg
  citation:
    texte: "Nous ne prendrons pas l'ascendant sur cette galaxie hostile par la seule technologie. C'est notre cause commune et notre sens de l'honneur partagé qui nous unissent et nous confèrent le pouvoir de défaire nos ennemis."
    auteur: "Shas'el Sa'cea Or'es, Commandeur de la caste du Feu"
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une partie de chasse basée sur le Sept de T'au. Cette liste peut également être utilisée pour représenter des parties de chasse d'autres mondes de l'empire T'au comme ceux de Vior'la, de Fi'rios ou de Yo'Vai.

    Les parties de chasse du Sept de T'au sont organisées autour de grandes formations appelées cadres, elles-mêmes complétées par des formations de soutien et/ou des formations d'auxiliaires qui leurs sont autonomes.

    Chaque formation (cadre, formation de soutien ou formation d'auxiliaires) peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par formation. Hormis cela, chaque formation peut prendre autant d'améliorations qu'elle le souhaite, sans limite. Les améliorations font partie intégrante des formations et doivent en respecter les règles de cohésion.

    Les formations d'engins de guerre ou de la caste de l'air sont des formations autonomes. Un maximum de ⅓ des points de l'armée peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Déflecteurs"
      texte: |
        Certaines unités et engins de guerre T'au sont équipés d'un puissant champ déflecteur pour se protéger. Les unités ayant la règle spéciale Déflecteurs notée dans leurs profils bénéficient d'une sauvegarde de type invulnérable égale à la valeur renseignée entre parenthèses.
    - titre: "Règle spéciale : Propulseurs"
      texte: |
        Les Propulseurs fonctionnent exactement comme les Réacteurs Dorsaux (voir Livre de règles). De plus, lorsqu'une formation exécute une action d'avance ou d'avance rapide, ses unités ayant la règle spéciale « Propulseurs » notée dans leur profil peuvent choisir de tirer avant ou après l'un de ses mouvements.
    - titre: "Règle spéciale : Drones"
      texte: |
        Les unités ayant la règle spéciale Drones notée dans leur profil ne génèrent pas de pion d'impact lorsqu'elles sont détruites, ni lorsqu'elles sont touchées par des armes ayant la note Rupture. Toute autre règle générant des pions d'impact lorsque les touches sont allouées à ces unités sont ignorées.

        Les Drones d'une formation n'empêchent pas celle-ci de débuter en garnison si elle dispose des prérequis pour le faire.

        Une formation composée uniquement de Drones ne peut pas tenir d'objectifs, bien qu'elle puisse contester ceux-ci.

        Remarque : Les unités de Drones comptent dans le calcul des pertes lors de la résolution d'un assaut.
    - titre: "Règle spéciale : Armes guidées"
      texte: |
        Les armes guidées sont des armes disposant d'un système de localisation, et un calculateur de trajectoire. Ces armes sont capables d'atteindre une cible hors de ligne de vue, et ceci de façon autonome.

        Une Arme Guidée ne peut être employée que sur une unité sur laquelle a été infligé un Marquage de Désignateur laser. Une formation ne peut tirer qu'une fois par tour avec ses Armes guidées, qu'elle ait déjà été activée ou non.

        Toutes les règles relatives au tir comme l'allocation des touches et le feu croisé s'appliquent à partir de la formation d'où partent les armes guidées.

        Lorsqu'elles tirent, les Armes guidées ne nécessitent pas de ligne de vue et ne sont jamais affectées par les modificateurs pour toucher, qu'ils soient dûs à un ordre (+1 du tir soutenu ou -1 d'avance rapide) ou à un couvert.

        Remarque : une unité à couvert disposera toujours de sa sauvegarde de couvert, seul le modificateur pour toucher sera ignoré.

        Les unités démoralisées, neutralisées ou ayant effectué un redéploiement ne peuvent pas utiliser leurs Armes Guidées.

        Les Armes Guidées provenant d'un vaisseau peuvent être utilisées suite à l'activation du vaisseau et jusqu'à la fin de ce tour.
    - titre: "Règle spéciale : Désignateur laser"
      texte: |
        Le Désignateur laser est un dispositif porté par des unités T'au ayant la règle spéciale Désignateur laser (x) notée dans leurs profils. Un Désignateur laser possède une portée de 30cm et est utilisé en même temps que les attaques de tir ou de fusillade, mais avant que les jets pour toucher ne soient effectués. Une unité neutralisée ne peut pas faire usage de son Désignateur laser.

        Lorsqu'il est utilisé contre une formation ennemie, chaque unité T'au (à portée et en ligne de vue d'unités de cette formation ennemie) possédant cette règle lui inflige un nombre de Marquages de Désignateur laser.

        Au cours de son activation, une formation T'au peut utiliser ses Désignateurs laser selon l'action qu'elle effectue :

        **1. Tir** : Lors d'un tir et pour chaque Marquage de Désignateur laser infligé par une formation T'au, le joueur T'au peut décider d'appliquer l'un des effets suivants :

        Faire tirer une Arme Guidée possédée par une unité à portée de tir, depuis n'importe quelle formation n'ayant pas tiré avec ses Armes Guidées ce tour ci. Ces tirs d'armes sont considérés comme étant effectués par la formation utilisant ses Désignateurs laser : ils n'infligent qu'un pion impact à la formation ennemie visée, quel que soit le nombre de formations T'au impliquées.

        OU

        Donner un bonus de +1 au jet pour toucher d'un tir de la formation, exception faite des tirs antiaériens.

        **2. Assaut** : Au cours de sa phase d'assaut et pour chaque Marquage de Désignateur laser infligé par sa formation, le joueur T'au peut décider d'appliquer l'effet suivant :

        Donner un bonus de +1 à un jet pour toucher une autre attaque de fusillade de la formation.

        Chaque jet pour toucher ne peut bénéficier que d'un seul bonus de +1 au jet pour toucher grâce à un Désignateur laser.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustrations : Diego Gisbert Lorrens (cover)."
