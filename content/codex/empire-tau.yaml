    nom: Destroyer Manta
    type: EG
    vitesse: 20cm
    blindage: "5+"
    cc: "-"
    ff: "3+"
    armes:
      - { nom: 2x Artillerie rail, portee: 75cm, puissance: "MA2+, Frt, TT (D3)" }
      - { nom: 3x Canons à ion jumelés, portee: 60cm, puissance: "2xAP2+/AC5+, FrtF" }
      - { nom: 4x Drones, portee: 15cm, puissance: "AA5+" }
      - { nom: Nacelle de missiles (Aérien), portee: 30cm, puissance: "AP4+/AC5+/AA5+, FrtF" }
      - { nom: 4x Missiles à guidage laser, portee: 75cm, puissance: "AC4+, Arme Guidée" }
    notes:
      - "Déflecteurs (4+)"
      - Antigrav
      - Sans peur
      - Blindage Renforcé
      - Assaut Planétaire
      - "Transport (16) : Strike team, Cibleurs, XV15 Stealth, XV8 Crisis*, XV88 Broadside*, Drones d'attaque, Drones lourds, Mentor Kroot, Carnivores Kroots, Krootox, Tetra*, Piranha* (* prennent 2 places)."
      - "Le Manta peut embarquer en plus 4 des unités suivantes : Devilfish, Hammerhead, Skyray, Stingray."
    transport:
      capacite: 16
      accepte: [strike_team, cibleur, xv15_stealth, xv8_crisis, xv88_broadside, drone_attaque, drone_lourd, mentor_kroot, carnivore_kroot, krootox, tetra, piranha_ci, piranha_ef]
    taille_transport: 3
    degats: { cd: 10, critique: "le Destroyer Manta perd son Déflecteur, les critiques suivants font perdre 1 point de structure supplémentaire." }
  - id: croiseur_emissary
    nom: Croiseur Emissary
    type: VS
    armes:
      - { nom: Frappe chirurgicale, portee: "-", puissance: "MA2+, TT (D3)" }
      - { nom: 6x Torpilles gravitiques, portee: "∞", puissance: "MA5+, Arme Guidée" }
    notes: ["Transport (6) : Orcas, Mantas (prennent 3 places) ainsi que les troupes qu'ils contiennent"]
    transport: { capacite: 6, accepte: [transporteur_orca, destroyer_manta] }
  - id: cuirasse_custodian
    nom: Cuirassé Custodian
    type: VS
    armes:
      - { nom: 2x Frappe chirurgicale, portee: "-", puissance: "MA2+, TT (D3)" }
      - { nom: 6x Torpilles gravitiques, portee: "∞", puissance: "MA5+, Arme Guidée" }
    notes:
      - "Transport (18) : Orcas, Mantas (prennent 3 places) ainsi que les troupes qu'ils contiennent"
      - "Lent, ne peut être utilisé dans les 2 premiers tours de la partie à moins que le scénario ne dise le contraire"
    transport: { capacite: 18, accepte: [transporteur_orca, destroyer_manta] }

options:
  # ---- Améliorations communes ----
  - id: commandeur
    nom: Commandeur
    effet:
      type: choix
      parmi:
        - id: shas_el
          nom: "1 Shas'El"
          cout: 50
          effet: { type: ajouter, unites: [{ unite: shas_el, nombre: 1 }] }
        - id: shas_o
          nom: "1 Shas'O"
          cout: 50
          effet: { type: ajouter, unites: [{ unite: shas_o, nombre: 1 }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Shas'El à une unité de la formation. 0-1 (Remplacer 1 Shas'El par 1 Shas'O)"
    note_md: "Le remplacement du Shas'El par un Shas'O est gratuit et limité à un seul dans l'armée."
  - id: ethere
    nom: "0-1 Éthéré"
    effet: { type: ajouter, cout: 50, unites: [{ unite: ethere, nombre: 1 }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Ajouter 1 Éthéré à une unité de la formation"
  - id: talissera
    nom: "Ta'lissera"
    effet: { type: mot_cle, texte: Meneur, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Meneur à 1 unité de la formation"
  - id: drones_communication
    nom: Drones de communication
    effet: { type: mot_cle, texte: Meneur, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Meneur à 1 véhicule de la formation"
  - id: drones_attaque
    nom: Drones d'attaque
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: drone_attaque }], min: 2, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
