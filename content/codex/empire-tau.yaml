sections:
  - id: cadres
    titre: "CADRES DE T'AU"
    formations: [cadre_crisis, cadre_blinde, cadre_guerrier_feu]
    contraintes: [{ type: fournit, budget: soutien, quantite: 2 }]
    colonne_options: true
  - id: soutien
    titre: FORMATIONS DE SOUTIEN
    sous_titre: "Jusqu'à 2 formations de soutien par cadre"
    formations: [exo_stealth, exo_broadsides, groupe_cibleurs, groupe_reconnaissance, vague_piranhas, groupe_appui_feu, groupe_interdiction_blinde, drones_attaque_formation, aile_skysweep, exo_riptides]
    contraintes: [{ type: consomme, budget: soutien }]
    colonne_options: true
    options: [commandeur, ethere, talissera, drones_communication, drones_attaque, drones_lourds, drones_snipers, blindes_tau, skyray, devilfish, cibleurs]
    tableau_options:
      titre: AMÉLIORATIONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation"
  - id: engins_et_air
    titre: "ENGINS DE GUERRE ET CASTE DE L'AIR"
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
    formations: [exo_supremacy, escadrille_interception, escadrille_bombardiers, escadrille_attaque_sol, destroyer_manta, transporteur_orca, soutien_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: auxiliaires
    titre: "FORMATIONS D'AUXILIAIRES"
    sous_titre: "Jusqu'à 1 formation d'auxiliaires par cadre de guerriers de feu"
    formations: [harde_kroots, essaim_vespid]
    contraintes: [{ type: consomme, budget: auxiliaire }]
    colonne_options: true

listes_test:
  - nom: "3000 pts valide : trois cadres, quatre soutiens, une harde de Kroots et une escadrille"
    limite: 3000
    attendu: valide
    formations:
      - formation: cadre_guerrier_feu
        variante: douze
        options:
          - { option: ethere }
          - { option: devilfish, variante: six }
          - { option: skyray }
          - { option: talissera }
      - formation: cadre_crisis
        variante: six
        options:
          - { option: commandeur, choix: shas_o }
          - { option: drones_lourds, variante: deux }
      - formation: cadre_blinde
        choix: { "0": { hammerhead_rail: 4, hammerhead_ion: 2 } }
        options:
          - { option: blindes_tau, repartition: { hammerhead_rail: 2, stingray: 1 } }
          - { option: drones_communication }
      - formation: exo_stealth
        variante: six
        options: [{ option: talissera }]
      - { formation: exo_broadsides, variante: quatre }
      - { formation: groupe_cibleurs }
      - { formation: aile_skysweep }
      - formation: harde_kroots
        options: [{ option: kroots_supplementaires }]
      - { formation: escadrille_interception, variante: deux }
  - nom: "2000 pts valide : Riptides, Piranhas, Vespids et un Transporteur Orca"
    limite: 2000
    attendu: valide
    formations:
      - formation: cadre_guerrier_feu
        variante: huit
        options:
          - { option: cibleurs, choix: remplacement }
          - { option: drones_snipers, quantite: 2 }
      - formation: cadre_blinde
        choix: { "0": { hammerhead_ion: 6 } }
        options: [{ option: skyray }]
      - formation: vague_piranhas
        variante: six
        choix: { "0": { piranha_ci: 4, piranha_ef: 2 } }
      - formation: exo_riptides
        choix: { "0": { xv104_riptide_cil: 2, xv104_riptide_ai: 1 } }
        options: [{ option: drones_attaque, quantite: 3 }]
      - { formation: groupe_reconnaissance, variante: six }
      - formation: essaim_vespid
        options: [{ option: vespids_supplementaires, variante: trois }]
      - { formation: transporteur_orca }
  - nom: "trois formations de soutien pour un seul cadre"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: cadre_blinde
        choix: { "0": { hammerhead_rail: 6 } }
      - { formation: exo_broadsides, variante: quatre }
      - { formation: groupe_reconnaissance, variante: six }
      - { formation: aile_skysweep }
  - nom: "une harde de Kroots sans Cadre de Guerrier de feu"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: cadre_crisis, variante: quatre }
      - { formation: harde_kroots }
  - nom: "deux Éthérés dans l'armée"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: cadre_guerrier_feu
        variante: huit
        options: [{ option: ethere }]
      - formation: cadre_guerrier_feu
        variante: huit
        options: [{ option: ethere }]
  - nom: "deux Shas'O dans l'armée"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: cadre_crisis
        variante: quatre
        options: [{ option: commandeur, choix: shas_o }]
      - formation: cadre_crisis
        variante: quatre
        options: [{ option: commandeur, choix: shas_o }]
  - nom: "Destroyer Manta au-delà du tiers des points à 2000 pts"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: cadre_guerrier_feu, variante: huit }
      - { formation: destroyer_manta }
