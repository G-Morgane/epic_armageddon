  - id: drones_lourds
    nom: Drones lourds
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: deux, nom: 2 unités de Drones lourds, cout: 75, unites: [{ unite: drone_lourd, nombre: 2 }] }
        - { id: quatre, nom: 4 unités de Drones lourds, cout: 150, unites: [{ unite: drone_lourd, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 ou 4 unités de Drones lourds à la formation"
  - id: drones_snipers
    nom: "0-1 Drones Snipers"
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: drone_sniper }], min: 1, max: 4 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Ajouter 1 à 4 unités de Drones Snipers à la formation (50 pts chacun)"
  - id: blindes_tau
    nom: "Blindés T'au"
    effet:
      type: choix
      parmi:
        - id: trois_vehicules
          nom: "3 véhicules parmi Hammerheads (tous types) et Stingray"
          cout: 175
          effet:
            type: choix_multiple
            total: 3
            parmi:
              - { unite: hammerhead_rail }
              - { unite: hammerhead_ion }
              - { unite: stingray }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 3 véhicules à la formation parmi : Hammerheads (tous types), Stingray"
  - id: skyray
    nom: Skyray
    effet: { type: ajouter, cout: 75, unites: [{ unite: skyray, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Skyray à la formation"
  - id: devilfish
    nom: Devilfish
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: quatre, nom: 4 Devilfish, cout: 100, unites: [{ unite: devilfish, nombre: 4 }] }
        - { id: six, nom: 6 Devilfish, cout: 150, unites: [{ unite: devilfish, nombre: 6 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 4 ou 6 Devilfish à la formation"
    note_md: "Vous ne pouvez pas prendre plus de Devilfish que nécessaire pour transporter la formation."
  - id: cibleurs
    nom: Cibleurs
    effet:
      type: choix
      parmi:
        - id: ajout
          nom: "Ajouter 2 Cibleurs et 1 Devilfish"
          cout: 100
          effet: { type: ajouter, unites: [{ unite: cibleur, nombre: 2 }, { unite: devilfish, nombre: 1 }] }
        - id: remplacement
          nom: "Remplacer 2 Strike team par 2 Cibleurs"
          cout: 25
          effet: { type: remplacer, de: strike_team, par: cibleur, lot: 2, max: 1 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 Cibleurs et 1 Devilfish à la formation (100 pts) ou remplacer 2 Strike team par 2 Cibleurs (25 pts)"

  # ---- Renforts des formations d'auxiliaires ----
  - id: kroots_supplementaires
    nom: Carnivores Kroots supplémentaires
    effet: { type: ajouter, cout: 75, unites: [{ unite: carnivore_kroot, nombre: 5 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "+5 unités de Carnivores Kroots"
  - id: krootox_supplementaires
    nom: Krootox
    effet: { type: ajouter, cout: 75, unites: [{ unite: krootox, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "+3 Krootox"
  - id: knarlocs_supplementaires
    nom: Grands Knarlocs
    effet: { type: ajouter, cout: 50, unites: [{ unite: grand_knarloc, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "+3 Grands Knarlocs"
  - id: vespids_supplementaires
    nom: Frelons Vespid supplémentaires
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: trois, nom: 3 unités de Frelons Vespid, cout: 75, unites: [{ unite: frelon_vespid, nombre: 3 }] }
        - { id: six, nom: 6 unités de Frelons Vespid, cout: 150, unites: [{ unite: frelon_vespid, nombre: 6 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "+3 unités de Frelons Vespid ou +6 unités de Frelons Vespid"

