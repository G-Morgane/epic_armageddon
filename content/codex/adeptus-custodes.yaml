# Adeptus Custodes, transcrit depuis le PDF expérimental EAFR (source de vérité).
codex:
  slug: adeptus-custodes
  armee_id: 59abce74-190d-40aa-b7f1-e321992e499b
  nom: Adeptus Custodes
  version: "0.2"
  faction: imperium
  categorie: armees-imperiales
  statut: experimental
  citation:
    texte: "Nous sommes la vigilance perpétuelle. Nous sommes le châtiment inéluctable. Nous sommes l'Adeptus Custodes, et tous craignent notre colère."
    auteur: Capitaine-Bouclier Rothrian Ganyth
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied une armée de l'Adeptus Custodes basée sur les Formations Martiales de l'Adeptus Custodes et des Couvents de l'Anatema Psykana.

    Les armées de l'Adeptus Custodes sont organisées autour de petites formations appelées Formations Martiales et Couvents Anatema Psykana.

    Chaque Formation Martiale peut recevoir des améliorations. La liste d'armée indique pour chaque Formation Martiale quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par Formation Martiale. Les améliorations font partie intégrante des Formations Martiales et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'une Formation Martiale tandis que d'autres ajoutent des unités supplémentaires.

    Les formations des Couvents Anatema Psykana sont des formations autonomes des Formations Martiales. Elles ne peuvent jamais bénéficier des règles spéciales du codex Adeptus Custodes, sauf celles indiquées dans leur profil. Un maximum de 1/3 des points peuvent être dépensés pour ces formations.

    L'Adeptus Custodes utilise les feuilles de référence Adeptus Custodes et des Légions Titaniques.
  regles_md:
    - titre: "Règle spéciale : Gardiens du Trône d'Or"
      texte: |
        Les Formations Martiales de l'Adeptus Custodes bénéficient de la règle "Et ils ne connaîtront pas la peur" ET de la règle "Obstiné" uniquement pour ce qui est du retrait des pertes dans la résolution d'un assaut.

        De plus les Formations Martiales de l'Adeptus Custodes ignorent la règle des armes ruptures et les Pions Impacts supplémentaires infligés par les tirs croisés. Ils diminuent de 1 les Pions Impacts infligés par les armes à PB.
    - titre: "Règle spéciale : Utilisateurs du Trône d'Or"
      texte: |
        Les guerriers de l'Adeptus Custodes sont les seuls de tout l'imperium à pouvoir utiliser le Trône d'Or. Cette Machine fut conçue et imaginée par l'Empereur Dieu pour pouvoir voyager à travers les énergies warp de manière fiable et sans risque. Lors de n'importe quelle téléportation du tour 1 et du tour 2 :

        - les Formations Martiales entièrement Infanteries de l'Adeptus Custodes peuvent relancer leur jet de téléportation
        - les autres Formations Martiales de l'Adeptus Custodes diminuent de 1 les Pi dû au jet de téléportation.
    - titre: "Règle spéciale : Et ils ne connaîtront pas la peur"
      texte: |
        - Il faut deux pions d'impact pour neutraliser une unité Space Marines ou détruire une unité démoralisée (ignorez les pions d'impacts en plus).
        - Les formations Space Marines ne sont démoralisées qu'à partir du moment où elles ont deux pions d'impact ou plus par unité.
        - Les formations Space Marines comptent comme ayant la moitié de leur nombre de pions impact lors de la résolution de l'assaut (arrondi à l'inférieur, à un minimum de 1 pion impact).
        - Réduisez de moitié le nombre de touches supplémentaires subies par une formation de Space Marines perdant un assaut, en arrondissant à l'entier inférieur en faveur des Space Marines.
        - Lorsqu'une formation Space Marines démoralisée se rallie, elle reçoit un nombre de pions impact égal au nombre d'unités plutôt qu'à la moitié du nombre d'unités.
        - Les Meneurs Space Marines retirent deux pions d'impact au lieu d'habituellement un seul.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Judas Chaban."
  valeur_strategique: 5
  initiative:
    defaut: "1+"
    exceptions:
      - { portee: "Couvents de l'Anatema Psykana", valeur: "2+" }

