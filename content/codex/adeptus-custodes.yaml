listes_test:
  - nom: "3000 pts, formations martiales, soutiens et supports"
    limite: 3000
    attendu: valide
    formations:
      - formation: gardes_custodiens
        variante: bouclier_6
        options:
          - { option: herault_imperium, choix: capitaine_rempart }
          - { option: land_raiders, quantite: 3 }
          - { option: sagittaires, quantite: 2 }
      - formation: terminator_allarus
        options:
          - { option: teleportation }
          - { option: dreadnought, choix: telemon }
      - { formation: formation_sagittaires, variante: quatre, options: [{ option: appui_lourd, choix: pallas }] }
      - { formation: venatari }
      - { formation: caladius, options: [{ option: caladius_arachnus }] }
      - { formation: ares }
      - { formation: couvent_vigilators }

  - nom: "deux Capitaines Rempart"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: gardes_custodiens, variante: bouclier_4, options: [{ option: herault_imperium, choix: capitaine_rempart }] }
      - { formation: terminator_allarus, options: [{ option: herault_imperium, choix: capitaine_rempart }] }

  - nom: "quatre améliorations sur une formation martiale"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: gardes_custodiens
        variante: bouclier_4
        options:
          - { option: herault_imperium, choix: champion_lames }
          - { option: sagittaires, quantite: 1 }
          - { option: teleportation }
          - { option: appui_lourd, choix: pallas }

  - nom: "trois formations de soutien pour une formation martiale"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: gardes_custodiens, variante: bouclier_4 }
      - { formation: venatari }
      - { formation: pallas }
      - { formation: caladius }

  - nom: "supports au-delà du tiers des points"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: gardes_custodiens, variante: bouclier_4 }
      - { formation: titan_warlord }
