    contraintes:
      - { type: max_options, valeur: 3 }
      - { type: fournit, budget: slot_soutien, quantite: 2 }
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS ADEPTUS CUSTODES
      sous_titre: "Jusqu'à 3 améliorations max par formation, chaque amélioration ne peut être sélectionnée qu'une seule fois"
  - id: soutien
    titre: FORMATIONS MARTIALES DE SOUTIEN ADEPTUS CUSTODES
    sous_titre: "2 Formations de soutien par Formation Martiale"
    formations: [veilleurs_custodiens, formation_sagittaires, venatari, terminator_aquillon, contemptor, pallas, caladius]
    contraintes: [{ type: consomme, budget: slot_soutien }, { type: max_options, valeur: 3 }]
    colonne_options: true
  - id: aviation
