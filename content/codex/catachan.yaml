# Catachan, transcrit depuis le PDF expérimental EAFR beta 0.1 (source de vérité).
codex:
  slug: catachan
  armee_id: 43c57302-4c36-4726-8b17-5517dd5f6f22
  nom: Catachan
  version: "0.1"
  faction: imperium
  categorie: armees-imperiales
  statut: experimental
  citation:
    texte: "J'aime l'odeur du Promethium le matin. Tu sais, une fois on a bombardé une colline pendant douze heures. Quand tout a été terminé j'y suis allé. On n'a trouvé aucun Ork, pas le moindre morceau de leur corps puant. L'odeur, tu sais, cette odeur de Promethium, sur toute la colline. Ça sentait… la victoire."
    auteur: Colonel Kilgore
  intro_md: |
    La liste qui suit vous permet de mettre sur pied un régiment de combattant de la jungle de Catachan. Cette liste peut également être utilisée pour représenter des régiments d'infanterie légère de la Garde Impériale d'autres origines.

    Les régiments de Catachan sont organisés autour de grandes formations appelées compagnies, elles-mêmes complétées par des formations d'appui qui leurs sont autonomes.

    Chaque compagnie peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par compagnie. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Chaque compagnie peut prendre jusqu'à trois améliorations.

    Les formations de support sont des formations autonomes des compagnies. Elles ne peuvent pas recevoir d'améliorations. Un maximum de 1/3 des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Mobilité"
      texte: |
        Les véhicules blindés de Catachan peuvent pénétrer dans les jungles et ignorent tous les tests de terrain dangereux.

        Les véhicules légers de Catachan peuvent traverser les terrains et profiter des règles de couvert comme s'il s'agissait d'infanterie.

        Les éléments de fortification (champs de mines, barbelés, etc.) et les éléments de terrains spéciaux (rivière de lave, etc.) affectent cependant les Catachans normalement.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Games Workshop LTD."
  valeur_strategique: 3
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Diables de Catachan", valeur: "1+" }
      - { portee: "Soutiens de l'Adeptus Titanicus", valeur: "1+" }

budgets:
  - id: slot_appui
    libelle: Formations d'appui
    capacite: { source: fournitures }
    phrase_pdf: "Jusqu'à 2 formations d'appui par compagnie"
  - id: rare
    libelle: Supports de Catachan
    capacite: { source: ratio_points, ratio: 0.3334 }
    phrase_pdf: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"

