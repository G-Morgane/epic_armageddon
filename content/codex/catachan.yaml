sections:
  - id: compagnies
    titre: COMPAGNIES DE CATACHAN
    formations: [qg_regimentaire, compagnie_infanterie, compagnie_aeromobile, compagnie_reconnaissance]
    contraintes:
      - { type: max_options, valeur: 4 }
      - { type: fournit, budget: slot_appui, quantite: 2 }
    options: [commissaire, peloton_infanterie, lance_flammes, snipers, ogryns, batterie_mortiers, peloton_appui_feu, dca, chimeres, leman_russ]
    tableau_options:
      titre: AMÉLIORATIONS DE COMPAGNIES DE CATACHAN
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation et jusqu'à un maximum de 4"
    notes:
      embarquement: "Les formations de ces unités peuvent être embarquées pour 25 points par Chimère ou 50 points par Valkyrie. Vous ne pouvez pas prendre plus de Chimères que nécessaire pour embarquer ces troupes."
  - id: appui
    titre: FORMATIONS D'APPUI DE CATACHAN
    sous_titre: "Jusqu'à 2 formations d'appui par compagnie"
    formations: [appui_diables, peloton_ogryns, escadron_mortiers, escadron_sentinelles, escadron_vulture, escadron_hellhound, peloton_tank_riders, peloton_reconnaissance, batterie_deathstrike, peloton_appui_lourd, peloton_super_lourd]
    contraintes: [{ type: consomme, budget: slot_appui }]
    colonne_options: true
  - id: aeronautica
    titre: FLOTTES DE L'AERONAUTICA IMPERIALIS
    sous_titre: "SUPPORTS DE CATACHAN"
    formations: [escadrille_intercepteurs, soutien_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: titanicus
    titre: SOUTIENS DE L'ADEPTUS TITANICUS
    sous_titre: "SUPPORTS DE CATACHAN"
    formations: [titan_warhound, meute_warhounds, titan_dire_wolf, meute_dire_wolves]
    contraintes: [{ type: consomme, budget: rare, quoi: points }, { type: initiative, valeur: "1+" }]

listes_test:
  - nom: "3000 pts, QG, compagnies, appuis et supports"
    limite: 3000
    attendu: valide
    formations:
      - formation: qg_regimentaire
        options:
          - { option: commissaire }
          - { option: peloton_infanterie }
          - { option: chimeres, choix: chimere, quantite: 8 }
      - formation: compagnie_aeromobile
        options:
          - { option: support_aerien, choix: vultures }
          - { option: batterie_mortiers, quantite: 4 }
      - { formation: compagnie_reconnaissance }
      - { formation: escadron_hellhound, options: [{ option: devil_dog }] }
      - { formation: peloton_ogryns, options: [{ option: chimeres_ogryns }] }
      - { formation: appui_diables }
      - { formation: escadrille_intercepteurs }
      - { formation: titan_warhound }

  - nom: "trois Commissaires"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: qg_regimentaire, options: [{ option: commissaire }] }
      - { formation: compagnie_infanterie, options: [{ option: commissaire }] }
      - { formation: compagnie_aeromobile, options: [{ option: commissaire }] }

  - nom: "cinq améliorations sur une compagnie"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: compagnie_infanterie
        options:
          - { option: commissaire }
          - { option: peloton_infanterie }
          - { option: snipers }
          - { option: ogryns }
          - { option: lance_flammes }

  - nom: "deux Pelotons Tank Riders"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: compagnie_infanterie }
      - { formation: peloton_tank_riders }
      - { formation: peloton_tank_riders }

  - nom: "trois formations d'appui pour une compagnie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: escadron_mortiers }
      - { formation: escadron_sentinelles }
      - { formation: peloton_reconnaissance }
