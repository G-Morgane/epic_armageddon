options:
  - id: legate
    nom: Legate Commander
    effet: { type: remplacer, de: commander, par: legate_commander, lot: 1, max: 1, cout: 0 }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Le Commander devient Legate Commander (1 par armée max, gratuit)"
  - id: cyclopes
    nom: Cyclopes
    effet: { type: remplacer, de: auxiliaries, par: cyclope, lot: 1, max: 2, cout: 0 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer jusqu'à 2 Auxiliaries par 2 Cyclope (gratuit)"
  - id: veteran
    nom: Vétéran
    effet:
      type: choix
      parmi:
        - { id: veletarii, nom: 3 Veletarii, cout: 25, effet: { type: remplacer, de: auxiliaries, par: veletarii, lot: 3, max: 1 } }
        - { id: veletarii_assaut, nom: 3 Veletarii d'assaut, cout: 25, effet: { type: remplacer, de: auxiliaries, par: veletarii_assaut, lot: 3, max: 1 } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Vétéran : remplacer 3 Auxiliaries par 3 Veletarii (tous types)"
  - id: medusa
    nom: Medusa 30k
    effet: { type: ajouter, cout: 75, unites: [{ unite: medusa, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 Medusa 30k à la formation"
  - id: engins_de_guerre
    nom: Engins de Guerre
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: malcador, cout: 100 }
        - { unite: malcador_infernus, cout: 100 }
        - { unite: malcador_valdor, cout: 100 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Engins de Guerre parmi : Malcador, Malcador Infernus, Valdor (100 pts chaque)"
  - id: meneur
    nom: Meneur
    effet: { type: mot_cle, texte: Meneur, cout: 25 }
