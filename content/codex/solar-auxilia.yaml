# Cohorte du Solar Auxilia, transcrit depuis le PDF expérimental fan codex 1.5.1 (source de vérité).
codex:
  slug: solar-auxilia
  armee_id: f9b38721-2cfa-4bef-9c02-1b98699c0517
  nom: Solar Auxilia
  version: "0.5.1"
  faction: imperium
  categorie: armees-imperiales
  statut: experimental
  citation:
    texte: "Les batailles se gagnent par le courage, en restant ferme face à une adversité écrasante, en avançant vers une mort certaine alors que votre instinct vous hurle de faire demi-tour. Tout le monde est un héros quand il n'y a plus d'endroit où fuir."
    auteur: Auxiliaire Skarn, 2333e cohorte
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une Cohorte du Solar Auxilia. Elles sont organisées autour de petites formations appelées Tercios.

    Les Cohortes du Solar Auxilia sont organisées autour de grandes formations appelées Tercios, elles-mêmes complétées par des sections de combat indépendantes qui leurs sont autonomes.

    Les formations de la flotte de l'Aeronautica Imperialis et celles de l'alliance des Légions Titaniques ou des Chevaliers Impériaux sont des formations autonomes. Un maximum de 1/3 des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Vétéran de la Grande Croisade"
      texte: |
        Les formations du Solar Auxilia bénéficient toutes de la règle Obstiné :

        - Une formation est démoralisée dès qu'elle a accumulé un nombre de pions Impact égal au nombre d'unités + 1.
        - Lorsqu'une formation perd un assaut, elle subit une perte de moins lors de la résolution des touches supplémentaires. Ceci peut réduire à zéro les pertes encourues en résolution.
    - titre: "Règle spéciale : Adaptation de l'explorateur"
      texte: |
        Lors d'un mouvement prudent (qui permet de relancer les tests de terrain dangereux), les formations du Solar Auxilia peuvent se déplacer jusqu'à 15cm au lieu des 5cm habituels.
    - titre: "Règle spéciale : Veletaris"
      texte: |
        Les formations incluant au moins une unité ayant la note "Veletaris" bénéficient d'un bonus de +1 lors des tests d'actions pour effectuer un Assaut.
    - titre: "Règle spéciale : Autodestruction"
      texte: |
        Les unités de Cyclopes sont automatiquement détruites à la fin de la phase après avoir réalisé leur attaque.

        Si l'unité de Cyclope a pu réaliser son attaque alors, durant cette phase, sa formation ne reçoit pas de pions d'impact pour sa destruction, et celle-ci ne compte pas pour déterminer le vainqueur d'un assaut.
    - titre: "Règle spéciale : Alliance et Flotte"
      texte: |
        Un tiers des points d'une liste de cohorte du Solar Auxilia peut être sélectionné dans les formations de la flotte de l'Aeronautica Imperialis et/ou dans l'un des deux codex Légions Titaniques ou Chevaliers Impériaux.

        Cette sélection doit respecter la structure de ces listes (par exemple un choix de base pour avoir deux choix de soutien) et elle ne peut pas inclure d'unités possédant la note Commandant Suprême.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Games Workshop LTD."
  valeur_strategique: 2
  initiative:
    defaut: "2+"

