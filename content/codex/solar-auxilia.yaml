listes_test:
  - nom: "3000 pts, Tercios, sections indépendantes et flotte"
    limite: 3000
    attendu: valide
    formations:
      - formation: tercio_militaris
        choix: { "2": { veletarii: 2, charonite_ogryns: 2, aethon_sentinel: 1 } }
        options:
          - { option: legate }
          - { option: medusa }
          - { option: transport, choix: dracosan, quantite: 4 }
      - formation: tercio_blinde
        choix: { "0": { leman_russ_obusier: 4, leman_russ_exterminator: 4 } }
        options: [{ option: meneur }]
      - formation: tercio_super_lourd
        variante: deux
        choix: { "0": { baneblade: 1, shadowsword: 1 } }
      - { formation: section_sentinelle }
      - { formation: batterie_tarentule, options: [{ option: hyperios_tarentule, quantite: 3 }] }
      - { formation: escadrille_avenger, variante: deux }

  - nom: "deux Legate Commanders"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: tercio_militaris
        choix: { "2": { veletarii: 2 } }
        options: [{ option: legate }]
      - formation: tercio_militaris
        choix: { "2": { veletarii: 2 } }
        options: [{ option: legate }]

  - nom: "deux Tercios Blindés lourds"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: tercio_blinde_lourd, choix: { "0": { leman_russ_vanquisher: 8 } } }
      - { formation: tercio_blinde_lourd, choix: { "0": { leman_russ_demolisher: 8 } } }

  - nom: "trois sections indépendantes pour un seul Tercio"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: tercio_militaris
        choix: { "2": { veletarii: 2 } }
      - { formation: section_sentinelle }
      - { formation: batterie_artillerie }
      - { formation: section_malcador, choix: { "0": { malcador: 2 } } }

  - nom: "flotte au-delà du tiers des points"
    limite: 1500
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: tercio_militaris
        choix: { "2": { veletarii: 2 } }
      - { formation: escadrille_avenger, variante: quatre }
      - { formation: escadrille_bombardiers }
