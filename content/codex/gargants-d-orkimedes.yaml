# Gargants d'Orkimedes, transcrit depuis le PDF EAFR rev 1.1.1 (source de vérité).
codex:
  slug: gargants-d-orkimedes
  armee_id: 9f2cef62-b74a-4fb2-aa35-b6c43aa3cc83
  logo: /icons/gargants_ork.svg
  nom: Gargants d'Orkimedes
  version: "1.1.1"
  faction: xenos
  categorie: armees-xenos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/gargants-d-orkimedes.jpg
  citation:
    texte: "ÇA VA TIRER À MORT, AVEC DÉ TAS D'FLINGUES DE PARTOU."
    auteur: Big Mek Badlug Na Kune Jamb'
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied une force d'Orks basée sur celle d'ORKIMEDES, Gros Mek en chef de la WAAAGH! de GHAZGHKULL THRAKA, dont la téléportation de Gargants a dévasté les forces de la Légion d'Acier lors de la IIIème Guerre pour Armageddon.

    Les armées d'Orkimedes sont organisées en formations appelées bandes d'Orkimedes et bandes en rab'.

    Chaque bande d'Orkimedes permet de prendre jusqu'à trois bandes en rab', qui peuvent pour certaines s'acheter selon 3 tailles, la bande normale, la mastok (doubler l'effectif de départ) ou la tré mastok (tripler l'effectif de départ).

    Chaque bande peut recevoir des kust'oms. La liste d'armée indique pour chaque catégorie de bande quels kust'oms sont autorisés. Chaque kust'om autorisé peut être pris un nombre illimité de fois par bande, sauf s'il est fait état d'une limitation de kust'om. Les limitations de kust'om sont multipliées de la même façon que l'effectif de départ, ainsi si une Bande de Guerre de Pillards normale ne peut accueillir qu'un Nobz supplémentaire, une Bande de Guerre de Pillards Tré Mastok peut en inclure jusqu'à 3. Les kust'oms font partie intégrante des bandes et doivent de ce fait en respecter la cohésion.

    Les armées de Gargants d'Orkimedes ont une valeur stratégique de 2. Toutes les formations ont une initiative de 3+ mais reçoivent des modificateurs en fonction des actions choisies lorsqu'elles effectuent un test d'action (Pouvoir de la WAAAGH!) ou de leur taille lorsqu'elles tentent de se rallier (R'mise en bande).
  regles_md:
    - titre: "Règle spéciale : DA BIG MEK"
      texte: |
        Chaque armée Orkimedes peut inclure un personnage de commandant suprême appelé Big Mek. Ce personnage est gratuit et doit obligatoirement rejoindre un Grand Gargant Tré Tré Kustom' ou un Gargant Tré Kustom'.
    - titre: "Règle spéciale : POUVOIR DE LA WAAAGH!"
      texte: |
        Les Orks ne sont pas de fins stratèges mais la perspective d'une bonne bagarre les galvanise toujours.

        Une formation tentant une action d'Avance Rapide ou d'Assaut reçoit +2 à l'initiative pour son test d'action. Les formations aériennes ont +2 de bonus pour les tests d'actions lorsqu'elles tentent une Interception ou une Attaque au sol.
    - titre: "Règle spéciale : R'MISE EN BANDE"
      texte: |
        Lorsque les bandes Orks tentent un test de ralliement, ils reçoivent un bonus de +1 lorsqu'ils sont plus de 5 et un bonus de +2 lorsqu'ils sont plus de 10. Les engins de guerre faisant partie de ces bandes comptent pour autant d'unités que leur capacité de dommage de départ. Ne sont comptabilisables dans le calcul ni les Gretchins ni les Grokalibr'.
    - titre: "Règle spéciale : CHAMP ÉNERGÉTIQUE"
      texte: |
        Certains engins de guerre Orks possèdent des champs énergétiques. Le nombre dont en dispose chaque engin est indiqué sur sa fiche d'unité. Les champs énergétiques fonctionnent de la même manière que les boucliers du vide de l'Imperium, à la différence qu'une fois abattus ils ne sont pas réparables et restent donc inactifs jusqu'à la fin de la bataille.
    - titre: "Règle spéciale : TÉLA TÉPULA"
      texte: |
        Le Téla Tépula permet aux unités se trouvant dans un vaisseau spatial d'être téléportées directement sur le champ de bataille.

        Cette technologie, reste (pour les orks) encore mal maîtrisée et plusieurs règles s'appliquent :

        - Le Téla Tépula ne peut être utilisé que si le joueur orkimedes a sélectionné un vaisseau spatial.
        - Le Téla Tépula ne peut être utilisé que sur une bande d'Orkimedes.
        - La règle Assaut Planétaire sera utilisée plutôt que la règle Téléportation (coordonnées secrètement choisies, activation du vaisseau, déviation des unités, etc.).
        - Lors de l'arrivée sur le champ de bataille, lancez 1D6 par unité de la formation. Les engins de guerre comptent pour autant d'unités que leur capacité de dommage de départ. Sur un résultat de 1 la formation de l'unité reçoit un pion impact.
        - Un Kroiseur Kitu peut transporter l'équivalent de 10 unités. Un Kroiseur d'la Mort peut en transporter l'équivalent de 20.
    - titre: "Règle spéciale : Forteresse de Bataille Unik' & Forteresse à Kanons Surmezur'"
      texte: |
        Dans les parties de tournois, ces unités peuvent seulement transporter les unités de leur propre formation.
    - titre: "Règle spéciale : TUNING"
      texte: |
        Orkimedes est un génie dont les merveilles technologiques éblouissent toute la galaxie. Les Titans Impériaux semblent chétifs et archaïques en comparaison de ses fabuleux Gargants. Chacun de ces monuments est une orfèvrerie unique et originale.

        Chaque unité de Gargant (Gargant Tré Kustom et Grand Gargant Tré Tré Kustom) et chaque Super Krabouillator Personalizé sélectionne ses armes comme indiqué dans son profil. Les Super Krabouillators Personalizés choisissent leurs armes dans la liste des Dakka Kust'om. Les Gargants choisissent leurs armes dans la liste des Dakka Kust'om et Dakka Kust'om de Gargant. Chaque arme à un coût qui s'ajoute à celui de l'Engin de Guerre. La même arme peut être sélectionnée plusieurs fois par le même Engin de Guerre. Tous les emplacements d'armes doivent être utilisés.

        Les Engins de guerre Orkimedes (sauf Drop Rok) peuvent sélectionner des améliorations appelées Ekip'ment kustom. Chaque amélioration ne peut être sélectionnée qu'une fois par Engin de Guerre.

        Chaque Forteresse de Bataille Unik' et Forteresse à Kanons Surmezur' ayant sélectionné de l'Ekip'ment kustom, ainsi que chaque Super Krabouillator Personalizé, Gargant Tré Kustom' et Grand Gargant Tré Tré Kustom' doit être unique au sein de l'armée.
    - titre: "DAKKA KUST'OM"
      texte: |
        Armes disponibles pour les Super Krabouillators Personalizés et pour les Gargants.

        - **Mega-Kikoup'**, gratuit, (contact) et 45cm, Arme d'assaut, +1A, MA, TT (D3) / AP5+/AC6+, FrtF
        - **Poing Tronçonneur**, gratuit, (contact) et 45cm, Arme d'assaut, +D3A, MA, TT (1) / AP5+/AC6+, FrtF
        - **Kanon Gatling**, +25 pts, 45cm, 6x AP4+/AC5+, FrtF
        - **Super Kanon**, +25 pts, 60cm, 2 PB, MA, FrtF
        - **Super Leva-Lacha**, +25 pts, 45cm, MA4+, TT (D6), FrtF
        - **Super Zap**, +25 pts, 60cm, MA3+, TT (D3), FrtF
    - titre: "DAKKA KUST'OM DE GARGANT"
      texte: |
        Armes réservées aux Gargants, en plus de la liste des Dakka Kust'om.

        - **Kanon d'la Mort**, +50 pts, 90cm, MA3+, TT (D3), FrtF
        - **Mega-Zap**, +50 pts, 60cm et (contact), MA3+, TT (D3), FrtF / Arme d'assaut, +1A, MA, TT (D3)
        - **2x Missiles Grots**, +50 pts, illimité, MA3+, TT (D3), Uniq, Aucune ligne de vue requise, emplacement de bras uniquement
        - **Mega-Lobba**, +50 pts, 60cm, D3+3 PB, FrtF
        - **Mega-Kanon**, +50 pts, 75cm, 4PB, MA, FrtF
        - **Snapper**, +25 pts, (contact) ou (15cm), Arme d'assaut, +1A, MA, TT (1), FeP / Arme légère, +2A, FeP
    - titre: "EKIP'MENT KUST'OM"
      texte: |
        - **Boucliers en rab'** (+25 pts) : ajoute D3 Champs Énergétiques à l'Engin de Guerre.
        - **Chaudière Renforcée** (+50 pts) : ajoute +5cm à la caractéristique de vitesse de l'Engin de Guerre.
        - **Blindage Supplémentaire** (+50 pts) : ajoute +1 CD à l'Engin de Guerre (pas d'impact sur Téla Tépula ou la place de transport en Kroiseur).
        - **Cibleurs Grots** (+50 pts) : ajoute une attaque AA5+ à tous les Gros Kanons de l'Engin de Guerre.
        - **Grot Bidouilleur** (+25 pts) : l'Engin de Guerre peut relancer un jet d'incendie par tour.
        - **Kaptain** (+25 pts) : ajoute la note Meneur à l'Engin de Guerre.
        - **Tête de Gork** (+50 pts) : ajoute la note Charismatique à l'Engin de Guerre. Gargant uniquement.
        - **TAKATAKATAKA** (+50 pts) : l'Engin de Guerre gagne +3 attaques supplémentaires d'armes légères. Gargant uniquement.
        - **Transport** (+25 pts) : ajoute la note Transport (peut transporter dix unités parmi Boyz, Nobz, Kopter, Boit'Kitu, Dreadnought ; les Kopters prennent deux places ; peut transporter quatre unités de Gretchins en plus des autres unités) à l'Engin de Guerre. Gargant uniquement.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture rasmusillustration."
  valeur_strategique: 2
  initiative:
    defaut: "3+"
    exceptions: []

