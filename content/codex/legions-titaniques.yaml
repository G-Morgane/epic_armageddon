formations:
  # ---------- Formations de bases ----------
  - id: titan_warlord
    nom: Titan Warlord
    variantes:
      - { id: base, cout: 725, composition: [{ unite: titan_warlord, nombre: 1 }] }
    options: [legat, princeps_veteran_warlord, multi_lasers_carapace, icone_sacree, auspex_ameliore, cloche_devotion, armement_warlord, seconde_arme_carapace]
  - id: titan_warbringer
    nom: Titan Warbringer Nemesis
    variantes:
      - { id: base, cout: 700, composition: [{ unite: titan_warbringer, nombre: 1 }] }
    options: [legat, princeps_veteran, icone_sacree, auspex_ameliore, armement_warbringer]
  - id: titan_reaver
    nom: Titan Reaver
    variantes:
      - { id: base, cout: 575, composition: [{ unite: titan_reaver, nombre: 1 }] }
    options: [legat, princeps_veteran, multi_lasers_carapace, icone_sacree, auspex_ameliore, armement_reaver]
  - id: meute_warhounds
    nom: Meute de Warhounds
    variantes:
      - { id: base, cout: 500, composition: [{ unite: titan_warhound, nombre: 2 }] }
    options: [princeps_veteran, armement_meute_warhounds]
    contraintes: [{ type: max_par_armee, valeur: 2 }]

  # ---------- Formations de soutien ----------
  - id: titan_warhound
    nom: Titan Warhound
    variantes:
      - { id: base, cout: 275, composition: [{ unite: titan_warhound, nombre: 1 }] }
    options: [princeps_veteran, armement_warhound]
  - id: cohorte_secutarii_peltastes
    nom: Cohorte de Secutarii Peltastes
    variantes:
      - { id: base, cout: 200, composition: [{ unite: secutarii_peltastes, nombre: 8 }] }
    options: [tunneliers]
  - id: cohorte_secutarii_hoplites
    nom: Cohorte de Secutarii Hoplites
    variantes:
      - { id: base, cout: 200, composition: [{ unite: secutarii_hoplites, nombre: 8 }] }
    options: [tunneliers]

  # ---------- Formations de soutien rare ----------
  - id: titan_imperator
    nom: Titan Imperator
    variantes:
      - { id: base, cout: 1250, composition: [{ unite: titan_imperator, nombre: 1 }] }
    options: [legat]
  - id: titan_imperator_warmonger
    nom: Titan Imperator Warmonger
    variantes:
      - { id: base, cout: 1250, composition: [{ unite: titan_imperator_warmonger, nombre: 1 }] }
    options: [legat]

sections:
  - id: bases
    titre: FORMATIONS DE BASES
    formations: [titan_warlord, titan_warbringer, titan_reaver, meute_warhounds]
    contraintes:
      - { type: max_options, valeur: 4 }
      - { type: fournit, budget: slot_soutien, quantite: 2 }
      - { type: fournit, budget: slot_rare, quantite: 1 }
  - id: soutien
    titre: FORMATIONS DE SOUTIEN
    sous_titre: "Deux formations de soutien par formation de base"
    formations: [titan_warhound, cohorte_secutarii_peltastes, cohorte_secutarii_hoplites]
    contraintes:
      - { type: max_options, valeur: 4 }
      - { type: consomme, budget: slot_soutien }
  - id: soutien_rare
    titre: FORMATIONS DE SOUTIEN RARE
    sous_titre: "Une formation de soutien rare par formation de base, jusqu'à 1/3 des points maximum"
    formations: [titan_imperator, titan_imperator_warmonger]
    contraintes:
      - { type: max_options, valeur: 4 }
      - { type: consomme, budget: slot_rare }
      - { type: consomme, budget: rare, quoi: points }

listes_test:
  - nom: "4000 pts : deux bases, deux soutiens et un soutien rare"
    limite: 4000
    attendu: valide
    formations:
      - formation: titan_warlord
        options:
          - { option: armement_warlord, choix: poing_combat }
          - { option: armement_warlord, choix: canon_gatling }
          - { option: armement_warlord, choix: lance_roquettes_apocalypse }
          - { option: armement_warlord, choix: canon_volcano }
          - { option: seconde_arme_carapace, choix: canon_gatling }
          - { option: princeps_veteran_warlord }
      - formation: meute_warhounds
        options:
          - { option: armement_meute_warhounds, choix: canon_plasma_leger }
          - { option: armement_meute_warhounds, choix: canon_plasma_leger }
          - { option: armement_meute_warhounds, choix: mega_bolter_vulcain_leger }
          - { option: armement_meute_warhounds, choix: mega_bolter_vulcain_leger }
      - formation: titan_warhound
        options:
          - { option: armement_warhound, choix: destructeur_turbo_laser_leger }
          - { option: armement_warhound, choix: mega_bolter_vulcain_leger }
      - formation: cohorte_secutarii_hoplites
        options: [{ option: tunneliers, choix: taupe }]
      - formation: titan_imperator
        options: [{ option: legat }]
  - nom: "1500 pts : un Reaver complet et deux soutiens"
    limite: 1500
    attendu: valide
    formations:
      - formation: titan_reaver
        options:
          - { option: armement_reaver, choix: poing_tronconneur }
          - { option: armement_reaver, choix: destructeur_turbo_laser }
          - { option: armement_reaver, choix: annihilateur_plasma }
          - { option: icone_sacree, choix: remplacer_carapace }
          - { option: auspex_ameliore }
          - { option: multi_lasers_carapace }
          - { option: princeps_veteran }
      - formation: cohorte_secutarii_peltastes
        options: [{ option: tunneliers, choix: termites }]
      - formation: titan_warhound
        options:
          - { option: armement_warhound, choix: griffe_ursus }
          - { option: armement_warhound, choix: canon_inferno_leger }
  - nom: "trois soutiens pour une seule formation de base"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: titan_warlord }
      - { formation: titan_warhound }
      - { formation: cohorte_secutarii_hoplites }
      - { formation: cohorte_secutarii_peltastes }
  - nom: "cinq améliorations sur un Warlord"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: titan_warlord
        options:
          - { option: legat }
          - { option: princeps_veteran_warlord }
          - { option: multi_lasers_carapace }
          - { option: icone_sacree, choix: equiper }
          - { option: cloche_devotion, choix: equiper }
          - { option: auspex_ameliore }
  - nom: "deux Missiles Warp dans l'armée"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: titan_warlord
        options: [{ option: armement_warlord, choix: missile_warp }]
      - formation: titan_reaver
        options: [{ option: armement_reaver, choix: missile_warp }]
  - nom: "trois Meutes de Warhounds"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: meute_warhounds }
      - { formation: meute_warhounds }
      - { formation: meute_warhounds }
  - nom: "cinq armes sur un Reaver"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: titan_reaver
        options:
          - { option: armement_reaver, choix: poing_combat }
          - { option: armement_reaver, choix: poing_combat }
          - { option: armement_reaver, choix: canon_gatling }
          - { option: armement_reaver, choix: canon_gatling }
