options:
  # ---------- Améliorations ----------
  - id: legat
    nom: Légat
    effet: { type: ajouter, unites: [{ unite: legat, nombre: 1 }], cout: 50 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: max_par_armee, valeur: 1 }
    note_md: "Ajouter un Légat au Titan. Un seul Légat par armée. Le Légat doit obligatoirement rejoindre le titan avec la plus grande Capacité de Dommages de l'armée."
  - id: princeps_veteran
    nom: Princeps Vétéran
    effet: { type: ajouter, unites: [{ unite: princeps_veteran, nombre: 1 }], cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter un Princeps Vétéran au Titan (Warhound, Reaver, Warbringer)."
  - id: princeps_veteran_warlord
    nom: Princeps Vétéran
    effet: { type: ajouter, unites: [{ unite: princeps_veteran, nombre: 1 }], cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter un Princeps Vétéran au Titan Warlord."
  - id: multi_lasers_carapace
    nom: Multi-lasers de Carapace
    effet: { type: mot_cle, texte: "Multi-Laser de Carapace (30cm, AP5+/AC6+/AA5+)", cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter des Multi-lasers de carapace au Titan."
  - id: icone_sacree
    nom: Icône Sacrée
    effet:
      type: choix
      parmi:
        - id: equiper
          nom: "Équiper le Titan d'une Icône Sacrée"
          cout: 50
          effet: { type: mot_cle, texte: "Icône Sacrée (Charismatique)" }
        - id: remplacer_carapace
          nom: "Remplacer un système d'arme de carapace par une Icône Sacrée"
          cout: 0
          effet: { type: mot_cle, texte: "Icône Sacrée (Charismatique)" }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "L'Icône Sacrée ajoute la note Charismatique au Titan. En remplacement, elle prend la place d'un système d'arme de carapace : retirez une arme de carapace du Titan."
  - id: cloche_devotion
    nom: Cloche de Dévotion
    effet:
      type: choix
      parmi:
        - id: equiper
          nom: "Équiper le Titan d'une Cloche de Dévotion"
          cout: 100
          effet: { type: mot_cle, texte: "Cloche de Dévotion (Mouvement +5cm, Charismatique, Meneur, Sauvegarde Invulnérable)" }
        - id: remplacer_carapace
          nom: "Remplacer deux systèmes d'arme de carapace par une Cloche de Dévotion"
          cout: 0
          effet: { type: mot_cle, texte: "Cloche de Dévotion (Mouvement +5cm, Charismatique, Meneur, Sauvegarde Invulnérable)" }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "La Cloche de Dévotion donne Mouvement Titan +5cm, Charismatique, Meneur et Sauvegarde Invulnérable. En remplacement, elle prend la place de deux systèmes d'arme de carapace : retirez deux armes de carapace du Titan."
  - id: auspex_ameliore
    nom: Auspex amélioré
    effet: { type: mot_cle, texte: "Auspex Amélioré (Tir Indirect sur toutes les armes ayant une valeur de Barrage)", cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Équiper le Titan d'un Auspex amélioré."
  - id: tunneliers
    nom: Tunneliers
    effet:
      type: choix
      parmi:
        - id: termites
          nom: Ajouter 4 Termites à la formation
          cout: 100
          effet: { type: ajouter, unites: [{ unite: termite, nombre: 4 }] }
        - id: taupe
          nom: Ajouter 1 Taupe à la formation
          cout: 50
          effet: { type: ajouter, unites: [{ unite: taupe, nombre: 1 }] }
        - id: fouisseuse
          nom: Ajouter 1 Fouisseuse à la formation
