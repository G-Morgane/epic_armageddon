# Légions Titaniques, transcrit depuis le PDF v1.4.1 (source de vérité).
codex:
  slug: legions-titaniques
  armee_id: b344fee5-9202-4ec3-8231-6d2bdf1664cf
  logo: /icons/legions_titaniques.svg
  nom: Légions Titaniques
  version: "1.4.1"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/legions-titaniques.jpg
  citation:
    texte: "En vérité, un Titan n'a que trois ennemis contre lesquels il doit se protéger : la folie, l'orgueil et un de ses semblables."
    auteur: Grand Maître Volkus, Ordo Sinister
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une Légion Titanique. Les Titans sont d'immenses machines de combat, des guerriers humanoïdes mécaniques pouvant atteindre jusqu'à 30 mètres de haut. Ils instillent la terreur par leur simple présence, et peu de choses peuvent égaler leur armement. Peu d'ennemis, à part un autre Titan, peuvent s'opposer à eux.

    Les Légions Titaniques sont organisées en formations appelées formations de bases, formations de soutien et formations de soutien rare.

    Pour chaque formation de base vous pouvez prendre jusqu'à deux formations de soutien et/ou une formation de soutien rare (jusqu'à un maximum d'un tiers des points de l'armée).

    Chaque formation peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par formation pour un maximum de quatre par détachement. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion.
  regles_md:
    - titre: "Règle spéciale : Boucliers du vide"
      texte: |
        Certains engins de guerre comme les Titans impériaux, les Léviathans de la Garde Impériale et des Squats ou encore les Deathwheels de la Black Legion sont protégés par des boucliers énergétiques. Le nombre de boucliers de chaque engin de guerre est noté sur sa fiche d'unité.

        Chaque bouclier stoppe automatiquement un point de dommages avant de se désactiver. Ne faites pas de sauvegarde contre les attaques stoppées par des boucliers, n'ajoutez pas non plus de pion d'impact pour chaque bouclier désactivé. Une fois que tous les boucliers sont désactivés, l'engin de guerre peut être endommagé normalement. Faites les jets de sauvegarde habituels contre les touches subies.

        Les touches de corps à corps lors d'un assaut ignorent les boucliers, mais pas celles de fusillade.

        Les boucliers désactivés peuvent être réparés. Un engin de guerre répare un bouclier désactivé à la fin de chaque tour. De plus, si un engin de guerre se regroupe, il peut utiliser le résultat de son dé pour retirer des pions d'impact ou pour réparer des boucliers (par exemple, si le résultat est 2, vous pouvez soit retirer 2 pions d'impact, soit réparer 2 boucliers, soit retirer 1 pion d'impact et réparer 1 bouclier).
    - titre: "Règle spéciale : Tunneliers"
      texte: |
        Le Mechanicum utilise des Tunneliers pour mener sans danger par voie souterraine les troupes à des lieux clés du champ de bataille :

        - Les tunneliers sont déployés sur leur bord de table avant la bataille, au même moment que les vaisseaux spatiaux, ils n'interviennent pas directement dans le jeu tant qu'ils n'émergent pas.
        - Noter secrètement au début de quel tour ils feront surface ainsi que les coordonnées (à partir de la pointe de la ou d'une des foreuses) où vous voulez qu'ils émergent, de la même façon que vous notez celles de vos zones de largage.
        - Si les tunneliers apparaissent dans votre moitié de table, ils ne peuvent le faire qu'à partir du second tour et s'ils comptent émerger dans la moitié de table ennemie, ils ne peuvent le faire qu'à partir du troisième tour.
        - Les tunneliers émergeant sont placés en début de tour, avant le jet de stratégie. Une fois les tunneliers placés vous pouvez faire débarquer vos troupes de suite.
        - Il n'y a pas de déviation mais si toutefois, ils émergent sous les pieds de n'importe quel type d'unité (amie ou ennemie) ou dans une zone de contrôle ennemie, l'unité est placée par l'adversaire dans la zone dégagée la plus proche pouvant la recevoir.
        - S'il y a plus d'une unité de Tunnelier qui émerge, après le placement de la première, les autres sont toutes placées à 15cm maximum de celle-ci tout en restant en formation.
    - titre: "Alliance : Mechanicum"
      texte: |
        Un tiers des points d'une liste de Légions Titaniques peut être sélectionné dans l'un des deux codex Chevaliers Impériaux ou Adeptus Mechanicus. Cette sélection doit respecter la structure de ces listes (ex : un choix de base pour avoir deux choix de soutien, etc.) et elle ne peut pas inclure d'unités possédant la note Commandant Suprême.
    - titre: "Armement des Titans"
      texte: |
        Les Titans choisissent leur armement avec les restrictions suivantes :

        - Un Titan Warhound est équipé de deux armes légères.
        - Un Titan Reaver doit être équipé de 3 armes aux choix parmi les armes d'assaut, tactiques et de support.
        - Un Titan Warbringer Nemesis doit être équipé de 2 Armes de bras à choisir parmi Canon Gatling, Turbo Laser, Canon Fuseur et Canon Volcano.
        - Un Titan Warlord doit être équipé de 4 armes aux choix parmi les armes d'assaut, tactiques et de support.

        Les armes des catégories Légères et Assaut sont gratuites, les armes Tactiques coûtent 25 points pièce et les armes de support coûtent 50 points pièce. Ces points s'ajoutent à ceux du Titan sélectionné.

        Le Titan Warlord a la possibilité de prendre une deuxième arme tactique de carapace identique gratuitement, parmi : Lance-roquettes Apocalypse, Destructeur Turbo Laser, Méga Bolter Vulcain, Canon Gatling.

        Les emplacements (bras ou carapace) sont indiqués dans les tableaux d'armes ci-dessous et doivent être respectés lors du choix de l'armement.
    - titre: "Armes légères (gratuites)"
      texte: |
        - **Griffe d'Ursus**, (contact), Arme d'assaut, +1A, TT (1D3)
        - **Natrix Shock Lance**, 30cm et (15cm), 2xAC3+, Lance, Ignore les boucliers du Vide / Arme Légère, +1A, Lance, Ignore les boucliers du Vide
        - **Canon à Plasma Léger**, 45cm, 2xMA2+, Rchg
        - **Canon Inferno Léger**, 30cm et (15cm), 2PB, IC / Arme Légère, +1A, IC
        - **Destructeur Turbo Laser Léger**, 45cm, 4xAP5+/AC3+
        - **Méga Bolter Vulcain Léger**, 45cm, 4x AP3+/AC5+
    - titre: "Armes d'assaut (gratuites)"
      texte: |
        - **Module d'assaut Corvus**, (15cm), Arme Légère, +4A, Transport (8). Emplacement de Bras uniquement, Titan Warlord uniquement, Transport d'Infanterie exclusif
        - **Poing de Combat**, (contact), Arme d'Assaut, +3A, TT (D3). Emplacement de Bras uniquement
        - **Poing tronçonneur**, (contact), Arme d'Assaut, +6A, MA. Emplacement de Bras uniquement
        - **Démolisseur**, (contact), Arme d'Assaut, +1A, TT (D6), FeP. Emplacement de Bras uniquement
    - titre: "Armes tactiques (25 pts pièce)"
      texte: |
        - **Canon à Plasma**, 60cm, 3xMA2+, Rchg. Emplacement de Bras uniquement
        - **Canon Inferno (PB)**, 30cm et (15cm), 4PB, IC / Arme Légère, +2A, IC. Emplacement de Bras uniquement
        - **Destructeur Turbo Laser**, 60cm, 4xAP5+/AC3+
        - **Méga Bolter Vulcain**, 45cm, 6x AP3+/AC5+
        - **Lance-roquettes Apocalypse**, 60cm, 4PB. Emplacement de carapace uniquement
        - **Canon Gatling (Titan)**, 60cm, 4xAP4+/AC4+
        - **Thermo Fuseur**, (15cm), Arme Légère, +3A, MA. Emplacement de Bras uniquement
        - **Canon Fuseur**, 30cm et (15cm), 2xMA3+, TT (1) / Arme Légère, +1A, TT (D3). Emplacement de Bras uniquement
        - **Poing de Combat Arioch**, 30cm et (contact), 2x AP3+/AC5+ / Arme d'Assaut, +3A, TT (D3). Emplacement de Bras uniquement, Titan Warlord uniquement
    - titre: "Armes de support (50 pts pièce)"
      texte: |
        - **Annihilateur à plasma**, 90cm, 4xMA2+, Rchg. Emplacement de Bras uniquement
        - **Sismo Canon (Titan)**, 90cm, 3PB, MA. Emplacement de Bras uniquement
        - **Canon Volcano (Titan)**, 90cm, MA2+, TT (D3). Emplacement de Bras uniquement
        - **0-1 Missile Warp**, Illimité, MA2+, Uniq, TT (D3), Ind. Cette arme ignore les boucliers du Vide. Emplacement de carapace uniquement
        - **Missile de barrage**, Illimité, 8PB, Uniq, Rpt, Ind. Emplacement de carapace uniquement
    - titre: "Améliorations des Titans"
      texte: |
        - **Multi-Laser de Carapace**, 30cm, AP5+/AC6+/AA5+
        - **Icône Sacrée** : ajouter la Note Charismatique au Titan.
        - **Cloche de Dévotion** : Mouvement Titan +5cm, ajouter la Note Charismatique, Meneur et Sauvegarde Invulnérable au Titan.
        - **Auspex Amélioré** : ajouter la Note Tir Indirect à toutes les Armes ayant une valeur de Barrage.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture GW LTD."
  valeur_strategique: 3
  initiative:
    defaut: "1+"

