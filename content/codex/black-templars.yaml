    degats: { cd: 4, critique: "La Barge de débarquement s'écrase au sol et est détruite, ainsi que toutes les unités à son bord. Toute unité dans un rayon de 5cm de l'appareil subit une touche si la Barge de débarquement se trouvait au sol." }
  - id: croiseur_attaque
    nom: Croiseur d'attaque
    type: VS
    armes:
      - { nom: Bombardement Orbital (5), portee: "∞", puissance: "5PB, MA" }
    notes: ["Transport (20+20+6) : Croisés, Novices, Marines d'Assaut, Terminators, Dreadnoughts, Motos et Motos d'assaut, plus 20 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 6 Thunderhawks et Thunderhawks Transporteurs. De plus, le Croiseur d'Attaque peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."]
  - id: barge_bataille
    nom: Barge de bataille
    type: VS
    armes:
      - { nom: Bombardement Orbital (14), portee: "∞", puissance: "14PB, MA" }
    notes:
      - "Lent, ne peut être utilisé aux tours 1 et 2."
      - "Transport (60+60+6) : Croisés, Novices, Marines d'Assaut, Terminators, Dreadnoughts, Motos et Motos d'Assaut, plus 60 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 9 Thunderhawks et Thunderhawks Transporteurs. De plus, la Barge de Bataille peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."

  # ---- Légions Titaniques : importées par l'alliance avec adeptus-titanicus ----

options:
  - id: commandant
    nom: Commandant
    effet:
      type: choix
      parmi:
        - { id: capitaine, nom: Capitaine, cout: 50, effet: { type: ajouter, unites: [{ unite: capitaine }] } }
        - { id: chapelain, nom: Chapelain, cout: 50, effet: { type: ajouter, unites: [{ unite: chapelain }] } }
        - id: maitre_chapitre
          nom: Maître de Chapitre
          cout: 50
          effet: { type: ajouter, unites: [{ unite: maitre_chapitre }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Capitaine ou un Chapelain (Remplacer un Capitaine par 0-1 Maître de Chapitre, gratuit)"
    note_md: "Un seul Maître de Chapitre par armée (Commandant Suprême). Le codex Black Templars ne propose pas d'Archiviste."
  - id: champion_empereur
    nom: Champion de l'Empereur
    effet: { type: ajouter, cout: 50, unites: [{ unite: champion_empereur, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: max_par_armee, valeur: 1 }
      - { type: min_par_armee, valeur: 1 }
    phrase_pdf: "Ajouter un Champion de l'Empereur"
    note_md: "Règle spéciale Champion de l'Empereur : une armée Black Templars doit inclure un, et un seul, Champion de l'Empereur. Cette amélioration n'est proposée qu'aux détachements Black Templars, une armée valide comprend donc au moins un détachement Black Templars."
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 50, cible: [terminators, terminators_assaut] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Téléportation aux unités d'infanteries de la formation"
  - id: novice
    nom: Novice
    effet: { type: ajouter, cout_par_unite: 75, unites: [{ unite: novices, nombre: 2 }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 ou 4 unités de Novices (75 pts / 150 pts)"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorback
    nom: Razorback
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter autant de Razorbacks (tous types) que d'unités à transporter, 25 pts chacun"
  - id: dreadnought
    nom: Dreadnought
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: dreadnought, cout: 50 }
        - { unite: dreadnought_feu_enfer, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Dreadnoughts à la formation parmi : Dreadnought et Dreadnought Feu d'Enfer, 50 pts chacun"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: predator_annihilator, cout: 65 }
        - { unite: predator_destructor, cout: 65 }
        - { unite: vindicator, cout: 65 }
        - { unite: land_raider, cout: 75 }
        - { unite: land_raider_crusader, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 véhicules blindés à la formation selon n'importe quelle combinaison : Predator Annihilator, Predator Destructor, Vindicator (65 pts chacun), Land raider, Land raider Crusader (75 pts chacun)"
  - id: land_raider
    nom: Land Raider
    effet:
      type: choix_multiple
      total: { min: 1, max: 4 }
      parmi:
        - { unite: land_raider, cout: 75 }
        - { unite: land_raider_crusader, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 Land raiders ou Land raiders Crusaders, 75 pts chacun"
  - id: vindicators
    nom: Vindicators
    effet: { type: ajouter, cout_par_unite: 65, unites: [{ unite: vindicator }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Vindicators, 65 pts chacun"
  - id: tornado_typhoon
    nom: Tornado / Typhoon
    effet: { type: mot_cle, texte: "Land speeders Tornado et Typhoon au choix dans la composition", cout: 0, cible: [land_speeder, land_speeder_tornado, land_speeder_typhoon] }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation peut contenir des land speeders selon n'importe quelle combinaison : remplacer des unités par autant de Land speeders Tornado (5 pts chacun) ou de Land speeders Typhoon (15 pts chacun)"
    note_md: "Porté par la composition de la formation Land speeders (5 unités parmi Land speeder 0 pt, Tornado 5 pts, Typhoon 15 pts) ; cette ligne ne sert qu'à l'affichage du tableau."
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Module d'atterrissage à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage, tout: true, par_nombre: 1, cout: 0 }
          contraintes: [{ type: exclut, options: [razorback, hunter, support_lourd] }]
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par un Module d'atterrissage"
    note_md: "Vient de la règle spéciale Transports et non du tableau des améliorations : elle ne consomme donc pas le quota de 3 améliorations. Une formation contenant des unités ne pouvant pas être déployées en Module d'atterrissage (Razorbacks, Hunter, Support Lourd) ne peut pas choisir le Module."

formations:
  # ---- Détachements principaux ----
  - id: black_templars
    nom: Black Templars
    variantes:
      - id: base
        cout: 275
        composition:
          - { unite: croises, nombre: 6 }
          - { transports: { unite: rhino } }
    options: [commandant, dreadnought, razorback, hunter, support_lourd, novice, champion_empereur, transport_remplacement]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]
    phrase_pdf: "6 unités de Croisés + transports"
  - id: assaut
    nom: Assaut
    variantes:
      - { id: base, cout: 175, composition: [{ unite: marines_assaut, nombre: 4 }] }
    options: [commandant]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]
    phrase_pdf: "4 unités de Marines d'assaut"

  # ---- Détachements de soutien ----
  - id: terminator
    nom: Terminator
    variantes:
      - { id: assaut, nom: 4 unités Terminators d'assaut, cout: 275, composition: [{ unite: terminators_assaut, nombre: 4 }] }
      - { id: terminators, nom: 4 unités Terminators, cout: 300, composition: [{ unite: terminators, nombre: 4 }] }
    options: [commandant, dreadnought, land_raider, teleportation]
  - id: motos
    nom: Motos
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 5
              parmi: [{ unite: motos, cout: 0 }, { unite: motos_assaut, cout: 0 }]
              phrase_pdf: "5 unités parmi : Motos, Motos d'assaut"
    options: [commandant]
  - id: land_speeders
    nom: Land speeders
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 5
              parmi: [{ unite: land_speeder, cout: 0 }, { unite: land_speeder_tornado, cout: 5 }, { unite: land_speeder_typhoon, cout: 15 }]
              phrase_pdf: "5 Land speeders"
    options: [commandant, tornado_typhoon]
  - id: vindicators
    nom: Vindicators
    variantes:
      - { id: base, cout: 250, composition: [{ unite: vindicator, nombre: 4 }] }
    options: [commandant]
  - id: land_raiders
    nom: Land Raiders
    variantes:
      - { id: base, cout: 350, composition: [{ unite: land_raider, nombre: 4 }] }
    options: [commandant, vindicators]
  - id: predators
    nom: Predators
    variantes:
      - { id: destructor, nom: 4 Predators Destructor, cout: 225, composition: [{ unite: predator_destructor, nombre: 4 }] }
      - { id: annihilator, nom: 4 Predators Annihilator, cout: 275, composition: [{ unite: predator_annihilator, nombre: 4 }] }
    options: [commandant, vindicators]
  - id: whirlwinds
    nom: Whirlwinds
    variantes:
      - { id: base, cout: 300, composition: [{ unite: whirlwind, nombre: 4 }] }
    options: [commandant, hunter]

  # ---- Supports : Flotte Black Templars ----
  - id: thunderhawk
    nom: Thunderhawk
    variantes:
      - { id: base, cout: 225, composition: [{ unite: thunderhawk, nombre: 1 }] }
  - id: thunderhawks_transporteurs
    nom: Thunderhawks transporteurs
    variantes:
      - { id: deux, nom: 2 Thunderhawks transporteurs, cout: 300, composition: [{ unite: thunderhawk_transporteur, nombre: 2 }] }
      - { id: trois, nom: 3 Thunderhawks transporteurs, cout: 450, composition: [{ unite: thunderhawk_transporteur, nombre: 3 }] }
    phrase_pdf: "2 Thunderhawks transporteurs (Ajouter 1 Thunderhawk transporteur : +150 pts)"
  - id: barge_debarquement
    nom: Barge de débarquement
    variantes:
      - { id: base, cout: 400, composition: [{ unite: barge_debarquement, nombre: 1 }] }
  - id: intercepteurs_stormtalons
    nom: Intercepteurs Stormtalons
    variantes:
      - { id: destructor, nom: 2 Stormtalons Destructor, cout: 200, composition: [{ unite: stormtalon_destructor, nombre: 2 }] }
      - { id: annihilator, nom: 2 Stormtalons Annihilator, cout: 250, composition: [{ unite: stormtalon_annihilator, nombre: 2 }] }
  - id: stormeagles
    nom: Stormeagles
    variantes:
      - { id: base, cout: 275, composition: [{ unite: stormeagle, nombre: 2 }] }
  - id: caestus
    nom: Bélier d'assaut Caestus
    variantes:
      - { id: deux, nom: 2 Caestus, cout: 250, composition: [{ unite: belier_assaut_caestus, nombre: 2 }] }
      - { id: trois, nom: 3 Caestus, cout: 350, composition: [{ unite: belier_assaut_caestus, nombre: 3 }] }
    phrase_pdf: "2 Caestus (Ajouter 1 Caestus : +100 pts)"
  - id: soutien_orbital
    nom: Soutien orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur d'attaque, cout: 200, composition: [{ unite: croiseur_attaque, nombre: 1 }] }
      - { id: barge_bataille, nom: 1 Barge de bataille, cout: 350, composition: [{ unite: barge_bataille, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    phrase_pdf: "0-1 Soutien orbital"

sections:
  - id: detachements_principaux
    titre: DÉTACHEMENTS PRINCIPAUX BLACK TEMPLARS
    formations: [black_templars, assaut]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
    notes:
      champion: "Une armée Black Templars doit obligatoirement inclure un, et un seul, Champion de l'Empereur pour 50 pts."
  - id: detachements_soutien
    titre: DÉTACHEMENTS DE SOUTIEN BLACK TEMPLARS
    sous_titre: "Jusqu'à 3 détachements de soutien par détachement principal"
    formations: [terminator, motos, land_speeders, vindicators, land_raiders, predators, whirlwinds]
    contraintes: [{ type: consomme, budget: soutien }, { type: max_options, valeur: 3 }]
    colonne_options: true
    # Tableau unique des améliorations du PDF : `options` reprend toutes les améliorations dans l'ordre du PDF
    # (chaque formation garde sa propre liste `options`, cette liste ne sert qu'au tableau).
    options: [commandant, champion_empereur, teleportation, novice, hunter, razorback, dreadnought, support_lourd, land_raider, vindicators, tornado_typhoon, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS BLACK TEMPLARS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 3 améliorations"
  - id: flotte
    titre: FLOTTE BLACK TEMPLARS
    sous_titre: "SUPPORTS BLACK TEMPLARS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [thunderhawk, thunderhawks_transporteurs, barge_debarquement, intercepteurs_stormtalons, stormeagles, caestus, soutien_orbital]
  - id: titanicus
    titre: SOUTIEN DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS BLACK TEMPLARS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: adeptus-titanicus }
    notes:
      sans_peur: "Les formations prises en Soutien des Légions Titaniques ne bénéficient pas de la règle « Et ils ne connaîtront pas la peur »."

listes_test:
  - nom: "3000 pts valide, Champion de l'Empereur, Terminators d'assaut et un Warhound"
    limite: 3000
    attendu: valide
    formations:
      - formation: black_templars
        options:
          - { option: champion_empereur }
          - { option: commandant, choix: capitaine }
          - { option: razorback, repartition: { razorback_bolters_lourds: 1, razorback_canons_laser: 1 } }
      - { formation: assaut }
      - formation: terminator
        variante: assaut
        options:
          - { option: teleportation }
          - { option: commandant, choix: chapelain }
          - { option: land_raider, repartition: { land_raider_crusader: 2 } }
      - { formation: predators, variante: destructor }
      - { formation: titan_warhound }
  - nom: "2000 pts valide, Novices, Dreadnoughts et compositions au choix"
    limite: 2000
    attendu: valide
    formations:
      - formation: black_templars
        options:
          - { option: champion_empereur }
          - { option: novice, quantite: 2 }
          - { option: dreadnought, repartition: { dreadnought: 1, dreadnought_feu_enfer: 1 } }
      - formation: motos
        choix: { "0": { motos: 3, motos_assaut: 2 } }
        options: [{ option: commandant, choix: maitre_chapitre }]
      - formation: land_speeders
        choix: { "0": { land_speeder: 3, land_speeder_tornado: 1, land_speeder_typhoon: 1 } }
      - { formation: soutien_orbital, variante: croiseur }
  - nom: "1500 pts valide, Module d'atterrissage à la place des Rhinos"
    limite: 1500
    attendu: valide
    formations:
      - formation: black_templars
        options:
          - { option: champion_empereur }
          - { option: transport_remplacement, choix: module_atterrissage }
      - { formation: whirlwinds }
      - { formation: thunderhawk }
  - nom: "armée sans Champion de l'Empereur"
    limite: 1500
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: black_templars }
      - { formation: assaut }
  - nom: "deux Champions de l'Empereur"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: black_templars, options: [{ option: champion_empereur }] }
      - { formation: black_templars, options: [{ option: champion_empereur }] }
  - nom: "quatre détachements de soutien pour un seul détachement principal"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: black_templars, options: [{ option: champion_empereur }] }
      - { formation: motos, choix: { "0": { motos: 5 } } }
      - { formation: vindicators }
      - { formation: whirlwinds }
      - { formation: predators, variante: destructor }
  - nom: "quatre améliorations sur un même détachement"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: black_templars
        options:
          - { option: champion_empereur }
          - { option: commandant, choix: capitaine }
          - { option: hunter }
          - { option: novice, quantite: 1 }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: black_templars, options: [{ option: champion_empereur }] }
      - { formation: titan_warlord }
