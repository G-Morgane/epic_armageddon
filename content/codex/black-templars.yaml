# Black Templars, transcrit depuis le PDF EAFR rev 1.4.1 (source de vérité).
codex:
  slug: black-templars
  armee_id: a3d34e5d-0503-47a8-aabb-105a7aff8487
  nom: Black Templars
  version: "1.4.1"
  faction: imperium
  categorie: armees-astartes
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/black-templars.jpg
  couleur: "#1c1c1c"
  citation:
    texte: "L'Empereur étend Sa Volonté sur nous lorsque nous détruisons les impurs et reconquérons la galaxie en Son nom. L'Empereur conduira la galaxie vers la vertu, et nous devons donc en appeler à Son jugement pour châtier les impurs... Car Il ne connaît pas la miséricorde."
    auteur: Grand Sénéchal Helbrecht, s'adressant à ses troupes avant la Purge de Guémenon Majoris
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de l'Adeptus Astartes basée sur un chapitre Black Templars avec toutes les spécificités de ce codex.

    Les armées de Black Templars sont organisées autour de petites formations appelées détachements principaux ainsi que des détachements de soutien qui leurs sont autonomes (même si le nombre de détachements de soutien autorisé dépend du nombre de détachements principaux que vous mettez dans votre armée).

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement et chaque détachement peut recevoir au maximum 3 améliorations. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de support sont des formations autonomes des détachements. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Et ils ne connaîtront pas la peur"
      texte: |
        La bravoure et la ténacité des Space Marines sont légendaires. Ces traits de caractère sont représentés par les règles suivantes :

        - Il faut deux pions d'impact pour neutraliser une unité Space Marines ou détruire une unité démoralisée (ignorez les pions d'impacts en plus).
        - Les formations Space Marines ne sont démoralisées qu'à partir du moment où elles ont deux pions d'impact ou plus par unité.
        - Les formations Space Marines comptent comme ayant la moitié de leur nombre de pions impact lors de la résolution de l'assaut (arrondi à l'inférieur, à un minimum de 1 pion impact).
        - Réduisez de moitié le nombre de touches supplémentaires subies par une formation de Space Marines perdant un assaut, en arrondissant à l'entier inférieur en faveur des Space Marines.
        - Lorsqu'une formation Space Marines démoralisée se rallie, elle reçoit un nombre de pions impact égal au nombre d'unités plutôt qu'à la moitié du nombre d'unités.
        - Les Meneurs Space Marines retirent deux pions d'impact au lieu d'habituellement un seul.

        Attention : les formations prises en Soutien de Légions Titaniques ne bénéficient pas de cette règle.
    - titre: "Règle spéciale : Transports"
      texte: |
        Les formations Space Marines disposant d'unités avec le suffixe « + Transports » peuvent prendre assez de Rhinos pour transporter l'intégralité de la formation. Si cette option est prise, le nombre de Rhinos doit être suffisant, mais la capacité totale de transport ne doit pas être excédentaire par rapport au nombre d'unités à transporter.

        Si des véhicules avec une capacité de transport ont été achetés pour la formation (comme des Razorbacks ou des Land Raiders), on considère qu'ils transportent au maximum de leurs capacités et qu'il est possible de prendre assez de Rhinos pour transporter ce qu'il reste de la formation (même si un Rhino se retrouve à moitié vide).

        En outre, il est possible de remplacer tous les Rhinos de la formation par un Dreadnought ou par des Modules d'atterrissage.
    - titre: "Règle spéciale : Champion de l'Empereur"
      texte: |
        Une armée Black Templars doit obligatoirement inclure un, et un seul, Champion de l'Empereur pour 50 pts.
    - titre: "Règle spéciale : Modules d'atterrissage"
      texte: |
        Une formation se déployant par Assaut Planétaire et pouvant être transportée par Modules d'atterrissage le fait selon les règles spéciales suivantes : placez un marqueur de Module d'atterrissage en utilisant les règles d'Assaut Planétaire (4.3 et 4.4 du Livre de Règles). Un Vaisseau en orbite sera nécessaire pour déployer les Modules d'atterrissage.

        Le Module d'atterrissage est un marqueur comptant comme la première unité de la formation au moment de déterminer son emplacement d'arrivée en Assaut Planétaire. Une fois le marqueur de Module d'atterrissage placé, résolvez son attaque de tir sur toutes les unités ennemies à moins de 15 cm du centre du Module d'atterrissage. Chaque formation ennemie attaquée reçoit un Pion Impact selon les règles normales de tir.

        Ensuite, faites débarquer les troupes transportées dans le Module d'atterrissage (cela peut déclencher un tir d'État d'Alerte normalement) complètement à moins de 15 cm du centre de celui-ci, en cohésion et en dehors de toute zone de contrôle ennemie. Si les unités ne peuvent débarquer en totalité en respectant les règles ci-dessus, les unités restantes seront détruites sans attribution de pions d'impacts.

        Le Module d'atterrissage n'étant pas une unité mais un marqueur, il ne possède pas de zone de contrôle et il ne compte pas pour la cohérence de la formation. De plus, il ne peut pas être utilisé pour revendiquer un feu croisé ainsi que pour tenir ou contester des objectifs.

        Si plusieurs formations utilisent des Modules d'atterrissage, placez tous les marqueurs Module d'atterrissage aux coordonnées prédéterminées en utilisant les règles d'Assaut Planétaire (y compris la résolution de dispersion). Une fois que tous les marqueurs sont placés, résolvez toutes les attaques des Modules d'atterrissage simultanément contre les formations ennemies à portée des marqueurs Module d'atterrissage. Les formations visées recevront un pion impact pour le tir pour chaque attaque du vaisseau ou des modules d'atterrissage. Les pertes et les tirs ruptures infligent des PI normalement. Puis débarquez toutes les formations transportées, en suivant les règles ci-dessus.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Andrey Nyarl, page deux John Blanche."
