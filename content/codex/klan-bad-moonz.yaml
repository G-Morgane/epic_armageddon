listes_test:
  - nom: "3000 pts, bandes mastok', truk'en'plus et un Gargant"
    limite: 3000
    attendu: valide
    formations:
      - formation: flashgitz
        variante: mastok
        options:
          - { option: big_boss }
          - { option: k_flashgitz, quantite: 4 }
          - { option: k_grokalibr, quantite: 2 }
      - formation: batterie_grokalibr
        variante: normale
        options:
          - { option: k_brikolo, choix: super_zap }
          - { option: k_nobz, quantite: 1 }
      - { formation: bande_krabouillators, variante: normale, options: [{ option: k_krabouillators, quantite: 2 }] }
      - { formation: nobz_mega_armure, options: [{ option: k_telatepula }] }
      - { formation: batterie_rokets_pulsor }
      - { formation: gargant }

  - nom: "sans Big Boss"
    limite: 2000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: flashgitz, variante: normale }
      - { formation: batterie_grokalibr, variante: normale }

  - nom: "deux Tours de Bizarboy sur une bande normale"
    limite: 3000
    attendu: refusee
    formations:
      - formation: bande_krabouillators
        variante: normale
        options:
          - { option: big_boss }
          - { option: k_tour_bizarboy }
          - { option: k_tour_bizarboy }

  - nom: "trois truk'en'plus pour une seule bande"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: flashgitz
        variante: normale
        options: [{ option: big_boss }]
      - { formation: batterie_rokets_pulsor }
      - { formation: nobz_mega_armure }
      - { formation: bande_forteresses, choix: { "0": { forteresse_bataille: 2 } } }

  - nom: "truk'eud'mek au-delà du tiers des points"
    limite: 1500
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: flashgitz
        variante: normale
        options: [{ option: big_boss }]
      - { formation: grand_gargant }
