sections:
  - id: principales
    titre: FORMATIONS PRINCIPALES ELDARS NOIRS
    sous_titre: "Chaque formation principale permet de choisir jusqu'à 3 formations soit dans la liste des formations associée à cette formation principale soit dans la liste des formations d'élites"
    formations: [cabale_eldars_noirs, culte_ceraste, coterie_tourmenteur]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
    options: [grand_voivode, voivode, succube, tourmenteur, executeur, sybarite, portail_noir, teleportation, grotesques, machine_tourment, transport_venom, transport_raider, transport_barge_tantale, banshee, reaper]
    tableau_options:
      titre: AMÉLIORATIONS DES ELDARS NOIRS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation et chaque formation peut recevoir au plus 4 améliorations"
    notes:
      transport: "Transport : ajouter suffisamment de véhicules pour transporter toute la formation sans qu'il ne reste de place libre. Venom ou Raider 25 pts chacun, Barge Tantale 100 pts chacune. Les types d'appareils peuvent être combinés, chaque type compte comme une amélioration."
  - id: cabale
    titre: FORMATIONS DE LA CABALE ELDARS NOIRS
    formations: [immacules, ravageurs_cabale, barge_souffrances_cabale]
    contraintes:
      - { type: consomme, budget: slot_cabale }
      - { type: max_options, valeur: 4 }
    colonne_options: true
  - id: coterie
    titre: FORMATIONS DE LA COTERIE DU TOURMENTEUR
    formations: [hemoxytes, talos, ravageurs_coterie]
    contraintes:
      - { type: consomme, budget: slot_coterie }
      - { type: max_options, valeur: 4 }
    colonne_options: true
  - id: culte
    titre: FORMATIONS DU CULTE CERASTE
    formations: [maitresses_sang_hekatrix, hellions, reavers, barge_souffrances_culte]
    contraintes:
      - { type: consomme, budget: slot_culte }
      - { type: max_options, valeur: 4 }
    colonne_options: true
  - id: elites
    titre: FORMATIONS D'ÉLITES ELDARS NOIRS
    formations: [incubes, fleaux, maitres_betes, mandragores]
    contraintes:
      - { type: consomme, budget: [slot_cabale, slot_culte, slot_coterie] }
      - { type: max_options, valeur: 4 }
    colonne_options: true
  - id: flotte
    titre: FLOTTE DE GUERRE ELDARS NOIRS
    sous_titre: "FORMATIONS DE SOUTIEN ELDARS NOIRS"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [escadrille_intercepteurs, escadrille_voidravens, transporteur, soutien_orbital]
  - id: soutien_titanique
    titre: SOUTIEN TITANIQUE DES ELDARS NOIRS
    sous_titre: "FORMATIONS DE SOUTIEN ELDARS NOIRS"
    contraintes:
      - { type: consomme, budget: rare, quoi: points }
      - { type: initiative, valeur: "1+" }
    formations: [titans_tourmenteurs, titan_moissonneur, horreur_vect]

listes_test:
  - nom: "3000 pts valide, Cabale et Coterie avec leurs formations"
    limite: 3000
    attendu: valide
    formations:
      - formation: cabale_eldars_noirs
        options:
          - { option: transport_raider, quantite: 4 }
          - { option: voivode }
          - { option: portail_noir }
          - { option: banshee }
      - formation: immacules
        variante: huit
        options:
          - { option: sybarite }
          - { option: transport_raider, quantite: 4 }
          - { option: grand_voivode }
      - formation: ravageurs_cabale
        choix: { "0": { ravageur_tenebres: 3, ravageur_desintegrateur: 2 } }
        options: [{ option: reaper, quantite: 2 }]
      - formation: coterie_tourmenteur
        options:
          - { option: grotesques, quantite: 2 }
          - { option: machine_tourment, repartition: { talos: 1, cronos: 1 } }
          - { option: tourmenteur }
      - { formation: hemoxytes }
      - formation: incubes
        variante: six
        options: [{ option: executeur }]
      - formation: fleaux
        options: [{ option: teleportation }]
      - { formation: titans_tourmenteurs, variante: un }
      - formation: escadrille_intercepteurs
        choix: { "0": { razorwing: 2 } }
  - nom: "2000 pts valide, transports combinés, Mandragores et Corsaires"
    limite: 2000
    attendu: valide
    formations:
      - formation: culte_ceraste
        options:
          - { option: transport_venom, quantite: 8 }
          - { option: succube }
          - { option: portail_noir }
      - formation: maitresses_sang_hekatrix
        options:
          - { option: transport_barge_tantale, quantite: 1 }
          - { option: transport_raider, quantite: 1 }
      - formation: reavers
        options: [{ option: succube }]
      - formation: mandragores
        choix: { "0": { mandragores: 3 } }
        options: [{ option: teleportation }]
      - { formation: cabale_eldars_noirs }
      - { formation: maitres_betes }
      - formation: soutien_orbital
        variante: corsaires
        choix: { "1": { escorteur_corsaire: 2 } }
  - nom: "soutien au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: cabale_eldars_noirs }
      - { formation: horreur_vect }
  - nom: "deux formations d'Incubes"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: cabale_eldars_noirs }
      - { formation: incubes, variante: six }
      - { formation: incubes, variante: six }
  - nom: "trop de Raiders pour la Cabale"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: cabale_eldars_noirs
        options: [{ option: transport_raider, quantite: 5 }]
  - nom: "quatre formations pour une seule Cabale"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: cabale_eldars_noirs }
      - { formation: immacules, variante: six }
      - formation: ravageurs_cabale
        choix: { "0": { ravageur_tenebres: 4 } }
      - { formation: barge_souffrances_cabale }
      - { formation: fleaux }
