      - "Tous les escorteurs sélectionnés forment une seule et même formation qui agit de la même manière qu'un vaisseau spatial simple. Ils peuvent combiner leur bombardement orbital en une même attaque, ou tirer séparément (les gabarits ne peuvent se superposer)."
      - "Chaque Corsaire peut choisir de renoncer à sa frappe chirurgicale pour transporter jusqu'à 3 Transporteurs Slavebringer et jusqu'à 1 Moissonneur ainsi que leurs cargaisons."
  - id: croiseur_torture
