# Eldars Noirs, transcrit depuis le PDF EAFR rev 1.5 (source de vérité).
codex:
  slug: eldars-noirs
  nom: Eldars Noirs
  version: "1.5"
  faction: xenos
  categorie: armees-xenos
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/eldars-noirs.jpg
  couleur: "#6100be"
  citation:
    texte: "Nous sommes les maîtres du ciel ténébreux. Nous refusons de ramper dans la fange du champ de bataille. Nous laissons cela aux espèces indignes. Nous ne poserons le pied sur la terre natale de ces vermines que pour appuyer nos talons sur leur gorge."
    auteur: Archonte Vraesque Malidrach, Prince de la Couronne Empoisonnée
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une force Eldars Noirs.

    Les armées Eldars Noirs sont organisées autour de formations principales, elles-mêmes complétées par des formations et des formations d'élites qui leurs sont autonomes.

    Chaque formation principale permet de choisir jusqu'à 3 formations soit dans la liste des formations associée à cette formation principale soit dans la liste des formations d'élites.

    Chaque formation peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par formation et jusqu'à un maximum de 4 améliorations par formation. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion.

    Les formations de support sont des formations autonomes. Elles ne peuvent pas recevoir d'améliorations. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Hit and run"
      texte: |
        Les formations Eldars Noirs qui reçoivent l'ordre avance ou avance rapide peuvent choisir de tirer soit avant, soit après chaque mouvement. Elles ne peuvent néanmoins tirer qu'une seule fois durant l'action. Par exemple, une formation Eldar Noir avec un ordre avance peut tirer puis se déplacer ou se déplacer puis tirer, de même une formation avec un ordre de avance rapide peut tirer et se déplacer deux fois, se déplacer deux fois et tirer, ou se déplacer puis tirer puis encore bouger.

        De plus, les formations Eldars Noirs qui remportent un assaut sont autorisées à utiliser la totalité de leur mouvement lorsqu'elles consolident leur position, au lieu d'être limitées à un mouvement de 5 cm. Cependant, les formations Eldars Noirs qui choisissent de consolider de leur mouvement complet, ne peuvent pas soutenir un autre assaut durant ce tour. Les formations qui souhaitent soutenir un autre assaut ne doivent alors consolider que de 5 cm.

        Les unités Eldars Noirs possédant la note Virtuose peuvent elles, toujours consolider de leur mouvement complet et soutenir d'autres assauts. Il s'agit des unités de Grand voivode et sa cour ; Maîtresses de sang ; Immaculés ; Incubes et Hémoxytes.

        Remarque : une même formation peut contenir des unités Virtuose et d'autres non.
    - titre: "Règle spéciale : La puissance vient de la souffrance"
      texte: |
        Les Eldars Noirs se nourrissent de la souffrance de leurs adversaires. Ainsi, pour chaque perte infligée en assaut par une unité Eldar Noir non démoralisée, sa formation pourra retirer un pion impact à la fin de son action. Les pertes dues à la différence de résultat du combat comptent. Il n'est pas possible de retirer le dernier pion impact de cette façon.
    - titre: "Règle spéciale : Pas de garnison"
      texte: |
        Les Eldars Noirs sont une armée de pirates très mobiles, qui a rarement suffisamment d'effectif pour prendre et tenir une position. C'est pourquoi, au lieu de maintenir une lourde garnison sur la ligne de front, ils comptent sur un écran formé par des éclaireurs pour les avertir de l'approche de toutes forces ennemies. En attendant, la majeure partie de l'armée Eldar Noir reste dans la toile, où elle se tient prête à débarquer rapidement. En jeu, seules les formations de Fléaux, d'Hélion, de Maîtres des bêtes et de Mandragores peuvent se déployer en garnison. De plus si une formation comprend l'amélioration Portail Noir, celle-ci ne peut être positionnée en garnison.
    - titre: "Règle spéciale : Portail noir"
      texte: |
        Les portails sont utilisés par les Eldars Noirs pour sortir de la toile. Ils sont présents sur les Barges des souffrances et sur les Moissonneurs. De plus, chaque personnage de l'armée peut recevoir l'amélioration Portail noir. Elle coûte 50 pts et ajoute la note portail noir au profil du personnage. Elle compte dans le nombre maximum d'améliorations de la formation du personnage. Enfin, l'unité du Grand Voïvode et sa cour peut également recevoir cette amélioration.

        Chaque portail inclus dans une armée permet au joueur Eldar Noir de prendre trois formations et de les conserver en réserve dans la toile. Ces formations en réserve peuvent entrer en jeu par un portail, en réalisant une action qui comporte un mouvement. Ce mouvement est mesuré à partir de la position du portail sur la table de jeu. Notez que les formations peuvent apparaître à travers n'importe quel portail, pas seulement celui qui a été « utilisé » pour permettre de conserver la formation en réserve. Une seule formation peut voyager à travers chaque portail par tour. Notez qu'une formation qui rate son activation en tentant de franchir un portail recevra automatiquement l'ordre tenir (donc peut entrer en jeu en réalisant un simple mouvement en prenant 1 PI pour l'activation ratée, ou alors rester hors de table et se regrouper). Si elle choisit de se regrouper en restant hors de table, cela permettra à une autre formation de pouvoir utiliser ce portail car il ne sera pas considéré comme utilisé par la formation précédente ayant raté son activation. Toute formation voyageant à travers un portail noir porté par une unité démoralisée, recevra immédiatement un PI.

        Seules les unités d'infanterie et les véhicules légers peuvent utiliser les portails noirs.
    - titre: "Règle spéciale : Transport ouvert"
      texte: |
        Des unités d'infanterie Eldars Noirs peuvent être transportées en Raider, Venom ou Barge Tantale. Si vous choisissez de faire transporter une formation, vous devez alors prendre un nombre de transports permettant d'embarquer toute la formation sans laisser aucun espace de transport vide.

        Les unités Eldars Noirs transportées peuvent toujours effectuer leurs tirs ou leurs attaques FF. Mesurez les portées à partir du transport. Les unités transportées (y compris les unités Virtuoses) ne peuvent pas soutenir d'assaut après un mouvement entier de consolidation, mais peuvent le faire si le mouvement de consolidation est de 5 cm.
    - titre: "Règle spéciale : Holochamp"
      texte: |
        Les Holo-champs procurent aux titans une sauvegarde spéciale de 3+ qui peut être utilisée à la place de la sauvegarde normale du titan. Cette sauvegarde peut toujours être utilisée, même en corps à corps, en fusillade et contre les armes tueuses de titan ou les macro-armes. Faites une seule sauvegarde contre les armes avec la capacité tueuse de titan, au lieu de séparer les sauvegardes pour chaque point de dommage. Si un véhicule avec un Holo-champ a aussi un blindage renforcé, alors il est autorisé à relancer ses sauvegardes, sauf pour les attaques faites avec des armes ayant la capacité lance, macro-armes ou tueuses de titans. La relance doit être faite en utilisant la sauvegarde d'armure de l'unité et non pas celle de l'Holo-champ. Aucun pion d'impact n'est placé pour une touche sauvée par le Holo-champ.
    - titre: "Règle spéciale : Manteau d'ombre"
      texte: |
        Les Manteaux d'Ombre sont des dispositifs sophistiqués qui drainent littéralement la lumière des objets, empêchant ainsi les Eldars Noirs d'être pris pour cible. Les Manteaux d'Ombre affectent d'un malus de -1 tout tir porté contre l'unité, ce malus n'étant pas cumulatif avec un éventuel malus de couvert. Ne fonctionne pas lors d'un assaut.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture : Igor Sid."
  valeur_strategique: "5 au tour 1, puis 4 les tours suivants"
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Formations d'Immaculés, d'Incubes, de Maîtresses de sang Hekatrix et d'Hémoxytes", valeur: "1+" }
      - { portee: "Soutien titanique des Eldars Noirs", valeur: "1+" }

