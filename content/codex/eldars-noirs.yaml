      - { nom: 2x Frappe chirurgicale, portee: "-", puissance: "MA2+, TT (D3)" }
    notes:
      - "Lent"
      - "Transport : peut transporter jusqu'à 6 Transporteurs Slavebringer ainsi que leurs cargaisons. De plus, le croiseur peut choisir de renoncer à ses frappes chirurgicales pour transporter jusqu'à 10 Transporteurs Slavebringer et jusqu'à 2 Moissonneurs ainsi que leurs cargaisons."

options:
  # ---- Personnages ----
  - id: grand_voivode
    nom: Grand Voïvode et sa cour
    effet: { type: remplacer, de: [immacules, incubes, maitresses_sang, hemoxytes], par: grand_voivode, lot: 1, max: 1, cout: 75 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Remplacer une des unités par l'unité de Grand Voïvode et sa cour"
    note_md: "Un seul Grand Voïvode et sa cour par armée (Commandant suprême)."
  - id: voivode
    nom: Voïvode
    effet: { type: ajouter, cout: 25, unites: [{ unite: voivode }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un personnage de Voïvode à l'une des unités de la formation"
  - id: succube
    nom: Succube
    effet: { type: ajouter, cout: 25, unites: [{ unite: succube }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un personnage de Succube à l'une des unités de la formation"
  - id: tourmenteur
    nom: Tourmenteur
    effet: { type: ajouter, cout: 50, unites: [{ unite: tourmenteur }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un personnage de Tourmenteur à l'une des unités de la formation"
  - id: executeur
    nom: Exécuteur
    effet: { type: ajouter, cout: 25, unites: [{ unite: executeur }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un personnage d'Exécuteur à l'une des unités de la formation"
  - id: sybarite
    nom: Sybarite
    effet: { type: ajouter, cout: 25, unites: [{ unite: sybarite }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Sybarite à l'une des unités de la formation"
  - id: portail_noir
    nom: Portail noir
    effet: { type: mot_cle, texte: Portail noir, cout: 50, cible: [voivode, succube, tourmenteur, executeur, sybarite, grand_voivode] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [voivode, succube, tourmenteur, executeur, sybarite, grand_voivode] }
    phrase_pdf: "Ajouter la note Portail noir à un personnage de la formation ou à l'unité de Grand Voïvode et sa cour"
    note_md: "Règle spéciale Portail noir : chaque portail permet de conserver trois formations en réserve dans la toile. Une formation comprenant un Portail noir ne peut pas être positionnée en garnison."

  # ---- Notes ----
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 50, cible: [fleaux, mandragores] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Téléportation aux unités d'infanterie de la formation"

  # ---- Remplacements et ajouts ----
  - id: grotesques
    nom: Grotesque
    effet: { type: remplacer, de: [gorgones, hemoxytes], par: grotesques, lot: 2, max: 3, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer jusqu'à 6 unités de la formation par autant d'unités de Grotesques (25 pts la paire)"
  - id: machine_tourment
    nom: Machine de Tourment
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: talos, cout: 50 }
        - { unite: cronos, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Talos ou Cronos à la formation"
  - id: banshee
    nom: Banshee
    effet: { type: ajouter, cout: 50, unites: [{ unite: raider_banshee }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Raider Banshee à la formation"
  - id: reaper
    nom: Reaper
    effet: { type: remplacer, de: [ravageur_desintegrateur, ravageur_tenebres], par: reaper, lot: 1, max: 2, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer de 1 à 2 Ravageurs de la formation par autant de Reaper"

  # ---- Transport (une ligne par type d'appareil, combinables) ----
  - id: transport_venom
    nom: Transport en Venoms
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: venom }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_ref: transport
    phrase_pdf: "Transport : ajouter suffisamment de Venoms pour transporter toute la formation sans qu'il ne reste de place libre"
  - id: transport_raider
    nom: Transport en Raiders
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: raider }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_ref: transport
    phrase_pdf: "Transport : ajouter suffisamment de Raiders pour transporter toute la formation sans qu'il ne reste de place libre"
  - id: transport_barge_tantale
    nom: Transport en Barges Tantale
    effet: { type: ajouter, cout_par_unite: 100, unites: [{ unite: barge_tantale }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_ref: transport
    phrase_pdf: "Transport : ajouter suffisamment de Barges Tantale pour transporter toute la formation sans qu'il ne reste de place libre"

