  - id: slavebringer
    nom: Transporteur Slavebringer
    type: A/EG
    vitesse: B
    blindage: "5+"
    cc: "6+"
    ff: "5+"
    armes:
      - { nom: 2x Lance à antimatière, portee: 30cm, puissance: "AC4+/AA5+, Lance, FrtF" }
      - { nom: Tourelles de canons éclateurs lourds jumelés, portee: 30cm, puissance: "AP5+/AA5+" }
    notes: [Assaut orbital, Blindage renforcé, "Transport 8 (parmi : Grand Voïvode, Guerrier cabaliste, Immaculé, Incube, Fléaux, Céraste, Maîtresse de sang Hekatrix, Maîtres des bêtes, Hellions, Gorgones, Grotesques, Talos). Les unités de Grotesques, Cronos et Talos prennent 2 places"]
    transport: { capacite: 8, accepte: [grand_voivode, guerriers_cabalistes, immacules, incubes, fleaux, cerastes, maitresses_sang, maitres_betes, hellions, gorgones, grotesques, talos, cronos] }
    degats: { cd: 2, critique: "Détruit ainsi que toutes les unités transportées." }
