      - { nom: Poing hydre, portee: 30cm, puissance: "6xAP4+/AC4+" }
      - { nom: et, portee: (15cm), puissance: "Arme Légère, +3A" }
      - { nom: ou, portee: (contact), puissance: "Armes d'assaut, +2A, MA, TT (D3)" }
    notes: [Blindage renforcé, "Holochamp (3+)", Marcheur, Sans peur, "Les armes des titans Eldars noirs ont un arc de tir de 360° dû à leur exceptionnelle manœuvrabilité"]
    degats: { cd: 6, critique: "La touche critique provoque un point de dommage supplémentaire et la sauvegarde holographique est réduite à 4+ pour le reste de la partie. La prochaine touche critique détruira définitivement le générateur d'Holo-champs et causera un point de dommage supplémentaire. Toutes les touches critiques suivantes provoquent un point de dommage supplémentaire." }

  # ---- Flotte de guerre ----
  - id: razorwing
    nom: Razorwing
