    degats: { cd: 8, critique: "Le dispositif optique de brouillage du titan est détruit. Celui-ci perd la capacité Manteau d'ombre. Tout dégât critique supplémentaire occasionnera la perte d'un point de CD." }
  - id: horreur_vect
    nom: Horreur de Vect
    type: EG
    vitesse: 25cm
    blindage: "5+"
    cc: "3+"
    ff: "3+"
    armes:
      - { nom: Lance des cauchemars, portee: 30cm, puissance: "3PB, MA, Rpt, IC, TT (D3)" }
      - { nom: et, portee: (15cm), puissance: "Arme Légère, +3A" }
