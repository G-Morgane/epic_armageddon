    vitesse: C
    blindage: "4+"
    cc: "-"
    ff: "-"
    armes:
      - { nom: Missiles Monofaux, portee: 30cm, puissance: "AP4+, FrtF" }
      - { nom: 2x Lance des ténèbres (AA), portee: 30cm, puissance: "AC5+/AA5+, Lance, FrtF" }
  - id: voidraven
    nom: Voidraven
    type: A
    vitesse: CB
    blindage: "5+"
    cc: "-"
    ff: "-"
    armes:
