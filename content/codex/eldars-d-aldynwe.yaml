# Eldars d'Aldynwë, transcrit depuis le PDF expérimental Codex Aldynwë 1.0 (source de vérité).
codex:
  slug: eldars-d-aldynwe
  armee_id: 74f75f53-d759-4c1e-9523-0ec84d85da16
  nom: Eldars d'Aldynwë
  version: "0.1"
  faction: xenos
  categorie: armees-xenos
  statut: experimental
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/eldars-d-aldynwe.png
  citation:
    texte: "Quand la poignée de blindés et sa maigre escorte sont arrivées en annonçant être les renforts envoyés par Aldynwë, j'ai cru que l'on venait de me cracher au visage. À la fin des opérations, ces renforts avaient réduit en cendres plus d'ennemis que n'importe quel ost sous mon commandement."
    auteur: Autarque Kel'thaïr de Saim-Hann
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée du vaisseau-monde Aldynwë. Cette liste ne peut pas être utilisée comme liste générique pour représenter n'importe quelle autre armée d'Eldars.

    Une armée d'Aldynwë est organisée autour de formations principales aussi appelées osts de guerre. Chaque formation principale permet de choisir jusqu'à 3 formations de support.

    Les formations de support lourd sont des formations autonomes. Un maximum de 1/3 des points peut être dépensé pour ces formations.

    Chaque formation est autonome et peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par formation.

    Concernant le transport, les unités suivantes seront jugées comme équivalentes : Spirite et Grand Prophète.

    La dénomination Guerriers Aspects regroupe les unités suivantes : Intercepteurs Nightshades, Vengeurs, Guerriers Scorpions, Banshees, Dragons de Feu, Faucheurs Noirs, Araignées Spectrales et Lances de Lumière.
  regles_md:
    - titre: "Règle spéciale : Vision extra lucide"
      texte: |
        Toute formation Eldar qui n'est pas démoralisée et qui comprend une unité ayant la capacité vision extra lucide ignore la pénalité de -1 au test d'action lorsqu'elle tente de conserver l'initiative.

        De plus, une fois par tour le joueur Eldar peut essayer de retenir l'initiative deux fois d'affilée. N'importe quelle formation Eldar peut être choisie, y compris celles ne comportant pas de Grand Prophète, néanmoins un Grand Prophète doit impérativement être encore en jeu sur le champ de bataille. La formation doit tout de même passer un test d'initiative pour ne pas perdre l'action, et elle subit le modificateur de -1 pour avoir retenu l'initiative, sauf si elle comprend une unité ayant la capacité vision extra lucide.
    - titre: "Règle spéciale : Tactique tirer et courir"
      texte: |
        Les formations Eldars qui reçoivent l'ordre avance ou avance rapide peuvent choisir de tirer soit avant soit après chaque mouvement. Elles ne peuvent néanmoins tirer qu'une seule fois durant l'action.

        De plus, les formations Eldars qui remportent un assaut sont autorisées à utiliser la totalité de leur mouvement lorsqu'elles consolident leur position, au lieu d'être limitées à un mouvement de 5cm. Cependant (hormis pour les formations de Guerriers Aspects), les formations qui consolident de leur mouvement complet ne peuvent pas soutenir un autre assaut pendant ce tour.

        Les formations de Guerriers Aspects peuvent toujours consolider de leur mouvement complet et soutenir d'autres assauts.
    - titre: "Règle spéciale : Armée en mouvement"
      texte: |
        Seuls les Escadrons de Frelons "Piqueurs" peuvent se déployer en garnison.
    - titre: "Règle spéciale : Portails Eldars"
      texte: |
        Chaque Portail inclus dans une armée permet au joueur Eldar de prendre trois autres formations et de les conserver en réserve sur son vaisseau monde.

        Les formations en réserve peuvent entrer en jeu par le Portail, en réalisant une action qui comporte un mouvement mesuré à partir du centre du marqueur. Une seule formation peut voyager à travers chaque portail, chaque tour. Une formation ne peut qu'entrer en jeu grâce au portail mais jamais retourner en réserve.

        Les formations pouvant utiliser un Portail Fantôme sont : les unités d'infanterie, les véhicules légers, les véhicules blindés dotés de la capacité Marcheur (mais sans la capacité Antigrav) et le Roi Fantôme.

        Le joueur Eldar peut remplacer un marqueur d'objectif dans sa moitié de table par un Portail. Il compte à la fois comme un objectif et un Portail. Il ne peut être ni attaqué, ni détruit.
    - titre: "Règle spéciale : Holo-Champs"
      texte: |
        Les Holo-champs procurent aux titans Eldars une sauvegarde spéciale de 3+ qui peut être utilisée à la place de la sauvegarde normale du titan.

        Cette sauvegarde peut toujours être utilisée, même en corps à corps, en fusillade et contre les armes tueuses de titan ou les macro armes. Si un véhicule avec un Holo-champ a aussi un blindage renforcé, alors il est autorisé à relancer ses sauvegardes, sauf pour les attaques réalisées avec des armes ayant la capacité lance, macro-armes ou tueuses de titans.

        Aucun point d'impact n'est placé pour une touche avec une arme ayant le trait Rupture sauvée par l'Holo-champ.
    - titre: "Règle spéciale : Holo-Champs d'antigrav"
      texte: |
        Tous les véhicules légers et blindés d'une armée d'Aldynwë possèdent des Holo-champs. La sauvegarde spéciale de ces Holo-champs est de 5+.

        Tous les engins de guerre avec la règle antigrav d'une armée d'Aldynwë possèdent des Holo-champs. La sauvegarde spéciale de ces Holo-champs est de 4+.
    - titre: "Règle spéciale : Suprématie antigrav"
      texte: |
        Chaque ost de guerre de Bûcher du Chagrin et de Lame de Vaul doit recevoir une optimisation. De plus, pour chaque tranche complète de 1 000 points, une formation contenant des véhicules légers et/ou blindés peut recevoir une optimisation.

        Une optimisation a un coût initial de 25 points et permet de choisir une optimisation parmi la liste suivante :

        - Optimisation d'assaut (15 points par VL/VB) : les véhicules de la formation augmentent leur caractéristique de fusillade (FF) de +1. De plus, ils ont une attaque supplémentaire lors d'une attaque en fusillade.
        - Optimisation d'appui (10 points par VL/VB) : lors d'un Tir soutenu, les véhicules de la formation peuvent choisir de ne pas bénéficier du modificateur de +1 pour doubler le nombre de tirs de chacune de leurs armes.
        - Optimisation de furtivité (10 points par VL/VB) : tout tir porté contre un véhicule de la formation reçoit un malus de -1 pour toucher. Ce malus n'est pas cumulable à celui d'un couvert et ne s'applique pas lors d'un assaut.
        - Optimisation de mobilité (15 points par VL/VB) : les véhicules de la formation augmentent leur vitesse de 5 cm. De plus, ils ignorent le malus de -1 lors d'une Avance rapide. Les tirs de flak effectués lors du désengagement d'un aéronef ne subissent pas le malus de -1.
        - Optimisation de portée (15 points par VL/VB) : les véhicules de la formation augmentent la portée de leurs armes de tir de 15 cm.
        - Optimisation de suppression (5 points par VL/VB) : les véhicules de la formation appliquent un pion d'impact supplémentaire lors d'un tir.
        - Optimisation perce-blindage (15 points par VL/VB) : les véhicules de la formation appliquent un malus de -1 aux jets de sauvegarde de leurs cibles. Ce malus s'applique sur les sauvegardes de blindage, de couvert et d'Holo-champs, ainsi que sur les unités avec la règle Métal vivant. Il ne s'applique pas contre la sauvegarde d'esquive des aéronefs.
        - Optimisation de déplacement tout-terrain (10 points par VL/VB) : les véhicules de la formation bénéficient de la règle Marcheur lors d'un mouvement dans le cadre d'un assaut, d'une Avance ou d'un Tenir.
        - Optimisation de blindage (20 points par VL/VB) : les véhicules de la formation augmentent leur caractéristique de blindage de 1. Cette augmentation ne s'applique pas lors de la relance donnée par la règle Blindage renforcé.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD."
  valeur_strategique: 4
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Guerriers Aspects, Titans et formations ayant reçu une optimisation", valeur: "1+" }

