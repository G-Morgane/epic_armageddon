options:
  # ---- Options d'armée ----
  - id: portail
    nom: Portail
    effet: { type: mot_cle, texte: Portail de Vaul, cout: 75 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    note_md: "Ne peut être sélectionné que si une Troupe d'Arlequins est aussi sélectionnée. Le Portail peut être utilisé par toutes les formations sauf les Engins de guerre."
    phrase_pdf: "0-1 Portail : 1 Portail de Vaul (75 pts)"
  - id: commandant_supreme
    nom: Commandant Suprême
    effet: { type: mot_cle, texte: Commandant Suprême, cout: 50, cible: [grand_prophete, grand_prophete_motojet, spirite] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: requiert_unite, unites: [grand_prophete, grand_prophete_motojet, spirite] }
    phrase_pdf: "0-1 Commandant Suprême : un Grand Prophète, à motojet ou non, ou un Spirite devient Commandant suprême (50 pts)"

  # ---- Optimisations (Suprématie antigrav) ----
  - id: optimisation
    nom: Optimisation
    effet:
      type: choix
      parmi:
        - { id: assaut, nom: Optimisation d'assaut, cout: 25, effet: { type: mot_cle, texte: "Optimisation d'assaut" } }
        - { id: appui, nom: Optimisation d'appui, cout: 25, effet: { type: mot_cle, texte: "Optimisation d'appui" } }
        - { id: furtivite, nom: Optimisation de furtivité, cout: 25, effet: { type: mot_cle, texte: "Optimisation de furtivité" } }
        - { id: mobilite, nom: Optimisation de mobilité, cout: 25, effet: { type: mot_cle, texte: "Optimisation de mobilité" } }
        - { id: portee, nom: Optimisation de portée, cout: 25, effet: { type: mot_cle, texte: "Optimisation de portée" } }
        - { id: suppression, nom: Optimisation de suppression, cout: 25, effet: { type: mot_cle, texte: "Optimisation de suppression" } }
        - { id: perce_blindage, nom: Optimisation perce-blindage, cout: 25, effet: { type: mot_cle, texte: "Optimisation perce-blindage" } }
        - { id: tout_terrain, nom: Optimisation de déplacement tout-terrain, cout: 25, effet: { type: mot_cle, texte: "Optimisation de déplacement tout-terrain" } }
        - { id: blindage, nom: Optimisation de blindage, cout: 25, effet: { type: mot_cle, texte: "Optimisation de blindage" } }
    contraintes: [{ type: max_par_formation, valeur: 1 }, { type: consomme, budget: optimisations }]
    note_md: "Le coût indiqué est le coût initial de 25 points. Il faut y ajouter le coût par véhicule léger ou blindé de la formation, propre à chaque optimisation (de 5 à 20 pts par VL/VB) : ce surcoût n'est pas calculé par le constructeur."
    phrase_pdf: "Optimisation (25 pts + le coût par VL/VB de l'optimisation choisie)"
  - id: optimisation_obligatoire
    nom: Optimisation
    effet:
      type: choix
      parmi:
        - { id: assaut, nom: Optimisation d'assaut, cout: 25, effet: { type: mot_cle, texte: "Optimisation d'assaut" } }
        - { id: appui, nom: Optimisation d'appui, cout: 25, effet: { type: mot_cle, texte: "Optimisation d'appui" } }
        - { id: furtivite, nom: Optimisation de furtivité, cout: 25, effet: { type: mot_cle, texte: "Optimisation de furtivité" } }
        - { id: mobilite, nom: Optimisation de mobilité, cout: 25, effet: { type: mot_cle, texte: "Optimisation de mobilité" } }
        - { id: portee, nom: Optimisation de portée, cout: 25, effet: { type: mot_cle, texte: "Optimisation de portée" } }
        - { id: suppression, nom: Optimisation de suppression, cout: 25, effet: { type: mot_cle, texte: "Optimisation de suppression" } }
        - { id: perce_blindage, nom: Optimisation perce-blindage, cout: 25, effet: { type: mot_cle, texte: "Optimisation perce-blindage" } }
        - { id: tout_terrain, nom: Optimisation de déplacement tout-terrain, cout: 25, effet: { type: mot_cle, texte: "Optimisation de déplacement tout-terrain" } }
        - { id: blindage, nom: Optimisation de blindage, cout: 25, effet: { type: mot_cle, texte: "Optimisation de blindage" } }
    contraintes: [{ type: max_par_formation, valeur: 1 }, { type: obligatoire }, { type: hors_quota_options }]
    note_md: "Chaque ost de guerre de Bûcher du Chagrin et de Lame de Vaul doit recevoir une optimisation. Au coût initial de 25 points s'ajoute le coût par véhicule léger ou blindé de l'optimisation choisie."
    phrase_pdf: "Optimisation obligatoire (25 pts + le coût par VL/VB de l'optimisation choisie)"

  # ---- Améliorations ----
  - id: pierres_esprits
    nom: Pierres Esprits
    effet: { type: mot_cle, texte: Meneur, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter des Pierres Esprits (la formation gagne la compétence Meneur)"
  - id: veterans_temple
    nom: Vétérans du Temple
    effet: { type: mot_cle, texte: "Marcheur, Lances laser avec Frappe en premier", cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation reçoit la règle Marcheur et ses Lances laser reçoivent la règle Frappe en premier"
  - id: exarque
    nom: Exarque
    effet: { type: ajouter, cout: 25, unites: [{ unite: exarque }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Exarque à une unité de Guerriers Aspect"
  - id: transport
    nom: Transport
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: wave_serpent, cout: 55 }
        - { unite: falcon, cout: 55 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "55 pts le Falcon ou le Wave Serpent « Déferlante », 85 pts les 2 Wave Serpents « Déferlante »."
    phrase_pdf: "Ajouter assez de Wave Serpents « Déferlante » et/ou de Falcon pour transporter toute la formation sans qu'il ne reste de place libre"
  - id: frappe_nebuleuse
    nom: Frappe nébuleuse
    effet: { type: mot_cle, texte: Téléportation, cout: 50 }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "0-1 Frappe nébuleuse : si une formation est entièrement transportée par des Falcons sans contenir d'unité ne pouvant pas embarquer, les unités de la formation gagnent Téléportation"
  - id: gardiens
    nom: Gardiens
    effet:
      type: ajouter
      cout: 100
      unites: [{ unite: gardiens, nombre: 2 }, { unite: wave_serpent, nombre: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 unités de Gardiens et 1 Wave Serpent « Déferlante »"
  - id: gardes_guerriers_fantomes
    nom: Gardes et Guerriers Fantômes
    effet:
      type: choix
      parmi:
        - id: gardes
          nom: 2 Gardes Fantômes
          cout: 185
          effet: { type: ajouter, unites: [{ unite: garde_fantome, nombre: 2 }, { unite: wave_serpent, nombre: 2 }] }
        - id: guerriers
          nom: 2 Guerriers Fantômes
          cout: 185
          effet: { type: ajouter, unites: [{ unite: guerrier_fantome, nombre: 2 }, { unite: wave_serpent, nombre: 2 }] }
        - id: mixte
          nom: 1 Garde Fantôme et 1 Guerrier Fantôme
          cout: 185
          effet: { type: ajouter, unites: [{ unite: garde_fantome, nombre: 1 }, { unite: guerrier_fantome, nombre: 1 }, { unite: wave_serpent, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 unités de Gardes Fantômes et/ou de Guerriers Fantômes et deux Wave Serpents « Déferlante »"
  - id: windriders
    nom: Windriders
    effet: { type: ajouter, cout: 115, unites: [{ unite: windrider, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 3 unités de Windriders d'Aldynwë"
  - id: frelons
    nom: Frelons
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: frelon }], min: 2, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 à 3 Frelons « Piqueur » (50 pts chacun)"
  - id: falcon
    nom: Falcon
    effet: { type: ajouter, cout: 110, unites: [{ unite: falcon, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 Falcons"
  - id: firestorm
    nom: Firestorm
    effet: { type: ajouter, cout_par_unite: 80, unites: [{ unite: firestorm }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 à 2 Firestorm (80 pts chacun)"
  - id: tisseur_nuit
    nom: Tisseur de Nuit
    effet: { type: ajouter, cout: 110, unites: [{ unite: tisseur_nuit, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 Tisseurs de Nuit"
  - id: lynx
    nom: Lynx
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: lynx_yme_loc, cout: 175 }
        - { unite: lynx_aldynwe, cout: 175 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 à 2 parmi : Lynx d'Yme-Loc et Lynx d'Aldynwë (175 pts chacun)"
  - id: machines_vaul
    nom: Machines de Vaul
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: scorpion_vaul, cout: 250 }
        - { unite: cobra, cout: 250 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 à 2 Scorpion, Cobra (250 pts chacun)"
  - id: plateformes
    nom: Plateforme d'arme lourde
    effet: { type: remplacer, de: gardiens, par: plateforme_arme_lourde, lot: 1, max: 1, cout: 0 }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Vous pouvez remplacer gratuitement 1 unité de Gardiens par une Plateforme d'arme lourde"

