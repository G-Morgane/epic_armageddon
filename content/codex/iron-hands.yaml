      parmi:
        - { id: capitaine, nom: Capitaine, cout: 50, effet: { type: ajouter, unites: [{ unite: capitaine }] } }
        - { id: archiviste, nom: Archiviste, cout: 50, effet: { type: ajouter, unites: [{ unite: archiviste }] } }
        - { id: reverend_de_fer, nom: Révérend de Fer, cout: 50, effet: { type: ajouter, unites: [{ unite: reverend_de_fer }] } }
        - id: maitre_chapitre
          nom: Maître de Chapitre
          cout: 50
          effet: { type: ajouter, unites: [{ unite: maitre_chapitre }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Capitaine ou un Archiviste ou un Révérend de Fer à une unité de la formation (un Capitaine peut être échangé gratuitement par un Maître de Chapitre)"
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Téléportation aux unités d'infanterie de la formation"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorback
    nom: Razorback
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à autant de Razorbacks que d'unités à transporter (25 pts chacun)"
  - id: dreadnought
    nom: Dreadnought
    effet:
      type: choix
      parmi:
        - id: contemptor
          nom: Jusqu'à 2 Dreadnoughts ou Dreadnoughts Feu d'enfer
          cout: 0
          effet:
            type: choix_multiple
            total: { min: 1, max: 2 }
            parmi:
              - { unite: dreadnought, cout: 50 }
              - { unite: dreadnought_feu_enfer, cout: 50 }
        - { id: venerable, nom: 1 Dreadnought Vénérable, cout: 75, effet: { type: ajouter, unites: [{ unite: dreadnought_venerable }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Dreadnoughts ou Dreadnoughts Feu d'enfer (50 pts chacun) ou 1 Dreadnought Vénérable (75 pts)"
  - id: destructor
    nom: Destructor
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: predator_destructor }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Predators Destructors à la formation (50 pts chacun)"
  - id: support_blinde
    nom: Support Blindé Polyvalent
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: predator_destructor, cout: 50 }
        - { unite: predator_annihilator, cout: 65 }
        - { unite: vindicator, cout: 65 }
        - { unite: land_raider, cout: 75 }
        - { unite: land_raider_achilles, cout: 88 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ces véhicules doivent être différents de ceux initialement présents dans la formation. Les Land Raiders Achilles se prennent par paire pour 175 pts."
    phrase_pdf: "Ajouter jusqu'à 2 véhicules blindés différents de ceux initialement présents : Predator Destructor (50 pts chacun), Predator Annihilator ou Vindicator (65 pts chacun, 125 pts les deux), Land Raider (75 pts chacun), Land Raiders Achilles (175 pts les deux)"
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Modules d'atterrissage à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage, tout: true, par_nombre: 1, cout: 0 }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par des Modules d'atterrissage (hors détachements de Scouts)"
    note_md: "Vient de la règle spéciale Transports et non du tableau des améliorations : elle ne consomme donc pas le quota de 3 améliorations."
  - id: thunderhawk_supplementaire
    nom: Ajouter 1 Thunderhawk transporteur
    effet: { type: ajouter, cout: 150, unites: [{ unite: thunderhawk_transporteur }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]

formations:
  # ---- Détachements principaux ----
  - id: tactique
    nom: Tactique
    variantes:
      - id: appui_leger
        nom: 4 Tactiques + transports + 2 véhicules (Dreadnought, Dreadnought Feu d'enfer, Predator Destructor)
        cout: 275
        composition:
          - { unite: tactiques, nombre: 4 }
          - choix:
              total: 2
              parmi: [{ unite: dreadnought }, { unite: dreadnought_feu_enfer }, { unite: predator_destructor }]
              phrase_pdf: "2 véhicules parmi : Dreadnought, Dreadnought Feu d'enfer, Predator Destructor"
          - { transports: { unite: rhino } }
      - id: appui_lourd
        nom: 4 Tactiques + transports + 2 véhicules (Predator Annihilator, Vindicator, Land Raider, Whirlwind)
        cout: 300
        composition:
          - { unite: tactiques, nombre: 4 }
          - choix:
              total: 2
              parmi: [{ unite: predator_annihilator }, { unite: vindicator }, { unite: land_raider }, { unite: whirlwind }]
              phrase_pdf: "2 véhicules parmi : Predator Annihilator, Vindicator, Land Raider, Whirlwind"
          - { transports: { unite: rhino } }
    options: [dreadnought, commandant, razorback, hunter, support_blinde, transport_remplacement]
    contraintes: [{ type: fournit, budget: soutien, quantite: 1 }]
  - id: devastator
    nom: Devastator
    variantes:
      - id: base
        cout: 250
        composition:
          - { unite: devastators, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [dreadnought, commandant, razorback, hunter, support_blinde, transport_remplacement]
    phrase_pdf: "4 unités de Devastators Iron Hands + transports"
  - id: land_raiders
    nom: Land Raiders
    variantes:
      - { id: base, cout: 350, composition: [{ unite: land_raider, nombre: 4 }] }
    options: [commandant, support_blinde]
  - id: predators
    nom: Predators
    variantes:
      - { id: destructor, nom: 4 Predators Destructor, cout: 225, composition: [{ unite: predator_destructor, nombre: 4 }] }
      - { id: annihilator, nom: 4 Predators Annihilator, cout: 275, composition: [{ unite: predator_annihilator, nombre: 4 }] }
    options: [commandant, support_blinde]
  - id: vindicators
    nom: Vindicators
    variantes:
      - { id: base, cout: 250, composition: [{ unite: vindicator, nombre: 4 }] }
    options: [commandant, support_blinde]
  - id: terminator
    nom: Terminator
    variantes:
      - id: base
        cout: 550
        composition:
          - { unite: terminators, nombre: 4 }
          - { unite: land_raider, nombre: 4 }
    options: [commandant]

  # ---- Détachements de soutien ----
  - id: scouts
    nom: Scouts
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: scouts, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [commandant, destructor, razorback]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
    phrase_pdf: "0-2 Scouts : 4 unités de Scouts + transports"
  - id: motos
    nom: Motos
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 5
              parmi: [{ unite: motos }, { unite: motos_assaut }]
              phrase_pdf: "5 unités parmi : Motos, Motos d'assaut"
    options: [commandant, destructor]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
  - id: land_speeders
    nom: Land Speeders
    variantes:
      - { id: base, cout: 200, composition: [{ unite: land_speeder, nombre: 5 }] }
    options: [commandant]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
  - id: morlocks
    nom: Morlocks
    variantes:
      - { id: base, cout: 300, composition: [{ unite: terminators, nombre: 4 }] }
    options: [commandant, teleportation]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
  - id: whirlwinds
    nom: Whirlwinds
    variantes:
      - { id: base, cout: 300, composition: [{ unite: whirlwind, nombre: 4 }] }
    options: [commandant, hunter]

  # ---- Supports ----
  - id: thunderhawks_transporteurs
    nom: Thunderhawks transporteurs
    variantes:
      - { id: base, cout: 300, composition: [{ unite: thunderhawk_transporteur, nombre: 2 }] }
    options: [thunderhawk_supplementaire]
    phrase_pdf: "2 Thunderhawks transporteurs (+1 Thunderhawk transporteur : +150 pts)"
  - id: thunderhawk_bombardier
    nom: Thunderhawk bombardier
    variantes:
      - { id: base, cout: 250, composition: [{ unite: thunderhawk_bombardier, nombre: 1 }] }
  - id: barge_debarquement
    nom: Barge de débarquement
    variantes:
      - { id: base, cout: 400, composition: [{ unite: barge_debarquement, nombre: 1 }] }
  - id: intercepteurs_stormtalons
    nom: Intercepteurs Stormtalons
    variantes:
      - { id: destructor, nom: 2 Stormtalons Destructor, cout: 200, composition: [{ unite: stormtalon_destructor, nombre: 2 }] }
      - { id: annihilator, nom: 2 Stormtalons Annihilator, cout: 250, composition: [{ unite: stormtalon_annihilator, nombre: 2 }] }
  - id: stormeagles
    nom: Stormeagles
    variantes:
      - { id: base, cout: 275, composition: [{ unite: stormeagle, nombre: 2 }] }
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur d'attaque, cout: 200, composition: [{ unite: croiseur_attaque, nombre: 1 }] }
      - { id: barge_bataille, nom: 1 Barge de bataille, cout: 350, composition: [{ unite: barge_bataille, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    phrase_pdf: "0-1 Soutien Orbital"
  - id: relique_31eme_millenaire
    nom: Relique du 31ème millénaire
    variantes:
      - { id: un, nom: 1 Fellblade Relique, cout: 300, composition: [{ unite: fellblade_relique, nombre: 1 }] }
      - { id: deux, nom: 2 Fellblade Relique, cout: 600, composition: [{ unite: fellblade_relique, nombre: 2 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: "0-1 Relique du 31ème millénaire : 1 ou 2 Fellblade Relique (300 pts chacun)"
  - id: titan_reaver
    nom: Titan Reaver
    variantes:
      - { id: base, cout: 650, composition: [{ unite: reaver, nombre: 1 }] }
  - id: titan_warlord
    nom: Titan Warlord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: warlord, nombre: 1 }] }

sections:
  - id: detachements_principaux
    titre: DÉTACHEMENTS PRINCIPAUX IRON HANDS
    formations: [tactique, devastator, land_raiders, predators, vindicators, terminator]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
  - id: detachements_soutien
    titre: DÉTACHEMENTS DE SOUTIEN IRON HANDS
    sous_titre: "1 seul détachement de soutien par détachement Tactique"
    formations: [scouts, motos, land_speeders, morlocks, whirlwinds]
    contraintes: [{ type: consomme, budget: soutien }, { type: max_options, valeur: 3 }]
    colonne_options: true
    options: [commandant, teleportation, hunter, razorback, dreadnought, destructor, support_blinde, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS IRON HANDS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement"
  - id: flotte
    titre: FLOTTE IRON HANDS
    sous_titre: "SUPPORTS IRON HANDS"
    formations: [thunderhawks_transporteurs, thunderhawk_bombardier, barge_debarquement, intercepteurs_stormtalons, stormeagles, soutien_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: relique
    titre: RELIQUE DU CHAPITRE
    sous_titre: "SUPPORTS IRON HANDS"
    formations: [relique_31eme_millenaire]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: titanicus
    titre: SOUTIENS DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS IRON HANDS"
    formations: [titan_reaver, titan_warlord]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts, détachements principaux, soutiens et supports"
    limite: 3000
    attendu: valide
    formations:
      - formation: tactique
        variante: appui_leger
        choix: { "1": { dreadnought: 1, predator_destructor: 1 } }
        options:
          - { option: commandant, choix: maitre_chapitre }
          - { option: hunter }
      - formation: tactique
        variante: appui_lourd
        choix: { "1": { land_raider: 1, whirlwind: 1 } }
        options:
          - { option: razorback, repartition: { razorback_bolters_lourds: 2 } }
      - { formation: devastator }
      - { formation: predators, variante: destructor, options: [{ option: commandant, choix: capitaine }] }
      - { formation: scouts }
      - { formation: morlocks, options: [{ option: teleportation }] }
      - { formation: intercepteurs_stormtalons, variante: destructor }

  - nom: "deux Maîtres de Chapitre"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: devastator, options: [{ option: commandant, choix: maitre_chapitre }] }
      - { formation: vindicators, options: [{ option: commandant, choix: maitre_chapitre }] }

  - nom: "quatre améliorations sur un détachement"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: devastator
        options:
          - { option: commandant, choix: capitaine }
          - { option: hunter }
          - { option: dreadnought, choix: venerable }
          - { option: support_blinde, repartition: { vindicator: 1 } }

  - nom: "trois Scouts"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: tactique
        variante: appui_leger
        choix: { "1": { dreadnought: 2 } }
      - { formation: scouts }
      - { formation: scouts }
      - { formation: scouts }

  - nom: "deux détachements de soutien pour un seul Tactique"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: tactique
        variante: appui_leger
        choix: { "1": { dreadnought: 2 } }
      - { formation: scouts }
      - { formation: whirlwinds }
