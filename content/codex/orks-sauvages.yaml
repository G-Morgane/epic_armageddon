# Orks Sauvages, transcrit depuis le PDF EAFR rev 1.1 (source de vérité).
codex:
  slug: orks-sauvages
  armee_id: 3ae3ccc4-587a-4a33-98ee-4ec7cc5cd76b
  nom: Orks Sauvages
  version: "1.1"
  faction: xenos
  categorie: armees-xenos
  logo: ork.png
  citation:
    texte: "Suivr' Gork et Mork. Allé trouvé la guerre. Tué tout s'ki pass' à porté. Lé vieilles méthod' cé lé meilleur'."
    auteur: Sacerdoce des Orques Sauvages (traduction approximative)
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied une armée d'Orks Sauvages.

    Les armées des Orks sont organisées autour de grandes formations appelées bandes, qui peuvent s'acheter selon 3 tailles, la bande normale, la mastok (doubler l'effectif de départ) ou la tré mastok (tripler l'effectif de départ).

    Chaque bande peut recevoir des kust'oms. La liste d'armée indique pour chaque catégorie de bande quels kust'oms sont autorisés. Chaque kust'om autorisé peut être pris un nombre illimité de fois par bande, sauf s'il est fait état d'une limitation de kust'om. Les limitations de kust'om sont multipliées de la même façon que l'effectif de départ, ainsi une bande de guerre tré mastok peut inclure jusqu'à 3 nobz supplémentaire, et 3 Bizarboyz. Les kust'oms font partie intégrante des bandes et doivent en respecter la cohésion. Les kust'oms qui sont des personnages doivent rejoindre une unité initialement dans la bande, pas un autre kust'oms.

    Les armées Orks sauvages ont une valeur stratégique de 2. Toutes les formations Orks sauvages ont une initiative de 3+ mais reçoivent des modificateurs en fonction des actions choisies lorsqu'elles effectuent un test d'action (Pouvoir de la Waaagh!) ou de leur taille lorsqu'elles tentent de se rallier (R'mise en bande).
  regles_md:
    - titre: "Règle spéciale : Seigneur de Guerre"
      texte: |
        Chaque armée d'Orks Sauvages doit inclure une unité Commandement Suprême appelée Seigneur de Guerre. Cette unité est gratuite et doit être ajoutée à la formation de votre armée comportant le plus d'unités. Les Engins de Guerre comptent un nombre d'unités égal à leur Capacité de dommages de départ. En cas d'égalité, choisissez quelle formation doit rejoindre le Seigneur de Guerre.
    - titre: "Règle spéciale : Pouvoir de la Waaagh!"
      texte: |
        Les Orks ne sont pas de fins stratèges mais la perspective d'une bonne bagarre les galvanise toujours. Afin de représenter ceci, une formation tentant une action d'Avance Rapide ou d'Assaut reçoit +2 à l'initiative pour son test d'action.

        Les formations aériennes ont +2 de bonus pour les tests d'actions lorsqu'elles tentent une Interception ou une Attaque au sol.
    - titre: "Règle spéciale : R'mise en bande"
      texte: |
        Lorsque les bandes Orks tentent un test de ralliement, ils reçoivent un bonus de +1 lorsqu'ils sont plus de 5 et de +2 lorsqu'ils sont plus de 10. Les engins de guerre faisant partie de ces bandes comptent pour autant d'unités que leur capacité de dommage de départ. Les Gretchins ne sont pas comptabilisables dans le calcul.
    - titre: "Règle spéciale : Orkeosaurus"
      texte: |
        Dans les parties de tournois, ces unités peuvent seulement transporter les unités de leur propre formation.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture Samuel Bourguignon, page 1 Chase Toole."
  valeur_strategique: 2
  initiative:
    defaut: "3+"
    exceptions: []

budgets: []

