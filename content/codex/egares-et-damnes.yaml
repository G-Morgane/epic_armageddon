options:
  - id: archi_heretique
    nom: Archi-Hérétique
    effet: { type: ajouter, cout: 0, unites: [{ unite: archi_heretique }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: min_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: requiert_unite, unites: [demagogue, aspirant_champion, champion_dieux_sombres, prince_demon, prince_demon_aile] }
    phrase_pdf: "Améliorer un Démagogue, un Aspirant Champion Marine du Chaos, un Champion des Dieux Sombres ou un Prince Démon en Archi-Hérétique"
    note_md: "Obligatoire et gratuit : une armée compte exactement un Archi-Hérétique. Cette amélioration ne compte pas dans les quatre améliorations par formation."
  - id: demon_majeur_ajout
    nom: Démon Majeur
    effet:
      type: choix
      parmi:
        - id: buveur_sang
          nom: Buveur de Sang
          cout: 150
          effet: { type: ajouter, unites: [{ unite: buveur_sang }] }
          contraintes: [{ type: requiert_unite, unites: [sanguinaires] }]
        - id: duc_changement
          nom: Duc du Changement
          cout: 150
          effet: { type: ajouter, unites: [{ unite: duc_changement }] }
          contraintes: [{ type: requiert_unite, unites: [incendiaires] }]
        - id: grand_immonde
          nom: Grand Immonde
          cout: 150
          effet: { type: ajouter, unites: [{ unite: grand_immonde }] }
          contraintes: [{ type: requiert_unite, unites: [portepestes] }]
        - id: gardien_secrets
          nom: Gardien des Secrets
          cout: 150
          effet: { type: ajouter, unites: [{ unite: gardien_secrets }] }
          contraintes: [{ type: requiert_unite, unites: [demonettes] }]
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: consomme, budget: demon_majeur_unique }
    phrase_pdf: "(0-1) Ajouter un Démon Majeur à une formation de Démons Mineurs correspondant à l'allégeance de la formation"
    note_md: "Uniquement si le Démon Majeur n'a pas déjà été pris comme formation. Une formation de Démons Mineurs comprenant un Démon Majeur a une initiative de 1+."
  - id: autel_chaos
    nom: Autel du Chaos
    effet: { type: ajouter, cout: 200, unites: [{ unite: autel_chaos }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "(0-1) Ajouter un Autel du Chaos à la formation"
  - id: prince_demon
    nom: Prince Démon
    effet:
      type: choix
      parmi:
        - id: prince_demon
          nom: Prince Démon
          cout: 50
          effet: { type: remplacer, de: [aspirant_champion, demagogue], par: prince_demon, lot: 1, max: 1, cout: 0 }
        - id: prince_demon_aile
          nom: Prince Démon Ailé
          cout: 50
          effet: { type: remplacer, de: [aspirant_champion, demagogue], par: prince_demon_aile, lot: 1, max: 1, cout: 0 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "(0-1) Remplacer l'Aspirant Champion Space Marine du Chaos ou le Démagogue par un Prince Démon ou un Prince Démon Ailé"
  - id: champion_dieux_sombres
    nom: Champion des Dieux Sombres
    effet: { type: ajouter, cout: 100, unites: [{ unite: champion_dieux_sombres }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la note Concentration Démoniaque (2D3) à une unité de la formation"
    note_md: "La feuille de références décrit le Champion des Dieux Sombres comme un personnage (Meneur, Sauvegarde invulnérable, Concentration démoniaque (2d3)) : l'amélioration est donc modélisée comme l'ajout de ce personnage à une unité de la formation."
  - id: cardinal
    nom: Cardinal
    effet: { type: mot_cle, texte: Charismatique, cout: 25, cible: [demagogue] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [demagogue] }
    phrase_pdf: "(0-1) Un Démagogue gagne la note Charismatique"
  - id: pacte_demoniaque
