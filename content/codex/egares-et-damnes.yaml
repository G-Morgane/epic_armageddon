listes_test:
  - nom: "2000 pts valide : Loge Stigmatus en Transporteurs, Loge Gigantis, Compagnie Blindée, Démon Majeur et Meute du Carnage"
    limite: 2000
    attendu: valide
    formations:
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
        options:
          - { option: archi_heretique }
          - { option: cardinal }
          - { option: pacte_demoniaque }
          - { option: transports_renegats, repartition: { transporteur_terrestre: 6 } }
      - formation: loge_gigantis
        variante: sans_chef
        choix: { "0": { mutant_geant: 4, ogryn_renegat: 2 } }
      - { formation: compagnie_blindee }
      - { formation: demon_majeur, choix: { "0": { buveur_sang: 1 } } }
      - { formation: meute_carnage, variante: quatre }
  - nom: "3000 pts valide : deux Loges Stigmatus, Prince Démon Ailé, Démons Mineurs avec Grand Immonde et Loge Primatus"
    limite: 3000
    attendu: valide
    formations:
      - formation: loge_stigmatus
        choix: { "0": { aspirant_champion: 1 }, "1": { cultiste: 6, mutant: 5 } }
        options:
          - { option: archi_heretique }
          - { option: prince_demon, choix: prince_demon_aile }
          - { option: chars_renegats, choix: demolisseurs, quantite: 2 }
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { mutant: 11 } }
        options:
          - { option: champion_dieux_sombres }
          - { option: appuis_feu, quantite: 4 }
      - { formation: batterie_artillerie }
      - { formation: escadron_sentinelles }
      - formation: demons_mineurs
        variante: douze
        choix: { "0": { portepestes: 12 } }
        options: [{ option: demon_majeur_ajout, choix: grand_immonde }]
      - formation: loge_primatus
        choix: { "0": { demagogue: 1 } }
        options: [{ option: dca_renegate }]
  - nom: "Loge Gigantis sans Loge Stigmatus"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: loge_gigantis
        variante: avec_chef
        choix: { "0": { aspirant_champion: 1 }, "1": { mutant_geant: 5 } }
        options: [{ option: archi_heretique }]
  - nom: "deux formations de soutien pour une seule Loge Renégate"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
        options: [{ option: archi_heretique }]
      - { formation: vol_doomwings }
      - { formation: batterie_feu_enfer, variante: quatre }
  - nom: "trois formations de Démons Mineurs"
    limite: 4000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
        options: [{ option: archi_heretique }]
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
      - { formation: demons_mineurs, variante: huit, choix: { "0": { sanguinaires: 8 } } }
      - { formation: demons_mineurs, variante: huit, choix: { "0": { sanguinaires: 8 } } }
      - { formation: demons_mineurs, variante: huit, choix: { "0": { sanguinaires: 8 } } }
  - nom: "cinq améliorations sur une Loge Stigmatus"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
        options:
          - { option: archi_heretique }
          - { option: cardinal }
          - { option: pacte_demoniaque }
          - { option: defilers, variante: un }
          - { option: chiens_chaos, quantite: 3 }
          - { option: griffons, quantite: 3 }
  - nom: "Cardinal dans une Loge Stigmatus sans Démagogue"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: loge_stigmatus
        choix: { "0": { aspirant_champion: 1 }, "1": { cultiste: 11 } }
        options:
          - { option: archi_heretique }
          - { option: cardinal }
  - nom: "armée sans Archi-Hérétique"
    limite: 3000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
  - nom: "Démon Majeur pris en formation et en amélioration"
    limite: 4000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - formation: loge_stigmatus
        choix: { "0": { demagogue: 1 }, "1": { cultiste: 11 } }
        options: [{ option: archi_heretique }]
