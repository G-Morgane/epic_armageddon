# Égarés et Damnés, transcrit depuis le PDF EAFR rev 1.9 (source de vérité).
codex:
  slug: egares-et-damnes
  armee_id: b1b6924b-e761-474a-a9da-855d081cbbce
  nom: Égarés et Damnés
  version: "1.9"
  faction: chaos
  categorie: armees-chaos
  statut: official
  citation:
    texte: "La chair et les os sont faibles et mutables, et pourtant le démon est finalement insignifiant et impuissant. Être maître à la fois de la matière et de l'énergie, et combiner cette maîtrise avec le contrôle ultime de sa conscience, c'est atteindre la véritable immortalité, ni confinée par la matière, ni séparée de celle-ci."
    auteur: Magos Kaudge Elizah
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée d'Égarés et de Damnés composée de cultistes du Chaos, démons issus des quatres dieux du Chaos et leurs machines de guerres infernales.

    Pour chaque Loge Renégate sélectionnée dans votre liste d'armée, vous pouvez également sélectionner une Formation d'Appui Renégate ET une formation parmi : Formation de Machines démoniaques OU une Formation de Démons OU une Formation du Chaos Universel.

    Chaque Loge Renégate, Formation du Chaos Universel et Formation de Démons peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement pour un maximum de quatre par formation. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'une formation tandis que d'autres ajoutent des unités supplémentaires.
  regles_md:
    - titre: "Règle spéciale : Archi-Hérétique"
      texte: |
        Un Démagogue, Aspirant Champion Marine du Chaos, Champion des dieux Sombres ou Prince Démon dans l'armée doit obligatoirement être amélioré en Archi-Hérétique. Cette amélioration de personnage ne coûte aucun point supplémentaire.
    - titre: "Règle spéciale : Instables"
      texte: |
        Si les démons sont démoralisés, ils sont détruits. Ils ne peuvent que contester les objectifs, pas les contrôler.
    - titre: "Règle spéciale : Infestations"
      texte: |
        Le déploiement des Infestations fonctionne exactement comme la règle Téléportation, mais après avoir placé une unité lancez 2D6+6 pour savoir de combien de socles de Zombies de la Peste la formation est composée. Testez ensuite normalement les pions impact pour la Téléportation (cela représente une infestation de zombies de la peste qui a été lâchée sur l'ennemi).
    - titre: "Règle spéciale : Invocation de démons"
      texte: |
        Au début de la partie, toutes les formations de Démons sélectionnée lors de la composition de l'armée sont placées en réserve. La note Icône Démoniaque permet, lors de la phase de Téléportation, d'invoquer une de ces formations. L'unité possédant Icône Démoniaque est nommée unité Invocatrice.

        La formation de l'unité Invocatrice et la formation invoquée doivent appartenir à la même allégeance. La formation invoquée apparaît à moins de 15 cm de l'unité Invocatrice. Si l'unité Invocatrice est éliminée, les démons ne peuvent plus être invoqués par cette formation.

        On ne peut invoquer qu'une seule formation de démons par Icône Démoniaque et par partie. Une formation s'étant téléportée ce tour-ci ne peut pas invoquer de démons. La formation invoquée ne subit pas de PI suite à sa « téléportation ».

        Elle devient immédiatement une formation à part entière et en suit les règles habituelles d'activation, de cohésion, etc. Elle reste ensuite en jeu jusqu'à la fin de la partie ou jusqu'à sa destruction.
    - titre: "Règle spéciale : Concentration démoniaque (X)"
      texte: |
        Une fois par partie, une unité possédant la note Concentration Démoniaque (X) peut invoquer des démons mineurs de la manière suivante :

        Au moment de l'activation de la formation de l'unité et avant qu'elle ne fasse son jet d'activation, X démons mineurs correspondants à l'allégeance de l'armée sont ajoutés à la formation. Tous les démons ainsi invoqués doivent être placés à 5 cm de l'unité.

        Les démons restent attachés à la formation jusqu'à la fin de la partie, ou jusqu'à leur destruction. Les démons et la formation devenant ainsi une seule et même formation suivant toutes les règles de cohésion, d'activation, etc.

        Remarque : ces démons n'ont pas à avoir été préalablement sélectionnés lors de la composition de l'armée.
    - titre: "Règle spéciale : Allégeance"
      texte: |
        Une armée Egarés et Damnés doit prêter allégeance à l'un des Dieux du Chaos (Khorne, Nurgle, Slaanesh ou Tzeentch). Vous devez décider à quelle allégeance appartient votre armée au début de la bataille et le noter sur votre liste d'armée. Il est impossible de lier des alliances entre les différents dieux. Vous n'aurez accès qu'aux formations de Démons et de Machines Démons du Dieu choisi, ainsi qu'à celles du Chaos Universel pour constituer votre armée.

        | Factions | Démons mineurs | Démons majeurs | Machines Démons |
        |---|---|---|---|
        | Khorne | Sanguinaires | Buveur de Sang | Seigneurs de Batailles, Grands Scorpions d'Airain, Machines Démon de Khorne, Canons de Khorne |
        | Tzeentch | Incendiaires | Duc du Changement | Palais du Warp, Tours d'Argent, Firelords, Doomwings |
        | Nurgle | Portes-peste | Grand Immonde | Tours de la Peste, Drônes de la Ruine, Machines de Contagion, Zombies de la Peste |
        | Slaanesh | Démonettes | Gardien des Secrets | Subjugators, Questors, Chevaliers Hell-Scourge, Chevaliers Hell-Striders |
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par GW LTD 2019. Couverture : Lorenzo Mastroianni ; P1 : Jason Juta."
  valeur_strategique: 2
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Engins de Guerre démoniaques (hors Firelords et Doomwings)", valeur: "1+" }
      - { portee: "Toute formation contenant un Démon Majeur", valeur: "1+" }

