    variantes:
      - id: base
        cout: 175
        composition:
          - choix:
              total: 1
              parmi: [{ unite: aspirant_champion }, { unite: demagogue }]
              phrase_pdf: "1 Aspirant Champion Marine du Chaos ou 1 Démagogue"
          - choix:
              total: 11
              parmi: [{ unite: cultiste }, { unite: mutant }]
              phrase_pdf: "11 unités de cultistes et/ou de Mutants"
    contraintes:
      - { type: fournit, budget: place_appui, quantite: 1 }
      - { type: fournit, budget: place_soutien, quantite: 1 }
      - { type: fournit, budget: place_gigantis, quantite: 1 }
