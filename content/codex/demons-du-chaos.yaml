options:
  - id: champion_demoniaque
    nom: Champion Démoniaque
    effet:
      type: choix
      parmi:
        - { id: heraut_khorne, nom: Héraut de Khorne, cout: 50, effet: { type: ajouter, cout: 50, unites: [{ unite: heraut_khorne }] } }
        - { id: heraut_tzeentch, nom: Héraut de Tzeentch, cout: 50, effet: { type: ajouter, cout: 50, unites: [{ unite: heraut_tzeentch }] } }
        - { id: heraut_nurgle, nom: Héraut de Nurgle, cout: 50, effet: { type: ajouter, cout: 50, unites: [{ unite: heraut_nurgle }] } }
        - { id: heraut_slaanesh, nom: Héraut de Slaanesh, cout: 50, effet: { type: ajouter, cout: 50, unites: [{ unite: heraut_slaanesh }] } }
        - { id: preneur_cranes, nom: Preneur de Crâne (Khorne), cout: 50, effet: { type: ajouter, cout: 50, unites: [{ unite: preneur_cranes }] } }
        - { id: jardinier_nurgle, nom: Jardinier de Nurgle (Nurgle), cout: 50, effet: { type: ajouter, cout: 50, unites: [{ unite: jardinier_nurgle }] } }
        - { id: ravisseur_infernal, nom: Ravisseur infernal (Slaanesh), cout: 50, effet: { type: ajouter, cout: 50, unites: [{ unite: ravisseur_infernal }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 Héraut Démoniaque ou 1 Soutien Démoniaque à l'une des unités de la formation"
  - id: bete_demoniaque
    nom: Bête Démoniaque
    effet:
      type: choix_multiple
      total: { min: 1, max: 3 }
      parmi: [{ unite: chien_khorne, cout: 25 }, { unite: bete_nurgle, cout: 25 }, { unite: bete_slaanesh, cout: 25 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez jusqu'à 3 Bêtes Démoniaques, 25 pts chacune"
  - id: demon_mineur_opt
    nom: Démon Mineur
    effet:
      type: choix_multiple
      total: { min: 1, max: 6 }
      parmi:
        - { unite: sanguinaires, cout: 25 }
        - { unite: incendiaires, cout: 25 }
        - { unite: portepestes, cout: 25 }
        - { unite: demonettes, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez jusqu'à 6 unités de Démons mineurs, 25 pts chacune"
  - id: support_demoniaque_opt
    nom: Support Démoniaque
    effet:
      type: choix
      parmi:
        - { id: canon_khorne, nom: Canon de Khorne, cout: 75, effet: { type: ajouter, cout: 75, unites: [{ unite: canon_khorne }] } }
        - { id: chariot_feu, nom: Chariot de Feu de Tzeentch, cout: 75, effet: { type: ajouter, cout: 75, unites: [{ unite: chariot_feu }] } }
        - { id: crapaud_peste, nom: Crapaud de la Peste, cout: 75, effet: { type: ajouter, cout: 75, unites: [{ unite: crapaud_peste }] } }
        - { id: chariot_slaanesh, nom: Chariot de Slaanesh, cout: 75, effet: { type: ajouter, cout: 75, unites: [{ unite: chariot_slaanesh }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajoutez 1 unité de Support Démoniaque"
  - id: attaque_rapide_opt
    nom: Attaque rapide
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: equarrisseurs, cout: 25 }
        - { unite: hurleurs, cout: 25 }
        - { unite: mouches_nurgle, cout: 25 }
        - { unite: veneuses, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
