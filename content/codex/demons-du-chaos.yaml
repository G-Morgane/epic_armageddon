  - id: incendiaire_exalte_opt
    nom: Incendiaire Exalté (Tzeentch)
    effet: { type: remplacer, de: incendiaires, par: incendiaire_exalte, lot: 2, max: 1, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
