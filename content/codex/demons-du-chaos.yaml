# Démons du Chaos, transcrit depuis le PDF EAFR (pied de page : CODEX DÉMONS DU CHAOS - EAFR -
# BETA - V0.1, publié sur le site en REV 0.2 — source de vérité).
codex:
  slug: demons-du-chaos
  armee_id: 599a78d8-3463-4699-9eee-19419733562f
  nom: Démons du Chaos
  version: "0.2"
  faction: chaos
  categorie: armees-chaos
  statut: beta
  couleur: "#5c3a6e"
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/demons-du-chaos.png
  citation:
    texte: "Les intentions de leur sombre maître se reflètent sur le visage et l'apparence de ses émissaires."
    auteur: Extrait du Liber Maleficarum
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de Démons du Chaos telles celles qui apparaissent lors des grandes incursions démoniaques. Les armées de Démons du Chaos sont organisées en formations appelées détachements.

    Chaque détachement peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement pour un maximum de quatre par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Notez que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.
  regles_md:
    - titre: "Règle spéciale : Factions"
      texte: |
        Chaque formation dans une armée de Démons du Chaos appartient à une faction qui prête allégeance à l'un des Dieux du Chaos (Khorne, Nurgle, Slaanesh ou Tzeentch) ou au Chaos Universel.

        À l'exception de celles vénérant le Chaos Universel, les différentes factions ne s'entendent pas toutes bien, et certaines entretiennent entre elles des haines millénaires.

        Les unités et les améliorations sélectionnées pour une formation doivent appartenir à la même faction (pas de Héraut de Khorne dans une formation de Nurgle). Certaines améliorations sont spécifiques à une faction, qui est alors indiquée entre parenthèses. Un Commandant d'une faction ne peut pas utiliser sa règle Commandant avec un détachement d'une autre faction.

        **Khorne** : Buveur de Sang, Sanguinaires, Équarrisseurs, Chiens de Khorne, Canon de Khorne, Héraut de Khorne, Preneur de Crâne. **Tzeentch** : Duc du Changement, Incendiaires, Hurleurs, Chariots de feu, Héraut de Tzeentch. **Nurgle** : Grand Immonde, Portepestes, Nurglings, Mouches de Nurgle, Bêtes de Nurgle, Crapauds de la peste, Héraut de Nurgle, Jardinier de Nurgle. **Slaanesh** : Gardien des Secrets, Démonettes, Veneuses, Bêtes de Slaanesh, Chariots de Slaanesh, Héraut de Slaanesh, Ravisseur infernal, Le Masque.

        Le constructeur ne sait pas vérifier la faction d'une formation : à vous de ne pas mélanger deux Dieux dans un même détachement.
    - titre: "Règle spéciale : Exalté"
      texte: |
        Un seul Démon Majeur de l'armée peut devenir gratuitement un Démon Majeur Exalté. Il gagne la règle Commandant Suprême.

        Si vous jouez la Cour du Premier Prince, alors le Prince Démon de la Cour du Premier Prince devient Commandant Suprême à la place.
    - titre: "Règle spéciale : Sacrifiables"
      texte: |
        Les unités Sacrifiables ne génèrent pas de pion impact lorsqu'elles sont détruites. Cependant, les unités Sacrifiables comptent dans le calcul des pertes lors de la résolution d'un assaut.
    - titre: "Règle spéciale : Instables"
      texte: |
        Les démons sont instables. Une fois démoralisés, chaque pion d'impact leur fera perdre 2 socles au lieu de 1. Les Démons majeurs ne perdent que 1 CD.
    - titre: "Règle spéciale : Portail Démoniaque"
      texte: |
        Lors des grandes invasions démoniaques, les Démons s'infiltrent dans le monde réel par de gigantesques failles Warp. Ces failles servent de portails qui permettent aux démons de se matérialiser pour quelques heures, jours ou semaines.

        Chaque portail démoniaque permet de mettre jusqu'à 3 formations de démons en réserve. Dans le scénario du Grand Tournoi, les formations avec plusieurs options de déploiement doivent désigner leur méthode de déploiement durant le déploiement (Portail, aéronef, Faille Démoniaque…).

        Le joueur Démons du Chaos peut remplacer gratuitement son objectif Blitz par un Portail. Il compte à la fois comme un objectif et un Portail. Il peut remplacer un seul marqueur d'objectif supplémentaire dans sa moitié de table par un Portail s'il en a payé l'option. Un portail ne peut être ni attaqué, ni détruit.

        Un Portail Démoniaque permet, lors de la phase de Téléportation, d'invoquer une et une seule formation de démons préalablement sélectionnée lors de la composition de l'armée. La formation invoquée apparaît à moins de 15cm du portail démoniaque, et hors des zones de contrôle ennemies. Si cela n'est pas possible, alors la formation ne peut pas être déployée.

        On ne peut invoquer qu'une seule formation de démons par Portail Démoniaque et par tour. La formation invoquée ne subit pas de PI suite à sa « téléportation ». Elle devient immédiatement une formation à part entière et en suit les règles habituelles d'activation, de cohésion, etc.
    - titre: "Règle spéciale : Faille démoniaque"
      texte: |
        Les Démons du Chaos peuvent apparaître via des Failles démoniaques. Une Faille démoniaque permet de déployer jusqu'à 2 détachements de Démons du Chaos en suivant les règles d'Assaut planétaire indépendant. Ne prenez qu'une seule coordonnée par Faille Démoniaque, qui sera utilisée pour déployer les 2 détachements liés à la Faille (les 2 détachements seront donc déployés dans les 15cm de la Faille démoniaque).

        La Faille démoniaque compte comme une activation. Les formations déployées ainsi deviennent immédiatement des formations à part entière et en suivent les règles habituelles d'activation, de cohésion, etc.
    - titre: "Règle spéciale : Cacophonie Psychique"
      texte: |
        Lors des invasions démoniaques, le ciel se couvre de nuages chargés d'énergie psychique. Lors de leur entrée en jeu, les aéronefs ennemis subissent 1 tir AA6+ par formation.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Tze Kun Chin."
  valeur_strategique: 1
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Formations comprenant un Démon Majeur et Failles Démoniaques", valeur: "1+" }

