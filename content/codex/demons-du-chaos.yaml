sections:
  - id: detachements
    titre: DÉTACHEMENTS DÉMONS DU CHAOS
    formations: [legion_demoniaque, demon_majeur_khorne, demon_majeur_tzeentch, demon_majeur_nurgle, demon_majeur_slaanesh, horde_demons_mineurs]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
  - id: soutien_demoniaque
    titre: FORMATION DE SOUTIEN
    sous_titre: "Maximum 2 formations de soutien par détachement de Démons du Chaos"
    formations: [demons_mineurs, formation_attaque_rapide, betes_demoniaques, formation_support_demoniaque]
    contraintes: [{ type: consomme, budget: soutien }, { type: max_options, valeur: 4 }]
    colonne_options: true
    options: [champion_demoniaque, bete_demoniaque, demon_mineur_opt, support_demoniaque_opt, attaque_rapide_opt, karanak_opt, incendiaire_exalte_opt, nurgling_opt, le_masque_opt]
    tableau_options:
      titre: AMÉLIORATIONS DÉMONS DU CHAOS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement"
  - id: rares
    titre: FORMATION RARE
    sous_titre: "Maximum 1/3 des points"
    formations: [formation_portail, formation_faille]

listes_test:
