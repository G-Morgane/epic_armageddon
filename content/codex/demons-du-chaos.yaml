  - id: karanak_opt
    nom: Karanak (Khorne)
    effet: { type: ajouter, cout: 50, unites: [{ unite: karanak, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: max_par_formation, valeur: 1 }]
