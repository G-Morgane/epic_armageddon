    type: VS
    armes:
      - { nom: Bombardement Orbital (5), portee: "∞", puissance: "5PB, MA" }
    notes: ["Transport (20+20+6) : Tactiques, Devastators, Marines d'Assaut, Scouts, Terminators, Dreadnoughts, Motos et Motos d'assaut, plus 20 véhicules parmi Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 6 Thunderhawks et Thunderhawks Transporteurs. De plus, le Croiseur d'Attaque peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."]
    transport: { capacite: 20, accepte: [tactiques, devastators, marines_assaut, scouts, terminators, dreadnought, dreadnought_feu_enfer, motos, motos_assaut] }
  - id: barge_bataille
    nom: Barge de Bataille
    type: VS
    armes:
      - { nom: Bombardement Orbital (14), portee: "∞", puissance: "14PB, MA" }
    notes:
      - "Lent, ne peut être utilisé aux tours 1 et 2."
      - "Transport (60+60+6) : Tactiques, Devastators, Marines d'Assaut, Scouts, Terminators, Dreadnoughts, Motos et Motos d'Assaut, plus 60 véhicules parmis Rhinos, Razorbacks, Whirlwinds, Hunters, Predators, Vindicators et Land Raiders ainsi que 9 Thunderhawks et Thunderhawks Transporteurs. De plus, la Barge de Bataille peut transporter le nombre nécessaire de Modules d'Atterrissage, Stormeagles, Stormravens, Béliers d'Assaut Caestus et Barges de Débarquement pour transporter le reste des unités à son bord."
    transport: { capacite: 60, accepte: [tactiques, devastators, marines_assaut, scouts, terminators, dreadnought, dreadnought_feu_enfer, motos, motos_assaut] }

  # ---- Légions Titaniques : importées par l'alliance avec adeptus-titanicus ----

options:
  - id: commandant
    nom: Commandant
    effet:
      type: choix
      parmi:
        - { id: capitaine, nom: Capitaine, cout: 50, effet: { type: ajouter, unites: [{ unite: capitaine }] } }
        - { id: archiviste, nom: Archiviste, cout: 50, effet: { type: ajouter, unites: [{ unite: archiviste }] } }
        - { id: chapelain, nom: Chapelain, cout: 50, effet: { type: ajouter, unites: [{ unite: chapelain }] } }
        - id: maitre_chapitre
          nom: Maître de Chapitre
          cout: 50
          effet: { type: ajouter, unites: [{ unite: maitre_chapitre }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter un Capitaine ou un Archiviste ou un Chapelain (Remplacer un Capitaine par 0-1 Maître de Chapitre, gratuit)"
    note_md: "Un seul Maître de Chapitre par armée (Commandant Suprême). L'échange d'un Capitaine contre le Maître de Chapitre est gratuit : les deux coûtent 50 pts."
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 50, cible: [terminators] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter la Note Téléportation aux unités d'infanterie de la formation"
  - id: sniper
    nom: Sniper
    effet: { type: mot_cle, texte: Sniper, cout: 50, cible: [scouts] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Les Bolters Lourds des unités de Scouts reçoivent la Note Sniper"
  - id: hunter
    nom: Hunter
    effet: { type: ajouter, cout: 50, unites: [{ unite: hunter, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Hunter à la formation"
  - id: razorback
    nom: Razorback
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: razorback_bolters_lourds, cout: 25 }
        - { unite: razorback_canons_laser, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter autant de Razorback Bolters Lourds ou de Razorback Canons Laser que d'unités à transporter, 25 pts chacun"
  - id: dreadnought
    nom: Dreadnought
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: dreadnought, cout: 50 }
        - { unite: dreadnought_feu_enfer, cout: 50 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 ou 2 Dreadnoughts à la formation parmi Dreadnought, Dreadnought Feu d'Enfer, 50 pts chacun"
  - id: support_lourd
    nom: Support Lourd
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: predator_annihilator, cout: 65 }
        - { unite: predator_destructor, cout: 65 }
        - { unite: vindicator, cout: 65 }
        - { unite: land_raider, cout: 75 }
        - { unite: land_raider_redeemer, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 véhicules blindés à la formation selon n'importe quelle combinaison : Predators Annihilator, Predators Destructor, Vindicator (65 pts chacun), Land Raiders, Land Raider Redeemer (75 pts chacun)"
  - id: land_raider
    nom: Land Raider
    effet:
      type: choix_multiple
      total: { min: 1, max: 4 }
      parmi:
        - { unite: land_raider, cout: 75 }
        - { unite: land_raider_redeemer, cout: 75 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 Land Raiders et/ou Land Raider Redeemer à la formation, 75 pts chacun"
  - id: vindicator
    nom: Vindicator
    effet: { type: ajouter, cout_par_unite: 65, unites: [{ unite: vindicator }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Vindicators à la formation, 65 pts chacun"
  - id: tornado_typhoon
    nom: Tornado / Typhoon
    effet: { type: mot_cle, texte: "Land Speeders Tornado et Typhoon au choix dans la composition", cout: 0, cible: [land_speeder, land_speeder_tornado, land_speeder_typhoon] }
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "La formation peut contenir des Land Speeders selon n'importe quelle combinaison : remplacer des unités par autant de Land Speeders Tornado (5 pts chacun) ou de Land Speeders Typhoon (15 pts chacun)"
    note_md: "Porté par la composition de la formation Land Speeders (5 unités parmi Land Speeder 0 pt, Tornado 5 pts, Typhoon 15 pts) ; cette ligne ne sert qu'à l'affichage du tableau."
  - id: transport_remplacement
    nom: Remplacer les transports
    effet:
      type: choix
      parmi:
        - id: dreadnought
          nom: Dreadnought à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: dreadnought, tout: true, par_nombre: 1, cout: 0 }
        - id: module_atterrissage
          nom: Module d'atterrissage à la place des Rhinos
          cout: 0
          effet: { type: remplacer, de: rhino, par: module_atterrissage, tout: true, par_nombre: 1, cout: 0 }
          contraintes: [{ type: exclut, options: [razorback, hunter, support_lourd] }]
    contraintes: [{ type: hors_quota_options }, { type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer tous les Rhinos de la formation par un Dreadnought ou par un Module d'atterrissage"
    note_md: "Vient de la règle spéciale Transports et non du tableau des améliorations : elle ne consomme donc pas le quota de 3 améliorations. Une formation contenant des unités ne pouvant pas être déployées en Module d'atterrissage (Razorbacks, Hunter, Support Lourd) ne peut pas choisir le Module. Le Module d'atterrissage ne transporte que des Tactiques, des Devastators et un Dreadnought : un détachement de Scouts ne peut donc prendre que le Dreadnought."

formations:
  # ---- Détachements principaux ----
  - id: tactique
    nom: Tactique
    variantes:
      - id: base
        cout: 300
        composition:
          - { unite: tactiques, nombre: 6 }
          - { transports: { unite: rhino } }
    options: [commandant, dreadnought, razorback, hunter, support_lourd, transport_remplacement]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]
    phrase_pdf: "6 unités de Tactiques Salamanders + Transports"
  - id: devastator
    nom: Devastator
    variantes:
      - id: base
        cout: 250
        composition:
          - { unite: devastators, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [commandant, dreadnought, razorback, hunter, support_lourd, transport_remplacement]
    contraintes: [{ type: fournit, budget: soutien, quantite: 3 }]
    phrase_pdf: "4 unités de Devastators Salamanders + Transports"

  # ---- Détachements de soutien ----
  - id: assaut
    nom: Assaut
    variantes:
      - { id: base, cout: 175, composition: [{ unite: marines_assaut, nombre: 4 }] }
    options: [commandant]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: "4 unités de Marines d'Assaut"
  - id: terminator
    nom: Terminator
    variantes:
      - { id: base, cout: 300, composition: [{ unite: terminators, nombre: 4 }] }
    options: [commandant, dreadnought, land_raider, teleportation]
    phrase_pdf: "4 unités de Terminators Salamanders"
  - id: scouts
    nom: Scouts
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: scouts, nombre: 4 }
          - { transports: { unite: rhino } }
    options: [commandant, razorback, sniper, transport_remplacement]
    phrase_pdf: "4 unités de Scouts + Transports"
  - id: motos
    nom: Motos
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 5
              parmi: [{ unite: motos, cout: 0 }, { unite: motos_assaut, cout: 0 }]
              phrase_pdf: "5 unités parmi : Motos, Motos d'Assaut"
    options: [commandant]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
  - id: land_speeders
    nom: Land Speeders
    variantes:
      - id: base
        cout: 200
        composition:
          - choix:
              total: 5
              parmi: [{ unite: land_speeder, cout: 0 }, { unite: land_speeder_tornado, cout: 5 }, { unite: land_speeder_typhoon, cout: 15 }]
              phrase_pdf: "5 Land Speeders"
    options: [commandant, tornado_typhoon]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
  - id: land_raiders
    nom: Land Raiders
    variantes:
      - id: base
        cout: 350
        composition:
          - choix:
              total: 4
              parmi: [{ unite: land_raider, cout: 0 }, { unite: land_raider_redeemer, cout: 0 }]
              phrase_pdf: "4 Land Raiders et/ou Land Raiders Redeemer"
    options: [commandant, vindicator]
  - id: predators
    nom: Predators
    variantes:
      - { id: destructor, nom: 4 Predators Destructor, cout: 225, composition: [{ unite: predator_destructor, nombre: 4 }] }
      - { id: annihilator, nom: 4 Predators Annihilator, cout: 275, composition: [{ unite: predator_annihilator, nombre: 4 }] }
    options: [commandant, vindicator]
  - id: vindicators
    nom: Vindicators
    variantes:
      - { id: base, cout: 250, composition: [{ unite: vindicator, nombre: 4 }] }
    options: [commandant]
    phrase_pdf: "4 Vindicators"
  - id: whirlwinds
    nom: Whirlwinds
    variantes:
      - { id: base, cout: 300, composition: [{ unite: whirlwind, nombre: 4 }] }
    options: [commandant, hunter]
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    phrase_pdf: "4 Whirlwinds"

  # ---- Supports : Flotte Salamanders ----
  - id: thunderhawks_transporteurs
    nom: Thunderhawks Transporteurs
    variantes:
      - { id: deux, nom: 2 Thunderhawk Transporteurs, cout: 300, composition: [{ unite: thunderhawk_transporteur, nombre: 2 }] }
      - { id: trois, nom: 3 Thunderhawk Transporteurs, cout: 450, composition: [{ unite: thunderhawk_transporteur, nombre: 3 }] }
    phrase_pdf: "2 Thunderhawk Transporteurs (Ajouter 1 Thunderhawk Transporteur : +150 pts)"
  - id: thunderhawk
    nom: Thunderhawk
    variantes:
      - { id: base, cout: 225, composition: [{ unite: thunderhawk, nombre: 1 }] }
  - id: barge_debarquement
    nom: Barge de Débarquement
    variantes:
      - { id: base, cout: 400, composition: [{ unite: barge_debarquement, nombre: 1 }] }
  - id: intercepteurs_stormtalons
    nom: Intercepteurs Stormtalons
    variantes:
      - { id: destructor, nom: 2 Stormtalons Destructor, cout: 200, composition: [{ unite: stormtalon_destructor, nombre: 2 }] }
      - { id: annihilator, nom: 2 Stormtalons Annihilator, cout: 250, composition: [{ unite: stormtalon_annihilator, nombre: 2 }] }
  - id: stormeagles
    nom: Stormeagles
    variantes:
      - { id: base, cout: 275, composition: [{ unite: stormeagle, nombre: 2 }] }
  - id: caestus
    nom: Béliers d'Assaut Caestus
    variantes:
      - { id: deux, nom: 2 Caestus, cout: 250, composition: [{ unite: belier_assaut_caestus, nombre: 2 }] }
      - { id: trois, nom: 3 Caestus, cout: 350, composition: [{ unite: belier_assaut_caestus, nombre: 3 }] }
    phrase_pdf: "2 Caestus (Ajouter 1 Caestus : +100 pts)"
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur d'Attaque, cout: 200, composition: [{ unite: croiseur_attaque, nombre: 1 }] }
      - { id: barge_bataille, nom: 1 Barge de Bataille, cout: 350, composition: [{ unite: barge_bataille, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    phrase_pdf: "0-1 Soutien Orbital"

sections:
  - id: detachements_principaux
    titre: DÉTACHEMENTS PRINCIPAUX SALAMANDERS
    formations: [tactique, devastator]
    contraintes: [{ type: max_options, valeur: 3 }]
    colonne_options: true
  - id: detachements_soutien
    titre: DÉTACHEMENTS DE SOUTIEN
    sous_titre: "Jusqu'à 3 Détachements de Soutien par Détachement principal"
    formations: [assaut, terminator, scouts, motos, land_speeders, land_raiders, predators, vindicators, whirlwinds]
    contraintes: [{ type: consomme, budget: soutien }, { type: max_options, valeur: 3 }]
    colonne_options: true
    # Tableau unique des améliorations du PDF : `options` reprend toutes les améliorations dans l'ordre du PDF
    # (chaque formation garde sa propre liste `options`, cette liste ne sert qu'au tableau).
    options: [commandant, teleportation, sniper, hunter, razorback, dreadnought, support_lourd, land_raider, vindicator, tornado_typhoon, transport_remplacement]
    tableau_options:
      titre: AMÉLIORATIONS SALAMANDERS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 3 améliorations"
  - id: flotte
    titre: FLOTTE SALAMANDERS
    sous_titre: "SUPPORTS SPACE MARINES"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [thunderhawks_transporteurs, thunderhawk, barge_debarquement, intercepteurs_stormtalons, stormeagles, caestus, soutien_orbital]
  - id: titanicus
    titre: SOUTIENS DES LÉGIONS TITANIQUES
    sous_titre: "SUPPORTS SPACE MARINES"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: []
    allies: { codex: adeptus-titanicus }

listes_test:
  - nom: "3000 pts valide, Tactique complet, Terminators téléportés et un Warhound"
    limite: 3000
    attendu: valide
    formations:
      - formation: tactique
        options:
          - { option: commandant, choix: capitaine }
          - { option: dreadnought, repartition: { dreadnought: 1, dreadnought_feu_enfer: 1 } }
          - { option: razorback, repartition: { razorback_bolters_lourds: 1, razorback_canons_laser: 1 } }
      - formation: terminator
        options:
          - { option: teleportation }
          - { option: commandant, choix: chapelain }
          - { option: land_raider, repartition: { land_raider_redeemer: 2 } }
      - formation: scouts
        options: [{ option: sniper }]
      - { formation: predators, variante: destructor }
      - { formation: titan_warhound }
  - nom: "2000 pts valide, Module d'atterrissage, compositions au choix et Soutien orbital"
    limite: 2000
    attendu: valide
    formations:
      - formation: devastator
        options:
          - { option: transport_remplacement, choix: module_atterrissage }
      - formation: motos
        choix: { "0": { motos: 3, motos_assaut: 2 } }
      - formation: land_speeders
        choix: { "0": { land_speeder: 3, land_speeder_tornado: 1, land_speeder_typhoon: 1 } }
      - formation: whirlwinds
        options: [{ option: hunter }]
      - { formation: soutien_orbital, variante: croiseur }
  - nom: "1500 pts valide, Maître de Chapitre, Support Lourd et Land Raiders mixtes"
    limite: 1500
    attendu: valide
    formations:
      - formation: tactique
        options:
          - { option: commandant, choix: maitre_chapitre }
          - { option: support_lourd, repartition: { land_raider_redeemer: 1, vindicator: 1 } }
      - formation: land_raiders
        choix: { "0": { land_raider: 2, land_raider_redeemer: 2 } }
      - { formation: assaut }
  - nom: "deux Maîtres de Chapitre"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: tactique, options: [{ option: commandant, choix: maitre_chapitre }] }
      - { formation: tactique, options: [{ option: commandant, choix: maitre_chapitre }] }
  - nom: "quatre détachements de soutien pour un seul détachement principal"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: tactique }
      - { formation: motos, choix: { "0": { motos: 5 } } }
      - { formation: vindicators }
      - { formation: whirlwinds }
      - { formation: predators, variante: destructor }
  - nom: "quatre améliorations sur un même détachement"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: tactique
        options:
          - { option: commandant, choix: capitaine }
          - { option: hunter }
          - { option: razorback, repartition: { razorback_bolters_lourds: 1 } }
          - { option: dreadnought, repartition: { dreadnought: 1 } }
  - nom: "deux détachements de Whirlwinds alors qu'ils sont 0-1"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: tactique }
      - { formation: whirlwinds }
      - { formation: whirlwinds }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: tactique }
      - { formation: titan_warlord }
