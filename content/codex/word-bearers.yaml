        - { id: lr3, nom: 3 Land Raiders du Chaos, cout: 200, unites: [{ unite: land_raider_chaos, nombre: 3 }] }
        - { id: lr4, nom: 4 Land Raiders du Chaos, cout: 250, unites: [{ unite: land_raider_chaos, nombre: 4 }] }
        - { id: vindicators_lr1, nom: 2 Vindicators et 1 Land Raider du Chaos, cout: 150, unites: [{ unite: vindicator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 1 }] }
        - { id: vindicators_lr2, nom: 2 Vindicators et 2 Land Raiders du Chaos, cout: 200, unites: [{ unite: vindicator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 2 }] }
        - { id: predators_lr1, nom: 2 Predators et 1 Land Raider du Chaos, cout: 150, unites: [{ unite: predator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 1 }] }
        - { id: predators_lr2, nom: 2 Predators et 2 Land Raiders du Chaos, cout: 200, unites: [{ unite: predator_chaos, nombre: 2 }, { unite: land_raider_chaos, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "0-4 véhicules supplémentaires parmi : Support Lourd, Land Raiders"
    note_md: "Compagnie Blindée uniquement : au plus 4 véhicules supplémentaires en combinant une fois Support Lourd (2 Vindicators ou 2 Predators, 75 pts) et une fois Land Raiders (75 pts chacun, 125 pts les 2)."

formations:
  # ---- Détachements des Word Bearers ----
  - id: suite_word_bearers
    nom: Suite des Word Bearers
    description: "1+ par armée"
    variantes:
      - { id: base, cout: 250, composition: [{ unite: space_marines_chaos, nombre: 8 }] }
    options: [personnage_chaos, apotre_noir, prince_demon, porte_icone, autel_chaos, autel_devotion, enfants_chaos, havocs, dreadnoughts, defilers, transports, stalker, support_lourd, land_raiders]
    contraintes:
      - { type: min_par_armee, valeur: 1 }
      - { type: fournit, budget: place_soutien, quantite: 1 }
      - { type: fournit, budget: place_possedes, quantite: 1 }
  - id: suite_elus
    nom: Suite d'Élus Word Bearers
    variantes:
      - id: base
        cout: 0
        composition:
          - choix:
              total: { min: 4, max: 6 }
              parmi: [{ unite: elus_terminators_chaos, cout: 50 }]
              phrase_pdf: "4 à 6 unités d'Élus Terminators du Chaos (50 pts chacune)"
    options: [personnage_chaos, apotre_noir, prince_demon, porte_icone, autel_chaos, autel_devotion, dreadnoughts, defilers, transports_elus, stalker, support_lourd, land_raiders]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: suite_possedes
    nom: Suite de possédés
    description: "0-1 par Suite des Word Bearers"
    variantes:
      - { id: base, cout: 300, composition: [{ unite: possedes, nombre: 8 }] }
    options: [autel_devotion, enfants_chaos, transports]
    contraintes: [{ type: consomme, budget: place_possedes }]
  - id: compagnie_motos
    nom: Compagnie de Motos
    variantes:
      - { id: base, cout: 250, composition: [{ unite: motos_chaos, nombre: 8 }] }
    options: [personnage_chaos, apotre_noir, porte_icone, chiens_chaos]
  - id: compagnie_blindee
    nom: Compagnie Blindée
    variantes:
      - { id: land_raiders, nom: 4 Land Raiders du Chaos, cout: 300, composition: [{ unite: land_raider_chaos, nombre: 4 }] }
      - { id: predators, nom: 4 Predators du Chaos, cout: 200, composition: [{ unite: predator_chaos, nombre: 4 }] }
    options: [stalker, vehicules_blindee]

  # ---- Formations de soutien des Word Bearers ----
  - id: loge_stigmatus
    nom: Loge Stigmatus
    variantes:
      - id: base
        cout: 175
        composition:
          - { unite: aspirant_champion, nombre: 1 }
          - choix:
              total: 11
              parmi: [{ unite: cultiste }, { unite: mutant }]
              phrase_pdf: "11 unités de Cultistes et/ou de Mutants"
    options: [transports_renegats, hydre, enfants_chaos, chiens_chaos, autel_chaos, porte_icone, appuis_feu, hellhounds, cultistes]
    contraintes: [{ type: fournit, budget: place_gigantis, quantite: 1 }]
  - id: loge_gigantis
    nom: Loge Gigantis
    description: "0-1 par Loge Stigmatus"
    variantes:
      - id: base
        cout: 250
        composition:
          - choix:
              total: 6
              parmi: [{ unite: mutant_geant }, { unite: ogryn_renegat }]
              phrase_pdf: "6 Mutants Géants et/ou Ogryns Renégats"
    options: [transports_renegats, hydre, cultistes]
    contraintes: [{ type: consomme, budget: place_gigantis }]
  - id: detachement_defilers
    nom: Defilers
    variantes:
      - { id: base, cout: 300, composition: [{ unite: defiler, nombre: 4 }] }
    options: [defilers]

  # ---- Pool démoniaque ----
  - id: demon_majeur
    nom: Démon Majeur
    variantes:
      - id: seul
        nom: 1 Démon Majeur
        cout: 200
        composition:
          - choix:
              total: 1
              parmi: [{ unite: buveur_sang }, { unite: duc_changement }, { unite: grand_immonde }, { unite: gardien_secrets }]
              phrase_pdf: "1 Démon Majeur"
      - id: huit_mineurs
        nom: 1 Démon Majeur et 8 unités de Démons Mineurs
        cout: 325
        composition:
          - choix:
              total: 1
              parmi: [{ unite: buveur_sang }, { unite: duc_changement }, { unite: grand_immonde }, { unite: gardien_secrets }]
              phrase_pdf: "1 Démon Majeur"
          - choix:
              total: 8
              parmi: [{ unite: sanguinaires }, { unite: incendiaires }, { unite: portepestes }, { unite: demonettes }, { unite: betes_demoniaques }]
              phrase_pdf: "8 unités de Démons Mineurs"
      - id: douze_mineurs
        nom: 1 Démon Majeur et 12 unités de Démons Mineurs
        cout: 425
        composition:
          - choix:
              total: 1
              parmi: [{ unite: buveur_sang }, { unite: duc_changement }, { unite: grand_immonde }, { unite: gardien_secrets }]
              phrase_pdf: "1 Démon Majeur"
          - choix:
              total: 12
              parmi: [{ unite: sanguinaires }, { unite: incendiaires }, { unite: portepestes }, { unite: demonettes }, { unite: betes_demoniaques }]
              phrase_pdf: "12 unités de Démons Mineurs"
    options: []
    contraintes: [{ type: max_par_armee, valeur: 2 }]
  - id: demons_mineurs
    nom: Démons Mineurs
    variantes:
      - id: huit
        nom: 8 unités de Démons Mineurs
        cout: 175
        composition:
          - choix:
              total: 8
              parmi: [{ unite: sanguinaires }, { unite: incendiaires }, { unite: portepestes }, { unite: demonettes }, { unite: betes_demoniaques }]
              phrase_pdf: "8 unités de Démons Mineurs"
      - id: douze
        nom: 12 unités de Démons Mineurs
        cout: 275
        composition:
          - choix:
              total: 12
              parmi: [{ unite: sanguinaires }, { unite: incendiaires }, { unite: portepestes }, { unite: demonettes }, { unite: betes_demoniaques }]
              phrase_pdf: "12 unités de Démons Mineurs"
    options: []
    contraintes:
      - { type: max_par_armee, valeur: 2 }
      - { type: initiative, valeur: "2+" }

  # ---- Supports : Flotte de Guerre du Chaos ----
  - id: escadrille_intercepteurs
    nom: Escadrille d'Intercepteurs
    variantes:
      - { id: base, cout: 200, composition: [{ unite: hellblade, nombre: 3 }] }
  - id: escadrille_chasseurs_bombardiers
    nom: Escadrille de Chasseurs-Bombardiers
    variantes:
      - { id: base, cout: 225, composition: [{ unite: helltalon, nombre: 2 }] }
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: croiseur, nom: 1 Croiseur Devastation, cout: 200, composition: [{ unite: croiseur_devastation, nombre: 1 }] }
      - { id: cuirasse, nom: 1 Cuirassé Despoiler, cout: 250, composition: [{ unite: cuirasse_despoiler, nombre: 1 }] }
    contraintes: [{ type: pas_une_activation }]

  # ---- Supports : DeathWheel et Titans ----
  - id: deathwheel
    nom: DeathWheel
    variantes:
      - { id: base, cout: 275, composition: [{ unite: deathwheel, nombre: 1 }] }
  - id: titan_feral
    nom: Titan Feral
    variantes:
      - { id: base, cout: 300, composition: [{ unite: titan_feral, nombre: 1 }] }
  - id: titan_ravager
    nom: Titan Ravager
    variantes:
      - { id: base, cout: 650, composition: [{ unite: titan_ravager, nombre: 1 }] }
  - id: titan_banelord
    nom: Titan Banelord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: titan_banelord, nombre: 1 }] }

sections:
  - id: detachements
    titre: DÉTACHEMENTS DES WORD BEARERS
    formations: [suite_word_bearers, suite_elus, suite_possedes, compagnie_motos, compagnie_blindee]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DES WORD BEARERS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 4 améliorations"
  - id: soutien
    titre: FORMATION DE SOUTIEN DES WORD BEARERS
    sous_titre: "Une formation de soutien par Suite des Word Bearers"
    formations: [loge_stigmatus, loge_gigantis, detachement_defilers]
    contraintes:
      - { type: consomme, budget: place_soutien }
      - { type: max_options, valeur: 4 }
      - { type: initiative, valeur: "2+" }
    colonne_options: true
  - id: pool_demoniaque
    titre: POOL DÉMONIAQUE
    sous_titre: "Une formation démoniaque par amélioration de Porte-icône"
    formations: [demon_majeur, demons_mineurs]
    contraintes: [{ type: consomme, budget: place_demons }]
  - id: flotte
    titre: FLOTTE DE GUERRE DU CHAOS
    sous_titre: "SUPPORTS DES WORD BEARERS"
    formations: [escadrille_intercepteurs, escadrille_chasseurs_bombardiers, soutien_orbital]
    contraintes:
      - { type: consomme, budget: rare, quoi: points }
      - { type: initiative, valeur: "2+" }
  - id: titans_renegats
    titre: DEATHWHEEL ET TITANS
    sous_titre: "SUPPORTS DES WORD BEARERS"
    formations: [deathwheel, titan_feral, titan_ravager, titan_banelord]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts valide : Suite en Rhinos, Élus téléportés, Possédés, Loge Stigmatus, deux formations démoniaques et un Titan Feral"
    limite: 3000
    attendu: valide
    formations:
      - formation: suite_word_bearers
        options:
          - { option: personnage_chaos, choix: seigneur }
          - { option: porte_icone }
          - { option: apotre_noir }
          - { option: transports, choix: rhinos, quantite: 4 }
      - formation: suite_elus
        choix: { "0": { elus_terminators_chaos: 6 } }
        options:
          - { option: personnage_chaos, choix: champion }
          - { option: prince_demon, choix: prince_demon_aile }
          - { option: transports_elus, choix: teleportation }
      - formation: suite_possedes
        options: [{ option: autel_devotion }]
      - formation: compagnie_motos
        options:
          - { option: porte_icone }
          - { option: chiens_chaos, quantite: 3 }
      - formation: loge_stigmatus
        choix: { "1": { cultiste: 8, mutant: 3 } }
        options: [{ option: hydre }]
      - { formation: demons_mineurs, variante: huit, choix: { "0": { sanguinaires: 8 } } }
      - { formation: demon_majeur, variante: seul, choix: { "0": { buveur_sang: 1 } } }
      - { formation: titan_feral }
  - nom: "4000 pts valide : deux Suites, Loge Stigmatus et Loge Gigantis en Transports Renégats, Compagnie Blindée"
    limite: 4000
    attendu: valide
    formations:
      - { formation: suite_word_bearers }
      - { formation: suite_word_bearers }
      - formation: loge_stigmatus
        choix: { "1": { cultiste: 11 } }
        options: [{ option: transports_renegats, repartition: { transporteur_terrestre: 4, chimere: 2 } }]
      - formation: loge_gigantis
        choix: { "0": { mutant_geant: 4, ogryn_renegat: 2 } }
        options: [{ option: transports_renegats, repartition: { transporteur_terrestre: 6 } }]
      - formation: compagnie_blindee
        variante: predators
        options:
          - { option: stalker }
          - { option: vehicules_blindee, variante: lr2 }
      - { formation: escadrille_intercepteurs }
  - nom: "formation démoniaque sans amélioration Porte-icône"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_word_bearers }
      - { formation: demons_mineurs, variante: huit, choix: { "0": { incendiaires: 8 } } }
  - nom: "deux Suites de possédés pour une seule Suite des Word Bearers"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_word_bearers }
      - { formation: suite_possedes }
      - { formation: suite_possedes }
  - nom: "Loge Gigantis sans Loge Stigmatus"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_word_bearers }
      - { formation: loge_gigantis, choix: { "0": { mutant_geant: 6 } } }
  - nom: "trois Suites d'Élus Word Bearers"
    limite: 4000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: suite_word_bearers }
      - { formation: suite_elus, choix: { "0": { elus_terminators_chaos: 4 } } }
      - { formation: suite_elus, choix: { "0": { elus_terminators_chaos: 4 } } }
      - { formation: suite_elus, choix: { "0": { elus_terminators_chaos: 4 } } }
  - nom: "Autel du Chaos dans deux détachements"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: suite_word_bearers, options: [{ option: autel_chaos }] }
      - formation: suite_elus
        choix: { "0": { elus_terminators_chaos: 4 } }
        options: [{ option: autel_chaos }]
  - nom: "cinq améliorations sur une Suite des Word Bearers"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: suite_word_bearers
        options:
          - { option: personnage_chaos, choix: champion }
          - { option: porte_icone }
          - { option: apotre_noir }
          - { option: stalker }
          - { option: havocs }
  - nom: "Dreadclaw sur une Suite équipée de Land Raiders"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: suite_word_bearers
        options:
          - { option: land_raiders, variante: deux }
          - { option: transports, choix: dreadclaw }
  - nom: "armée sans Suite des Word Bearers"
    limite: 1000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: compagnie_motos }
  - nom: "supports au-delà du tiers des points"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: suite_word_bearers }
      - { formation: titan_banelord }
