options:
  - id: personnage_chaos
    nom: Personnage du Chaos
    effet:
      type: choix
      parmi:
        - id: seigneur
          nom: Seigneur du Chaos
          cout: 50
          effet: { type: ajouter, unites: [{ unite: seigneur_chaos }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
        - { id: champion, nom: Champion Exalté du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: champion_exalte }] } }
        - { id: sorcier, nom: Sorcier du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: sorcier_chaos }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "(0-1) Ajouter un Seigneur du Chaos (50 pts) ou ajouter un Champion Exalté du Chaos ou ajouter un Sorcier du Chaos (25 pts)"
    note_md: "Un seul Seigneur du Chaos par armée (Commandant Suprême)."
  - id: porte_icone
    nom: Porte-icône
    effet: { type: ajouter, cout: 25, unites: [{ unite: porte_icone }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: fournit, budget: place_demons, quantite: 1 }
    phrase_pdf: "Ajouter un Porte-icône à l'une des unités de la formation"
    note_md: "Une formation du Pool Démoniaque peut être prise pour chaque amélioration Porte-icône de l'armée (règle Invocation de démons)."
  - id: apotre_noir
    nom: Apôtre Noir
    effet: { type: ajouter, cout: 50, unites: [{ unite: apotre_noir }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 personnage d'Apôtre Noir à une unité de la formation"
  - id: prince_demon
    nom: Prince Démon
    effet:
      type: choix
      parmi:
        - id: prince_demon
          nom: Prince Démon
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon, lot: 1, max: 1, cout: 0 }
        - id: prince_demon_aile
          nom: Prince Démon Ailé
          cout: 50
          effet: { type: remplacer, de: [seigneur_chaos, champion_exalte], par: prince_demon_aile, lot: 1, max: 1, cout: 0 }
    contraintes:
      - { type: max_par_armee, valeur: 2 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Remplacer le Seigneur du Chaos ou le Champion Exalté du Chaos et l'unité qu'il accompagne par un Prince Démon (ou un Prince Démon Ailé). S'il remplace le Seigneur du Chaos, il acquiert la capacité Commandant Suprême"
    note_md: "Nécessite un Seigneur du Chaos ou un Champion Exalté du Chaos dans la formation. L'unité que le personnage accompagnait est retirée avec lui. Un Prince Démon peut être inclus dans l'armée pour chaque déité représentée : la limite 0-2 du tableau est appliquée, la correspondance avec les déités reste à la charge des joueurs."
  - id: enfants_chaos
    nom: Enfants du Chaos
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: enfant_chaos }], min: 1, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 3 Enfants du Chaos (25 pts chacun)"
  - id: chiens_chaos
    nom: Chiens du Chaos
    effet: { type: ajouter, cout_par_unite: 15, unites: [{ unite: chien_chaos }], min: 1, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 3 Chiens du Chaos (15 pts chacun)"
  - id: cultistes
    nom: Cultistes
    effet:
      type: choix_multiple
      total: { min: 1, max: 8 }
      parmi:
        - { unite: cultiste, cout: 10 }
        - { unite: mutant, cout: 10 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 8 Cultistes et/ou Mutants (10 pts chacun)"
  - id: transports_renegats
    nom: Transports Renégats
    effet:
      type: choix_multiple
      total: { min: 1, max: besoin_transport }
      parmi:
        - { unite: transporteur_terrestre, cout: 10 }
        - { unite: chimere, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter assez de Transporteurs Terrestres (10 pts chacun) et/ou Chimères (25 pts chacun) pour transporter les infanteries ayant un mouvement inférieur ou égal à 15 cm, sans laisser de places vides"
    note_md: "Les unités transportables sont celles listées dans la note Transport du Transporteur Terrestre et de la Chimère. On ne peut pas prendre plus de véhicules que nécessaire."
  - id: appuis_feu
    nom: Appuis feu
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: appui_feu }], min: 1, max: 4 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 4 unités d'Appui feu à la formation (25 pts chacune)"
  - id: hellhounds
    nom: Hellhounds
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: hellhound }], min: 1, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 3 Hellhounds à la formation (50 pts chacun)"
  - id: hydre
