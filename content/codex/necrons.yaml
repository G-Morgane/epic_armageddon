    formations: [pylone, megalithe, echarde_ctan, titans_aeons]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts valide, deux phalanges et leurs soutiens"
    limite: 3000
    attendu: valide
    formations:
      - formation: phalange_guerriers
        options:
          - { option: guerriers }
          - { option: intendance, quantite: 2 }
          - { option: transports, quantite: 6 }
          - { option: commandant_supreme, choix: seigneur_guerre_necron }
          - { option: gardes, choix: immortels, quantite: 3 }
          - { option: barge_commandement }
      - formation: nuees_canoptek
        options:
          - { option: intendance, quantite: 1 }
          - { option: spectres, quantite: 2 }
      - formation: phalange_immortels
        options:
          - { option: transports, quantite: 4 }
      - formation: destroyers
        choix: { "1": { destroyers: 3, destroyers_lourds: 2 } }
      - { formation: traqueurs }
      - { formation: ancres_necrons }
      - formation: moisson
        choix: { "1": { doom_scythe: 1 } }
      - { formation: pylone }
  - nom: "2000 pts valide, quatre soutiens et une Écharde C'tan"
    limite: 2000
    attendu: valide
    formations:
      - { formation: phalange_guerriers }
      - { formation: nuees_canoptek }
      - { formation: depeceurs, variante: huit }
      - { formation: garde_pretorienne, variante: six }
      - { formation: mecanopteres }
      - { formation: consoles_annihilation }
      - { formation: echarde_ctan, variante: nightbringer }
      - { formation: portail_objectif }
  - nom: "aucune Phalange de Guerriers"
    limite: 1000
    attendu: refusee
    erreur: min_par_armee
    formations:
      - { formation: nuees_canoptek }
      - { formation: phalange_immortels }
  - nom: "trois formations de soutien pour une seule phalange"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: phalange_guerriers }
      - { formation: traqueurs }
      - { formation: mecanopteres }
      - { formation: rodeurs_triarcat }
  - nom: "deux Ancres Nécrons pour une seule Phalange de Guerriers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: phalange_guerriers }
      - { formation: ancres_necrons }
      - { formation: ancres_necrons }
  - nom: "support au-delà du tiers"
    limite: 1000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: phalange_guerriers }
      - { formation: titans_aeons, variante: abattoir }
  - nom: "deux Échardes C'tan"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: phalange_guerriers }
      - { formation: echarde_ctan, variante: deceiver }
      - { formation: echarde_ctan, variante: nightbringer }
  - nom: "plus d'Arches Fantômes que nécessaire"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: phalange_guerriers
        options:
          - { option: transports, quantite: 6 }
