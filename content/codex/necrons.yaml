sections:
  - id: options_necrons
    titre: OPTIONS NÉCRONS
    sous_titre: "Options d'armée achetées en dehors des phalanges"
    formations: [portail_objectif]
  - id: phalanges
    titre: PHALANGES NÉCRONS
    formations: [phalange_guerriers, nuees_canoptek]
    colonne_options: true
    options: [commandant_supreme, guerriers, gardes, transports, intendance, barge_commandement, spectres]
    tableau_options:
      titre: AMÉLIORATIONS NÉCRONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation"
  - id: soutien
    titre: FORMATIONS DE SOUTIEN NÉCRONS
    sous_titre: "Jusqu'à 2 formations de soutien Nécrons par phalange Nécron"
    formations: [phalange_immortels, depeceurs, rodeurs_triarcat, arches_jugement, pylones_sentinelles, consoles_annihilation, destroyers, garde_pretorienne, mecanopteres, traqueurs, ancres_necrons]
    colonne_options: true
    options: [commandant_supreme, transports, intendance, barge_commandement]
    contraintes: [{ type: consomme, budget: soutien }]
  - id: flotte
    titre: FLOTTE NÉCRONS
    sous_titre: "FORMATIONS DE SUPPORT DE L'ARMÉE NÉCRON"
    formations: [moisson, linceul, vaisseau_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
  - id: soutiens_rares
    titre: SOUTIENS RARES
