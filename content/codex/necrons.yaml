options:
  - id: commandant_supreme
    nom: Commandant Suprême
    effet:
      type: choix
      parmi:
        - id: seigneur_guerre_necron
          nom: Seigneur de Guerre Nécron
          cout: 75
          effet: { type: remplacer, de: seigneur_necron, par: seigneur_guerre_necron, lot: 1, max: 1, cout: 0 }
        - id: seigneur_guerre_destroyer
          nom: Seigneur de Guerre Destroyer
          cout: 75
          effet: { type: remplacer, de: seigneur_destroyer, par: seigneur_guerre_destroyer, lot: 1, max: 1, cout: 0 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
    phrase_pdf: "Remplacer une unité de Seigneur Nécron par une unité de Seigneur de Guerre Nécron ou remplacer une unité de Seigneur Destroyer par une unité de Seigneur de Guerre Destroyer"
    note_md: "Un seul Commandant Suprême par armée."
  - id: guerriers
    nom: Guerriers
    effet: { type: ajouter, cout: 125, unites: [{ unite: guerriers_necrons, nombre: 4 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 4 unités de Guerriers Nécrons à la formation"
  - id: gardes
    nom: Gardes
    effet:
      type: choix
      parmi:
        - id: immortels
          nom: Immortels
          cout: 0
          effet: { type: remplacer, de: guerriers_necrons, par: immortels, lot: 1, max: 3, cout: 25 }
        - id: factionnaires
          nom: Factionnaires
          cout: 0
          effet: { type: remplacer, de: guerriers_necrons, par: factionnaires, lot: 1, max: 3, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacez jusqu'à 3 unités de Guerriers Nécrons par des unités d'Immortels ou de Factionnaires (25 pts chacun)"
  - id: transports
    nom: Transports
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: arche_fantome }], min: 1, max: besoin_transport }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter autant d'Arches Fantômes que nécessaire pour transporter toutes les unités de la formation (25 pts chacune)"
  - id: intendance
    nom: Intendance
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: araignee_canoptek }], min: 1, max: 3 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 à 3 unités d'Araignée Canoptek à la formation (50 pts chacune)"
  - id: barge_commandement
    nom: Barge de commandement
    effet:
      type: mot_cle
      texte: "Blindage Renforcé, Sauvegarde Invulnérable"
      cout: 50
