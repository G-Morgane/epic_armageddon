# Nécrons, transcrit depuis le PDF EAFR rev 1.4 (source de vérité).
codex:
  slug: necrons
  armee_id: f51928d4-5c83-4552-bd78-a06a9f4eb239
  nom: Necrons
  version: "1.4"
  faction: xenos
  categorie: armees-xenos
  statut: official
  couleur: "#2f7d3a"
  citation:
    texte: "La mort vient flotter au-dessus de moi, et elle murmure au creux de mon oreille, avec des mots que je ne comprends pas, la promesse de douleurs sans pareilles."
    auteur: Inscription relevée sur les murs de Cthelmax
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une légion nécron basée sur celles de Szarekh, le Roi Silencieux.

    Les légions des nécrons sont organisées autour de grandes formations appelées phalanges, elles-mêmes complétées par des formations d'appui qui leurs sont autonomes.

    Chaque phalange peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par phalange. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion.

    Les formations de support sont des formations autonomes des phalanges. Elles ne peuvent pas recevoir d'améliorations. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Conduits Extra-dimensionnels"
      texte: |
        Les formations de l'armée peuvent relancer leurs jets de téléportation.
    - titre: "Règle spéciale : Avance Inexorable"
      texte: |
        Les formations de l'armée ne peuvent pas accomplir l'action « Redéploiement » mais ont un bonus de +1 sur les jets d'initiative pour accomplir l'action « Regroupement ».
    - titre: "Règle spéciale : Machine-Esprit"
      texte: |
        Les formations ne comportant que des unités bénéficiant de la règle Machine Esprit ne peuvent que contester les objectifs, pas les capturer.
    - titre: "Règle spéciale : Métal Organique"
      texte: |
        Les unités faites de Métal Organique peuvent effectuer une sauvegarde de Blindage Renforcé contre les armes normales, Macro-armes et les Lances : elles peuvent donc effectuer deux sauvegardes lorsqu'elles sont touchées par ces armes. De plus, leur sauvegarde ne peut être réduite par la capacité Sniper. Les attaques Tueur de Titans sont automatiquement réduites à Tueur de Titans (1) lorsqu'elles touchent une unité en Métal Organique, et l'unité en Métal Organique peut effectuer une unique sauvegarde même contre ces attaques.
    - titre: "Règle spéciale : Réanimation Améliorée"
      texte: |
        Les unités bénéficiant de la règle Réanimation Améliorée permettent à toutes les unités de la formation de réussir leurs Sauvegarde Invulnérable sur 5+ plutôt que 6+.
    - titre: "Règle spéciale : Portails Nécrons"
      texte: |
        Seules les unités d'Infanterie et les Araignées Canoptek peuvent utiliser les portails. Ces formations peuvent entrer en jeu depuis la réserve après avoir réussi un test d'activation pour une action autorisant au minimum un mouvement. Mesurez la distance de déplacement depuis l'unité équipée du portail utilisé ou l'objectif.

        Chaque portail ne peut être utilisé qu'une seule fois par tour et ne doit être ni en réserve ni embarqué pour être utilisé. Une formation peut également « entrer » dans un portail et retourner ainsi se placer hors table et ne pourra alors revenir en jeu qu'au travers d'un Portail Nécron.

        Une formation disposant de deux mouvements peut quitter la table depuis un portail pour immédiatement entrer en jeu par un autre portail. Ceci compte comme une utilisation des deux portails pour le tour. Le premier mouvement utilisé pour entrer dans un portail est entièrement consommé.

        Le mouvement de retraite et le mouvement de consolidation sont des mouvements valides pour entrer ou sortir d'un Portail.

        Une formation utilisant le portail d'une formation démoralisée reçoit un pion impact lors de son arrivée en jeu ou de son retour en réserve.

        Le joueur Nécron peut remplacer un marqueur d'objectif dans sa moitié de table par un Portail Nécron Objectif s'il en a fait l'acquisition. Il compte alors à la fois comme un objectif et un Portail Nécron. Il ne peut être ni attaqué, ni détruit.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture : Ashkan Ghanbari."
  valeur_strategique: 1
  initiative:
    defaut: "1+"
    exceptions:
      - { portee: "Vaisseau orbital", valeur: "2+" }

