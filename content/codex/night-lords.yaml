formations:
  # ---- Détachements ----
  - id: suite_night_lords
    nom: Suite de Night Lords
    variantes:
      - id: base
        cout: 250
        composition:
          - { unite: marines_chaos, nombre: 6 }
          - { transports: { unite: rhino_chaos } }
    options: [personnage_chaos, prince_demon, havocs, dreadnoughts, stalker, support_lourd, land_raiders, dreadclaw, atramentars]
    contraintes: [{ type: fournit, budget: specialistes, quantite: 3 }]
    phrase_pdf: "6 unités de Marines du Chaos + l'amélioration Transports"
  - id: suite_elus
    nom: Suite d'Élus Night Lords
    variantes:
      - { id: quatre, nom: 4 unités d'Élus Terminators du Chaos, cout: 200, composition: [{ unite: elus_terminators, nombre: 4 }] }
      - { id: cinq, nom: 5 unités d'Élus Terminators du Chaos, cout: 250, composition: [{ unite: elus_terminators, nombre: 5 }] }
      - { id: six, nom: 6 unités d'Élus Terminators du Chaos, cout: 300, composition: [{ unite: elus_terminators, nombre: 6 }] }
    options: [personnage_chaos, prince_demon, teleportation, dreadnoughts, stalker, support_lourd, land_raiders, atramentars]
    contraintes: [{ type: max_par_armee, valeur: 2 }]
    phrase_pdf: "0-2 Suite d'Élus Night Lords : 4 à 6 unités d'Élus Terminators du Chaos (50 pts chacun)"
  - id: suite_raptors
    nom: Suite de Raptors
    variantes:
      - { id: base, cout: 200, composition: [{ unite: raptors, nombre: 6 }] }
    options: [personnage_chaos_gratuit, prince_demon, atramentars]
    contraintes: [{ type: min_par_armee, valeur: 1 }]
    phrase_pdf: "1+ Suite de Raptors : 6 unités de Raptors + gratuitement l'amélioration Personnage du Chaos"
  - id: compagnie_motos
    nom: Compagnie de Motos du Chaos
    variantes:
      - { id: base, cout: 200, composition: [{ unite: motos_chaos, nombre: 6 }] }
    options: [personnage_chaos_gratuit, atramentars]
