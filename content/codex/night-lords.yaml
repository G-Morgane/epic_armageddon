# Night Lords, transcrit depuis le PDF expérimental EAFR rev 1.0 (source de vérité).
codex:
  slug: night-lords
  armee_id: 86734e23-5c2a-4a26-84e7-771fdb6db342
  nom: Night Lords
  version: "0.1"
  faction: chaos
  categorie: armees-du-chaos
  statut: experimental
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/night-lords.jpg
  citation:
    texte: "Nous avons reçu votre offre votre reddition et nous l'avons rejetée ; nous ne sommes pas venus pour entendre vos supplications mais pour rendre jugement. Le temps de la reddition est depuis longtemps passé. Le verdict est à la mesure de vos actes. Maintenant votre heure est venue."
    auteur: Vox-communication de la flotte Night Lords lors de la pacification de Listrantia IV
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée des Night Lords basée sur les forces de Tarraq Darkblood lors de la XIIIème Croisade Noire d'Abaddon le Fléau. Cette liste peut également être utilisée pour représenter n'importe quel autre chapitre Space Marine du Chaos Universel comme les Red Corsairs ou les Sons of Malice.

    Les armées des Night Lords sont organisées en formations appelées détachements ou détachements de spécialistes.

    Chaque détachement et détachement de spécialistes peut recevoir des améliorations. La liste d'armée indique pour chaque détachement quelle amélioration est autorisée. Chaque amélioration autorisée ne peut être prise qu'une fois par détachement pour un maximum de quatre par détachement. Les améliorations font partie intégrante des détachements et doivent respecter les règles de cohésion. Noter que certaines améliorations remplacent des unités d'un détachement tandis que d'autres ajoutent des unités supplémentaires.

    Les formations de Soutien Titaniques des Légions Renégates et de la Flotte de Guerre du Chaos sont des formations autonomes des détachements. Un maximum d'1/3 des points de l'armée peuvent être dépensés pour ces formations.

    La mention Space Marines du Chaos indiquée dans les notes des unités ayant la capacité "Transport" englobe les unités Space Marines du Chaos, Havocs, Terror Squads et Forlorn Hopes.
  regles_md:
    - titre: "Règle spéciale : Atramentars (50 pts)"
      texte: |
        0-2 Détachements Night Lords peuvent être transformés en Atramentars.

        Pour la résolution de combat des assauts des Atramentars, les formations ennemies comptent comme ayant un pion impact de plus qu'elles ne possèdent réellement.

        De plus, les formations ennemies en position de soutien de formations alliées ayant perdu un assaut initié par des Atramentars prennent 2 pions impacts au lieu de 1.

        Les Atramentars sont l'élite des Night Lords et agissent seuls, ils ne peuvent pas participer à des assauts combinés des formations ayant la note Commandant ou Commandant Suprême.
    - titre: "Règle spéciale : Capitaine du Kyroptera"
      texte: |
        0-7 Capitaines du Kyroptera peuvent être recrutés dans une armée de Night Lords.
    - titre: "Règle spéciale : Modules d'atterrissage Dreadclaw"
      texte: |
        Une formation se déployant par Assaut Planétaire et pouvant être transportée par Modules d'atterrissage Dreadclaw le fait selon les règles spéciales suivantes : placez un marqueur de Module d'atterrissage en utilisant les règles d'Assaut Planétaire (4.3 et 4.4 du Livre de Règles). Un Vaisseau en orbite sera nécessaire pour déployer les Modules d'atterrissage.

        Le Module d'atterrissage est un marqueur comptant comme la première unité de la formation au moment de déterminer son emplacement d'arrivée en Assaut Planétaire. Une fois le marqueur placé, résolvez son attaque de tir sur toutes les unités ennemies à moins de 15 cm de son centre. Chaque formation ennemie attaquée reçoit un Pion Impact selon les règles normales de tir.

        Ensuite, débarquez les troupes transportées dans le Module d'atterrissage complètement à moins de 15 cm du centre de celui-ci, en cohésion et en dehors de toute zone de contrôle ennemie. Si les unités ne peuvent débarquer en totalité, les unités restantes seront détruites sans attribution de pions d'impacts.

        Le Module d'atterrissage n'étant pas une unité mais un marqueur, il ne possède pas de zone de contrôle et il ne compte pas pour la cohérence de la formation. De plus, il ne peut pas être utilisé pour revendiquer un feu croisé ainsi que pour tenir ou contester des objectifs.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture LJ Koh."
  valeur_strategique: 4
  initiative:
    defaut: "1+"
    exceptions:
      - { portee: "Flotte de Guerre du Chaos", valeur: "2+" }

