      cd: 6
      bi: 4
      critique: "Le réacteur à plasma se fissure. Lancez 1D6 durant la phase finale de chaque tour pour chaque fissure : 1, le réacteur explose et toute unité dans un rayon de 5cm subit une touche sur 5+ ; 2-3, le titan subit 1 point de dommages supplémentaire ; 4-6, la fissure est réparée."
  - id: banelord
    nom: Titan Banelord
    type: EG
    vitesse: 15cm
    blindage: "4+"
    cc: "2+"
    ff: "4+"
    armes:
      - { nom: Rack de Missiles Havoc, portee: 60cm, puissance: "6x2PB, Ind, Uniq, IC, FrtF" }
      - { nom: Canon Hellstrike, portee: 60cm, puissance: "3PB, MA, IC, Frt" }
      - { nom: Poing de Combat Apocalypse, portee: 30cm, puissance: "4xAP4+/AC4+, Frt" }
      - { nom: "", portee: (contact), puissance: "Arme d'Assaut, +2A, TT (D3)" }
      - { nom: Tête de Bataille, portee: (15cm), puissance: "Arme Légère, +2A, FrtF" }
    notes: [Blindage Renforcé, Blindage Arrière Renforcé, Marcheur, Sans Peur, "Peut passer au-dessus d'unités et de terrains infranchissables ou dangereux moins hauts que les genoux du titan et de 2cm de large maximum."]
    degats:
      cd: 8
      bi: 6
      critique: "Le réacteur à plasma se fissure. Lancez 1D6 durant la phase finale de chaque tour pour chaque fissure : 1, le réacteur explose et toute unité dans un rayon de 5cm subit une touche sur 5+ ; 2-3, le Banelord entre dans une rage démoniaque et bouge immédiatement de 3D6cm dans une direction aléatoire (s'il percute un terrain infranchissable ou une unité qu'il ne peut pousser, il s'arrête et subit un point de dommages supplémentaire, les unités qu'il percute subissent une touche sur un résultat de 4+) ; 4-6, la fissure est réparée."

options:
  - id: personnage_chaos
    nom: Personnage du Chaos
    effet:
      type: choix
      parmi:
        - id: seigneur
          nom: Seigneur du Chaos
          cout: 50
          effet: { type: ajouter, unites: [{ unite: seigneur_chaos }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
        - { id: champion, nom: Champion Exalté du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: champion_exalte }] } }
        - { id: sorcier, nom: Sorcier du Chaos, cout: 25, effet: { type: ajouter, unites: [{ unite: sorcier_chaos }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "(0-1) Ajouter un Seigneur du Chaos (50 pts) ou ajouter un Champion Exalté du Chaos ou un Sorcier du Chaos (25 pts)"
  - id: personnage_chaos_gratuit
    nom: Personnage du Chaos (gratuit)
    effet:
      type: choix
      parmi:
        - id: seigneur
          nom: Seigneur du Chaos
          cout: 0
          effet: { type: ajouter, unites: [{ unite: seigneur_chaos }] }
          contraintes: [{ type: max_par_armee, valeur: 1 }]
        - { id: champion, nom: Champion Exalté du Chaos, cout: 0, effet: { type: ajouter, unites: [{ unite: champion_exalte }] } }
        - { id: sorcier, nom: Sorcier du Chaos, cout: 0, effet: { type: ajouter, unites: [{ unite: sorcier_chaos }] } }
    contraintes: [{ type: max_par_formation, valeur: 1 }, { type: hors_quota_options }, { type: obligatoire }]
    phrase_pdf: "L'amélioration Personnage du Chaos, gratuitement"
  - id: prince_demon
