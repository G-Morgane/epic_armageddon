  # ---- Détachements de spécialistes ----
  - id: terror_squad
    nom: Terror Squad
    variantes:
      - { id: base, cout: 250, composition: [{ unite: terror_squad, nombre: 6 }] }
    options: [personnage_chaos_gratuit, prince_demon, havocs, dreadnoughts, stalker, support_lourd, land_raiders]
    phrase_pdf: "6 unités de Terror Squad + gratuitement l'amélioration Personnage du Chaos"
  - id: forlorn_hopes
    nom: Forlorn Hopes
    variantes:
      - id: base
        cout: 150
        composition:
          - { unite: forlorn_hope, nombre: 4 }
          - { unite: rhino_chaos, nombre: 2 }
    options: []
  - id: suite_warp_talons
    nom: Suite de Warp Talons
    variantes:
      - { id: base, cout: 300, composition: [{ unite: warp_talons, nombre: 6 }] }
    options: [personnage_chaos, prince_demon, teleportation]

  # ---- Supports ----
  - id: escadrille_intercepteurs
    nom: Escadrille d'Intercepteurs
    variantes:
      - { id: base, cout: 200, composition: [{ unite: hellblade, nombre: 3 }] }
  - id: escadrille_chasseurs_bombardiers
    nom: Escadrille de Chasseurs-Bombardiers
    variantes:
      - { id: base, cout: 225, composition: [{ unite: helltalon, nombre: 2 }] }
  - id: soutien_orbital
    nom: Soutien Orbital
    variantes:
      - { id: devastation, nom: 1 Croiseur Devastation, cout: 200, composition: [{ unite: croiseur_devastation, nombre: 1 }] }
      - { id: despoiler, nom: 1 Cuirassé Despoiler, cout: 250, composition: [{ unite: cuirasse_despoiler, nombre: 1 }] }
    contraintes: [{ type: pas_une_activation }]
  - id: titan_feral
    nom: Titan Feral
    variantes:
      - { id: base, cout: 300, composition: [{ unite: feral, nombre: 1 }] }
  - id: titan_ravager
    nom: Titan Ravager
    variantes:
      - { id: base, cout: 650, composition: [{ unite: ravager, nombre: 1 }] }
  - id: titan_banelord
    nom: Titan Banelord
    variantes:
      - { id: base, cout: 850, composition: [{ unite: banelord, nombre: 1 }] }

sections:
  - id: detachements
    titre: DÉTACHEMENTS DES NIGHT LORDS
    formations: [suite_night_lords, suite_elus, suite_raptors, compagnie_motos]
    contraintes: [{ type: max_options, valeur: 4 }]
    colonne_options: true
    tableau_options:
      titre: AMÉLIORATIONS DES NIGHT LORDS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par détachement et chaque détachement peut recevoir au plus 4 améliorations"
    options: [personnage_chaos, prince_demon, transports, land_raiders, support_lourd, stalker, havocs, dreadnoughts, teleportation]
  - id: specialistes
    titre: DÉTACHEMENTS DE SPÉCIALISTES DES NIGHT LORDS
    sous_titre: "Jusqu'à 3 détachements de spécialistes différents par Suite de Night Lords"
    formations: [terror_squad, forlorn_hopes, suite_warp_talons]
    contraintes: [{ type: consomme, budget: specialistes }, { type: max_options, valeur: 4 }]
    colonne_options: true
  - id: flotte
    titre: FLOTTE DE GUERRE DU CHAOS
    sous_titre: "SUPPORTS NIGHT LORDS"
    formations: [escadrille_intercepteurs, escadrille_chasseurs_bombardiers, soutien_orbital]
    contraintes: [{ type: consomme, budget: rare, quoi: points }, { type: initiative, valeur: "2+" }]
  - id: titanicus
    titre: SOUTIEN TITANIQUE DES LÉGIONS RENÉGATES
    sous_titre: "SUPPORTS NIGHT LORDS"
    formations: [titan_feral, titan_ravager, titan_banelord]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

