# Paras Élysiens, transcrit depuis le PDF EAFR rev 1.1.2 (source de vérité).
codex:
  slug: paras-elysiens
  armee_id: 1e85b8e6-a422-4eaf-ae34-99f6d832d24b
  logo: /icons/paras_elysiens.svg
  nom: Paras Élysiens
  version: "1.1.2"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/paras-elysiens.jpg
  citation:
    texte: "Les commandants ennemis se croient à l'abri de la colère de l'Empereur derrière des kilomètres de fortifications et de légions de guerriers. Ils n'ont pas tenu compte de nous. Faites la paix avec l'Empereur, messieurs, on arrive dans deux minutes."
    auteur: Colonelle Johanna van Meer, 13ème Élysien
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied un régiment aéroporté de l'Astra Militarum basée sur le 23ème Para Élysien lors de la campagne de Taros. Cette liste peut également être utilisée pour représenter d'autres compagnies des Paras Élysiens ou des régiments aéroportés de la Garde Impériale d'autres origines comme ceux de Vanaheim.

    Les armées de l'Astra Militarum sont organisées autour de grandes formations appelées compagnies, elles-mêmes complétées par des formations d'appui et des formations de support qui leurs sont autonomes.

    Chaque compagnie peut choisir des améliorations. Chaque amélioration ne peut être prise qu'une fois par compagnie. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion. Chaque compagnie peut prendre jusqu'à trois améliorations.

    Les formations d'appui ne peuvent en principe pas recevoir d'améliorations, sauf celles indiquées en italique pour chacune de leurs formations.

    Les formations de support sont des formations autonomes des compagnies. Elles ne peuvent pas recevoir d'améliorations. Un maximum de ⅓ des points peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : Commissaires"
      texte: |
        Pour chaque Compagnie qu'inclut votre armée, un commissaire y est automatiquement intégré.

        De plus, vous pouvez ajouter gratuitement un commissaire dans une Formation d'Appui pour chaque tranche (même incomplète) de 1 000 points dans votre armée.

        Une compagnie ou une formation ne peut avoir qu'un seul commissaire.
    - titre: "Règle spéciale : Insertion par Grav-Chute"
      texte: |
        Les Paras Élysiens ont pour spécialité une utilisation intensive et exclusive de Valkyries pour transporter leurs fantassins. Le combat débarqué depuis les airs par grav-chute est une seconde nature pour ce régiment.

        Toutes les unités des Paras Élysiens peuvent être placées jusqu'à 15cm de leur transport lorsqu'elles débarquent.

        Les Paras Élysiens sont des troupes d'élite généralement conservées en réserve jusqu'au moment opportun. Aucun commandant impérial ne se risquerait à gaspiller leur potentiel en les assignant à des missions statiques ou d'importance secondaire.

        Seules les formations de Tarentules, Tauros, Vétérans et Vultures peuvent être déployées en garnison.
    - titre: "Règle spéciale : Assaut Planétaire"
      texte: |
        Si l'armée comprend une Frégate Claymore, toutes les Valkyries (tous types) et tous les Vultures (tous types) d'une formation peuvent gagner la note « Assaut Planétaire » pour 25 pts. Ceci permet à la formation d'être transporté par la Frégate Claymore (dans la limite des places disponibles) et de réaliser un assaut planétaire selon la règle spéciale suivante :

        Placez une première Valkyrie/Vulture en utilisant les règles d'Assaut Planétaire (4.3 et 4.4 du Livre de Règles).

        Ensuite, placez les autres Valkyries et Vultures (ceci peut déclencher un tir d'État d'Alerte normalement) complètement à moins de 15 cm de la première, en cohésion et en dehors de toute zone de contrôle ennemie.

        Si les unités ne peuvent pas se déployer en totalité en respectant les règles ci-dessus, les unités restantes seront détruites sans attribution de pion impact.

        Si plusieurs formations font un Assaut Planétaire, placez une Valkyrie/Vulture pour chaque formation concernée aux coordonnées prédéterminées en utilisant les règles d'Assaut Planétaire (y compris la résolution de dispersion). Puis déployez toutes les formations transportées, en suivant les règles ci-dessus.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustrations : Fantasy Flight Games, Marcin Jakubowski https://www.mjakubowski.art (couverture) et GW LTD (corps)."
  valeur_strategique: 3
  initiative:
    defaut: "2+"

