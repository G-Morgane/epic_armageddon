options:
  # ---- Améliorations de compagnie ----
  - id: amelioration_infanterie
    nom: Infanterie
    effet: { type: ajouter, cout: 200, unites: [{ unite: paras_elysiens, nombre: 6 }, { unite: valkyrie, nombre: 3 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 6 unités de Paras Élysiens et 3 Valkyries à la formation"
  - id: amelioration_appui_feu
    nom: Appui-feu
    effet: { type: ajouter, cout: 75, unites: [{ unite: appui_feu, nombre: 2 }, { unite: valkyrie, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 2 unités d'Appui-Feu et 1 Valkyrie à la formation"
  - id: vendetta
    nom: Vendetta
    effet: { type: remplacer, de: valkyrie, par: valkyrie_vendetta, lot: 2, max: 1, cout: 50 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: requiert_unite, unites: [valkyrie] }
    phrase_pdf: "Remplacer 2 Valkyries par autant de Valkyries Vendetta"
  - id: amelioration_vultures
    nom: Vultures
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: punisher, nom: 2 Vultures Punisher, cout: 75, unites: [{ unite: vulture_punisher, nombre: 2 }] }
        - { id: vultures, nom: 2 Vultures, cout: 100, unites: [{ unite: vulture, nombre: 2 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]

  # ---- Améliorations propres à certaines formations d'appui ----
  - id: teleportation
    nom: Téléportation
    effet: { type: mot_cle, texte: Téléportation, cout: 50 }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: exclusif, groupe: mobilite }
    phrase_pdf: "Ajouter la note « Téléportation » à toutes les unités"
  - id: renfort_sentinelles
    nom: Sentinelles supplémentaires
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: aeroportees, nom: 2 Sentinelles Aéroportées, cout: 50, unites: [{ unite: sentinelle_aeroportee, nombre: 2 }] }
        - { id: soutien, nom: 2 Sentinelles de Soutien, cout: 75, unites: [{ unite: sentinelle_soutien, nombre: 2 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "Ajouter 2 Sentinelles Aéroportées ou de Soutien"
  - id: sky_talons_sentinelles
    nom: Valkyries Sky Talon
    effet: { type: ajouter, cout_par_unite: 25, unites: [{ unite: valkyrie_sky_talon }], min: 1, max: besoin_transport }
    contraintes:
      - { type: hors_quota_options }
      - { type: exclusif, groupe: mobilite }
    phrase_pdf: "Ajouter autant de Valkyrie Sky Talons que nécessaire pour transporter toutes les unités de la formation"
  - id: valkyries_tempestus
    nom: Valkyries
    effet: { type: ajouter, cout: 150, unites: [{ unite: valkyrie, nombre: 4 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: exclusif, groupe: mobilite }
    phrase_pdf: "Ajouter autant de Valkyries que nécessaire pour transporter toutes les unités de la formation"
    note_md: "8 Tempestus Scions nécessitent 4 Valkyries."
  - id: valkyries_appui_feu
    nom: Valkyries
    effet: { type: ajouter, cout: 100, unites: [{ unite: valkyrie, nombre: 3 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "Ajouter autant de Valkyries que nécessaire pour transporter toutes les unités de la formation"
    note_md: "6 unités d'Appui-Feu ou de Mortiers nécessitent 3 Valkyries."
  - id: renfort_vultures
    nom: Vultures supplémentaires
    effet:
      type: ajouter
      unites: []
      variantes:
        - { id: vultures, nom: 2 Vultures, cout: 100, unites: [{ unite: vulture, nombre: 2 }] }
        - { id: punisher, nom: 2 Vultures Punisher, cout: 75, unites: [{ unite: vulture_punisher, nombre: 2 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }

  # ---- Assaut planétaire ----
  - id: assaut_planetaire
    nom: Assaut Planétaire
    effet:
      type: mot_cle
      texte: Assaut Planétaire
      cout: 25
      cible: [valkyrie, valkyrie_vendetta, valkyrie_sky_talon, vulture, vulture_punisher]
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: requiert_unite, unites: [valkyrie, valkyrie_vendetta, valkyrie_sky_talon, vulture, vulture_punisher] }
    note_md: "Uniquement si l'armée comprend une Frégate Claymore. Toutes les Valkyries (tous types) et tous les Vultures (tous types) de la formation gagnent la note « Assaut Planétaire »."

  # ---- Commissaire gratuit ----
  - id: commissaire_appui
    nom: Commissaire
    effet: { type: ajouter, cout: 0, unites: [{ unite: commissaire, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: consomme, budget: commissaires_gratuits }

formations:
  # ---- Compagnies ----
  - id: qg_regimentaire
    nom: QG Régimentaire
    variantes:
      - id: base
        cout: 350
        composition:
          - { unite: quartier_general, nombre: 1 }
          - { unite: paras_elysiens, nombre: 7 }
          - { unite: valkyrie, nombre: 4 }
          - { unite: commissaire, nombre: 1, implicite: true }
    contraintes: [{ type: max_par_armee, valeur: 1 }]
    options_plus: [assaut_planetaire]
  - id: compagnie_infanterie
    nom: Compagnie d'Infanterie
    variantes:
      - id: base
        cout: 300
        composition:
          - { unite: commandement, nombre: 1 }
          - { unite: paras_elysiens, nombre: 7 }
          - { unite: valkyrie, nombre: 4 }
          - { unite: commissaire, nombre: 1, implicite: true }
    options_plus: [assaut_planetaire]

  # ---- Formations d'appui ----
  - id: tarentules
    nom: Tarentules
    variantes:
      - { id: base, cout: 150, composition: [{ unite: tarentule, nombre: 6 }] }
    options_plus: [teleportation]
  - id: escadron_sentinelles
    nom: Escadron de Sentinelles
    variantes:
      - { id: aeroportees, nom: 4 Sentinelles Aéroportées, cout: 125, composition: [{ unite: sentinelle_aeroportee, nombre: 4 }] }
      - { id: soutien, nom: 4 Sentinelles de Soutien, cout: 150, composition: [{ unite: sentinelle_soutien, nombre: 4 }] }
    options_plus: [renfort_sentinelles, teleportation, sky_talons_sentinelles, assaut_planetaire]
  - id: peloton_veterans
    nom: Peloton de Vétérans
    variantes:
      - { id: saboteurs, nom: 6 Vétérans (Saboteurs), cout: 200, composition: [{ unite: veterans_saboteurs, nombre: 6 }] }
      - { id: snipers, nom: 6 Vétérans (Snipers), cout: 200, composition: [{ unite: veterans_snipers, nombre: 6 }] }
