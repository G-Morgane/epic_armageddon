sections:
  - id: compagnies
    titre: COMPAGNIES DES PARAS ÉLYSIENS
    formations: [qg_regimentaire, compagnie_infanterie]
    contraintes:
      - { type: max_options, valeur: 3 }
      - { type: fournit, budget: slot_appui, quantite: 2 }
    options: [amelioration_infanterie, amelioration_appui_feu, vendetta, amelioration_vultures]
    tableau_options:
      titre: AMÉLIORATIONS DES PARAS ÉLYSIENS
      sous_titre: "Jusqu'à 3 améliorations différentes par Compagnie"
  - id: appui
    titre: FORMATIONS D'APPUI DES PARAS ÉLYSIENS
    sous_titre: "Jusqu'à 2 formations d'appui par Compagnie"
    contraintes: [{ type: consomme, budget: slot_appui }]
    options: [commissaire_appui]
    formations: [tarentules, escadron_sentinelles, peloton_veterans, militarum_tempestus, peloton_appui_feu, escadron_tauros, escadrille_vultures, escadrille_vultures_punisher]
  - id: supports
    titre: SUPPORTS DES PARAS ÉLYSIENS
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
    contraintes: [{ type: consomme, budget: rare, quoi: points }]
    formations: [escadrille_lightning, escadrille_bomber, escadrille_destroyer, soutien_orbital]

listes_test:
  - nom: "3000 pts valide : QG, compagnie, quatre appuis et un soutien orbital"
    limite: 3000
    attendu: valide
    formations:
      - formation: qg_regimentaire
        options:
          - { option: amelioration_infanterie }
          - { option: amelioration_vultures, variante: punisher }
      - formation: compagnie_infanterie
        options: [{ option: vendetta }]
      - formation: escadron_sentinelles
        variante: aeroportees
        options:
          - { option: renfort_sentinelles, variante: aeroportees }
          - { option: sky_talons_sentinelles, quantite: 3 }
      - formation: militarum_tempestus
        options:
          - { option: valkyries_tempestus }
          - { option: vendetta }
          - { option: commissaire_appui }
      - formation: escadrille_vultures
        options: [{ option: assaut_planetaire }]
      - formation: escadron_tauros
        choix: { "0": { tauros: 3, tauros_venator: 3 } }
      - { formation: soutien_orbital, variante: claymore }
  - nom: "2000 pts valide : compagnie améliorée, deux appuis téléportés et une escadrille"
    limite: 2000
    attendu: valide
    formations:
      - formation: compagnie_infanterie
        options:
          - { option: amelioration_infanterie }
          - { option: amelioration_appui_feu }
          - { option: vendetta }
      - formation: tarentules
        options: [{ option: teleportation }]
      - formation: peloton_veterans
        variante: snipers
        options: [{ option: teleportation }]
      - { formation: escadrille_lightning, variante: deux }
  - nom: "quatre améliorations sur une compagnie"
    limite: 3000
    attendu: refusee
    erreur: max_options
    formations:
      - formation: compagnie_infanterie
        options:
          - { option: amelioration_infanterie }
          - { option: amelioration_appui_feu }
          - { option: vendetta }
          - { option: amelioration_vultures, variante: vultures }
  - nom: "trois formations d'appui pour une seule compagnie"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: tarentules }
      - { formation: escadron_tauros, choix: { "0": { tauros: 6 } } }
      - { formation: peloton_veterans, variante: saboteurs }
  - nom: "deux Escadrilles de Vultures Punisher"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: qg_regimentaire }
      - { formation: compagnie_infanterie }
      - { formation: escadrille_vultures_punisher }
      - { formation: escadrille_vultures_punisher }
  - nom: "supports au-delà du tiers"
    limite: 2000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: escadrille_destroyer }
      - { formation: escadrille_bomber }
      - { formation: soutien_orbital, variante: emperor }
  - nom: "quota de commissaires gratuits dépassé"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: compagnie_infanterie }
      - { formation: tarentules, options: [{ option: commissaire_appui }] }
      - { formation: peloton_veterans, variante: snipers, options: [{ option: commissaire_appui }] }
  - nom: "Téléportation et Sky Talons sur le même Escadron de Sentinelles"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - { formation: compagnie_infanterie }
      - formation: escadron_sentinelles
        variante: aeroportees
        options:
          - { option: teleportation }
          - { option: sky_talons_sentinelles, quantite: 2 }
  - nom: "plus de Sky Talons que nécessaire"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - { formation: compagnie_infanterie }
      - formation: escadron_sentinelles
        variante: aeroportees
        options: [{ option: sky_talons_sentinelles, quantite: 3 }]
