# Evil Sunz, transcrit depuis le PDF EAFR rev 1.0.1 (source de vérité).
codex:
  slug: evil-sunz
  armee_id: ed1d8015-f59c-44ed-9299-21cc30abf6f3
  nom: Evil Sunz
  version: "1.0.1"
  faction: xenos
  categorie: armees-xenos
  statut: official
  citation:
    texte: "LES ROUJ' VON PLU VITE !"
    auteur: Sagesse Evil Sunz
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied une WAAAGH! d'Orks basée sur le Klan Evil Sunz.

    Les armées des Orks sont organisées autour de grandes formations appelées bandes, qui peuvent s'acheter selon 3 tailles, la bande normale, la mastok (doubler l'effectif de départ) ou la tré mastok (tripler l'effectif de départ). Pour chaque bande de guerre vous pouvez prendre jusqu'à deux formations issues des truk'en'plus.

    Chaque bande et truk'en'plus peut recevoir des kust'oms. La liste d'armée indique pour chaque catégorie de bande et truk'en'plus quels kust'oms sont autorisés. Chaque kust'om autorisé peut être pris un nombre illimité de fois, sauf s'il est fait état d'une limitation de kust'om. Pour les bandes, les limitations de kust'om sont multipliées de la même façon que l'effectif de départ, ainsi si un Kulte d'la Vitesse normal ne peut accueillir qu'un Brikolo supplémentaire, un Kulte d'la Vitesse tré mastok peut en inclure jusqu'à 3. Les kust'oms font partie intégrante des bandes et doivent en respecter la cohésion.

    Les truk'eud'meks sont des formations autonomes des bandes. Un maximum de ⅓ des points de l'armée peuvent être dépensés pour ces formations.

    Les armées du Klan Evil Sunz ont une valeur stratégique de 4 au premier tour, et de 3 aux tours suivants. Toutes les formations Evil Sunz ont une initiative de 3+ mais reçoivent des modificateurs en fonction des actions choisies lorsqu'elles effectuent un test d'action (Pouvoir de la Waaagh!) ou de leur taille lorsqu'elles tentent de se rallier (R'mise en bande).
  regles_md:
    - titre: "Règle spéciale : R'mise en bande"
      texte: |
        Lorsque les bandes Orks tentent un test de ralliement, ils reçoivent un bonus de +1 lorsqu'ils sont plus de 5 et de +2 lorsqu'ils sont plus de 10. Les engins de guerre faisant partie de ces bandes comptent pour autant d'unités que leur capacité de dommage de départ. Les Gretchins ne sont pas comptabilisables dans le calcul.
    - titre: "Règle spéciale : Speedwaaagh!"
      texte: |
        Chaque armée Evil Sunz doit inclure une unité de commandant suprême appelée Big Bad Biker Boss. Cette unité coûte 50pts et peut rejoindre n'importe quelle formation.

        Le Big Bad Biker Boss donne à sa formation l'amélioration Speedwaaagh!. Cette formation bénéficie d'un bonus de +2 à l'initiative pour les redéploiements, et les unités de la formation (hors infanterie non montée) gagnent un bonus de +5cm à leur caractéristique de mouvement.
    - titre: "Règle spéciale : Pouvoir de la Waaagh!"
      texte: |
        Les Orks ne sont pas de fins stratèges mais la perspective d'une bonne bagarre les galvanise toujours. Afin de représenter ceci, une formation tentant une action d'Avance Rapide ou d'Assaut reçoit +2 à l'initiative pour son test d'action.

        Les formations aériennes ont +2 de bonus pour les tests d'actions lorsqu'elles tentent une Interception ou une Attaque au sol.
    - titre: "Règle spéciale : Champ énergétique"
      texte: |
        Certains engins de guerre Orks possèdent des champs énergétiques. Le nombre dont en dispose chaque engin est indiqué sur sa fiche d'unité. Les champs énergétiques fonctionnent de la même manière que ceux des impériaux, à la différence qu'une fois abattus, ils ne sont pas réparables et restent donc inactifs jusqu'à la fin de la bataille.
    - titre: "Règle spéciale : Le Rouj' va plus vite !"
      texte: |
        Le Klan Evil Sunz conçoit la guerre comme une course de buggys. L'important est d'aller vite, et de taper fort.

        Toutes les unités Evil Sunz doivent avoir soit un mouvement de 30cm minimum, soit être intégralement transportées par des transports de leur formation.
    - titre: "Règle spéciale : Atelier Mekboy"
      texte: |
        Le Klan Evil Sunz est le terrain de jeu rêvé pour les Mekboyz Orks. Les Kults de la Vitesse sont toujours prêts à expérimenter les dernières inventions des Brikolos, y compris jusqu'à la dernière minute.

        Jusqu'à deux formations de MotoKross peuvent être déployées en garnison, selon les règles normales de garnison (elles ne gagnent PAS la règle éclaireur).
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Alex Boyd."
  valeur_strategique: "4 au premier tour, 3 aux tours suivants"
  initiative:
    defaut: "3+"
    exceptions: []

budgets:
  - id: truk_en_plus
