    variantes:
      - { id: base, cout: 275, composition: [{ unite: frelon, nombre: 5 }] }
    options: [portail, avatar]
    contraintes: [{ type: consomme, budget: support }]

  # ---- Formations de support lourd ----
  - id: croiseur_eldar
    nom: Croiseur Eldar
    variantes:
      - { id: fantome, nom: 1 Vaisseau Fantôme, cout: 150, composition: [{ unite: vaisseau_fantome, nombre: 1 }] }
      - { id: dragon, nom: 1 Vaisseau Dragon, cout: 300, composition: [{ unite: vaisseau_dragon, nombre: 1 }] }
    contraintes: [{ type: max_par_armee, valeur: 1 }, { type: pas_une_activation }]
    phrase_pdf: "0-1 Croiseur Eldar"
  - id: escadrille_nightwing
    nom: Escadrille Nightwing
    variantes:
      - { id: deux, nom: 2 Nightwings, cout: 200, composition: [{ unite: nightwing, nombre: 2 }] }
      - { id: trois, nom: 3 Nightwings, cout: 300, composition: [{ unite: nightwing, nombre: 3 }] }
    phrase_pdf: "2 ou 3 Nightwings (100 pts chacun)"
  - id: escadrille_phoenix
    nom: Escadrille Phœnix
    variantes:
      - { id: base, cout: 250, composition: [{ unite: phoenix, nombre: 2 }] }
  - id: vampire
    nom: Vampire
    variantes:
      - { id: base, cout: 200, composition: [{ unite: vampire_hunter, nombre: 1 }] }
  - id: machine_vaul
    nom: Machine de Vaul
    variantes:
      - { id: cobra, nom: 1 Cobra, cout: 250, composition: [{ unite: cobra, nombre: 1 }] }
      - { id: scorpion, nom: 1 Scorpion, cout: 250, composition: [{ unite: scorpion_vaul, nombre: 1 }] }
  - id: titan_revenant
    nom: Titan Revenant
    variantes:
      - { id: base, cout: 650, composition: [{ unite: titan_revenant, nombre: 2 }] }
    phrase_pdf: "2 Titan Revenant"
  - id: titan_fantome
    nom: Titan Fantôme
    variantes:
      - { id: base, cout: 750, composition: [{ unite: titan_fantome, nombre: 1 }] }
  - id: escadron_chevaliers
    nom: Escadron de Chevaliers
    variantes:
      - { id: base, cout: 300, composition: [{ unite: chevalier_sabre, nombre: 3 }] }

sections:
  - id: principales
    titre: FORMATIONS PRINCIPALES
    formations: [ost_wild_riders, ost_guerriers_aspects]
    colonne_options: true
    tableau_options:
      titre: OPTIONS ET AMÉLIORATIONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une fois par formation"
    options: [portail, avatar, chef_clan, wild_riders_vypers, frelons, exarque, falcons, plateformes, firestorm, firestorms_remplacement]
  - id: support
    titre: FORMATIONS DE SUPPORT
    sous_titre: "Jusqu'à 3 formations de Support par Ost de Guerre"
    formations: [peloton_aspects_embarques, peloton_gardiens, peloton_rangers, escadron_bouclier_vaul, escadron_lame_vaul, escadron_storm_serpent, escadron_frelons]
    colonne_options: true
  - id: support_lourd
    titre: FORMATIONS DE SUPPORT LOURD
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
    formations: [croiseur_eldar, escadrille_nightwing, escadrille_phoenix, vampire, machine_vaul, titan_revenant, titan_fantome, escadron_chevaliers]
    contraintes: [{ type: consomme, budget: rare, quoi: points }]

listes_test:
  - nom: "3000 pts, osts de guerre, supports et support lourd"
    limite: 3000
    attendu: valide
    formations:
      - formation: ost_wild_riders
        choix: { "1": { wild_riders: 5, vyper: 2 } }
        options:
          - { option: chef_clan }
          - { option: portail }
          - { option: wild_riders_vypers, repartition: { wild_riders: 2, vyper: 1 } }
          - { option: frelons, quantite: 2 }
      - formation: ost_guerriers_aspects
        choix: { "0": { aigles_chasseurs: 4, lances_lumiere: 4 } }
        options: [{ option: exarque }]
      - { formation: peloton_gardiens, options: [{ option: plateformes, quantite: 2 }] }
      - { formation: peloton_rangers }
      - { formation: escadron_storm_serpent }
      - { formation: escadrille_nightwing, variante: deux }

  - nom: "deux Avatars"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: ost_wild_riders, choix: { "1": { wild_riders: 7 } }, options: [{ option: avatar }] }
      - { formation: peloton_rangers, options: [{ option: avatar }] }

  - nom: "deux Osts de Guerriers Aspects pour un seul Ost Wild Riders"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: ost_wild_riders, choix: { "1": { wild_riders: 7 } } }
      - formation: ost_guerriers_aspects
        choix: { "0": { aigles_chasseurs: 8 } }
      - formation: ost_guerriers_aspects
        choix: { "0": { lances_lumiere: 8 } }

  - nom: "quatre formations de support pour un seul ost"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: ost_wild_riders, choix: { "1": { wild_riders: 7 } } }
      - { formation: peloton_rangers }
      - { formation: peloton_gardiens }
      - { formation: escadron_frelons }
      - { formation: escadron_storm_serpent }

  - nom: "support lourd au-delà du tiers des points"
    limite: 1500
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: ost_wild_riders, choix: { "1": { wild_riders: 7 } } }
      - { formation: titan_fantome }
