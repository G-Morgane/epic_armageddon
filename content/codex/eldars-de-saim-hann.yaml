    nom: Portail
    effet: { type: mot_cle, texte: Portail Fantôme, cout: 50 }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "0-1 Portail : 1 Portail Fantôme (50 pts)"
  - id: avatar
    nom: Avatar
    effet: { type: ajouter, cout: 100, unites: [{ unite: avatar }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
    phrase_pdf: "0-1 Avatar (100 pts)"
  - id: chef_clan
    nom: Chef de clan Wild Rider
    effet: { type: ajouter, cout: 75, unites: [{ unite: chef_clan }] }
    contraintes:
      - { type: max_par_armee, valeur: 1 }
      - { type: max_par_formation, valeur: 1 }
      - { type: hors_quota_options }
      - { type: requiert_unite, unites: [wild_riders] }
    phrase_pdf: "0-1 Chef de clan Wild Rider : ajouter 1 personnage Chef de Clan Wild Rider à une unité de Wild Riders (75 pts)"

  # ---- Améliorations ----
  - id: wild_riders_vypers
    nom: Wild Riders ou Vypers supplémentaires
    effet:
      type: choix_multiple
      total: 3
      parmi:
        - { unite: wild_riders, cout: 34 }
        - { unite: vyper, cout: 34 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Trois unités au choix pour 100 pts au total."
    phrase_pdf: "Ajouter 3 unités parmi : Wild Riders, Vypers (100 pts)"
  - id: frelons
    nom: Frelons
    effet: { type: ajouter, cout_par_unite: 50, unites: [{ unite: frelon }], min: 1, max: 2 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter jusqu'à 2 Frelons à la formation (50 pts chacun)"
  - id: exarque
    nom: Exarque
    effet: { type: ajouter, cout: 25, unites: [{ unite: exarque }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Exarque à une unité de Guerriers Aspects (25 pts)"
  - id: falcons
    nom: Falcons
    effet: { type: remplacer, de: wave_serpent, par: falcon, lot: 3, max: 1, cout: 175, par_nombre: 6 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer 3 Wave Serpents par 6 Falcons (175 pts)"
  - id: plateformes
    nom: Plate-formes d'armes lourdes
    effet: { type: remplacer, de: gardiens, par: plateforme_arme_lourde, lot: 1, max: 2, cout: 0 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer jusqu'à deux unités de Gardiens par des Plate-formes d'armes lourdes (gratuit)"
  - id: firestorm
    nom: Firestorm
    effet: { type: ajouter, cout: 75, unites: [{ unite: firestorm }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Ajouter 1 Firestorm à la formation (75 pts)"
  - id: firestorms_remplacement
    nom: Firestorms
    effet: { type: remplacer, de: [tisseur_nuit, falcon, prisme_feu], par: firestorm, lot: 1, max: 2, cout: 25 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    phrase_pdf: "Remplacer 1 ou 2 véhicules blindés de la formation par autant de Firestorms (25 pts chacun)"

formations:
  # ---- Formations principales ----
  - id: ost_wild_riders
    nom: Ost de Guerre Wild Riders
    variantes:
      - id: base
        cout: 275
        composition:
          - { unite: grand_prophete_motojet, nombre: 1 }
          - choix:
              total: 7
              parmi: [{ unite: wild_riders }, { unite: vyper }]
              phrase_pdf: "7 unités de Wild Riders et/ou Vypers"
    options: [portail, avatar, chef_clan, wild_riders_vypers, frelons]
    contraintes:
      - { type: fournit, budget: support, quantite: 3 }
      - { type: fournit, budget: slot_aspects, quantite: 1 }
  - id: ost_guerriers_aspects
    nom: Ost de Guerre de Guerriers Aspects
    description: "1 max par Ost de guerre Wild Riders"
    variantes:
      - id: base
        cout: 300
        composition:
          - choix:
              total: 8
              parmi: [{ unite: aigles_chasseurs }, { unite: lances_lumiere }]
              phrase_pdf: "8 unités de Guerriers Aspects parmi : Aigles Chasseurs, Lances de Lumière"
    options: [portail, avatar, exarque]
    contraintes:
      - { type: fournit, budget: support, quantite: 3 }
      - { type: consomme, budget: slot_aspects }

  # ---- Formations de support ----
  - id: peloton_aspects_embarques
    nom: Peloton de Guerriers Aspects Embarqués
    description: "Un type de Guerriers Aspects uniquement"
    variantes:
      - id: vengeurs
        nom: 6 Vengeurs
        cout: 350
        composition:
          - { unite: vengeurs, nombre: 6 }
          - { unite: wave_serpent, nombre: 3 }
      - id: scorpions
        nom: 6 Guerriers Scorpions
        cout: 350
        composition:
          - { unite: scorpions, nombre: 6 }
          - { unite: wave_serpent, nombre: 3 }
      - id: banshees
        nom: 6 Banshees
        cout: 350
        composition:
          - { unite: banshees, nombre: 6 }
          - { unite: wave_serpent, nombre: 3 }
      - id: dragons_feu
        nom: 6 Dragons de Feu
        cout: 350
        composition:
          - { unite: dragons_feu, nombre: 6 }
          - { unite: wave_serpent, nombre: 3 }
      - id: faucheurs_noirs
        nom: 6 Faucheurs Noirs
        cout: 350
        composition:
          - { unite: faucheurs_noirs, nombre: 6 }
          - { unite: wave_serpent, nombre: 3 }
    options: [portail, avatar, exarque, falcons]
    contraintes: [{ type: consomme, budget: support }]
  - id: peloton_gardiens
    nom: Peloton de Gardiens
    variantes:
      - id: base
        cout: 225
        composition:
          - { unite: grand_prophete, nombre: 1 }
          - { unite: gardiens, nombre: 5 }
          - { unite: wave_serpent, nombre: 3 }
    options: [portail, avatar, plateformes, firestorm]
    contraintes: [{ type: consomme, budget: support }]
  - id: peloton_rangers
    nom: Peloton de Rangers
    variantes:
      - id: base
        cout: 175
        composition:
          - { unite: rangers, nombre: 4 }
          - { unite: wave_serpent, nombre: 2 }
    options: [portail, avatar, frelons]
    contraintes: [{ type: consomme, budget: support }]
  - id: escadron_bouclier_vaul
    nom: Escadron Bouclier de Vaul
    variantes:
      - { id: tisseurs, nom: 3 Tisseurs de Nuit, cout: 175, composition: [{ unite: tisseur_nuit, nombre: 3 }] }
      - id: mixte
        nom: 2 Tisseurs de Nuit et 1 Firestorm
        cout: 175
        composition:
          - { unite: tisseur_nuit, nombre: 2 }
          - { unite: firestorm, nombre: 1 }
    options: [portail, avatar, firestorms_remplacement]
    contraintes: [{ type: consomme, budget: support }]
  - id: escadron_lame_vaul
    nom: Escadron Lame de Vaul
    variantes:
      - id: cinq
        nom: 5 unités
        cout: 250
        composition:
          - choix:
              total: 5
              parmi: [{ unite: falcon }, { unite: prisme_feu }]
              phrase_pdf: "5 unités parmi : Falcon, Prisme de Feu"
      - id: six
        nom: 6 unités
        cout: 300
        composition:
          - choix:
              total: 6
              parmi: [{ unite: falcon }, { unite: prisme_feu }]
              phrase_pdf: "6 unités parmi : Falcon, Prisme de Feu"
    options: [portail, avatar, firestorms_remplacement]
    contraintes: [{ type: consomme, budget: support }]
    phrase_pdf: "5 ou 6 unités parmi : Falcon, Prisme de Feu (50 pts chacun)"
  - id: escadron_storm_serpent
    nom: Escadron Storm Serpent
    variantes:
      - { id: base, cout: 250, composition: [{ unite: storm_serpent, nombre: 1 }] }
    options: [portail, avatar]
    contraintes: [{ type: consomme, budget: support }]
  - id: escadron_frelons
