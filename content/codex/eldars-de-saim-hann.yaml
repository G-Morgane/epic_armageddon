# Eldars de Saim-Hann, transcrit depuis le PDF expérimental beta (source de vérité).
codex:
  slug: eldars-de-saim-hann
  armee_id: 78773e59-6566-4fb6-8501-8a423fa1ef07
  nom: Eldars de Saim Hann
  version: "0.3"
  faction: xenos
  categorie: armees-xenos
  statut: experimental
  illustration: https://pub-1666a3493ace4d1a9657de1f8a60b059.r2.dev/codex/couvertures/eldars-de-saim-hann.png
  citation:
    texte: "Sentez le vent siffler autour de vous et entendez son cri à vos oreilles. Écoutez-le attentivement car ne sommes-nous point les Wild Riders, les enfants de la tempête ?"
    auteur: Nuadhu "Coeur de feu", Chef de Saim Hann
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée du vaisseau monde Saim Hann. Cette liste peut également être utilisée comme liste générique pour représenter n'importe quelle autre armée d'eldars.

    Une armée d'eldars est organisée autour de formations principales aussi appelées osts de guerre. Chaque formation principale permet de recruter jusqu'à 3 formations de support.

    Chaque formation (principale ou de support) est autonome et peut recevoir des améliorations. La liste d'armée indique pour chaque formation quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par formation. Les améliorations font partie intégrante des formations et doivent respecter les règles de cohésion.

    Les formations de support lourd sont des formations autonomes. Un maximum de 1/3 des points peuvent être dépensés pour ces formations.

    Une armée eldar peut également recevoir des options. Chaque option ne peut être sélectionnée qu'une seule fois.

    Enfin, la dénomination Guerriers Aspects regroupe les unités suivantes : Vengeurs, Guerriers Scorpions, Banshees, Dragons de Feu, Faucheurs Noirs, Araignées Spectrales, Aigles Chasseurs et Lances de Lumière.
  regles_md:
    - titre: "Règle spéciale : Saim Hann"
      texte: |
        Toutes les unités d'infanterie et de véhicules légers (Inf et VL) Saim Hann possédant la note antigrav gagnent la note Marcheur.
    - titre: "Règle spéciale : L'Avatar de Saim Hann"
      texte: |
        L'Avatar de Saim Hann peut apparaître sur le champ de bataille de deux manières différentes :

        1. Par le biais d'un portail comme n'importe quelle formation se trouvant en réserve.
        2. Par invocation dans les 15 cm d'un grand prophète lors de la phase de téléportation.

        Dans tous les cas, dès son apparition, c'est une formation indépendante et permanente jusqu'à la fin de la partie ou sa destruction. Cependant il ne peut que contester les objectifs.
    - titre: "Règle spéciale : Vision extra lucide"
      texte: |
        Toute formation Eldar qui comprend une unité ayant la capacité vision extra lucide ignore la pénalité de -1 au test d'action lorsqu'elle tente de conserver l'initiative.

        De plus, une fois par tour le joueur Eldar peut essayer de retenir l'initiative deux fois d'affilée. N'importe quelle formation Eldar peut être choisie, y compris celles ne comportant pas de Grand Prophète, néanmoins un Grand Prophète doit impérativement être encore en jeu sur le champ de bataille. La formation doit tout de même passer un test d'initiative pour ne pas perdre l'action, et elle subit le modificateur de -1 pour avoir retenu l'initiative, sauf si elle comprend une unité ayant la capacité vision extra lucide. Une fois l'action réalisée, l'initiative retourne au joueur adverse.
    - titre: "Règle spéciale : Armée en mouvement"
      texte: |
        Seuls les Pelotons de Rangers peuvent se déployer en garnison.
    - titre: "Règle spéciale : Tactique du tirer et courir"
      texte: |
        Les formations Eldars qui reçoivent l'ordre avance ou avance rapide peuvent choisir de tirer soit avant soit après chaque mouvement. Elles ne peuvent néanmoins tirer qu'une seule fois durant l'action.

        De plus, les formations Eldars qui remportent un assaut sont autorisées à utiliser la totalité de leur mouvement lorsqu'elles consolident leur position, au lieu d'être limitées à un mouvement de 5 cm.

        Cependant (hormis pour les formations de Guerriers Aspects), les formations Eldars qui choisissent de consolider de leur mouvement complet ne peuvent en aucun cas prétendre au soutien d'un autre assaut lors du même tour. Les formations de Guerriers Aspects peuvent toujours consolider de leur mouvement complet et soutenir d'autres assauts.
    - titre: "Règle spéciale : Holo-Champs"
      texte: |
        Les Holo-champs procurent aux titans Eldars une sauvegarde spéciale de 3+ qui peut être utilisée à la place de la sauvegarde normale du titan.

        Cette sauvegarde peut toujours être utilisée, même en corps-à-corps, en fusillade et contre les armes tueuses de titan ou les macro armes. Faites une seule sauvegarde contre les armes avec la capacité tueuse de titan. Si un véhicule avec un Holo-champ a aussi un blindage renforcé, alors il est autorisé à relancer ses sauvegardes, sauf pour les attaques réalisées avec des armes ayant la capacité lance, macro-armes ou tueuses de titans.

        Aucun point d'impact n'est placé pour une touche avec une arme ayant le trait Rupture sauvée par l'Holo-champ. La sauvegarde de l'Holo-champ peut tout à fait être modifiée par un tir croisé ou par les armes Sniper.
    - titre: "Règle spéciale : Portails Eldars"
      texte: |
        Chaque Portail inclus dans une armée permet au joueur Eldar de conserver en réserve jusqu'à trois formations. Les formations en réserve peuvent entrer en jeu par n'importe quel Portail en réalisant une action qui comporte un mouvement, mesuré à partir du Portail. Une seule formation peut voyager à travers chaque portail à chaque tour.

        Une formation ne peut qu'entrer en jeu grâce au portail mais jamais retourner en réserve. Une formation qui rate son activation en tentant de franchir un Portail prendra automatiquement l'ordre Tenir.

        Les formations pouvant utiliser un Portail Fantôme sont : les unités d'infanterie, les véhicules légers, les véhicules blindés dotés de la capacité Marcheur et l'Avatar.

        Le joueur Eldar peut, pour 50 pts, placer un Portail Fantôme sur un objectif de sa moitié de table : il compte à la fois comme un objectif et un Portail. Il ne peut ni être attaqué ni détruit.
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Jaime Martinez."
  valeur_strategique: 4
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Formations de Guerriers Aspects, Avatar et Titans", valeur: "1+" }

