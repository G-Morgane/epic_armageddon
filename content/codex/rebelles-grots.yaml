# Rebelles Grotz, transcrit depuis le PDF expérimental rev 0.1 (source de vérité).
codex:
  slug: rebelles-grots
  armee_id: e0776400-8172-4394-b3e0-7a3d22fa7ed5
  nom: Rebelles Grotz
  version: "0.1"
  faction: xenos
  categorie: armees-xenos
  statut: experimental
  intro_md: |
    La liste qui suit vous autorise à mettre sur pied une Révolution Grotz telle qu'elle se produit quand des gobs énervés en ont assez de la pression de la société Ork et de ses injustices. Le plus connu de ces révolutionnaires étant Gobbo le Rouge, mais il y en a eu d'autres.

    Les armées des Rebelles Grotz sont organisées autour de grandes formations appelées sections, qui sont accompagnées de formations d'appui, elles mêmes autonomes, nommées comités.

    Chez les gobs, les améliorations sont appelées Kust'oms.

    La liste d'armée indique pour chaque catégorie de Section quels kust'oms sont autorisés. Chaque kust'om autorisé peut être pris au maximum deux fois par Section. Une section ne peut avoir que quatre Kust'oms au maximum. La liste des Kust'oms accessibles aux Comités est indiquée sous l'entrée du Comité.

    Les Sections autonomes sont des formations autonomes des sections, elles ne peuvent recevoir qu'un type de Kust'om : un Secrétaire de Section. Un maximum de 1/3 des points de l'armée peuvent être dépensés pour ces formations.
  regles_md:
    - titre: "Règle spéciale : 1 million, selon le Comité, 500 selon les Nobz"
      texte: |
        Lorsque les bandes grotz tentent un test de ralliement, elles reçoivent un bonus de +1 lorsqu'ils sont plus de 5 et de +2 lorsqu'ils sont plus de 10.

        Les Squigs ne bénéficient jamais de ce bonus ; ils ne savent pas compter.
    - titre: "Règle spéciale : Secrétaire Général"
      texte: |
        Un seul Secrétaire de Section de l'armée doit être transformé gratuitement en Secrétaire Général.

        Il ne peut pas être inclus dans un Comité, seulement dans une Section de Grotz.
  valeur_strategique: 4
  initiative:
    defaut: "2+"
    exceptions:
      - { portee: "Section contenant le Secrétaire Général", valeur: "1+" }

budgets:
  - id: comite
    libelle: Comités
    capacite: { source: fournitures }
    phrase_pdf: "0-2 Comités par Section"
  - id: troupeau
    libelle: Troupeaux de Squigs
    capacite: { source: fournitures }
    phrase_pdf: "0-1 Troupeau de Squigs par tranche de deux Sections de Grotz"
  - id: autonomes
    libelle: Sections Autonomes
    capacite: { source: ratio_points, ratio: 0.3334 }
    phrase_pdf: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"

