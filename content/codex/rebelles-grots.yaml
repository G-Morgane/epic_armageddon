sections:
  - id: sections
    titre: SECTIONS
    formations: [section_grotz, troupeau_squigs]
    contraintes:
      - { type: fournit, budget: comite, quantite: 2 }
      - { type: max_options, valeur: 4 }
    colonne_options: true
    tableau_options:
      titre: KUST'OMS
      sous_titre: "Chaque amélioration peut être choisie au maximum 2 fois par Section et jusqu'à un maximum de 4"
  - id: comites
    titre: COMITÉS
    sous_titre: "0-2 par Section"
    formations: [arnarko_syndikat, bande_boitkitu, chevaucheurs_grotz, comite_grokalibr, tanks_grots]
    contraintes: [{ type: consomme, budget: comite }]
    colonne_options: true
  - id: autonomes
    titre: SECTIONS AUTONOMES
    sous_titre: "Jusqu'à 1/3 des points disponibles peuvent être dépensés pour ces formations"
    formations: [chassa_bombas, brikolaj, super_brikolaj, vehicules_requisitionnes]
    contraintes: [{ type: consomme, budget: autonomes, quoi: points }]
    colonne_options: true

listes_test:
  - nom: "3000 pts, deux Sections, un Troupeau, des Comités et des Autonomes"
    limite: 3000
    attendu: valide
    formations:
      - formation: section_grotz
        options:
          - { option: secretaire_general }
          - { option: grotz_additionnels }
          - { option: snipers, quantite: 3 }
          - { option: transports_grotz, quantite: 7 }
      - formation: section_grotz
        options:
          - { option: leader_karismatik, choix: gross_tete }
          - { option: krameurs, quantite: 3 }
      - { formation: troupeau_squigs }
      - { formation: arnarko_syndikat, options: [{ option: teleportation }] }
      - { formation: bande_boitkitu }
      - { formation: tanks_grots }
      - formation: vehicules_requisitionnes
        variante: leman_russ
        options: [{ option: leader_karismatik_obligatoire, choix: secretaire_section }]

  - nom: "sans Secrétaire Général"
    limite: 1500
    attendu: refusee
    erreur: min_par_armee
