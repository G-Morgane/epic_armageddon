# Chevaliers Impériaux, transcrit depuis le PDF EAFR REV 1.1 (source de vérité).
codex:
  slug: chevaliers-imperiaux
  armee_id: a66a54e4-7630-4ed8-97b9-27b182eee006
  nom: Chevaliers Impériaux
  version: "1.1"
  faction: imperium
  categorie: armees-imperiales
  statut: official
  citation:
    texte: "Que la puissance du Chevalier s'écoule dans vos veines. Que les fantômes de votre Trône murmurent dans votre esprit. Que vos tendons soient d'acier, et vos poings de feu. Devenez votre Chevalier, et par la symbiose, élevez-vous. Ainsi vous serez adoubé. Ainsi vous protégerez votre peuple et massacrerez vos ennemis."
    auteur: Sixième Cantique du Rituel d'Adoubement
  intro_md: |
    La liste qui suit vous permet de mettre sur pied une armée de Chevaliers Impériaux.

    Les armées des Chevaliers Impériaux sont organisées en formations appelées Lance du Ban, Lance de soutien et Lance d'appui lourd.

    Chaque Lance peut recevoir des améliorations. La liste d'armée indique pour chaque lance quelles améliorations sont autorisées. Chaque amélioration autorisée ne peut être prise qu'une fois par lance sans autre contrainte. Les améliorations font partie intégrante des Lance et doivent respecter les règles de cohésion. Certaines améliorations ajoutent des chevaliers supplémentaires alors que d'autres ajoutent des personnages. Ces personnages sont des pilotes de ce fait, chaque véhicule ne peut recevoir qu'un seul personnage.
  regles_md:
    - titre: "Règle spéciale : Bouclier à Ions"
      texte: |
        Les Chevaliers sont protégés par un Bouclier à Ions.

        Un Chevalier peut décider d'utiliser la sauvegarde de son Bouclier à Ions à la place de sa sauvegarde de blindage, y compris contre les armes n'autorisant habituellement pas les sauvegardes (MA et TT). Dans ce cas, chaque touche en TT doit être sauvegardée séparément.

        Si la sauvegarde du Bouclier à Ions échoue, le Chevalier peut utiliser son Blindage Renforcé si l'arme l'y autorise (les attaques TT, MA et Lance annulent donc cette possibilité). Il utilisera alors sa valeur de blindage et non la valeur de son Bouclier à Ions.

        Par contre, cette règle ne s'applique pas contre les attaques de corps à corps et les tirs en cas de feu croisé.

        Le Pavois à Ions fonctionne de la même manière qu'un Bouclier mais il offre une bien meilleure protection à courte distance. Il peut donc également être utilisé contre des touches de corps à corps.
    - titre: "Règle spéciale : Courage Chevaleresque"
      texte: "Les formations de Chevaliers bénéficient d'un bonus de +1 lors des tests d'actions d'Assaut et des tests de ralliement."
    - titre: "Règle spéciale : Porte-Bannière de la Baronnie"
      texte: |
        La formation du Banneret gagne un +1 à son initiative tant que le Banneret est vivant.

        Il ne peut pas y avoir de Sans Fief dans la formation du Banneret.
    - titre: "Règle spéciale : Armement des Chevaliers"
      texte: |
        Les Chevaliers Questoris, Cerastus et Dominus sont des engins de guerres mobiles et leurs armes ont toutes un angle de tir frontal, à l'exception de l'Autocanon Icarus jumelé qui a un angle de 360° pour les attaques anti-aériennes uniquement.

        Les Chevalier Acastus sont des engins de guerres d'appui feu et leurs armes ont toutes un angle de tir frontal fixe, à l'exception du Lance-Missiles Acastus qui a un angle de 360° pour les attaques anti-aériennes uniquement.
    - titre: "Alliance : Mechanicum"
      texte: "Un tiers des points d'une liste de Chevalier peut être sélectionné dans l'un des deux codex Légions Titaniques ou Adeptus Mechanicus. Cette sélection doit respecter la structure de ces listes (ex : un choix de base pour avoir deux choix de soutien, etc.) et elle ne peut pas inclure d'unités possédant la note Commandant Suprême."
  credits: "Ce codex est un projet fan-made communautaire non officiel. Tous droits réservés. Utilisés sans approbation, ni volonté de préjudice ou comme opposition au copyright de Games Workshop LTD. Illustration de couverture par Tze Kun Chin."
  valeur_strategique: 3
  initiative:
    defaut: "2+"

budgets:
  - id: slot_soutien
    libelle: Lances de soutien
    capacite: { source: fournitures }
    phrase_pdf: "Deux formations par Lance du Ban"
  - id: slot_appui_lourd
    libelle: Lances d'appui lourd
    capacite: { source: fournitures }
    phrase_pdf: "Une formation par Lance du Ban"

