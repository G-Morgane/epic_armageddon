options:
  - id: porte_banniere
    nom: Porte-Bannière
    effet: { type: ajouter, cout: 75, unites: [{ unite: banneret, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: max_par_armee, valeur: 1 }
      - { type: exclut, options: [sans_fief] }
    note_md: "Ajouter un personnage de Banneret à la formation. Il ne peut pas y avoir de Sans-Fief dans la formation du Banneret."
  - id: senechal
    nom: Sénéchal
    effet: { type: ajouter, cout: 75, unites: [{ unite: senechal, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: max_par_armee, valeur: 1 }
    note_md: "Ajouter un personnage de Sénéchal à la formation."
  - id: sans_fief
    nom: Sans fief
    effet: { type: ajouter, cout: 50, unites: [{ unite: sans_fief, nombre: 1 }] }
    contraintes:
      - { type: max_par_formation, valeur: 1 }
      - { type: max_par_armee, valeur: 1 }
      - { type: exclut, options: [porte_banniere] }
    note_md: "Ajouter un personnage de Sans-Fief à la formation."
  - id: noble
    nom: Noble
    effet: { type: ajouter, cout: 25, unites: [{ unite: lord_scion, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter un personnage de Lord Scion à la formation."
  - id: precepteur
    nom: Précepteur
    effet: { type: ajouter, cout: 150, unites: [{ unite: precepteur, nombre: 1 }] }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter un chevalier Précepteur à la formation."
  - id: chevaliers
    nom: Chevaliers
    effet:
      type: choix_multiple
      total: { min: 1, max: 2 }
      parmi:
        - { unite: paladin, cout: 125 }
        - { unite: errant, cout: 125 }
        - { unite: croise, cout: 150 }
        - { unite: galant, cout: 100 }
        - { unite: warden, cout: 100 }
        - { unite: warden_aggressor, cout: 125 }
        - { unite: precepteur, cout: 150, max: 1 }
        - { unite: vaillant, cout: 175, max: 1 }
        - { unite: castellan, cout: 200, max: 1 }
    contraintes: [{ type: max_par_formation, valeur: 1 }]
    note_md: "Ajouter 1 à 2 chevaliers à la formation parmi : Paladin (125), Errant (125), Croisé (150), Galant (100), Warden (100), Warden Aggressor (125), 0-1 Précepteur (150), 0-1 Vaillant (175) ou Castellan (200)."

