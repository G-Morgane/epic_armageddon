sections:
  - id: lance_du_ban
    titre: LANCE DU BAN DES CHEVALIERS IMPÉRIAUX
    formations: [questoris_paladin, questoris_errant, questoris_warden, questoris_warden_aggressor, questoris_gallant]
    options: [chevaliers, noble, sans_fief, senechal, porte_banniere]
    colonne_options: true
  - id: lance_de_soutien
    titre: LANCE DE SOUTIEN DES CHEVALIERS IMPÉRIAUX
    sous_titre: "(Deux formations par Lance du Ban)"
    formations: [armigeres, questoris_magaera, questoris_styrix, cerastus_acheron, cerastus_castigator, cerastus_lancer, cerastus_atrapos]
    contraintes: [{ type: consomme, budget: slot_soutien }]
    options: [chevaliers, noble, sans_fief, senechal, porte_banniere]
    colonne_options: true
  - id: lance_appui_lourd
    titre: LANCE D'APPUI LOURD DES CHEVALIERS IMPÉRIAUX
    sous_titre: "(Une formation par Lance du Ban)"
    formations: [acastus_porphyrion, acastus_asterius, dominus_valiant, dominus_castellan]
    contraintes: [{ type: consomme, budget: slot_appui_lourd }]
    tableau_options:
      titre: AMÉLIORATIONS
      sous_titre: "Chaque amélioration ne peut être prise qu'une seule fois par formation."

listes_test:
  - nom: "3000 pts : deux Lances du Ban et leurs soutiens"
    limite: 3000
    attendu: valide
    formations:
      - formation: questoris_paladin
        options: [{ option: porte_banniere }]
      - formation: questoris_warden
        options:
          - { option: chevaliers, repartition: { croise: 1, galant: 1 } }
          - { option: noble }
      - formation: armigeres
        variante: quatre
        choix: { "0": { armigere_hastaire: 2, armigere_helverien: 2 } }
        options: [{ option: precepteur }]
      - { formation: questoris_magaera, variante: trois }
      - { formation: dominus_castellan, variante: un }
  - nom: "1500 pts : une Lance du Ban, un soutien, un appui lourd"
    limite: 1500
    attendu: valide
    formations:
      - formation: questoris_errant
        options: [{ option: senechal }, { option: sans_fief }]
      - { formation: cerastus_lancer, variante: quatre }
      - { formation: acastus_porphyrion, variante: un }
  - nom: "trois soutiens pour une seule Lance du Ban"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: questoris_gallant }
      - { formation: armigeres, variante: quatre, choix: { "0": { armigere_hastaire: 4 } } }
      - { formation: questoris_styrix, variante: trois }
      - { formation: cerastus_acheron, variante: trois }
  - nom: "appui lourd sans Lance du Ban"
    limite: 3000
    attendu: refusee
    erreur: budget_depasse
    formations:
      - { formation: dominus_valiant, variante: un }
  - nom: "deux Porte-Bannières dans l'armée"
    limite: 3000
    attendu: refusee
    erreur: max_par_armee
    formations:
      - { formation: questoris_paladin, options: [{ option: porte_banniere }] }
      - { formation: questoris_errant, options: [{ option: porte_banniere }] }
  - nom: "un Sans-Fief dans la formation du Banneret"
    limite: 3000
    attendu: refusee
    erreur: option_interdite
    formations:
      - formation: questoris_warden
        options: [{ option: porte_banniere }, { option: sans_fief }]
  - nom: "trois chevaliers ajoutés par l'amélioration Chevaliers"
    limite: 3000
    attendu: refusee
    erreur: option_quantite
    formations:
      - formation: questoris_paladin
        options: [{ option: chevaliers, repartition: { paladin: 2, galant: 1 } }]
